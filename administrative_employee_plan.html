:root{--g:#0f6b4a;--d:#0b3d2f;--bg:#f3f8f5;--line:#d8e8df;--gold:#c9a227}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:linear-gradient(135deg,#eef8f3,#fff8e8);color:#17263a}
.wrap{max-width:1050px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#0b3d2f,#1b8a61);color:#fff;border-radius:28px;padding:22px;display:flex;gap:16px;align-items:center;box-shadow:0 12px 30px #0b3d2f33}.hero img{width:72px;background:#fff;border-radius:18px;padding:9px}.hero h1{margin:0;font-size:25px}.hero p{margin:5px 0 0;opacity:.9}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:18px;box-shadow:0 10px 28px #08331e12}.title{font-weight:900;color:var(--d);font-size:18px;margin-bottom:14px;border-bottom:2px solid #eef6f1;padding-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}.hero{flex-direction:column;text-align:center}}
label{display:block;font-weight:800;color:#334155;margin-bottom:6px;font-size:13px}input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;background:#fbfffd}textarea{min-height:70px}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border:1px solid var(--line);padding:8px;text-align:right}th{background:#0f6b4a;color:white}.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}.btn{border:0;border-radius:12px;padding:11px 18px;font-family:inherit;font-weight:900;cursor:pointer}.primary{background:#0f6b4a;color:white}.gold{background:#f5e7b5;color:#634b00}.muted{background:#eef2f7;color:#334155}.danger{background:#ffe9e9;color:#b42318}.chip{display:inline-block;border-radius:999px;padding:5px 12px;background:#eef8f3;color:#0f6b4a;font-weight:900}
.status{font-weight:900}.pending{color:#c78300}.approved{color:#0f6b4a}.returned{color:#c0392b}
@media print{.btns{display:none}.wrap{padding:0}.card,.hero{box-shadow:none}}

<body>
<div class="wrap">
<header class="hero">
<img src="https://salogos.b-cdn.net/logos/svg/1774895141785-5zgexuf8.svg" alt="شعار وزارة التعليم">
<div><h1>نظام الإدارة المدرسية الذكي - خطة الموظف الإداري</h1><p>إعداد خطة الأداء الوظيفي وإرسالها للمسؤول المباشر للاعتماد</p></div>
</header>
<section class="card">
<div class="title">بيانات الموظف/ة الإداري/ة</div>
<div class="grid">
<div><label>اسم الموظف/ة</label><input id="empName" data-sic-kind="administrative_employee"></div>
<div><label>البريد / رقم الجوال</label><input id="empContact"></div>
<div><label>المسمى الوظيفي</label><select id="jobTitle"><option>مساعد إداري</option><option>كاتب مدرسة</option><option>سكرتير</option><option>مدخل بيانات</option><option>مشرف نقل مدرسي</option><option>محضر مختبر</option><option>أمين مصادر تعلم</option><option>مشرف فصول</option></select></div>
<div><label>يتبع إشراف</label><select id="supervisor"><option value="manager">مدير/مديرة المدرسة</option><option value="agent">وكيل/وكيلة المدرسة</option></select></div>
<div><label>العام الدراسي</label><select id="year"></select></div>
<div><label>حالة الخطة</label><div class="chip status pending" id="statusText">مسودة</div></div>
</div>
</section>
<section class="card">
<div class="title">الأهداف الوظيفية المقترحة</div>
<table><thead><tr><th>م</th><th>الهدف</th><th>مؤشر القياس</th><th>الناتج المستهدف</th><th>الوزن %</th></tr></thead><tbody id="goalsBody"></tbody></table>
<div class="btns"><button class="btn muted" onclick="addGoal()">+ إضافة هدف</button></div>
</section>
<section class="card">
<div class="title">الشواهد والاحتياج التطويري</div>
<div class="grid">
<div><label>الشواهد المتوقعة</label><textarea id="evidence"></textarea></div>
<div><label>الاحتياج التدريبي / الدعم المطلوب</label><textarea id="needs"></textarea></div>
<div><label>ملاحظات الموظف/ة</label><textarea id="notes"></textarea></div>
<div><label>ملاحظات المسؤول المباشر</label><textarea id="reviewNotes" readonly></textarea></div>
</div>
</section>
<div class="btns">
<button class="btn primary" onclick="savePlan('draft')">حفظ مسودة</button>
<button class="btn gold" onclick="savePlan('pending')">إرسال لاعتماد المسؤول</button>
<button class="btn muted" onclick="window.print()">طباعة / حفظ PDF</button><button id="executionBtn" class="btn muted" onclick="openApprovedExecution()" disabled title="يبدأ التنفيذ بعد اعتماد المسؤول المباشر">تنفيذ الخطة بعد الاعتماد</button>
<button class="btn danger" onclick="history.back()">رجوع</button>
</div>
</div>
<script>
const params=new URLSearchParams(location.search);
const ADMIN_CTX_KEY='administrative_employee_tab_session_v1';
function readAdminCtx(){try{const c=JSON.parse(sessionStorage.getItem(ADMIN_CTX_KEY)||'null');if(!c||typeof c!=='object')return null;const role=String(c.role||'').toLowerCase();if(!['administrative_employee','admin_employee'].includes(role)||String(c.status||'active')!=='active')return null;return c}catch(e){return null}}
function currentSchoolScope(){try{const c=readAdminCtx();if(c&&c.schoolId)return String(c.schoolId);return String(sessionStorage.getItem('smart_school_tab_school_v1')||sessionStorage.getItem('current_school_id')||'')}catch(e){return ''}}
const adminCtx=readAdminCtx();
if(!adminCtx){location.replace('administrative_employee_login.html'+(params.get('school')?'?schoolId='+encodeURIComponent(params.get('school')):''));throw new Error('ADMIN_EMPLOYEE_SESSION_REQUIRED');}
const schoolScope=String(adminCtx.schoolId||currentSchoolScope());
const currentUserId=String(adminCtx.userId||sessionStorage.getItem('currentUserId')||'');
const currentEmail=String(adminCtx.email||sessionStorage.getItem('currentUserEmail')||'').toLowerCase();
const currentName=String(adminCtx.name||sessionStorage.getItem('currentUserName')||'');
const fixedSupervisor=String(adminCtx.adminSupervisor||'manager').toLowerCase()==='agent'?'agent':'manager';
function fillYears(){const y=document.getElementById('year');for(let i=1448;i<=1477;i++){let o=document.createElement('option');o.value=i+'هـ';o.textContent=i+'هـ';y.appendChild(o)}}
function addGoal(g={}){const b=document.getElementById('goalsBody');const n=b.children.length+1;const tr=document.createElement('tr');tr.innerHTML=`<td>${n}</td><td><input value="${g.goal||''}"></td><td><input value="${g.kpi||''}"></td><td><input value="${g.target||''}"></td><td><input type="number" min="0" max="100" value="${g.weight||''}"></td>`;b.appendChild(tr)}
function collect(){let existing=(JSON.parse(localStorage.getItem('administrative_employee_plans')||'[]')).find(x=>String(x.id)===String(currentEmail));return {id: currentEmail||currentUserId||('emp_'+Date.now()), ownerUserId:currentUserId, name:empName.value, contact:empContact.value, jobTitle:jobTitle.value, supervisor:fixedSupervisor, schoolId: schoolScope, activeSchoolId: schoolScope, year:year.value, status:statusText.dataset.status||'draft', active:true, archive: existing&&existing.archive?existing.archive:[], history: existing&&existing.history?existing.history:[], evidence:evidence.value, needs:needs.value, notes:notes.value, reviewNotes:reviewNotes.value, updatedAt:new Date().toISOString(), goals:[...goalsBody.querySelectorAll('tr')].map(tr=>{let i=tr.querySelectorAll('input');return {goal:i[0].value,kpi:i[1].value,target:i[2].value,weight:i[3].value}})}}
async function savePlan(status){
 const p=collect();p.status=status;const key='administrative_employee_plans',before=localStorage.getItem(key);let arr=[];try{arr=JSON.parse(before||'[]');if(!Array.isArray(arr))arr=[]}catch(_){arr=[]}arr=arr.filter(x=>String(x.id)!==String(p.id));p.history=p.history||[];p.history.unshift({action:status==='pending'?'إرسال للاعتماد':'حفظ مسودة',at:new Date().toISOString(),by:'الموظف الإداري'});arr.push(p);
 try{if(!window.PlatformStateEngine)throw new Error('محرك حالة الأداء السحابي غير متاح');await PlatformStateEngine.bulkUpsert('admin_performance','user',[{key:'administrative_employee_plans',value:JSON.stringify([p]),deleted:false}],{timeout:15000});const vr=await PlatformStateEngine.pull('admin_performance','user',['administrative_employee_plans']);const vi=(vr.items||[]).find(x=>x.state_key==='administrative_employee_plans'&&!x.deleted_at);let vv=[];try{vv=JSON.parse(vi&&vi.payload&&vi.payload.value||'[]')}catch(_){vv=[]}if(!Array.isArray(vv)||!vv.some(x=>String(x.id)===String(p.id)&&String(x.status)===String(status)&&String(x.supervisor)===String(fixedSupervisor)))throw new Error('لم يكتمل التحقق السحابي من الخطة');if(!window.PlatformRecordSaveEngine||PlatformRecordSaveEngine.isSystemAdminContext())throw new Error('محرك الحفظ السحابي غير متاح');await PlatformRecordSaveEngine.save({moduleKey:'admin_employee_records',recordType:'admin_plan',recordId:String(p.id),academicYear:p.year||localStorage.getItem('school_info_academic_year')||'1448',semester:p.semester||'سنوي',scope:'user',folderId:'admin_plan',title:'خطة أداء الموظف الإداري',data:p});localStorage.setItem(key,JSON.stringify(arr));try{localStorage.setItem('administrative_employee_metrics_touch',new Date().toISOString())}catch(_){ }statusText.dataset.status=status;statusText.textContent=status==='pending'?'بانتظار الاعتماد':status==='approved'?'معتمدة':'مسودة';statusText.className='chip status '+(status==='approved'?'approved':status==='pending'?'pending':'');try{window.SchoolActivity?.emit(status==='pending'?'record_submitted':'record_updated',status==='pending'?'إرسال خطة الأداء للاعتماد':'حفظ خطة الأداء',{progress:status==='pending'?80:40,status,employee_id:p.id});}catch(_){ }alert(status==='pending'?'تم إرسال الخطة للمسؤول المباشر وحفظها والتحقق منها سحابيًا':'تم الحفظ والتحقق السحابي');return true;}catch(e){if(before===null)localStorage.removeItem(key);else localStorage.setItem(key,before);console.error('[admin_plan cloud save]',e);alert('تعذر تأكيد الحفظ السحابي؛ لم يتم اعتماد التغيير.');return false;}
}
function setLifecycleUI(p){const approved=p&&p.status==='approved';executionBtn.disabled=!approved;executionBtn.textContent=approved?'بدء / متابعة تنفيذ الخطة':'تنفيذ الخطة بعد الاعتماد';executionBtn.title=approved?'':'يبدأ التنفيذ بعد اعتماد المسؤول المباشر';const locked=p&&p.status==='pending';[...goalsBody.querySelectorAll('input'),jobTitle,evidence,needs,notes].forEach(el=>{if(el)el.disabled=!!locked});}
function openApprovedExecution(){const p=(JSON.parse(localStorage.getItem('administrative_employee_plans')||'[]')).find(x=>String(x.id)===String(currentEmail));if(!p||p.status!=='approved')return alert(p&&p.status==='pending'?'الخطة بانتظار اعتماد المسؤول المباشر.':p&&p.status==='returned'?'عدّل الخطة وأعد إرسالها للاعتماد أولًا.':'لا يمكن بدء التنفيذ قبل اعتماد الخطة.');location.href='administrative_employee_execution.html?emp='+encodeURIComponent(currentEmail)+'&uid='+encodeURIComponent(currentUserId)+'&supervisor='+encodeURIComponent(fixedSupervisor)+(schoolScope?'&school='+encodeURIComponent(schoolScope):'')}
async function load(){fillYears();empName.value=currentName;empContact.value=currentEmail;supervisor.value=fixedSupervisor;supervisor.disabled=true;let p=null;try{if(window.PlatformStateEngine){const r=await PlatformStateEngine.pull('admin_performance','user',['administrative_employee_plans']);const it=(r.items||[]).find(x=>x.state_key==='administrative_employee_plans'&&!x.deleted_at);if(it&&it.payload&&it.payload.value){const a=JSON.parse(it.payload.value||'[]');if(Array.isArray(a))p=a.find(x=>String(x.id)===String(currentEmail))||a[0]||null;if(p)localStorage.setItem('administrative_employee_plans',JSON.stringify([p]));}}}catch(e){console.warn('تعذر تحميل الخطة السحابية',e)}if(!p){try{const arr=JSON.parse(localStorage.getItem('administrative_employee_plans')||'[]');p=arr.find(x=>String(x.id)===String(currentEmail))||null}catch(e){}}
if(p){empName.value=p.name||currentName;empContact.value=p.contact||currentEmail;jobTitle.value=p.jobTitle||jobTitle.value;supervisor.value=fixedSupervisor;year.value=p.year||year.value;evidence.value=p.evidence||'';needs.value=p.needs||'';notes.value=p.notes||'';reviewNotes.value=p.reviewNotes||'';goalsBody.innerHTML='';(p.goals||[]).forEach(addGoal);statusText.dataset.status=p.status||'draft';statusText.textContent=p.status==='pending'?'بانتظار الاعتماد':p.status==='approved'?'معتمدة':p.status==='returned'?'معادة للتعديل':'مسودة';statusText.className='chip status '+(p.status==='approved'?'approved':p.status==='pending'?'pending':p.status==='returned'?'returned':'');}if(!goalsBody.children.length){addGoal();addGoal();addGoal();}setLifecycleUI(p)}
load();
</script>
