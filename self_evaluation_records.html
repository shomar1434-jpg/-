                            &lt;i data-lucide=&quot;printer&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                            &lt;span&gt;طباعة القرار الإداري (A4)&lt;/span&gt;
                        &lt;/button&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;div v-if=&quot;activeCommittee&quot; class=&quot;bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden p-6 space-y-6 print-card committee-print-sheet&quot;&gt;
                    &lt;!-- نموذج الترويسة لوزارة التعليم في طباعة القرارات الرسمية - مع التوسيط واليمين وبشعار مكبر ومسافات متسقة --&gt;

                        &lt;!-- الترويسة اليمنى - تنسيق توسيط --&gt;

                    &lt;/div&gt;

                    &lt;!-- صلب القرار الإداري الرسمي --&gt;
                    &lt;div class=&quot;space-y-4 committee-decision-body&quot;&gt;
                        &lt;div class=&quot;text-center&quot;&gt;
                            &lt;h2 class=&quot;font-bold text-lg md:text-xl text-slate-900 font-serif&quot;&gt;قرار إداري رقم (1) وتاريخ {{ activeCommittee.decisionDate }} هـ&lt;/h2&gt;
                            &lt;p class=&quot;text-sm font-semibold text-slate-700 mt-1&quot;&gt;بشأن اعتماد وتشكيل: &lt;span class=&quot;text-emerald-700 font-bold underline&quot;&gt;{{ activeCommittee.name }}&lt;/span&gt;&lt;/p&gt;
                        &lt;/div&gt;

                        &lt;div class=&quot;text-sm space-y-2 leading-relaxed text-slate-800 text-justify font-serif&quot;&gt;

                            &lt;div class=&quot;bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3 no-print&quot;&gt;
                                &lt;span class=&quot;text-xs font-bold text-slate-500 block&quot;&gt;تعديل الإسناد النظامي وتواريخ اللجنة:&lt;/span&gt;
                                &lt;div class=&quot;grid grid-cols-1 md:grid-cols-3 gap-3&quot;&gt;
                                    &lt;div&gt;
                                        &lt;label class=&quot;block text-xs text-slate-400 mb-1&quot;&gt;تاريخ القرار&lt;/label&gt;
                                        &lt;input type=&quot;text&quot; v-model=&quot;activeCommittee.decisionDate&quot; class=&quot;w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-mono&quot;&gt;
                                    &lt;/div&gt;
                                    &lt;div&gt;
                                        &lt;label class=&quot;block text-xs text-slate-400 mb-1&quot;&gt;صلاحية التكليف&lt;/label&gt;
                                        &lt;input type=&quot;text&quot; v-model=&quot;activeCommittee.authority&quot; class=&quot;w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs&quot;&gt;
                                    &lt;/div&gt;
                                    &lt;div&gt;
                                        &lt;label class=&quot;block text-xs text-slate-400 mb-1&quot;&gt;المدة&lt;/label&gt;
                                        &lt;input type=&quot;text&quot; v-model=&quot;activeCommittee.duration&quot; class=&quot;w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs&quot;&gt;
                                    &lt;/div&gt;
                                &lt;/div&gt;
                            &lt;/div&gt;

                        &lt;/div&gt;

                                        &lt;th class=&quot;border border-slate-300 p-2 text-xs font-bold w-12&quot;&gt;م&lt;/th&gt;

                                        &lt;/td&gt;

                                        &lt;/td&gt;
                                        &lt;td class=&quot;border border-slate-300 p-2 text-xs no-print text-center&quot;&gt;
                                            &lt;button @click=&quot;removeMember(activeCommittee, idx)&quot; class=&quot;text-rose-600 hover:text-rose-950 p-1&quot;&gt;&lt;i data-lucide=&quot;trash-2&quot; class=&quot;w-4 h-4 inline&quot;&gt;&lt;/i&gt;&lt;/button&gt;
                                        &lt;/td&gt;
                                    &lt;/tr&gt;
                                &lt;/tbody&gt;
                            &lt;/table&gt;
                        &lt;/div&gt;

                        &lt;!-- زر إضافة عضو باللجنة --&gt;
                        &lt;div class=&quot;flex justify-start no-print&quot;&gt;
                            &lt;button @click=&quot;addNewMember(activeCommittee)&quot; class=&quot;bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-colors&quot;&gt;
                                &lt;i data-lucide=&quot;user-plus&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                                &lt;span&gt;إضافة عضو/عضوة للجدول&lt;/span&gt;
                            &lt;/button&gt;
                        &lt;/div&gt;

                        &lt;!-- مهام واختصاصات اللجنة --&gt;

                                &lt;/li&gt;
                            &lt;/ul&gt;
                        &lt;/div&gt;

                        &lt;!-- إمكانية إضافة مهمة جديدة للجنة --&gt;
                        &lt;div class=&quot;flex gap-2 mt-2 no-print&quot;&gt;

                            &lt;button @click=&quot;addTask(activeCommittee)&quot; class=&quot;bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-3 py-2 rounded-lg text-xs font-bold transition-colors&quot;&gt;إضافة&lt;/button&gt;
                        &lt;/div&gt;

                        &lt;p class=&quot;font-serif text-sm text-justify pt-4 committee-notification-clause&quot;&gt;ثالثاً: يُبلغ هذا القرار لجميع الأعضاء والمكلفين/المكلفات للعمل بموجبه اعتباراً من تاريخ صدوره، ويُرفع لقسم التوجيه والقيادة المدرسية بنسخة منه للتوثيق والاعتماد الإداري.&lt;/p&gt;

                        &lt;!-- قسم التوقيع والاعتماد الرسمي المطور بوجود الختم والتوقيع الرقمي للجنسين --&gt;

                            &lt;/div&gt;

                                    &lt;!-- التوقيع الرقمي --&gt;
                                    &lt;img v-if=&quot;schoolInfo.signatureImg&quot; :src=&quot;schoolInfo.signatureImg&quot; class=&quot;absolute w-24 h-auto object-contain z-10 bottom-2&quot; style=&quot;mix-blend-mode: multiply;&quot; alt=&quot;التوقيع الرقمي&quot;&gt;

                    &lt;/div&gt;
                    &lt;div class=&quot;flex flex-wrap items-center gap-2 w-full md:w-auto&quot;&gt;

                            &lt;option v-for=&quot;comm in committees&quot; :key=&quot;comm.id&quot; :value=&quot;comm.id&quot;&gt;{{ comm.name }}&lt;/option&gt;

                        &lt;select v-model=&quot;selectedMeetingIndex&quot; class=&quot;px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500&quot;&gt;

                            &lt;i data-lucide=&quot;plus&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                            &lt;span&gt;اجتماع جديد&lt;/span&gt;
                        &lt;/button&gt;

                        &lt;button @click=&quot;printCurrentMeeting&quot; class=&quot;bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5&quot;&gt;
                            &lt;i data-lucide=&quot;printer&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                            &lt;span&gt;طباعة المحضر (A4)&lt;/span&gt;
                        &lt;/button&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;div v-if=&quot;activeMeeting&quot; class=&quot;bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden p-6 space-y-6 print-card&quot;&gt;
                    &lt;!-- الترويسة الموحدة للاجتماعات بوزارة التعليم - مع التوسيط واليمين وبشعار مكبر ومسافات متسقة --&gt;
                    &lt;div class=&quot;official-header grid grid-cols-3 items-center border-b-2 border-slate-900 pb-5 mb-6 gap-6&quot;&gt;
                        &lt;!-- الترويسة اليمنى - تنسيق توسيط --&gt;
                        &lt;div class=&quot;text-center text-xs space-y-1.5&quot;&gt;
                            &lt;div&gt;المملكة العربية السعودية&lt;/div&gt;
                            &lt;div&gt;وزارة التعليم&lt;/div&gt;
                            &lt;div&gt;{{ schoolInfo.directorate }}&lt;/div&gt;
                            &lt;div class=&quot;font-bold text-slate-900 text-sm&quot;&gt;{{ schoolInfo.name }}&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;!-- الترويسة الوسطى - شعار الوزارة مكبر وبمسافات متناسقة --&gt;
                        &lt;div class=&quot;flex flex-col items-center justify-center space-y-2&quot;&gt;
                            &lt;img src=&quot;https://salogos.b-cdn.net/logos/svg/1774895141785-5zgexuf8.svg&quot; alt=&quot;شعار وزارة التعليم&quot; class=&quot;h-20 w-auto object-contain&quot;&gt;
                            &lt;div class=&quot;text-xs text-slate-500 font-bold&quot;&gt;محضر اجتماع رسمي&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;!-- الترويسة اليسرى - تنسيق من اليمين --&gt;
                        &lt;div class=&quot;text-right text-xs space-y-1.5 leading-relaxed&quot;&gt;
                            &lt;div&gt;اللجنة: &lt;span class=&quot;font-bold&quot;&gt;{{ activeCommittee.name }}&lt;/span&gt;&lt;/div&gt;
                            &lt;div&gt;تاريخ الاجتماع: &lt;span class=&quot;font-mono&quot;&gt;{{ activeMeeting.date }}&lt;/span&gt; هـ&lt;/div&gt;
                            &lt;div&gt;الاجتماع رقم: ({{ activeMeeting.number }})&lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;

                    &lt;!-- صلب محضر الاجتماع --&gt;

        methods: {
            isHijriLeapYear(year) {
                const y = parseInt(year || this.schoolInfo.hijriYear || 1447, 10);
                return ((11 * y + 14) % 30) &lt; 11;
            },
            getHijriMonthLength(month, year) {
                const m = parseInt(month || this.schoolInfo.hijriMonth || 1, 10);
                if (m === 12) return this.isHijriLeapYear(year) ? 30 : 29;
                return m % 2 === 1 ? 30 : 29;
            },
            getHijriDays() {
                const count = this.getHijriMonthLength(this.schoolInfo.hijriMonth, this.schoolInfo.hijriYear);
                return Array.from({ length: count }, (_, i) =&gt; String(i + 1).padStart(2, '0'));
            },
            normalizeHijriDateParts() {
                const info = this.schoolInfo;
                const match = String(info.hijriDate || '').match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
                if (match) {
                    info.hijriYear = String(info.hijriYear || match[1]);
                    info.hijriMonth = String(info.hijriMonth || match[2]).padStart(2, '0');
                    info.hijriDay = String(info.hijriDay || match[3]).padStart(2, '0');
                } else {
                    info.hijriYear = String(info.hijriYear || '1447');
                    info.hijriMonth = String(info.hijriMonth || '03').padStart(2, '0');
                    info.hijriDay = String(info.hijriDay || '23').padStart(2, '0');
                }
                this.updateHijriDate();
            },
            updateHijriDate() {
                const maxDay = this.getHijriMonthLength(this.schoolInfo.hijriMonth, this.schoolInfo.hijriYear);
                let day = parseInt(this.schoolInfo.hijriDay || '1', 10);
                if (day &gt; maxDay) day = maxDay;
                if (day &lt; 1) day = 1;
                this.schoolInfo.hijriDay = String(day).padStart(2, '0');
                this.schoolInfo.hijriMonth = String(this.schoolInfo.hijriMonth || '01').padStart(2, '0');
                this.schoolInfo.hijriYear = String(this.schoolInfo.hijriYear || '1447');
                this.schoolInfo.hijriDate = `${this.schoolInfo.hijriYear}/${this.schoolInfo.hijriMonth}/${this.schoolInfo.hijriDay}`;
            },
            loadData() {
                const storedSchool = localStorage.getItem('school_info');
                const storedActualReality = localStorage.getItem('school_actual_reality');
                const storedCommittees = localStorage.getItem('school_committees');
                const storedPlan = localStorage.getItem('school_operational_plan');
                const storedIndicators = localStorage.getItem('school_indicators_data');

                if (storedSchool &amp;&amp; storedCommittees &amp;&amp; storedPlan) {
                    this.schoolInfo = JSON.parse(storedSchool);
                    this.committees = JSON.parse(storedCommittees);
                    this.operationalPlan = JSON.parse(storedPlan);
                } else {
                    this.schoolInfo = { ...DEFAULT_SCHOOL_INFO };
                    this.committees = JSON.parse(JSON.stringify(DEFAULT_COMMITTEES));
                    this.operationalPlan = JSON.parse(JSON.stringify(DEFAULT_OPERATIONAL_PLAN));
                }

                if (storedActualReality) {
                    this.actualReality = JSON.parse(storedActualReality);
                } else {
                    this.actualReality = JSON.parse(JSON.stringify(DEFAULT_ACTUAL_REALITY));
                }

                if (storedIndicators) {
                    this.indicatorsData = JSON.parse(storedIndicators);
                } else {
                    this.indicatorsData = JSON.parse(JSON.stringify(DEFAULT_INDICATORS_DATA));
                }

                this.ensureUploadedPdfCommittees();

                if (this.committees.length &gt; 0) {
                    this.selectedCommitteeId = this.committees[0].id;
                }
            },
            ensureUploadedPdfCommittees() {
                const uploaded = JSON.parse(JSON.stringify(UPLOADED_PDF_COMMITTEES));
                uploaded.reverse().forEach(pdfCommittee =&gt; {
                    const existingIndex = this.committees.findIndex(c =&gt; c.id === pdfCommittee.id || c.name === pdfCommittee.name);
                    if (existingIndex === -1) {
                        this.committees.unshift(pdfCommittee);
                    } else {
                        const current = this.committees[existingIndex];
                        this.committees[existingIndex] = {
                            ...pdfCommittee,
                            ...current,
                            tasks: (current.tasks &amp;&amp; current.tasks.length) ? current.tasks : pdfCommittee.tasks,
                            members: (current.members &amp;&amp; current.members.length) ? current.members : pdfCommittee.members,
                            meetings: (current.meetings &amp;&amp; current.meetings.length) ? current.meetings : pdfCommittee.meetings,
                            sourceFile: current.sourceFile || pdfCommittee.sourceFile
                        };
                    }
                });
            },
            saveToLocalStorage() {
                // حفظ احتياطي محلي للمعاينة فقط، مع الحفظ المنظم داخل أرشيف التقويم الذاتي.
                localStorage.setItem('school_info', JSON.stringify(this.schoolInfo));
                localStorage.setItem('school_actual_reality', JSON.stringify(this.actualReality));
                localStorage.setItem('school_committees', JSON.stringify(this.committees));
                localStorage.setItem('school_operational_plan', JSON.stringify(this.operationalPlan));
                localStorage.setItem('school_indicators_data', JSON.stringify(this.indicatorsData));

                const archiveKey = 'self_evaluation_archive_v1';
                const now = new Date().toISOString();
                let archive = {};
                try { archive = JSON.parse(localStorage.getItem(archiveKey) || '{}') || {}; } catch (e) { archive = {}; }
                if (!archive.folders) archive.folders = {};

                const ensureFolder = (folderName) =&gt; {
                    if (!archive.folders[folderName]) {
                        archive.folders[folderName] = { name: folderName, createdAt: now, items: [] };
                    }
                    return archive.folders[folderName];
                };
                const saveEntry = (folderName, title, type, payload) =&gt; {
                    const folder = ensureFolder(folderName);
                    const id = `${type}-${Date.now()}`;
                    folder.items.unshift({
                        id,
                        title,
                        type,
                        source: 'اللجان والفرق والخطة التشغيلية',
                        savedAt: now,
                        schoolName: this.schoolInfo &amp;&amp; this.schoolInfo.name ? this.schoolInfo.name : '',
                        academicYear: this.schoolInfo &amp;&amp; this.schoolInfo.hijriYear ? this.schoolInfo.hijriYear : '',
                        data: JSON.parse(JSON.stringify(payload || {}))
                    });
                    folder.updatedAt = now;
                    try {
                        window.parent &amp;&amp; window.parent.postMessage({
                            type: 'SELF_EVAL_ARCHIVE_SAVE',
                            folderName: folderName,
                            recordName: folderName,
                            title: title,
                            data: payload,
                            createdAt: new Date().toLocaleString('ar-SA')
                        }, '*');
                    } catch(e) {}
                };

                let savedFolder = 'أرشيف التقويم الذاتي';
                if (this.currentTab === 'operationalPlan') {
                    saveEntry('الخطة التشغيلية', `الخطة التشغيلية - ${this.schoolInfo.hijriYear || ''}هـ`, 'operational_plan', this.operationalPlan);
                    savedFolder = 'الخطة التشغيلية';
                } else if (this.currentTab === 'formations') {
                    const committee = this.activeCommittee || {};

                    const committee = this.activeCommittee || {};
                    saveEntry('اجتماعات اللجان والفرق', `اجتماعات ${committee.name || 'اللجان والفرق'}`, 'committee_meetings', { committeeName: committee.name, meetings: committee.meetings || [] });
                    savedFolder = 'اجتماعات اللجان والفرق';
                } else if (this.currentTab === 'actualReality') {
                    saveEntry('واقع المدرسة الفعلي', `واقع المدرسة الفعلي - ${this.schoolInfo.hijriYear || ''}هـ`, 'school_reality', this.actualReality);
                    savedFolder = 'واقع المدرسة الفعلي';
                } else if (this.currentTab === 'indicatorsPortal') {
                    saveEntry('بوابة التميز والمؤشرات', `بوابة التميز والمؤشرات - ${this.schoolInfo.hijriYear || ''}هـ`, 'indicators_portal', this.indicatorsData);
                    savedFolder = 'بوابة التميز والمؤشرات';
                } else {
                    saveEntry('إعدادات وبيانات المدرسة', `بيانات المدرسة - ${this.schoolInfo.hijriYear || ''}هـ`, 'school_info', this.schoolInfo);
                    savedFolder = 'إعدادات وبيانات المدرسة';
                }

                localStorage.setItem(archiveKey, JSON.stringify(archive));
                this.showToast(`تم الحفظ في أرشيف التقويم الذاتي / ${savedFolder}`);
            },
            resetToDefault() {
                localStorage.removeItem('school_info');
                localStorage.removeItem('school_actual_reality');
                localStorage.removeItem('school_committees');
                localStorage.removeItem('school_operational_plan');

                this.loadData();
                this.showToast('تمت إعادة تعيين البيانات للافتراضية للمدرسة!');
            },
            exportDataAsJSON() {
                const bundle = {
                    schoolInfo: this.schoolInfo,
                    actualReality: this.actualReality,
                    committees: this.committees,
                    operationalPlan: this.operationalPlan,
                    indicatorsData: this.indicatorsData
                };
                const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `سجلات_اللجان_والخطة_التشغيلية_${this.schoolInfo.name}_1447هـ.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                this.showToast('تم تصدير ملف البيانات بنجاح!');
            },
            importDataFromJSON(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) =&gt; {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.schoolInfo &amp;&amp; parsed.committees &amp;&amp; parsed.operationalPlan) {
                            this.schoolInfo = parsed.schoolInfo;
                            this.actualReality = parsed.actualReality || JSON.parse(JSON.stringify(DEFAULT_ACTUAL_REALITY));
                            this.committees = parsed.committees;
                            this.operationalPlan = parsed.operationalPlan;
                            this.indicatorsData = parsed.indicatorsData || JSON.parse(JSON.stringify(DEFAULT_INDICATORS_DATA));
                            this.selectedCommitteeId = this.committees[0]?.id || '';
                            this.saveToLocalStorage();
                            this.showToast('تم استيراد وتطبيق البيانات بنجاح!');
                        } else {
                            alert('هيكل الملف غير صالح أو لا يحتوي على البيانات المطلوبة!');
                        }
                    } catch (error) {
                        alert('حدث خطأ أثناء قراءة ملف البيانات الخارجي!');
                    }
                };
                reader.readAsText(file);
            },

            startDrawing(e) {
                this.isDrawing = true;
                const rect = this.$refs.sigCanvas.getBoundingClientRect();
                this.lastX = e.clientX - rect.left;
                this.lastY = e.clientY - rect.top;
            },
            draw(e) {
                if (!this.isDrawing) return;
                const canvas = this.$refs.sigCanvas;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                ctx.beginPath();
                ctx.strokeStyle = '#1e3a8a';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.moveTo(this.lastX, this.lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
                
                this.lastX = x;
                this.lastY = y;
            },
            startDrawingTouch(e) {
                this.isDrawing = true;
                const rect = this.$refs.sigCanvas.getBoundingClientRect();
                const touch = e.touches[0];
                this.lastX = touch.clientX - rect.left;
                this.lastY = touch.clientY - rect.top;
            },
            drawTouch(e) {
                if (!this.isDrawing) return;
                e.preventDefault();
                const canvas = this.$refs.sigCanvas;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                
                ctx.beginPath();
                ctx.strokeStyle = '#1e3a8a';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.moveTo(this.lastX, this.lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
                
                this.lastX = x;
                this.lastY = y;
            },
            stopDrawing() {
                this.isDrawing = false;
            },

                    : '.committee-print-sheet';
                const source = document.querySelector(selector);
                if (!source) {
                    this.showToast('تعذر العثور على النموذج المطلوب للطباعة.');
                    return;
                }

                /* إنشاء نافذة طباعة مستقلة حتى لا يطبع المتصفح إطار الـ iframe
                   أو أشرطة التمرير الخاصة بواجهة العرض. */

                    return;

                    const cloned = cloneControls[index];

                        replacement.textContent = control.options[control.selectedIndex]?.text || '';

                        replacement.className += ' print-choice-value';

const STORAGE='sa_self_eval_actual_v3';
const settingsDefault={school:'',edu:'',manager:'',academicYear:'1447هـ',semester:'الفصل الدراسي الأول',signature:'',stamp:''};
const planDefault={vision:'',mission:'',strategicGoal:'',owner:'مدير المدرسة',rows:[]};
let state={settings:{...settingsDefault},items:{},plan:{...planDefault}};
let activeRecordIndex=null;
function k(di,ri,ti){return `${di}-${ri}-${ti}`}
function defaultItem(){return {status:0,date:'',desc:'',evidence:[]}}
function initState(){try{let saved=JSON.parse(localStorage.getItem(STORAGE)||'null'); if(saved) state=saved}catch(e){} state.settings={...settingsDefault,...(state.settings||{})}; state.plan={...planDefault,...(state.plan||{})}; if(!state.plan.rows)state.plan.rows=[]; if(!state.items) state.items={}; domains.forEach((d,di)=&gt;d.records.forEach((r,ri)=&gt;r.tasks.forEach((t,ti)=&gt;{let id=k(di,ri,ti); if(!state.items[id]) state.items[id]=defaultItem()})))}
function archiveRead(){try{return JSON.parse(localStorage.getItem('self_evaluation_archive_v1')||'{}')||{}}catch(e){return {}}}
function archiveWrite(archive){localStorage.setItem('self_evaluation_archive_v1',JSON.stringify(archive))}
function archiveSave(folderName,title,type,payload){
  const now=new Date().toISOString();
  const archive=archiveRead();
  if(!archive.folders) archive.folders={};
  if(!archive.folders[folderName]) archive.folders[folderName]={name:folderName,createdAt:now,items:[]};
  archive.folders[folderName].items.unshift({id:`${type}-${Date.now()}`,title,type,source:'سجلات التقويم الذاتي والمؤشرات',savedAt:now,schoolName:state.settings.school||'',academicYear:state.settings.academicYear||'',data:JSON.parse(JSON.stringify(payload||{}))});
  archive.folders[folderName].updatedAt=now;
  archiveWrite(archive);
}
function recordPayload(di,ri){
  const d=domains[di], r=d.records[ri];
  const tasks=r.tasks.map((task,ti)=&gt;({task,...(state.items[k(di,ri,ti)]||defaultItem())}));
  return {domain:d.name,recordName:r.name,tasks,settings:state.settings,score:recordScore(di,ri)};
}
function saveCurrentRecordToArchive(){
  localStorage.setItem(STORAGE,JSON.stringify(state));
  if(activeRecordIndex){
    const {di,ri}=activeRecordIndex;
    const folderName=domains[di].records[ri].name;
    archiveSave(folderName, `${folderName} - ${new Date().toLocaleDateString('ar-SA')}`, 'self_evaluation_record', recordPayload(di,ri));
    toast(`تم الحفظ في أرشيف التقويم الذاتي / ${folderName}`);
  } else {
    archiveSave('سجلات التقويم الذاتي والمؤشرات','نسخة عامة من سجلات التقويم الذاتي','self_evaluation_bundle',state);
    toast('تم الحفظ في أرشيف التقويم الذاتي / سجلات التقويم الذاتي والمؤشرات');
  }
}
function saveLocal(){
  localStorage.setItem(STORAGE,JSON.stringify(state));
  try{
    const target=(window.parent&&window.parent!==window&&window.parent.localStorage)?window.parent.localStorage:window.localStorage;
    target.setItem('school_operational_execution_v1',JSON.stringify(state.plan||{}));
  }catch(e){}
  if(activeRecordIndex){
    const {di,ri}=activeRecordIndex;
    const folderName=domains[di].records[ri].name;
    archiveSave(folderName, `${folderName} - حفظ تلقائي`, 'self_evaluation_record', recordPayload(di,ri));
    toast(`تم الحفظ في مجلد ${folderName}`);
  } else {
    archiveSave('سجلات التقويم الذاتي والمؤشرات','حفظ عام لسجلات التقويم الذاتي','self_evaluation_bundle',state);
    toast('تم حفظ البيانات في أرشيف التقويم الذاتي');
  }
}
function toast(msg){let el=document.createElement('div');el.textContent=msg;el.style.cssText='position:fixed;left:24px;bottom:24px;background:#0f8a56;color:#fff;padding:12px 18px;border-radius:12px;z-index:9999;box-shadow:0 10px 28px rgba(0,0,0,.2)';document.body.appendChild(el);setTimeout(()=&gt;el.remove(),1800)}

function ensureEvidenceSlot(di,ri,ti){
  let id=k(di,ri,ti);
  if(!state.items[id]) state.items[id]=defaultItem();
  if(!Array.isArray(state.items[id].evidence)) state.items[id].evidence=[];
  return state.items[id].evidence;
}
function detectEvidenceType(file){
  if(!file) return 'file';
  if(file.type &amp;&amp; file.type.startsWith('image/')) return 'image';
  if((file.type||'').includes('pdf') || /\.pdf$/i.test(file.name||'')) return 'pdf';
  return 'file';
}
function addFileEvidence(di,ri,ti,input){
  let files=Array.from(input.files||[]);
  if(!files.length){toast('لم يتم اختيار ملف');return;}
  let pending=files.length;
  files.forEach(file=&gt;{
    let reader=new FileReader();
    reader.onload=()=&gt;{
      ensureEvidenceSlot(di,ri,ti).push({
        type:detectEvidenceType(file),
        name:file.name||'شاهد من الجهاز',
        data:reader.result,
        size:file.size||0,
        source:'رفع من الجهاز',
        createdAt:new Date().toLocaleString('ar-SA')
      });
      pending--;
      if(pending===0){
        input.value='';
        renderEvidenceList(di,ri,ti);
        calc();
        saveLocal();
        toast('تم رفع الشاهد من الجهاز واحتسابه ضمن إنجاز التقويم الذاتي');
      }
    };
    reader.onerror=()=&gt;{pending--; toast('تعذر قراءة أحد الملفات')};
    reader.readAsDataURL(file);
  });
}

function candidateFromValue(value,source,key,out,depth){
  if(value==null||depth&gt;5||out.length&gt;250)return;
  if(typeof value==='string'){
    let txt=value.trim();
    if(!txt)return;
    if(txt.startsWith('data:')||txt.startsWith('http')||txt.length&gt;80){
      out.push({name:key.split(':').pop()||'شاهد محفوظ',type:'platform',source,storageKey:key,url:txt.startsWith('http')?txt:'',data:txt.startsWith('data:')?txt:'',text:txt.startsWith('data:')?'':txt.slice(0,600)});
    }
    return;
  }
  if(Array.isArray(value)){value.forEach(v=&gt;candidateFromValue(v,source,key,out,depth+1));return;}
  if(typeof value==='object'){
    let title=value.displayName||value.title||value.name||value.fileName||value.filename||value.recordName||value.folderName||value.reportTitle||value.subject||value.label||'';
    let html=value.htmlContent||value.officialHtml||value.pdfHtml||value.templateHtml||value.contentHtml||value.html||'';
    let data=value.data||value.fileData||value.base64||value.url||value.link||value.href||'';
    let text=value.text||value.summary||value.description||value.content||value.minutes||value.body||'';
    let hasFile=title||html||data||text||value.createdAt||value.savedAt||value.date;
    if(hasFile){
      out.push({
        name:title||('شاهد محفوظ - '+source),type:'platform',source,storageKey:key,
        htmlContent:html||'',url:(String(data).startsWith('http')?data:''),data:(String(data).startsWith('data:')?data:''),text:String(text||'').slice(0,1200),createdAt:value.createdAt||value.date||value.savedAt||''
      });
    }
    Object.keys(value).slice(0,80).forEach(k2=&gt;{
      if(/items|files|attachments|evidence|records|reports|archive|children|folders|docs|documents|entries|list|data/i.test(k2))candidateFromValue(value[k2],source,key,out,depth+1)
    });
  }
}

function aiExpandTokens(words){
  const groups=[
    ['تقويم','التقويم','ذاتي','الذاتي','تقييم','اعتماد','جوده','تميز'],
    ['خطة','خطه','الخطة','التشغيلية','تشغيلية','مبادرة','مبادرات','تنفيذ','متابعة'],
    ['اجتماع','اجتماعات','محضر','محاضر','لقاء','لقاءات','فريق','لجنة','لجان'],
    ['شاهد','شواهد','دليل','ادلة','اثبات','توثيق','مرفق','مرفقات','صورة','صور','رابط','روابط','ملف','ملفات'],
    ['تحصيل','نتائج','اختبار','اختبارات','نافس','مؤشر','مؤشرات','تحليل','قياس'],
    ['سلامة','امن','إخلاء','اخلاء','طوارئ','مخاطر','صيانة','بيئة','مبنى'],
    ['معلم','معلمة','معلمين','تعلم','تعليم','درس','دروس','زيارة','زيارات','صفية','منهج'],
    ['طالب','طلاب','متعلمين','غياب','انضباط','مواظبة','سلوك','قيم','صحة'],
    ['تعميم','نشرة','اعلان','توعية','ثقافة','تدريب','ورشة','عرض','حضور']

<script>
(function(){
  const MANAGER_ARCHIVE_KEY='manager_self_evaluation_archive_v1';
  const EXTRA_FOLDERS=['الخطة التشغيلية','قرارات اللجان والفرق','اجتماعات اللجان والفرق'];
  function saveToManagerArchive(payload){
    try{
      const target = (window.parent && window.parent !== window && window.parent.localStorage) ? window.parent.localStorage : window.localStorage;
      let arr=[];
      try{ arr=JSON.parse(target.getItem(MANAGER_ARCHIVE_KEY)||'[]')||[]; }catch(e){ arr=[]; }
      const name=payload.recordName||payload.folderName||payload.title||'سجل التقويم الذاتي';

  window.addEventListener('message',function(event){
    const d=event.data||{};
