<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قسم التكليفات الإضافية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:linear-gradient(135deg,#eef7fb,#f7fbff);color:#0f172a}.wrap{max-width:1180px;margin:22px auto;padding:0 16px}.top{background:#fff;border:1px solid #dbeafe;border-radius:28px;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 12px 30px rgba(15,23,42,.05)}h1{margin:0;font-size:28px;font-weight:900}.hint{margin:7px 0 0;color:#64748b;font-size:13px;font-weight:800}.btn{border:0;border-radius:14px;background:#0f766e;color:#fff;padding:12px 18px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.btn.light{background:#fff;color:#0f766e;border:1px solid #99f6e4}.btn.blue{background:#2563eb}.btn.amber{background:#f59e0b}.btn.red{background:#ef4444}.layout{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-top:18px}.side,.panel{background:#fff;border:1px solid #dbeafe;border-radius:26px;padding:16px;box-shadow:0 12px 30px rgba(15,23,42,.04)}.roleBox{padding:16px;border-radius:22px;background:linear-gradient(135deg,#eef2ff,#ecfeff);border:1px solid #bfdbfe;margin-bottom:14px}.roleBox b{font-size:15px}.roleBox small{display:block;color:#64748b;font-weight:800;margin-top:6px}.folderBtn{width:100%;border:1px solid #e2e8f0;background:#f8fafc;border-radius:18px;padding:14px;margin-bottom:10px;text-align:right;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:.2s}.folderBtn:hover,.folderBtn.active{border-color:#67e8f9;background:#ecfeff;transform:translateY(-1px)}.folderBtn b{display:block;font-size:14px}.folderBtn small{display:block;color:#64748b;font-size:11px;font-weight:700;margin-top:3px}.panelHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid #e2e8f0;padding-bottom:14px;margin-bottom:14px}.panelHead h2{margin:0;font-size:24px;font-weight:900}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{border:1px solid #e2e8f0;border-radius:20px;padding:15px;background:#fbfdff}.item h3{margin:0 0 8px;font-size:17px}.desc{font-size:12px;color:#64748b;font-weight:800;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{border:1px dashed #cbd5e1;border-radius:22px;padding:30px;text-align:center;color:#64748b;font-weight:900;background:#f8fafc}.badge{display:inline-flex;border-radius:999px;padding:5px 10px;background:#e0f2fe;color:#0369a1;font-weight:900;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:#0f766e}.stat span{font-size:11px;color:#64748b;font-weight:800}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;background:#f8fafc;border:1px solid #dbeafe;border-radius:22px;padding:14px;margin:14px 0}.hidden{display:none!important}.field label{display:block;font-size:12px;font-weight:900;color:#475569;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:10px;font-family:inherit}.field.full{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.roleChip{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;margin:4px 0 0 4px}@media(max-width:800px){.layout{grid-template-columns:1fr}.items{grid-template-columns:1fr}.top{flex-direction:column;align-items:stretch}.stats{grid-template-columns:repeat(2,1fr)}}
</style>

<!-- PREMIUM_UI_2026 -->
<link rel="stylesheet" href="premium-ui.css">
<script defer src="premium-ui.js"></script>
</head>
<body>
<div class="wrap">
<header class="top"><div><h1 id="pageTitle">قسم التكليفات الإضافية</h1><p id="teacherMeta" class="hint">يظهر فقط عند وجود تكليف إضافي رسمي.</p><div id="roleBadges"></div></div><button class="btn light" onclick="history.back()">رجوع</button></header>
<div id="noRoles" class="empty" style="margin-top:18px;display:none">لا توجد تكليفات إضافية مفعلة لهذا الحساب حاليًا.</div>
<div id="mainLayout" class="layout" style="display:none"><aside class="side"><div id="roleSummary" class="roleBox"></div><div id="folderNav"></div></aside><main id="content" class="panel"></main></div>
</div>
<script>
function norm(v){if(Array.isArray(v))return v.map(String).filter(Boolean);if(typeof v==='string')return v.split(/[،,|]+/).map(x=>x.trim()).filter(Boolean);return []}
function code(x){x=String(x||'').trim();var m={'التوجيه الصحي':'health_guidance','موجه صحي':'health_guidance','الموجه الصحي':'health_guidance','health':'health_guidance','health_guidance':'health_guidance','منسق الموهوبين':'gifted_coordinator','منسق/ة الموهوبين':'gifted_coordinator','الموهوبين':'gifted_coordinator','الجودة':'quality_coordinator','منسق الجودة':'quality_coordinator','منسق/ة الجودة':'quality_coordinator','الإرشاد':'student_guidance','الإرشاد الطلابي':'student_guidance','منصة مدرستي':'madrasati_coordinator','منسق منصة مدرستي':'madrasati_coordinator'};return m[x]||x}
function normRoles(v){return norm(v).map(code).filter(Boolean)}
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function currentUser(){var q=new URLSearchParams(location.search||'');var qRoles=norm(q.get('teacher_extra_roles')||q.get('additional_assignments')||q.get('extra_roles')||'');var u={id:q.get('uid')||'',email:q.get('email')||localStorage.getItem('currentUserEmail')||'',name:localStorage.getItem('currentUserName')||'',role:'teacher',teacher_extra_roles:qRoles,additional_assignments:qRoles,extra_roles:qRoles};['currentSchoolUser','currentUser','smart_school_current_session'].forEach(k=>{try{var x=JSON.parse(localStorage.getItem(k)||'null');if(x)u=Object.assign(u,x)}catch(e){}});if(qRoles.length&&!normRoles(u.teacher_extra_roles||u.additional_assignments||u.extra_roles||u.extraRoles).length){u.teacher_extra_roles=qRoles;u.additional_assignments=qRoles;u.extra_roles=qRoles;}return u}
function storedUser(u){var email=String(u.email||localStorage.getItem('currentUserEmail')||'').trim().toLowerCase(),id=String(u.id||'').trim();for(const k of ['smartSchoolCloudStorage_users','smart_school_users']){try{var arr=JSON.parse(localStorage.getItem(k)||'[]')||[];var f=arr.find(x=>(id&&String(x.id)===id)||(email&&String(x.email||'').trim().toLowerCase()===email));if(f)return f}catch(e){}}return null}
function roleMaps(){var a=[];try{a.push(JSON.parse(localStorage.getItem('smart_school_teacher_extra_roles_map')||'{}'))}catch(e){}try{a.push(JSON.parse(localStorage.getItem('smartSchoolCloudStorage_teacher_extra_roles_map')||'{}'))}catch(e){}try{a.push(JSON.parse(localStorage.getItem('smartSchoolUnifiedOpsV2_teacher_extra_roles_map')||'{}'))}catch(e){}return a}
const teacher=currentUser();
function getRoles(){let r=normRoles(teacher.teacher_extra_roles||teacher.additional_assignments||teacher.extra_roles||teacher.extraRoles);let s=storedUser(teacher);if(!r.length&&s)r=normRoles(s.teacher_extra_roles||s.additional_assignments||s.extra_roles||s.extraRoles);for(const m of roleMaps()){if(!r.length&&teacher.id)r=normRoles(m['id:'+teacher.id]);if(!r.length&&teacher.email)r=normRoles(m['email:'+String(teacher.email).trim().toLowerCase()]);if(!r.length&&localStorage.getItem('currentUserEmail'))r=normRoles(m['email:'+String(localStorage.getItem('currentUserEmail')).trim().toLowerCase()])}return Array.from(new Set(r))}
const roleDefs={
 health_guidance:{label:'التوجيه الصحي',title:'التوجيه الصحي — معلم/معلمة مكلف/ة',desc:'السجلات الصحية الرسمية وأرشيفها داخل التكليف الإضافي.',folders:[
  {id:'health_dashboard',icon:'📊',title:'لوحة التوجيه الصحي',desc:'مؤشرات مختصرة للحالات والبرامج الصحية.'},
  {id:'health_registry',icon:'🩺',title:'السجل الصحي الشامل',desc:'سجل موحد للحالات الصحية والعيادة والأمراض المعدية والمزمنة.'},
  {id:'health_programs',icon:'📢',title:'البرامج الصحية',desc:'سجل التوعية والمبادرات والفعاليات الصحية.'},
  {id:'health_environment',icon:'🍏',title:'البيئة الصحية المدرسية',desc:'متابعة المقصف والنظافة ومياه الشرب والبيئة.'},
  {id:'health_referrals',icon:'☎️',title:'التحويلات والتواصل الصحي',desc:'التواصل مع المركز الصحي والتحويلات الطبية.'},
  {id:'health_archive',icon:'📦',title:'أرشيف السجلات الصحية',desc:'أرشيف الأعمال الصحية المعتمدة والتقارير الختامية.'}
 ]},
 gifted_coordinator:{label:'الموهوبين',title:'الموهوبون — معلم/معلمة مكلف/ة',desc:'سجلات حصر ورعاية الموهوبين وأرشيفها.',folders:[
  {id:'gifted_list',icon:'⭐',title:'حصر الموهوبين',desc:'قائمة الطلاب الموهوبين ومجالات تميزهم.'},
  {id:'gifted_programs',icon:'🏆',title:'برامج الرعاية',desc:'برامج ومبادرات رعاية الموهوبين.'},
  {id:'gifted_evidence',icon:'🧾',title:'الشواهد',desc:'شواهد الأعمال والإنجازات.'},
  {id:'gifted_archive',icon:'📦',title:'أرشيف الموهوبين',desc:'أرشيف السجلات المعتمدة.'}
 ]},
 quality_coordinator:{label:'الجودة',title:'الجودة — معلم/معلمة مكلف/ة',desc:'سجلات الجودة والتحسين.',folders:[
  {id:'quality_plans',icon:'📋',title:'خطط الجودة',desc:'خطط التحسين والمتابعة.'},
  {id:'quality_indicators',icon:'📈',title:'المؤشرات',desc:'مؤشرات الأداء والشواهد.'},
  {id:'quality_archive',icon:'📦',title:'أرشيف الجودة',desc:'أرشيف أعمال الجودة.'}
 ]},
 student_guidance:{label:'الإرشاد الطلابي',title:'الإرشاد الطلابي — معلم/معلمة مكلف/ة',desc:'سجلات المتابعة والإرشاد.',folders:[
  {id:'guidance_cases',icon:'👥',title:'الحالات الطلابية',desc:'حصر ومتابعة الحالات.'},
  {id:'guidance_plans',icon:'📝',title:'خطط التدخل',desc:'الخطط العلاجية والمتابعة.'},
  {id:'guidance_archive',icon:'📦',title:'أرشيف الإرشاد',desc:'أرشيف أعمال الإرشاد.'}
 ]},
 madrasati_coordinator:{label:'منصة مدرستي',title:'منصة مدرستي — معلم/معلمة مكلف/ة',desc:'متابعة أعمال منصة مدرستي.',folders:[
  {id:'madrasati_followup',icon:'💻',title:'متابعة المنصة',desc:'متابعة تفعيل الأدوات والحضور.'},
  {id:'madrasati_reports',icon:'📑',title:'التقارير',desc:'تقارير منصة مدرستي.'},
  {id:'madrasati_archive',icon:'📦',title:'أرشيف منصة مدرستي',desc:'أرشيف الأعمال المعتمدة.'}
 ]}
};
const roles=getRoles().filter(r=>roleDefs[r]);let activeRole=roles[0]||null,currentFolder='';const owner='teacher_'+(teacher.id||teacher.email||teacher.name||'local');const storeKey='additional_role_work_'+owner;
function allItems(){try{return JSON.parse(localStorage.getItem(storeKey)||'[]')||[]}catch(e){return []}}function setAllItems(v){localStorage.setItem(storeKey,JSON.stringify(v||[]))}function uid(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}function statusText(s){return {draft:'مسودة',pending:'بانتظار الاعتماد',returned:'معاد للتعديل',rejected:'غير معتمد',approved:'معتمد'}[s]||'مسودة'}
function init(){if(!roles.length){noRoles.style.display='block';mainLayout.style.display='none';return}mainLayout.style.display='grid';noRoles.style.display='none';roleBadges.innerHTML=roles.map(r=>'<span class="roleChip">'+esc(roleDefs[r].label)+'</span>').join('');if(!currentFolder)currentFolder=roleDefs[activeRole].folders[0].id;render()}
function render(){var def=roleDefs[activeRole];pageTitle.textContent=def.title;teacherMeta.textContent=(teacher.name?teacher.name+' — ':'')+def.desc;roleSummary.innerHTML='<b>معلم/معلمة مكلف/ة بـ</b><small>'+esc(def.label)+'</small>'+(roles.length>1?'<div class="toolbar">'+roles.map(r=>'<button class="btn light" onclick="switchRole(\''+r+'\')">'+esc(roleDefs[r].label)+'</button>').join('')+'</div>':'');folderNav.innerHTML=def.folders.map(f=>'<button class="folderBtn '+(currentFolder===f.id?'active':'')+'" onclick="openFolder(\''+f.id+'\')"><span><b>'+f.icon+' '+esc(f.title)+'</b><small>'+esc(f.desc)+'</small></span><span>›</span></button>').join('');renderContent()}
function switchRole(r){activeRole=r;currentFolder=roleDefs[r].folders[0].id;render()}function openFolder(id){currentFolder=id;render()}
function itemList(){return allItems().filter(x=>x.role===activeRole&&x.folder===currentFolder)}function counts(){let a=allItems().filter(x=>x.role===activeRole);return ['draft','pending','returned','approved'].map(s=>'<div class="stat"><b>'+a.filter(x=>x.status===s).length+'</b><span>'+statusText(s)+'</span></div>').join('')}
function renderContent(){let def=roleDefs[activeRole],f=def.folders.find(x=>x.id===currentFolder)||def.folders[0],items=itemList();let html='<div class="panelHead"><div><h2>'+f.icon+' '+esc(f.title)+'</h2><p class="hint">'+esc(f.desc)+'</p></div>'+(activeRole==='health_guidance'?'<a class="btn blue" href="school_health_unified_registry.html" target="_self">فتح الملف الصحي الموحد</a>':'')+'</div><div class="stats">'+counts()+'</div>';if(activeRole==='health_guidance')html+=healthContent(f);else html+=genericContent(f,items);content.innerHTML=html}
function healthContent(f){let records={health_dashboard:['ملخص الحالات الصحية','إحصاءات الزيارات','تنبيهات صحية'],health_registry:['السجل الصحي الشامل','سجل الحالات الصحية','سجل الإسعافات الأولية'],health_programs:['سجل التوعية الصحية','المبادرات الصحية','الفعاليات والبرامج'],health_environment:['متابعة المقصف صحيًا','نظافة البيئة المدرسية','مصادر المياه ودورات المياه'],health_referrals:['التواصل مع المركز الصحي','التحويلات الطبية','متابعة أولياء الأمور'],health_archive:['أرشيف السجلات الصحية','التقارير الختامية','الأعمال المعتمدة']};let list=records[f.id]||[];return '<div class="items">'+list.map(r=>'<div class="item"><h3>'+esc(r)+'</h3><div class="desc">جزء من ملف التوجيه الصحي الموحد. يتم العمل عليه من الملف الصحي، ويحفظ أرشيفه داخل أرشيف السجلات الصحية.</div><div class="actions"><a class="btn light" href="school_health_unified_registry.html" target="_self">فتح الملف الموحد</a><button class="btn" onclick="quickAdd(\''+esc(r)+'\')">توثيق عمل</button></div></div>').join('')+'</div><hr style="border:0;border-top:1px solid #e2e8f0;margin:16px 0">'+genericContent(f,itemList())}
function genericContent(f,items){return '<div class="toolbar"><button class="btn" onclick="showForm()">توثيق عمل / رفع شاهد</button></div>'+formHtml('hidden')+'<div class="items">'+(items.length?items.map(itemHtml).join(''):'<div class="empty">لا توجد أعمال موثقة داخل هذا المجلد حاليًا.</div>')+'</div>'}
function formHtml(cls){return '<form id="itemForm" class="form '+(cls||'')+'" onsubmit="saveItem(event)"><div class="field"><label>عنوان العمل</label><input id="itTitle" required></div><div class="field"><label>الحالة</label><select id="itStatus"><option value="draft">مسودة</option><option value="pending">بانتظار الاعتماد</option><option value="returned">معاد للتعديل</option><option value="approved">معتمد</option></select></div><div class="field"><label>رابط داعم</label><input id="itLink" placeholder="https://..."></div><div class="field"><label>رفع ملف/شاهد</label><input id="itFile" type="file"></div><div class="field full"><label>الوصف</label><textarea id="itDesc"></textarea></div><div class="field full"><button class="btn" type="submit">حفظ العمل</button> <button class="btn blue" type="button" onclick="saveItem(event,\'pending\')">إرسال للاعتماد</button></div></form>'}
function showForm(){document.getElementById('itemForm')&&document.getElementById('itemForm').classList.remove('hidden')}function quickAdd(t){showForm();setTimeout(()=>{let x=document.getElementById('itTitle');if(x)x.value=t},0)}
function fileMeta(){let f=document.getElementById('itFile')&&document.getElementById('itFile').files[0];return f?{name:f.name,size:f.size,type:f.type||'ملف'}:null}
function saveItem(e,forced){if(e&&e.preventDefault)e.preventDefault();let arr=allItems();arr.unshift({id:uid('role'),role:activeRole,folder:currentFolder,title:document.getElementById('itTitle').value,status:forced||document.getElementById('itStatus').value,link:document.getElementById('itLink').value,desc:document.getElementById('itDesc').value,file:fileMeta(),createdAt:new Date().toISOString()});setAllItems(arr);renderContent()}
function itemHtml(x){return '<div class="item"><h3>'+esc(x.title)+'</h3><div class="desc">'+esc(x.desc||'')+'</div><span class="badge">'+statusText(x.status)+'</span><div class="actions">'+(x.link?'<a class="btn light" href="'+esc(x.link)+'" target="_blank">فتح الرابط</a>':'')+'<button class="btn blue" onclick="setStatus(\''+x.id+'\',\'pending\')">إرسال للاعتماد</button><button class="btn red" onclick="removeItem(\''+x.id+'\')">حذف</button></div></div>'}
function setStatus(id,s){let a=allItems().map(x=>x.id===id?Object.assign(x,{status:s}):x);setAllItems(a);renderContent()}function removeItem(id){if(confirm('حذف العمل؟')){setAllItems(allItems().filter(x=>x.id!==id));renderContent()}}
init();
</script>
