<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساحة عمل المستند السحابي</title><style>html,body{height:100%;margin:0;font-family:Tajawal,Arial,sans-serif;background:#f5f8fa;color:#17384a}*{box-sizing:border-box}.top{height:58px;background:#15445A;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px}.top strong{flex:1}.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:800;cursor:pointer}.back{background:#fff;color:#15445A}.status{font-size:13px;opacity:.9}.wrap{height:calc(100% - 58px);position:relative}.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.card{background:#fff;border:1px solid #d8e2e8;border-radius:16px;padding:22px;max-width:680px;box-shadow:0 12px 40px rgba(20,68,90,.12)}#editor{width:100%;height:100%;display:none}.danger{background:#ef4444;color:#fff}</style></head><body>
<header class="top"><button class="btn back" id="back">العودة</button><strong id="title">مساحة عمل المستند السحابي</strong><span class="status" id="status">جارٍ التحقق...</span></header><main class="wrap"><div id="message" class="msg"><div class="card"><h2>جارٍ تجهيز المستند للتحرير</h2><p>يتم التحقق من المدرسة وصلاحية المستخدم وقفل التحرير وإنشاء جلسة معزولة.</p></div></div><div id="editor"></div></main>
<script src="platform-cloud-session.js?v=20260910-RL33-cdw-connection-config"></script><script src="cloud-document-workspace.js?v=20260910-cdw-canonical-connection"></script><script>
(async function(){const qs=new URLSearchParams(location.search),fileId=qs.get('file'),ret=qs.get('return')||'cloud_files_center.html';const title=document.getElementById('title'),status=document.getElementById('status'),message=document.getElementById('message'),editor=document.getElementById('editor');let sessionId='',beat=null,docEditor=null;document.getElementById('back').onclick=()=>location.href=ret;const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fail(text,allowForce,code){status.textContent='تعذر الفتح';message.style.display='flex';editor.style.display='none';message.innerHTML=`<div class="card"><h2>تعذر فتح المستند للتحرير</h2><p>${esc(text)}</p>${code?`<p style="font-size:12px;color:#64748b">رمز التشخيص: ${esc(code)}</p>`:''}${allowForce?'<button id="forceOpen" class="btn danger">إنهاء جلستي السابقة وإعادة الفتح</button>':''}<p style="font-size:12px;color:#64748b">لن يتم تعديل الملف الأصلي ما لم ينجح الحفظ السحابي.</p></div>`;if(allowForce)document.getElementById('forceOpen').onclick=()=>boot(true)}async function boot(force){try{status.textContent='فحص خدمة التحرير...';const h=await CloudDocumentWorkspace.health();if(!h.configured)throw Object.assign(new Error('خدمة مساحة العمل متصلة بنجاح، لكن ONLYOFFICE غير مهيأ بعد. أضف ONLYOFFICE_DOCUMENT_SERVER_URL و ONLYOFFICE_JWT_SECRET إلى أسرار مشروع Supabase ثم أعد نشر الدالة.'),{code:'ONLYOFFICE_NOT_CONFIGURED'});status.textContent='التحقق من صلاحية الملف...';const data=await CloudDocumentWorkspace.openSession(fileId,force);sessionId=data.sessionId;title.textContent=data.file?.display_name||'مستند سحابي';status.textContent='جلسة تحرير آمنة';const src=String(data.documentServerUrl||'').replace(/\/$/,'')+'/web-apps/apps/api/documents/api.js';if(!window.DocsAPI)await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('تعذر تحميل محرر ONLYOFFICE Docs.'));document.head.appendChild(s)});if(!window.DocsAPI)throw new Error('لم يتم تحميل واجهة محرر المستندات.');message.style.display='none';editor.style.display='block';docEditor=new DocsAPI.DocEditor('editor',{...data.config,width:'100%',height:'100%',events:{onError:e=>{console.error('ONLYOFFICE',e);status.textContent='حدث خطأ في المحرر'},onDocumentReady:()=>{status.textContent='جاهز — الحفظ السحابي والإصدارات مفعّلان'}}});clearInterval(beat);beat=setInterval(()=>CloudDocumentWorkspace.heartbeat(sessionId).catch(()=>{}),60000)}catch(e){console.error('[Cloud Document Workspace]',e);fail(e.message,e.status===409,e.code||'')}}if(!fileId){fail('لم يتم تحديد ملف.');return}await boot(false);window.addEventListener('pagehide',()=>{clearInterval(beat)});})();
</script></body></html>
