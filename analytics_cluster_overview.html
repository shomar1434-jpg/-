<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحليل المجمع التعليمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eef5f3;font-family:Cairo,Tahoma,Arial;color:#0f172a}
.hero{background:linear-gradient(135deg,#052e2b,#0f766e);color:white;padding:24px;border-radius:0 0 34px 34px}
.wrap{max-width:1280px;margin:22px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:white;border-radius:28px;padding:20px;border:1px solid #dbe7e2;box-shadow:0 12px 30px rgba(15,23,42,.07)}
.kpi{font-size:40px;font-weight:900;color:#0f766e}
.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:#ecfdf5;color:#047857;font-weight:900;font-size:12px}
.table{width:100%;border-collapse:collapse;background:white;border-radius:22px;overflow:hidden}
th,td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:right}
th{background:#ecfdf5;color:#065f46}
.bar{height:14px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:#0f766e;border-radius:999px}
.btn{display:inline-block;background:#0f766e;color:white;text-decoration:none;padding:10px 14px;border-radius:14px;font-weight:900}
</style></head>
<body>
<div class="hero">
<h1>تحليل المجمع التعليمي</h1>
<p>لوحة موحدة لتحليل جميع المدارس المرتبطة بالمدير والمقارنة بينها.</p>
<a class="btn" href="manager.html">العودة لقسم المدير/المديرة</a>
</div>

<div class="wrap" id="app"></div>

<script src="weekly_analytics_engine.js"></script>
<script>
const C = WeeklyAnalyticsEngine.clusterAnalytics();

document.getElementById('app').innerHTML = `
<div class="grid">
  <div class="card">
    <div>عدد المدارس</div>
    <div class="kpi">${C.schoolCount}</div>
  </div>

  <div class="card">
    <div>متوسط SSPI للمجمع</div>
    <div class="kpi">${C.averageSSPI}%</div>
  </div>

  <div class="card">
    <div>أفضل مدرسة</div>
    <h2>${C.topSchool ? C.topSchool.schoolName : '—'}</h2>
    <span class="badge">${C.topSchool ? C.topSchool.sspi + '%' : ''}</span>
  </div>

  <div class="card">
    <div>المدرسة التي تحتاج متابعة</div>
    <h2>${C.lowSchool ? C.lowSchool.schoolName : '—'}</h2>
    <span class="badge">${C.lowSchool ? C.lowSchool.sspi + '%' : ''}</span>
  </div>
</div>

<div class="card" style="margin-top:18px">
<h2>مقارنة المدارس</h2>
<table class="table">
<thead>
<tr>
<th>المدرسة</th>
<th>SSPI</th>
<th>النشاط</th>
<th>السجلات</th>
<th>خطط التحسين</th>
<th>الاتجاه</th>
</tr>
</thead>
<tbody>
${C.schools.map(s=>`
<tr>
<td><b>${s.schoolName}</b></td>
<td>
  <b>${s.sspi}%</b>
  <div class="bar"><span style="width:${s.sspi}%"></span></div>
</td>
<td>${s.activeRate}%</td>
<td>${s.totalReports}</td>
<td>${s.totalPlans}</td>
<td>${s.trend}</td>
</tr>
`).join('')}
</tbody>
</table>
</div>

<div class="grid" style="margin-top:18px">
${C.schools.map(s=>`
<div class="card">
  <h3>${s.schoolName}</h3>
  <div class="kpi">${s.sspi}%</div>
  <div style="margin-top:12px">
    ${(s.sections || []).map(sec=>`
      <div style="margin-bottom:10px">
        <div style="font-size:12px;font-weight:900">${sec.section}</div>
        <div class="bar"><span style="width:${sec.score}%"></span></div>
      </div>
    `).join('')}
  </div>
</div>
`).join('')}
</div>
`;
</script>
</body>
</html>
