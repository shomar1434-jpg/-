<script src="../../ai-schemas/wakil-schemas.js">
/* ===== V31: Execution Archive Engine ===== */
function archiveAllKey(){return "wakil_execution_archive_v31"}
function readExecutionArchive(){try{return JSON.parse(localStorage.getItem(archiveAllKey())||"{}")}catch(e){return {}}}
function writeExecutionArchive(obj){localStorage.setItem(archiveAllKey(),JSON.stringify(obj||{}))}
function safeArchiveName(name){return String(name||"سجل بدون اسم").replace(/[\\/:*?"<>|#%{}[\]^~`]/g," ").replace(/\s+/g," ").trim().slice(0,80)||"سجل بدون اسم"}
function getRecordPersonName(data){return safeArchiveName(data["اسم الطالب"]||data["اسم المعلم"]||data["اسم الموظف"]||data["اسم الطالب / الموظف"]||data["اسم المستفيد"]||data["اسم المحول"]||data["المعلم الغائب"]||data["المعلم المنفذ"]||data["عنوان الاجتماع"]||data["الاسم"]||"")}
function getExecutionFolderTitle(formId){const f=(typeof FORMS!=="undefined"?FORMS.find(x=>x.id===formId):null);return f?f.title:((current&&current.title)||formId)}
function nextArchiveDisplayName(records,baseName){const same=records.filter(r=>r.baseName===baseName).length;return same?`${baseName} (${same+1})`:baseName}
function saveExecutionArchiveSnapshot(){const data=collect();const formId=current.id;const obj=readExecutionArchive();if(!obj[formId])obj[formId]={title:current.title,items:[]};const baseName=getRecordPersonName(data);const displayName=nextArchiveDisplayName(obj[formId].items||[],baseName);const item={id:String(Date.now()),formId,folderTitle:current.title,baseName,displayName,savedAt:new Date().toLocaleString("ar-SA"),date:data["التاريخ"]||data["تاريخ الزيارة"]||data["تاريخ التحويل"]||"",identity:data["السجل المدني"]||data["رقم الهوية"]||"",summary:(data["الإجراءات والتوصيات النهائية"]||data["التوصيات"]||data["ملاحظات"]||data["سبب التحويل"]||"").slice(0,140),data};obj[formId].items.unshift(item);writeExecutionArchive(obj);renderExecutionArchive();return item}
function patchSaveCurrentForExecutionArchive(){if(typeof saveCurrent==="function"&&!saveCurrent.__executionArchivePatched){const original=saveCurrent;saveCurrent=function(){const r=original.apply(this,arguments);try{saveExecutionArchiveSnapshot()}catch(e){console.warn("archive error",e)}return r};saveCurrent.__executionArchivePatched=true}}
function ensureExecutionArchiveSection(){const main=document.querySelector(".main")||document.body;if(document.getElementById("executionArchiveSection"))return;const section=document.createElement("section");section.id="executionArchiveSection";section.className="execution-archive-section no-print";section.innerHTML=`<h2>أرشيف تنفيذ السجلات</h2><div class="execution-archive-note">يتم إنشاء مجلد مستقل لكل نموذج من سجلات الوكيل، وتحفظ السجلات المنفذة باسم الطالب أو المعلم. عند تكرار الاسم يضاف رقم تلقائي للتمييز.</div><div class="execution-folders" id="executionFolders"></div><div class="execution-archive-panel" id="executionArchivePanel" style="display:none"></div><div class="execution-ai-insights" id="executionAIInsights" style="display:none"></div>`;main.appendChild(section);renderExecutionArchive()}
function renderExecutionArchive(selectedId){const folders=document.getElementById("executionFolders");if(!folders)return;const obj=readExecutionArchive();const forms=(typeof FORMS!=="undefined"?FORMS:[]);folders.innerHTML=forms.map(f=>{const count=(obj[f.id]&&obj[f.id].items?obj[f.id].items.length:0);return `<div class="execution-folder ${selectedId===f.id?'active':''}" onclick="openExecutionFolder('${f.id}')"><div class="execution-folder-title">📁 ${f.title}</div><span class="execution-folder-count">${count}</span><span style="font-size:12px;color:#52635d;margin-inline-start:6px">سجل منفذ</span></div>`}).join("");if(selectedId)openExecutionFolder(selectedId,true)}
function openExecutionFolder(formId,skipFolders){if(!skipFolders)renderExecutionArchive(formId);const panel=document.getElementById("executionArchivePanel");if(!panel)return;const obj=readExecutionArchive();const folder=obj[formId]||{title:getExecutionFolderTitle(formId),items:[]};panel.style.display="block";panel.innerHTML=`<div class="execution-archive-panel-header"><span>📁 ${folder.title}</span><span>${folder.items.length} سجل منفذ</span></div><table class="execution-archive-table"><thead><tr><th>م</th><th>اسم الحفظ</th><th>التاريخ</th><th>السجل المدني/الهوية</th><th>ملخص</th><th>إجراءات</th></tr></thead><tbody>${folder.items.length?folder.items.map((it,i)=>`<tr><td>${i+1}</td><td>${it.displayName}</td><td>${it.date||it.savedAt}</td><td>${it.identity||"—"}</td><td>${it.summary||"—"}</td><td class="execution-archive-actions"><button onclick="restoreExecutionArchive('${formId}','${it.id}')">استرجاع</button><button onclick="analyzeExecutionArchiveItem('${formId}','${it.id}')">تحليل</button><button class="send-duty-btn" onclick="sendExecutionRecordToDutyPerformance('${formId}','${it.id}')">إرسال لأداء الواجبات</button><button class="danger" onclick="deleteExecutionArchiveItem('${formId}','${it.id}')">حذف</button></td></tr>`).join(""):`<tr><td colspan="6">لا توجد سجلات محفوظة في هذا المجلد بعد.</td></tr>`}</tbody></table><div class="execution-archive-actions" style="padding:10px;text-align:center"><button onclick="analyzeExecutionFolder('${formId}')">تحليل المجلد بالذكاء</button><button onclick="exportExecutionFolder('${formId}')">تصدير JSON</button></div>`}
function restoreExecutionArchive(formId,itemId){const obj=readExecutionArchive();const item=obj[formId]?.items?.find(x=>x.id===itemId);if(!item)return;selectForm(formId);setTimeout(()=>{qsa('[data-field], [data-table]',qs('#formPage')).forEach(el=>{const k=el.dataset.field||el.dataset.table;if(item.data[k]!==undefined)el.value=item.data[k]});if(typeof autoGrowAll==="function")autoGrowAll(qs('#formPage'));alert("تم استرجاع السجل: "+item.displayName)},100)}
function deleteExecutionArchiveItem(formId,itemId){if(!confirm("حذف هذا السجل من أرشيف التنفيذ؟"))return;const obj=readExecutionArchive();if(obj[formId]){obj[formId].items=obj[formId].items.filter(x=>x.id!==itemId);writeExecutionArchive(obj);renderExecutionArchive(formId)}}
function exportExecutionFolder(formId){const obj=readExecutionArchive();const folder=obj[formId]||{title:getExecutionFolderTitle(formId),items:[]};const blob=new Blob([JSON.stringify(folder,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${folder.title}-archive.json`;a.click();URL.revokeObjectURL(a.href)}
async function analyzeExecutionArchiveItem(formId,itemId){const obj=readExecutionArchive();const item=obj[formId]?.items?.find(x=>x.id===itemId);if(!item)return;await runExecutionAIAnalysis(`حلل هذا السجل المنفذ وقدم تنبيهات ومقترحات إجراء وتوصيات:\n${JSON.stringify(item.data,null,2)}`)}
async function analyzeExecutionFolder(formId){const obj=readExecutionArchive();const folder=obj[formId]||{title:getExecutionFolderTitle(formId),items:[]};const sample=folder.items.slice(0,20).map(x=>({name:x.displayName,date:x.date,summary:x.summary,data:x.data}));await runExecutionAIAnalysis(`حلل أرشيف هذا المجلد: ${folder.title}\nعدد السجلات: ${folder.items.length}\nالبيانات:\n${JSON.stringify(sample,null,2)}\nالمطلوب:\n- مؤشرات متكررة\n- تنبيهات إدارية\n- مقترحات إجراء\n- توصيات تحسين\n- أولويات متابعة`)}
async function runExecutionAIAnalysis(prompt){const box=document.getElementById("executionAIInsights");if(!box)return;box.style.display="block";box.textContent="جاري التحليل...";try{const res=await fetch(ASK_AI_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+SUPABASE_ANON_KEY},body:JSON.stringify({message:prompt})});const data=await res.json();box.textContent=data.response||data.result||data.answer||"لم يتم الحصول على نتيجة."}catch(e){box.textContent="تعذر تنفيذ التحليل: "+e.message}}
document.addEventListener("DOMContentLoaded",()=>{setTimeout(()=>{patchSaveCurrentForExecutionArchive();ensureExecutionArchiveSection()},300)});
setTimeout(()=>{patchSaveCurrentForExecutionArchive();ensureExecutionArchiveSection()},1000);


/* ===== V34: Send saved record to Duty Performance folder ===== */
function dutyArchiveKey(){
  return "wakil_duty_performance_records_v34";
}
function readDutyPerformanceArchive(){
  try{return JSON.parse(localStorage.getItem(dutyArchiveKey())||"[]")}catch(e){return []}
}
function writeDutyPerformanceArchive(arr){
  localStorage.setItem(dutyArchiveKey(), JSON.stringify(arr||[]));
  window.dispatchEvent(new Event("wakilDutyPerformanceArchiveUpdated"));
}
function isRecordSentToDuty(originalId){
  return readDutyPerformanceArchive().some(x=>x.originalArchiveId===originalId);
}
function sendExecutionRecordToDutyPerformance(formId,itemId){
  const obj=readExecutionArchive();
  const item=obj[formId]?.items?.find(x=>x.id===itemId);
  if(!item){
    alert("لم يتم العثور على السجل المحفوظ.");
    return;
  }

  const arr=readDutyPerformanceArchive();
  const exists=arr.some(x=>x.originalArchiveId===itemId);
  if(exists){
    alert("هذا السجل موجود مسبقًا في مجلد أداء الواجبات الوظيفية.");
    return;
  }

  const dutyItem={
    id:"duty_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
    originalArchiveId:itemId,
    source:"أرشيف تنفيذ السجلات",
    category:"أداء الواجبات الوظيفية",
    folderName:"أداء الواجبات الوظيفية",
    formId:formId,
    formTitle:item.folderTitle || getExecutionFolderTitle(formId),
    displayName:item.displayName,
    baseName:item.baseName,
    date:item.date || item.savedAt || "",
    identity:item.identity || "",
    summary:item.summary || "",
    data:item.data || {},
    sentAt:new Date().toLocaleString("ar-SA"),
    status:"نموذج تنفيذ"
  };

  arr.unshift(dutyItem);
  writeDutyPerformanceArchive(arr);

  alert("تم إرسال السجل إلى مجلد أداء الواجبات الوظيفية في الأرشيف الرقمي.");
  openExecutionFolder(formId);
}
function exportDutyPerformanceArchive(){
  const arr=readDutyPerformanceArchive();
  const blob=new Blob([JSON.stringify({folder:"أداء الواجبات الوظيفية",items:arr},null,2)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="أداء_الواجبات_الوظيفية_نماذج_تنفيذ.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function renderDutyPerformanceShortcut(){
  const sec=document.getElementById("executionArchiveSection");
  if(!sec || document.getElementById("dutyPerformanceShortcut")) return;
  const div=document.createElement("div");
  div.id="dutyPerformanceShortcut";
  div.className="duty-send-note";
  div.innerHTML='مجلد أداء الواجبات الوظيفية يستقبل السجلات المختارة كنماذج تنفيذ. <button class="btn gray" style="padding:6px 12px;margin-inline-start:8px" onclick="exportDutyPerformanceArchive()">تصدير مجلد أداء الواجبات</button>';
  sec.appendChild(div);
}
document.addEventListener("DOMContentLoaded",()=>setTimeout(renderDutyPerformanceShortcut,1200));
setTimeout(renderDutyPerformanceShortcut,1800);

e": "مساءلة غياب", "sections": [["بيانات الموظف", ["اسم الموظف", "المسمى الوظيفي", "تاريخ الغياب", "مدة الغياب"]], ["إفادة الموظف", ["سبب الغياب حسب الإفادة", "المرفقات", "تاريخ الإفادة"]], ["رأي الإدارة", ["رأي الوكيل", "قرار المدير", "ملاحظات"]]], "kind": "inquiry"}];

let current=FORMS[0];
function qs(x,root=document){return root.querySelector(x)} function qsa(x,root=document){return Array.from(root.querySelectorAll(x))}
function today(){return new Date().toISOString().slice(0,10)}
function formatDateDMY(dateObj){
  const d=String(dateObj.getDate()).padStart(2,'0');
  const m=String(dateObj.getMonth()+1).padStart(2,'0');
  const y=dateObj.getFullYear();
  return `${d} / ${m} / ${y}`;
}
function parseDateDMY(value){
  if(!value) return null;
  value=String(value).trim();
  let iso=value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(iso) return new Date(`${iso[1]}-${iso[2]}-${iso[3]}T12:00:00`);
  let m=value.match(/(\d{1,2})\s*[\/\-]\s*(\d{1,2})\s*[\/\-]\s*(\d{4})/);
  if(m) return new Date(`${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}T12:00:00`);
  return null;
}
function normalizeDateText(el){
  if(!el) return;
  const d=parseDateDMY(el.value);
  if(d && !isNaN(d)) el.value=formatDateDMY(d);
}
function isDateField(n){return /تاريخ|اليوم/.test(n)}
function isLongField(n){return /سبب|وصف|إجراء|إجراءات|توصيات|ملاحظات|ملحوظات|رأي|قرار|إفادة|نص|خطة|آلية|جوانب|فرص|مرفقات|الحالات|هدف|تحسين|متابعة/.test(n)}

function selectForm(id){current=FORMS.find(f=>f.id===id)||FORMS[0];renderNav();renderForm();loadCurrent()}
function yearOptions(selected=''){let opts='<option value="">اختر العام</option>';for(let y=1445;y<=1466;y++){let v=y+' هـ';opts+=`<option value="${v}" ${selected===v?'selected':''}>${v}</option>`}return opts}
function semesterOptions(selected=''){return `<option value="">اختر الفصل</option><option ${selected==='الأول'?'selected':''}>الأول</option><option ${selected==='الثاني'?'selected':''}>الثاني</option>`}

function timeOptions(selected=''){
  let opts='<option value="">اختر الوقت</option>';
  for(let h=7; h<=14; h++){
    for(let m of [0,15,30,45]){
      if(h===14 && m>0) continue;
      const hour12 = h>12 ? h-12 : h;
      const period = h<12 ? 'صباحًا' : 'ظهرًا';
      const val = `${String(hour12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${period}`;
      opts += `<option value="${val}" ${selected===val?'selected':''}>${val}</option>`;
    }
  }
  return opts;
}
function receiverRelationOptions(selected=''){
  const arr=['أب','أم','أخ','أخت','عم','عمة','غير ذلك'];
  return '<option value="">اختر صلة المستلم</option>'+arr.map(v=>`<option value="${v}" ${selected===v?'selected':''}>${v}</option>`).join('');
}
function returnStatusOptions(selected=''){
  const arr=['سيعود','لن يعود'];
  return '<option value="">اختر حالة العودة</option>'+arr.map(v=>`<option value="${v}" ${selected===v?'selected':''}>${v}</option>`).join('');
}
function fieldHtml(name){
  const wide=isLongField(name)?' wide note':'';
  let input='';
  if(name==='الفصل الدراسي') input=`<select data-field="${name}">${semesterOptions()}</select>`;
  else if(name==='العام الدراسي') input=`<select data-field="${name}">${yearOptions()}</select>`;
  else if(name==='وقت الخروج') input=`<select data-field="${name}" class="time-select">${timeOptions()}</select>`;
  else if(name==='صلة المستلم') input=`<select data-field="${name}">${receiverRelationOptions()}</select>`;
  else if(name==='حالة العودة') input=`<select data-field="${name}">${returnStatusOptions()}</select>`;
  else if(isLongField(name)) input=`<textarea data-field="${name}"></textarea>`;
  else if(/تاريخ/.test(name)) input=`<input type="text" class="date-display" data-field="${name}" placeholder="اليوم / الشهر / السنة">`;
  else input=`<input type="text" data-field="${name}">`;
  return `<div class="field${wide}"><div class="label">${name}</div><div>${input}</div></div>`
}
function tableRows(kind,count=5){let heads=['م','الاسم','الصف / العمل','التاريخ','الإجراء / الملاحظات']; if(kind==='visits')heads=['م','اسم المعلم','المادة','الفصل','تاريخ الزيارة','الحصة','ملاحظات']; if(kind==='waiting')heads=['م','الحصة','الفصل','المعلم الغائب','المعلم المنفذ','المادة','ملاحظات'];let h=heads.map(x=>`<th>${x}</th>`).join('');let rows='';for(let i=1;i<=count;i++){rows+='<tr>'+heads.map((x,j)=>j===0?`<td>${i}</td>`:`<td><textarea class="table-textarea auto-grow" data-table="${kind}-${i}-${j}"></textarea></td>`).join('')+'</tr>'}return `<div class="section dynamic-table-section"><h3>جدول تفصيلي قابل للتعبئة</h3><table class="form-table"><thead><tr>${h}</tr></thead><tbody>${rows}</tbody></table></div>`}
function settingInput(key,value,label,extra=''){
  return `<div class="head-row"><span class="head-label">${label}</span><input class="header-input ${extra}" data-setting="${key}" value="${value||''}"></div>`
}

function getIdentityValue(data=null){
  if(!data) data=collectSafe();
  return (data['السجل المدني']||data['رقم الهوية']||data['رقم السجل المدني']||'').toString().trim();
}
function collectSafe(){let d={};qsa('[data-field], [data-table]',qs('#formPage')).forEach(el=>{d[el.dataset.field||el.dataset.table]=el.value||''});return d}
function archiveKey(){return 'wakil_archive_v5_'+current.id}
function archiveSection(){return `<div class="section" id="archiveSection"><h3>أرشفة السجل والمرات السابقة حسب السجل المدني</h3><div class="fields"><div class="field"><div class="label">السجل المدني / الهوية للأرشفة</div><div><input data-field="السجل المدني" placeholder="يُستخدم لعرض المرات السابقة تلقائيًا"></div></div><div class="field"><div class="label">آخر حفظ</div><div><input data-field="آخر حفظ" readonly></div></div></div><div id="archiveRows"></div></div>`}
function readArchive(){try{return JSON.parse(localStorage.getItem(archiveKey())||'[]')}catch(e){return []}}
function writeArchive(arr){localStorage.setItem(archiveKey(),JSON.stringify(arr.slice(0,80)))}
function renderArchiveRows(){const box=qs('#archiveRows'); if(!box) return; const id=getIdentityValue(); const rows=readArchive().filter(r=>!id||r.identity===id).slice(0,10); if(!rows.length){box.innerHTML='<div style="padding:8px;color:#667085;font-weight:700">لا توجد مرات سابقة لهذا السجل المدني بعد.</div>';return} box.innerHTML=`<table class="archive-table"><thead><tr><th>م</th><th>تاريخ الحفظ</th><th>رقم السجل</th><th>اسم الطالب/الموظف</th><th>ملاحظة مختصرة</th><th class="no-print">استرجاع</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.savedAt||''}</td><td>${r.recordNo||''}</td><td>${r.person||''}</td><td>${r.note||''}</td><td class="no-print"><button class="btn gray" style="padding:5px 10px" onclick="restoreArchive('${r.id}')">استرجاع</button></td></tr>`).join('')}</tbody></table>`}
function addArchiveSnapshot(data){const id=getIdentityValue(data); if(!id) return; let arr=readArchive(); const now=new Date(); const rec={id:String(Date.now()),identity:id,savedAt:now.toLocaleString('ar-SA'),recordNo:data['رقم السجل']||'',person:data['اسم الطالب']||data['اسم الموظف']||data['الاسم']||'',note:(data['سبب التحويل']||data['الإجراءات والتوصيات النهائية']||data['ملاحظات']||'').slice(0,90),data:data}; arr.unshift(rec); writeArchive(arr);}
function restoreArchive(id){const rec=readArchive().find(r=>r.id===id); if(!rec) return; qsa('[data-field], [data-table]',qs('#formPage')).forEach(el=>{const k=el.dataset.field||el.dataset.table;if(rec.data[k]!==undefined)el.value=rec.data[k]});setDefaults();renderArchiveRows();autoGrowAll(qs('#formPage'));alert('تم استرجاع بيانات الأرشيف إلى النموذج.');}
function syncDayFromDate(dateValue){
  const day=qs('[data-field="اليوم"]',qs('#formPage'));
  if(!day||!dateValue) return;
  const d=parseDateDMY(dateValue);
  if(d && !isNaN(d)) day.value=new Intl.DateTimeFormat('ar-SA',{weekday:'long'}).format(d);
}

function renderForm(){
  const s=settings();
  qs('#currentTitle').textContent=current.title;
  const allSections=current.sections||[];
  const split=Math.max(1, Math.ceil(allSections.length/2));
  const firstSections=allSections.slice(0, split);
  const secondSections=allSections.slice(split);
  const shouldTable=['table','permission','waiting','supervision','visits','late-list'].includes(current.kind);
  let firstBody=`<div class="form-title">${current.title}</div>`;
  firstSections.forEach(sec=>{firstBody+=`<div class="section"><h3>${sec[0]}</h3><div class="fields">${sec[1].map(fieldHtml).join('')}</div></div>`});
  if(shouldTable && allSections.length<=2) firstBody+=tableRows(current.kind,5);
  let secondBody='';
  secondSections.forEach(sec=>{secondBody+=`<div class="section"><h3>${sec[0]}</h3><div class="fields">${sec[1].map(fieldHtml).join('')}</div></div>`});

function extractAIJson(text){
  if(!text) return null;
  let t=String(text).trim();
  t=t.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();
  const start=t.indexOf('{'), end=t.lastIndexOf('}');
  if(start>=0 && end>start) t=t.slice(start,end+1);
  try{return JSON.parse(t)}catch(e){return null}
}

function fillFieldByName(name,value,overwrite=false){
  if(value===undefined || value===null || String(value).trim()==='') return false;
  const el=qsa('[data-field]',qs('#formPage')).find(x=>x.dataset.field===name);
  if(!el) return false;
  if(!overwrite && el.value && el.value.trim()) return false;
  el.value=String(value).trim();
  el.dispatchEvent(new Event('input',{bubbles:true}));
  el.dispatchEvent(new Event('change',{bubbles:true}));
  if(el.tagName==='TEXTAREA') autoGrowOne(el);
  return true;
}
function fillFirstMatching(labels,value,overwrite=false){
  for(const label of labels){ if(fillFieldByName(label,value,overwrite)) return true; }
  return false;
}
function applyAIObject(obj,overwrite=false){
  let count=0;
  if(!obj || typeof obj!=='object') return 0;
  const aliases={
    'الإجراءات والتوصيات النهائية':['الإجراءات والتوصيات النهائية','الإجراءات النهائية','التوصيات النهائية'],
    'الإجراء المتخذ':['الإجراء المتخذ','الإجراءات المتخذة','الإجراءات','الإجراء','إجراء الوكيل','الإجراء النظامي'],
    'التوصيات':['التوصيات','توصيات الوكيل','التوصيات والمقترحات'],
    'ملاحظات':['ملاحظات','ملحوظات الزيارة','ملاحظات المناوبة','ملاحظات بداية اليوم','ملاحظات الفسحة','ملاحظات الانصراف'],
    'فرص التحسين':['فرص التحسين','جوانب التحسين'],
    'جوانب القوة':['جوانب القوة'],
    'خطة المتابعة':['خطة المتابعة','موعد المتابعة','تاريخ المتابعة'],
    'وصف الحالة':['وصف الحالة','تفاصيل الحالة','الحالات المرصودة'],
    'سبب التحويل':['سبب التحويل','سبب الاستئذان','سبب الغياب حسب الإفادة','أبرز الأسباب'],
    'نص القرار':['نص القرار','رأي الوكيل','قرار المدير']
  };
  for(const [k,v] of Object.entries(obj)){
    if(typeof v==='object') continue;
    if(fillFieldByName(k,v,overwrite)) {count++; continue;}
    for(const [main,names] of Object.entries(aliases)){
      if(k.includes(main) || names.some(n=>k.includes(n) || n.includes(k))){
        if(fillFirstMatching(names,v,overwrite)){count++; break;}
      }
    }
  }
  if(obj.فرص_التحسين) count += fillFirstMatching(['فرص التحسين','ملحوظات الزيارة','ملاحظات'],obj.فرص_التحسين,overwrite)?1:0;
  if(obj.التوصيات) count += fillFirstMatching(['التوصيات','توصيات الوكيل','الإجراءات والتوصيات النهائية'],obj.التوصيات,overwrite)?1:0;
  if(obj.الإجراءات) count += fillFirstMatching(['الإجراء المتخذ','الإجراءات المتخذة','الإجراءات والتوصيات النهائية'],obj.الإجراءات,overwrite)?1:0;
  return count;
}
function fallbackApplyAIText(text,overwrite=false){
  let count=0;
  const clean=String(text||'').replace(/```[\s\S]*?```/g,'').trim();
  if(!clean) return 0;
  const rec=qs('[data-field="الإجراءات والتوصيات النهائية"]');
  if(rec && (overwrite || !rec.value.trim())){rec.value=clean;autoGrowOne(rec);count++;}
  const recommendations=(clean.match(/(?:التوصيات|توصيات)[:：]?([\s\S]*?)(?:الإجراءات|فرص|جوانب|$)/)||[])[1];
  if(recommendations) count += fillFirstMatching(['التوصيات','توصيات الوكيل','التوصيات والمقترحات'],recommendations.trim(),overwrite)?1:0;
  const actions=(clean.match(/(?:الإجراءات|إجراءات|الإجراء)[:：]?([\s\S]*?)(?:التوصيات|فرص|جوانب|$)/)||[])[1];
  if(actions) count += fillFirstMatching(['الإجراء المتخذ','الإجراءات المتخذة','الإجراءات والتوصيات النهائية'],actions.trim(),overwrite)?1:0;
  const improvements=(clean.match(/(?:فرص التحسين|فرص)[:：]?([\s\S]*?)(?:التوصيات|الإجراءات|$)/)||[])[1];
  if(improvements) count += fillFirstMatching(['فرص التحسين','ملحوظات الزيارة','ملاحظات'],improvements.trim(),overwrite)?1:0;
  return count;
}

function autoGrowOne(el){
  if(!el || el.tagName!=='TEXTAREA') return;
  const isTable = el.classList.contains('table-textarea') || el.hasAttribute('data-table');
  const isLong = el.closest('.note') || el.dataset.field === 'الإجراءات والتوصيات النهائية';
  const maxHeight = isTable ? 58 : (isLong ? 92 : 78);
  const minHeight = isTable ? 30 : 34;
  el.style.height='auto';
  const nextHeight = Math.max(minHeight, Math.min(el.scrollHeight, maxHeight));
  el.style.height = nextHeight + 'px';
  el.style.overflow = el.scrollHeight > maxHeight ? 'hidden' : 'hidden';
}
function autoGrowAll(root=document){
  qsa('textarea', root).forEach(autoGrowOne);
}
function bindAutoGrow(root=document){
  qsa('textarea', root).forEach(el=>{
    autoGrowOne(el);
    if(!el.dataset.autogrowBound){
      el.addEventListener('input',()=>autoGrowOne(el));
      el.addEventListener('change',()=>autoGrowOne(el));
      el.dataset.autogrowBound='1';
    }
  });
}

async function requestStructuredAI(extraText='', modeLabel='جاري توليد تعبئة مهيكلة...'){
  saveCurrent();
  const panel=qs('#aiPanel'),pre=qs('#aiResult');
  panel.style.display='block';
  pre.textContent=modeLabel;
  lastAIAnswer=''; lastAIMap=null;
  const payload={message:buildStructuredPrompt(extraText)};
  try{
    const res=await fetch(ASK_AI_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify(payload)});
    const data=await res.json();
    const ans=data.response||data.result||data.answer||'لم يتم الحصول على رد.';
    lastAIAnswer=ans;
    lastAIMap=extractAIJson(ans);
    if(lastAIMap){
      pre.textContent=Object.entries(lastAIMap).map(([k,v])=>`${k}:\n${v}`).join('\n\n');
      const count=applyAIObject(lastAIMap,false);
      saveCurrent();
      pre.textContent += `\n\nتم تضمين ${count} حقل/حقول تلقائيًا داخل النموذج.`;
      autoGrowAll(qs('#formPage'));
    }else{
      pre.textContent=ans;
    }
  }catch(e){
    pre.textContent='تعذر الاتصال بالذكاء: '+e.message;
  }
}

function readTeamsAIFile(event){
  const file=event.target.files && event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const text=String(reader.result||'');
    qs('#teamsMeetingText').value=text;
    previewTeamsText(text);
  };
  reader.readAsText(file, 'utf-8');
}

function previewTeamsText(text){
  const participants=parseTeamsParticipants(text);
  const preview=qs('#teamsPreview');
  if(!preview) return;
  preview.innerHTML = `<strong>ملخص أولي:</strong><br>
  عدد الأسماء المحتملة: ${participants.length}<br>
  ${participants.slice(0,12).join('، ')}${participants.length>12?' ...':''}`;
}

function parseTeamsParticipants(text){
  if(!text) return [];
  const lines=String(text).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const names=[];
  for(const line of lines){
    let cleaned=line
      .replace(/\[[^\]]+\]/g,'')
      .replace(/\([^\)]*(joined|left|انضم|غادر|دخل|خرج)[^\)]*\)/ig,'')
      .replace(/\b(joined|left|started|ended|meeting|chat)\b/ig,'')
      .replace(/^\d{1,2}:\d{2}(:\d{2})?\s*/,'')
      .replace(/[,:؛|-].*$/,'')
      .trim();
    if(cleaned.length>=3 && cleaned.length<=60 && !/[<>@]/.test(cleaned)){
      if(!names.includes(cleaned)) names.push(cleaned);
    }
  }
  return names.slice(0,40);
}
