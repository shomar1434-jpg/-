<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أرشيف إجراءات وكيل شؤون الطلاب</title>
<script src="system-admin-context.js"></script>
<script src="active_school_scope.js"></script>
<script src="platform-cloud-session.js?v=20260828-session-continuity-v2"></script>
<style>
:root{--navy:#15445A;--teal:#0DA9A6;--blue:#3D7EB9;--green:#07A869;--bg:#f3f7f9;--muted:#667985}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Tajawal","Segoe UI",Arial,sans-serif;background:var(--bg);color:#173845}
body{visibility:hidden;opacity:0;transition:opacity .12s ease}html[data-ready="1"] body{visibility:visible;opacity:1}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid #dce8ec;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:14px}.brand-icon{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--teal));display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 8px 24px #15445a25}
h1{font-size:19px;margin:0;color:var(--navy)}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cfe0e5;background:#fff;color:var(--navy);padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
main{max-width:1220px;margin:auto;padding:26px}.banner{padding:12px 16px;border-radius:14px;margin-bottom:18px;font-size:12px;font-weight:800;background:#eaf7f6;color:#087b78;border:1px solid #cdebe8}.banner.admin{background:#fff7e9;color:#9a6510;border-color:#f0ddb6}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.kpi{background:#fff;border:1px solid #e0e9ed;border-radius:18px;padding:18px;box-shadow:0 8px 30px #15445a0b}.kpi b{display:block;font-size:28px;color:var(--navy)}.kpi span{font-size:11px;color:var(--muted);font-weight:800}
.folders{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.folder{background:#fff;border:1px solid #dce8ec;border-radius:18px;padding:15px;text-align:right;cursor:pointer;transition:.15s}.folder:hover,.folder.active{border-color:var(--teal);transform:translateY(-1px);box-shadow:0 8px 24px #0da9a616}.folder b{display:block;color:var(--navy);font-size:13px}.folder span{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 8px;border-radius:99px;background:#edf7f7;color:#087b78;font-size:10px;font-weight:900;margin-top:9px}
.panel{background:#fff;border:1px solid #dce8ec;border-radius:20px;padding:16px;box-shadow:0 12px 38px #15445a0d}.toolbar{display:grid;grid-template-columns:1fr 220px auto;gap:10px;margin-bottom:14px}.toolbar input,.toolbar select{width:100%;padding:11px 12px;border:1px solid #d6e3e7;border-radius:12px;font:inherit}
.table-wrap{overflow:auto;border:1px solid #e1e9ec;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px 10px;border-bottom:1px solid #edf2f4;text-align:right;font-size:12px}th{background:#f6fafb;color:#526773;font-size:11px}.status{padding:5px 9px;border-radius:99px;background:#e8f7ef;color:#08794a;font-weight:900;font-size:10px}
.empty{padding:45px;text-align:center;color:#7b8b94}.modalback{position:fixed;inset:0;background:#10252f99;z-index:100;display:grid;place-items:center;padding:20px}.hidden{display:none!important}.modal{width:min(900px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:20px}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #e6edef;padding-bottom:12px;margin-bottom:14px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.detail{padding:12px;background:#f7fafb;border:1px solid #e3ebee;border-radius:12px}.detail small{display:block;color:#768791;margin-bottom:5px}.bodybox{margin-top:14px;padding:16px;border:1px solid #dce7eb;border-radius:14px;line-height:2;background:#fcfefe}.sigbox{margin-top:14px;text-align:center}.sigbox img{max-width:260px;max-height:140px;border:1px solid #dbe6ea;border-radius:12px;padding:8px;background:#fff}
.denied{max-width:700px;margin:80px auto;background:#fff;border:1px solid #eadada;border-radius:20px;padding:30px;text-align:center;color:#8d3636;font-weight:800}
@media(max-width:900px){.kpis,.folders{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){header{align-items:flex-start;flex-direction:column}.kpis,.folders,.detail-grid{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="brand-icon">🗂️</div><div><h1>أرشيف إجراءات وكيل شؤون الطلاب</h1><div class="sub">أرشيف مستقل للمعاملات الموقعة والمكتملة داخل نطاق المدرسة والمستخدم</div></div></div>
  <div class="actions"><button class="btn" onclick="location.href='student_affairs_procedures.html'">إجراءات شؤون الطلاب</button><button class="btn primary" onclick="location.href='agent.html?sectionReturn=1'">العودة لواجهة أقسام الوكيل</button></div>
</header>
<main id="app">
  <div id="roleBanner" class="banner"></div>
  <div class="kpis">
    <div class="kpi"><b id="kTotal">0</b><span>إجمالي المعاملات المؤرشفة</span></div>
    <div class="kpi"><b id="kForms">0</b><span>نماذج مستخدمة</span></div>
    <div class="kpi"><b id="kSigned">0</b><span>معاملات موقعة</span></div>
    <div class="kpi"><b id="kStudents">0</b><span>طلاب/طالبات</span></div>
  </div>
  <div id="folders" class="folders"></div>
  <div class="panel">
    <div class="toolbar"><input id="search" placeholder="بحث باسم الطالب/الطالبة أو ولي الأمر أو النموذج"><select id="year"><option value="">جميع السنوات</option></select><button class="btn" id="refresh">تحديث الأرشيف</button></div>
    <div class="table-wrap"><table><thead><tr><th>اسم الحفظ</th><th>النموذج</th><th>الطالب/الطالبة</th><th>ولي الأمر</th><th>تاريخ الأرشفة</th><th>الحالة</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</main>
<div id="modalBack" class="modalback hidden"><div class="modal"><div class="modal-head"><h2 id="modalTitle" style="margin:0;color:#15445A;font-size:17px">تفاصيل المعاملة</h2><button class="btn" id="closeModal">إغلاق</button></div><div id="modalBody"></div></div></div>

<script>
(()=>{
const API='https://cijhgvbtrvmmlcssgxht.supabase.co/functions/v1/student-affairs-guardian';
const REAL_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpamhndmJ0cnZtbWxjc3NneGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTY4MzUsImV4cCI6MjA5NDI3MjgzNX0.1sbfDvL1V12kj9oVcYJqYhj8NPuLpYjId7CO9QGj3bM';
const templates={
 commitment:'لائحة الالتزام السلوكي',violation:'إشعار مخالفة سلوكية',attendanceNotice:'إشعار غياب أو تأخر',summons:'استدعاء ولي أمر',
 pledge:'تعهد طالب / ولي أمر',academic:'إشعار تدني المستوى الدراسي',meeting:'محضر مقابلة ولي الأمر',referral:'إحالة طالب'
};
let all=[],folder='all',viewerKind='';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function parse(v){try{return JSON.parse(v||'null')}catch(_){return null}}
function list(v){if(Array.isArray(v))return v.flatMap(list);v=String(v||'').trim();if(!v)return[];if(v[0]==='['){try{return list(JSON.parse(v))}catch(_){}}return v.split(/[،,|;/]+/).map(x=>x.trim()).filter(Boolean)}
function canon(v){const x=String(v||'').trim().toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');if(['student affairs','deputy students','وكيل شؤون الطلاب','وكيلة شؤون الطلاب','وكيل الشؤون الطلابية','وكيلة الشؤون الطلابية','شؤون الطلاب','الشؤون الطلابية'].includes(x))return'student_affairs';return x}
function isAdmin(){return sessionStorage.getItem('system_admin_context')==='1'||sessionStorage.getItem('system_admin_verified')==='true'||document.documentElement.getAttribute('data-system-admin-context')==='1'}
function profile(){return window.FOLLOW_TARGET_USER||parse(sessionStorage.getItem('smart_school_current_session'))||parse(localStorage.getItem('smart_school_current_session'))||parse(localStorage.getItem('currentSchoolUser'))||parse(localStorage.getItem('currentUser'))||{}}
function schoolId(){const p=profile();return String(window.PlatformCloudSession?.schoolId?.()||p.schoolId||p.school_id||sessionStorage.getItem('smart_school_tab_school_v1')||localStorage.getItem('current_school_id')||localStorage.getItem('school_id')||'').trim()}
function isStudentAffairs(){
 if(isAdmin())return false;const p=profile(),role=String(p.dbRole||p.role||'').toLowerCase();if(role&&!/agent|وكيل|student_affairs/.test(role))return false;
 const direct=[p.agent_categories,p.agency_categories,p.agency_types,p.agency_type,p.agencyType,p.roleLabel,p.role_label].flatMap(list).map(canon);if(direct.includes('student_affairs'))return true;
 try{const sid=p.schoolId||p.school_id||schoolId()||'default',map=parse(localStorage.getItem('smartSchoolUnifiedOpsV2_vp_agency_map_'+sid))||{},id=String(p.id||p.userId||p.user_id||''),em=String(p.email||'').toLowerCase();return list((id&&map[id])||(em&&map[em])||'').map(canon).includes('student_affairs')}catch(_){return false}
}
function token(){return window.PlatformCloudSession?.token?.()||sessionStorage.getItem('platform_tab_session_token_v1')||localStorage.getItem('platform_file_session_token')||''}
async function call(action,payload={}){
 if(window.PlatformCloudSession?.ensure)await PlatformCloudSession.ensure();
 let tk=token();if(!tk)throw new Error('الجلسة السحابية غير متاحة.');
 const run=async()=>{const r=await fetch(API,{method:'POST',headers:{apikey:REAL_ANON,'content-type':'application/json','x-platform-session':tk},body:JSON.stringify({action,...payload})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'تعذر قراءة الأرشيف');return j};
 try{return await run()}catch(e){if(window.PlatformCloudSession?.recover){await PlatformCloudSession.recover();tk=token();return await run()}throw e}
}
function statusLabel(s){return({archived:'مكتمل ومؤرشف',signed:'تم التوقيع',verified:'تم التحقق',opened:'تم فتح الرابط',waiting_guardian:'بانتظار ولي الأمر',revoked:'ملغي'})[s]||s}
function fmt(d){if(!d)return'—';try{return new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d))}catch(_){return d}}
function render(){
 const archived=all.filter(x=>x.status==='archived');
 $('#kTotal').textContent=archived.length;$('#kForms').textContent=new Set(archived.map(x=>x.form_key)).size;$('#kSigned').textContent=archived.filter(x=>x.signed_at).length;$('#kStudents').textContent=new Set(archived.map(x=>x.student_name)).size;
 $('#folders').innerHTML=`<button class="folder ${folder==='all'?'active':''}" data-f="all"><b>كل النماذج</b><span>${archived.length}</span></button>`+Object.entries(templates).map(([k,v])=>`<button class="folder ${folder===k?'active':''}" data-f="${k}"><b>${esc(v)}</b><span>${archived.filter(x=>x.form_key===k).length}</span></button>`).join('');
 document.querySelectorAll('.folder').forEach(b=>b.onclick=()=>{folder=b.dataset.f;render()});
 const q=$('#search').value.trim().toLowerCase(),y=$('#year').value;
 const rows=archived.filter(x=>(folder==='all'||x.form_key===folder)&&(!q||`${x.archive_name} ${x.student_name} ${x.guardian_name} ${x.form_title}`.toLowerCase().includes(q))&&(!y||String(x.archived_at||x.created_at).startsWith(y)));
 $('#rows').innerHTML=rows.map(x=>`<tr><td><b>${esc(x.archive_name)}</b></td><td>${esc(x.form_title)}</td><td>${esc(x.student_name)}</td><td>${esc(x.guardian_name)}</td><td>${esc(fmt(x.archived_at))}</td><td><span class="status">${esc(statusLabel(x.status))}</span></td><td><button class="btn open" data-id="${esc(x.id)}">فتح</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا توجد معاملات مؤرشفة مطابقة.</td></tr>';
 document.querySelectorAll('.open').forEach(b=>b.onclick=()=>openDetails(b.dataset.id));
}
async function load(){
 $('#rows').innerHTML='<tr><td colspan="7" class="empty">جاري تحميل الأرشيف السحابي...</td></tr>';
 const r=await call('list');viewerKind=r.viewerKind||'';all=r.transactions||[];
 const years=[...new Set(all.map(x=>String(x.archived_at||x.created_at||'').slice(0,4)).filter(Boolean))].sort().reverse();
 $('#year').innerHTML='<option value="">جميع السنوات</option>'+years.map(y=>`<option>${esc(y)}</option>`).join('');
 const b=$('#roleBanner');b.textContent=viewerKind==='system_admin'?'مدير النظام — عرض ومراجعة فقط. يعرض الأرشيف ضمن المدرسة النشطة دون التحول إلى دور وكيل شؤون الطلاب.':'وكيل/وكيلة شؤون الطلاب — يعرض هذا الأرشيف معاملات هذا المستخدم داخل المدرسة الحالية فقط.';if(viewerKind==='system_admin')b.classList.add('admin');
 render();
}
async function openDetails(id){
 const r=await call('status',{id}),x=r.transaction||{},p=x.payload||{};
 $('#modalTitle').textContent=x.archive_name||x.form_title||'تفاصيل المعاملة';
 $('#modalBody').innerHTML=`<div class="detail-grid">
 <div class="detail"><small>النموذج</small><b>${esc(x.form_title)}</b></div><div class="detail"><small>الطالب/الطالبة</small><b>${esc(x.student_name)}</b></div><div class="detail"><small>ولي الأمر</small><b>${esc(x.guardian_name)}</b></div>
 <div class="detail"><small>المرحلة</small><b>${esc(p.stage||'—')}</b></div><div class="detail"><small>الصف / الفصل</small><b>${esc([p.grade,p.classroom].filter(Boolean).join(' / ')||'—')}</b></div><div class="detail"><small>تاريخ التوقيع</small><b>${esc(fmt(x.signed_at))}</b></div>
 </div><div class="bodybox">${p.body||'لا توجد تفاصيل إضافية.'}</div>${x.signature_url?`<div class="sigbox"><small>توقيع ولي الأمر المحفوظ سحابيًا</small><br><img src="${esc(x.signature_url)}" alt="توقيع ولي الأمر"></div>`:''}`;
 $('#modalBack').classList.remove('hidden');
}
function deny(){
 document.body.innerHTML=`<div class="denied"><h2>أرشيف إجراءات وكيل شؤون الطلاب</h2><p>هذه الصفحة متاحة فقط لوكيل/وكيلة شؤون الطلاب أو لمدير النظام في سياق المراجعة.</p><button class="btn primary" id="denyBackBtn">العودة لواجهة أقسام الوكيل</button></div>`;
 const b=document.getElementById('denyBackBtn');if(b)b.onclick=()=>location.href='agent.html?sectionReturn=1';
 document.documentElement.setAttribute('data-ready','1');
}
$('#search').oninput=render;$('#year').onchange=render;$('#refresh').onclick=()=>load().catch(e=>{$('#rows').innerHTML=`<tr><td colspan="7" class="empty">${esc(e.message||e)}</td></tr>`});$('#closeModal').onclick=()=>$('#modalBack').classList.add('hidden');$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')e.currentTarget.classList.add('hidden')};
window.addEventListener('load',async()=>{if(!(isAdmin()||isStudentAffairs()))return deny();if(!schoolId())return deny();try{await load()}catch(e){$('#rows').innerHTML=`<tr><td colspan="7" class="empty">${esc(e.message||e)}</td></tr>`}finally{document.documentElement.setAttribute('data-ready','1')}});
setTimeout(()=>document.documentElement.setAttribute('data-ready','1'),2200);
})();
</script>
</body></html>
