<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>دخول المدرسة المستقلة</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{font-family:'Cairo',sans-serif;background:#0f172a;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden;}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 15%,rgba(20,184,166,.28),transparent 35%),linear-gradient(135deg,#0f172a,#042f2e);z-index:-2;}
    body:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.05);z-index:-1;pointer-events:none}
    #activation-overlay{display:none!important;visibility:hidden!important;pointer-events:none!important;}
    .login-card{width:min(92vw,520px);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);border-radius:2rem;padding:2rem;box-shadow:0 24px 80px rgba(0,0,0,.28);text-align:center;position:relative;z-index:10;}
    .login-card input{width:100%;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#fff;outline:0;font-size:16px;text-align:center;}
    .login-card input:focus{border-color:#5eead4;box-shadow:0 0 0 3px rgba(94,234,212,.13)}
    .login-card input::placeholder{color:rgba(255,255,255,.74)}
    #login-email{direction:ltr;text-align:left;unicode-bidi:plaintext}
    #school-login-btn{width:100%;border:0;border-radius:18px;padding:15px 18px;background:#14b8a6;color:#fff;font-weight:900;font-size:22px;cursor:pointer;position:relative;z-index:30;touch-action:manipulation;box-shadow:0 14px 30px rgba(20,184,166,.22)}
    #school-login-btn:active{transform:translateY(1px)}
    #school-login-btn[disabled]{opacity:.65;cursor:wait}
    #login-msg{min-height:1.5rem;margin-top:.75rem;font-size:13px;font-weight:800;color:#fecdd3}
    .safe-hidden-deactivate{display:none!important}
    @media(max-width:520px){body{padding:18px}.login-card{padding:1.8rem 1.5rem;border-radius:1.8rem}}
  </style>
<script>
/* RL33: تم تعطيل جسر Supabase القديم المضمّن في صفحة الدخول.
   جميع عمليات الهوية/العضوية/الدخول تمر عبر supabase-bridge + platform-directory + platform-session. */
</script>

<!-- PREMIUM_UI_2026 -->
<link rel="stylesheet" href="premium-ui.css">
<script defer src="premium-ui.js"></script>
<link rel="stylesheet" href="responsive-layout.css?v=20260818-responsive-1">

<body>
  <main class="login-card" aria-label="بوابة المدرسة المستقلة">
    <img src="https://upload.wikimedia.org/wikipedia/ar/1/17/Saudi_Ministry_of_Education_Logo_2025.png" alt="وزارة التعليم" style="width:96px;margin:0 auto 18px;display:block">
    <h1 id="school-main-title" style="font-size:clamp(28px,6vw,42px);font-weight:900;margin:0 0 8px">بوابة المدرسة المستقلة</h1>
    <div id="school-link-badge" style="display:none;margin:0 auto 14px;padding:10px 12px;border-radius:16px;background:rgba(20,184,166,.16);border:1px solid rgba(94,234,212,.22);color:#ccfbf1;font-size:13px;font-weight:900;line-height:1.8"></div>
    <p id="school-title" style="color:#99f6e4;font-size:15px;font-weight:900;margin:0 0 28px">تسجيل دخول مدير/ة المدرسة ومنسوبيها</p>
    <form id="school-login-form" autocomplete="on" novalidate>
      <div style="display:grid;gap:16px;text-align:right">
        <input id="login-email" name="email" type="text" placeholder="البريد أو اسم المستخدم" autocomplete="username" data-email-field="true" required>
        <input id="login-password" name="password" type="password" placeholder="الرقم السري" autocomplete="current-password" required>
        <button id="school-login-btn" type="submit">دخول</button>
        <p id="login-msg" role="alert" aria-live="polite"></p>
      </div>
    </form>
  </main>

<script src="supabase-bridge.js?v=20260905-RL33-directory"></script>
<script src="platform-cloud-session.js?v=20260905-RL33-complete-tab-role-isolation"></script>
<script id="school-logout-scope-cleanup-v1">
(function(){
  try{
    const q=new URLSearchParams(location.search||'');
    if(q.get('logout')!=='1')return;
    const keepSchool=String(q.get('schoolId')||q.get('school_id')||q.get('school')||q.get('schoolCode')||'').trim();
    const keys=['active_school_id','active_school_name','active_school_code','activeSchoolId','selected_school_id','current_school_id','current_school_name','school_id','school_name','school_code','smart_school_id','smart_school_name','persist_school','smartSchool.currentSchool','smartSchool:activeSchool','smart_school_active_school','smart_school_current_session','independent_school_mode','smart_school_tab_school_v1','smart_school_tab_role_v1'];
    keys.forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});
    if(keepSchool)sessionStorage.setItem('smart_school_logout_target_v1',keepSchool);else sessionStorage.removeItem('smart_school_logout_target_v1');
  }catch(e){}
})();
</script>
<script id="independent-school-login-engine" data-version="RL34-school-link-identity-direct-safe">
(function(){
  'use strict';

  const params = new URLSearchParams(location.search || '');
  const hashParams = (()=>{ try{ const h=String(location.hash||'').replace(/^#/,''); return new URLSearchParams(h.includes('?')?h.slice(h.indexOf('?')+1):h); }catch(_){ return new URLSearchParams(); }})();
  const first = (names) => {
    for (const n of names) {
      const v = params.get(n) || hashParams.get(n);
      if (v) return String(v).trim();
    }
    return '';
  };

  let targetSchoolId = first(['schoolId','school_id','sid','id']);
  let targetSchoolCode = first(['school','schoolCode','school_code','code']);
  let resolvedSchool = null;
  let loginBusy = false;

  function text(v){ return String(v == null ? '' : v).trim(); }
  function lower(v){ return text(v).toLowerCase(); }

  function setMsg(message, kind){
    const el = document.getElementById('login-msg');
    if(!el) return;
    el.textContent = message || '';
    el.style.color = kind === 'ok' ? '#99f6e4' : '#fecaca';
  }

  function setBusy(flag){
    const btn = document.getElementById('school-login-btn');
    if(!btn) return;
    btn.disabled = !!flag;
    btn.textContent = flag ? 'جارٍ التحقق...' : 'دخول';
  }

  function normalizeRole(role){
    const r = lower(role);
    if(['manager','principal','school_manager','leadership','مدير','مديرة','مدير المدرسة','مديرة المدرسة'].includes(r)) return 'leadership';
    if(['agent','deputy','vice','wakil','agency','وكيل','وكيلة'].includes(r)) return 'agency';
    if(['student_advisor','advisor','counselor','مرشد','موجه','موجه طلابي','الموجه الطلابي'].includes(r)) return 'student_advisor';
    if(['activity_leader','activity-leader','activity','رائد النشاط','رائدة النشاط'].includes(r)) return 'activity_leader';
    if(['health_advisor','health-advisor','موجه صحي','الموجه الصحي'].includes(r)) return 'health_advisor';
    if(['kindergarten_teacher','kindergarten-teacher','معلمة رياض الأطفال','معلمة رياض اطفال'].includes(r)) return 'kindergarten_teacher';
    if(['administrative_employee','admin_employee','employee_admin','موظف إداري','موظفة إدارية'].includes(r)) return 'administrative_employee';
    if(['teacher','performance','معلم','معلمة'].includes(r)) return 'performance';
    return r || 'performance';
  }

  function fileForRole(role){
    const r = normalizeRole(role);
    if(r === 'leadership') return 'manager.html';
    if(r === 'agency') return 'agent.html';
    if(r === 'student_advisor') return 'student_advisor.html';
    if(r === 'activity_leader') return 'activity_leader.html';
    if(r === 'health_advisor') return 'health_advisor.html';
    if(r === 'kindergarten_teacher') return 'kindergarten_teacher.html';
    if(r === 'administrative_employee') return 'administrative_employee_portal.html';
    return 'teacher.html';
  }

  const RL34_SUPABASE_URL='https://cijhgvbtrvmmlcssgxht.supabase.co';
  const RL34_SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpamhndmJ0cnZtbWxjc3NneGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTY4MzUsImV4cCI6MjA5NDI3MjgzNX0.1sbfDvL1V12kj9oVcYJqYhj8NPuLpYjId7CO9QGj3bM';
  async function inspectSchoolDirect(){
    const r=await fetch(RL34_SUPABASE_URL+'/functions/v1/platform-directory',{method:'POST',cache:'no-store',headers:{'content-type':'application/json','apikey':RL34_SUPABASE_ANON_KEY},body:JSON.stringify({action:'inspect-school',schoolId:targetSchoolId||'',schoolCode:targetSchoolCode||''})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||d.details||'تعذر التحقق من هوية المدرسة');
    return d;
  }
  async function resolveSchool(){
    if(resolvedSchool)return resolvedSchool;if(!targetSchoolId&&!targetSchoolCode)return null;
    let d=null, bridgeError=null;
    const bridge=window.SmartSchoolSupabase;
    if(bridge?.platformDirectoryCall){try{d=await bridge.platformDirectoryCall('inspect-school',{schoolId:targetSchoolId||'',schoolCode:targetSchoolCode||''},false)}catch(e){bridgeError=e}}
    if(!d?.school){try{d=await inspectSchoolDirect()}catch(e){throw bridgeError||e}}
    const row=d?.school||null;if(!row)return null;
    const sid=text(row.id),scode=text(row.school_code);if(targetSchoolId&&sid!==targetSchoolId)return null;if(targetSchoolCode&&scode&&scode!==targetSchoolCode)return null;
    targetSchoolId=sid;targetSchoolCode=scode||targetSchoolCode;resolvedSchool=row;
    try{sessionStorage.setItem('smart_school_tab_school_v1',sid);sessionStorage.setItem('current_school_id',sid);if(scode)sessionStorage.setItem('active_school_code',scode)}catch(_){}
    return row;
  }
  function renderSchool(school){
    if(!school) return;
    const name = text(school.school_name || school.schoolName || 'المدرسة');
    const title = document.getElementById('school-main-title');
    const subtitle = document.getElementById('school-title');
    const badge = document.getElementById('school-link-badge');
    if(title) title.textContent = name;
    if(subtitle) subtitle.textContent = 'تسجيل دخول: ' + name;
    if(badge){
      badge.style.display = 'block';
      badge.textContent = 'مدرسة مستقلة مرتبطة\n' + name;
      badge.style.whiteSpace = 'pre-line';
    }
  }

  async function loadUserProfile(userId,schoolId,login){
    try{const bridge=window.SmartSchoolSupabase;if(!bridge?.platformDirectoryCall)return null;const d=await bridge.platformDirectoryCall('me',{});if(String(d.user?.id||'')!==String(userId||''))throw new Error('هوية المستخدم لا تطابق جلسة التبويب');if(String(d.school?.id||'')!==String(schoolId||''))throw new Error('المدرسة لا تطابق جلسة التبويب');return d.user||null}catch(_){return null}
  }
  function storeCompatibilityContext(data){
    const {schoolId,schoolName,role,userId,userName,email,cloud}=data;
    const user={id:userId,user_id:userId,name:userName,full_name:userName,email,role,schoolId,school_id:schoolId,schoolName,school_name:schoolName,status:'active',isActive:true,active:true};
    const session={...user,userId,loginAt:new Date().toISOString(),independentSchool:true,loginMode:'direct',cloudToken:text(cloud.token),cloudExpiresAt:text(cloud.expiresAt),cloudUserId:text(cloud.userId||userId),cloudSchoolId:text(cloud.schoolId||schoolId),cloudRole:text(cloud.role||role)};
    sessionStorage.setItem('smart_school_tab_school_v1',schoolId);sessionStorage.setItem('current_school_id',schoolId);sessionStorage.setItem('current_school_name',schoolName);sessionStorage.setItem('smart_school_tab_role_v1',role);sessionStorage.setItem('currentRole',role);sessionStorage.setItem('currentUserId',userId);sessionStorage.setItem('currentUserEmail',email);sessionStorage.setItem('currentUserName',userName);sessionStorage.setItem('currentUser',JSON.stringify(user));sessionStorage.setItem('currentSchoolUser',JSON.stringify(user));sessionStorage.setItem('smart_school_current_session',JSON.stringify(session));
  }
  async function schoolLogin(event){
    if(event) event.preventDefault();
    if(loginBusy) return false;
    loginBusy = true;
    setBusy(true);
    setMsg('');

    try{
      const login = lower(document.getElementById('login-email')?.value);
      const password = text(document.getElementById('login-password')?.value);
      if(!login || !password) throw new Error('يرجى إدخال البريد أو اسم المستخدم والرقم السري.');

      const school = await resolveSchool();
      if(!school || !targetSchoolId) throw new Error('رابط المدرسة غير صحيح أو غير مرتبط بمدرسة فعالة.');

      // School authentication is intentionally isolated from browser Supabase Auth.
      // This preserves the pre-isolation successful flow while using the secure custom school session.
      if(!window.PlatformCloudSession || typeof PlatformCloudSession.open !== 'function')
        throw new Error('محرك جلسة المدرسة غير متاح.');

      const cloud = await PlatformCloudSession.open(login, password, targetSchoolId);
      if(!cloud || !cloud.token) throw new Error('تعذر إنشاء جلسة مدرسية صالحة.');
      if(text(cloud.schoolId) !== targetSchoolId)
        throw new Error('رفض أمني: جلسة الحساب لا تطابق المدرسة الموجودة في الرابط.');

      // Verify the server-issued context before navigation.
      const memberships = await PlatformCloudSession.memberships();
      const current = memberships && memberships.current ? memberships.current : {};
      if(text(current.schoolId) !== targetSchoolId || text(current.userId) !== text(cloud.userId))
        throw new Error('رفض أمني: تعذر تأكيد عضوية الحساب في المدرسة الحالية.');

      const role = normalizeRole(current.role || cloud.role);
      const profile = await loadUserProfile(cloud.userId, targetSchoolId, login);
      const schoolName = text(school.school_name || school.schoolName || 'المدرسة');
      const userName = text(profile?.full_name || profile?.name || school.manager_name || login);
      const userEmail = lower(profile?.email || login);

      storeCompatibilityContext({
        schoolId:targetSchoolId, schoolName, role,
        userId:text(cloud.userId), userName, email:userEmail, cloud
      });

      try{
        Object.keys(sessionStorage).forEach(k => {
          if(/follow|monitor|readonly/i.test(k)) sessionStorage.removeItem(k);
        });
        localStorage.removeItem('smartSchoolUnifiedOpsV2_follow_context');
        localStorage.removeItem('follow_context');
      }catch(_){}

      setMsg('تم التحقق، جارٍ فتح القسم...', 'ok');
      const target = fileForRole(role);
      const q = new URLSearchParams({
        role,
        uid:text(cloud.userId),
        email:userEmail,
        schoolId:targetSchoolId,
        school_name:schoolName,
        schoolMode:'independent',
        independent:'true',
        loginMode:'direct',
        direct:'1'
      });
      location.assign(target + '?' + q.toString());
      return false;
    }catch(err){
      console.error('[independent-school-login]', err);
      const message = err && err.message ? err.message : 'تعذر إكمال تسجيل الدخول.';
      setMsg(message);
      try{
        if(window.PlatformCloudSession && /رفض أمني|تعذر إنشاء جلسة|عضوية/.test(message))
          PlatformCloudSession.clear();
      }catch(_){}
      return false;
    }finally{
      loginBusy = false;
      setBusy(false);
    }
  }

  async function init(){
    const form = document.getElementById('school-login-form');
    if(form && !form.dataset.boundCleanV3){
      form.dataset.boundCleanV3 = '1';
      form.addEventListener('submit', schoolLogin, {passive:false});
    }

    // A school login link must never inherit system-admin visual context from the same tab.
    // Only tab-scoped flags are cleared; shared localStorage and the admin Supabase Auth session are untouched.
    try{
      if(targetSchoolId || targetSchoolCode){
        ['system_admin_context','system_admin_verified','system_admin_session','systemAdmin','system_admin_mode']
          .forEach(k => sessionStorage.removeItem(k));
        sessionStorage.removeItem('systemAdminSession');
        document.documentElement.removeAttribute('data-system-admin-context');
      }
    }catch(_){}

    try{
      const school = await resolveSchool();
      if(!school){
        setMsg('رابط المدرسة غير صحيح أو المدرسة غير فعالة. أعد نسخ رابط الدخول من إدارة المدارس.');
        setBusy(true);
        return;
      }
      renderSchool(school);
    }catch(err){
      console.error('[independent-school-init]',err);
      setMsg((targetSchoolId||targetSchoolCode)?'تعذر التحقق من هوية هذه المدرسة. أعد فتح رابط المدرسة الأصلي أو حدّث الصفحة.':'رابط الدخول لا يحتوي تعريف المدرسة. استخدم رابط الدخول الخاص بالمدرسة من إدارة المدارس.');
    }
  }

  window.schoolLogin = schoolLogin;
  document.addEventListener('DOMContentLoaded', init);
  if(document.readyState !== 'loading') init();
})();
</script>
