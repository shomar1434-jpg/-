<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>استبانة مشاركة أصحاب المصلحة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-bridge.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
:root{--navy:#15445A;--teal:#0DA9A6;--line:#D9E6EA;--muted:#667F89;--bg:#F3F8FA}*{box-sizing:border-box}body{margin:0;font-family:Tajawal,sans-serif;color:#183B49;background:linear-gradient(145deg,#F7FBFC,#EAF5F6);min-height:100vh}.wrap{width:min(820px,calc(100% - 24px));margin:24px auto 70px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 14px 38px rgba(21,68,90,.08)}.hero{overflow:hidden}.hero-top{height:10px;background:linear-gradient(90deg,var(--navy),var(--teal))}.hero-body{padding:28px}.hero h1{margin:0;color:var(--navy);font-size:25px;line-height:1.6}.hero p{color:var(--muted);line-height:2;font-size:14px;margin:12px 0 0}.card{padding:22px;margin-top:14px}.question{padding:18px 0;border-bottom:1px solid #E9F0F2}.question:last-child{border:0}.question h2{font-size:15px;line-height:1.8;margin:0 0 12px}.required{color:#BC4040}input[type=text],textarea,select{width:100%;padding:12px;border:1px solid #CBDDE2;border-radius:10px;font:14px Tajawal;background:#FBFDFE}textarea{min-height:100px;resize:vertical}.options{display:grid;gap:9px}.option{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid #D9E6EA;border-radius:10px;background:#FBFDFE;cursor:pointer}.option input{width:18px;height:18px;accent-color:var(--teal)}button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--teal),#087E7B);color:#fff;font:800 15px Tajawal;cursor:pointer}button:disabled{opacity:.6}.message{text-align:center;padding:38px}.message h1{color:var(--navy)}.error{color:#A74444;background:#FFF3F2;border:1px solid #ECC9C5;padding:12px;border-radius:11px;margin-bottom:12px}@media(max-width:600px){.hero-body,.card{padding:17px}.hero h1{font-size:20px}}
</style>
</head>
<body><main class="wrap" id="root"><div class="card message"><h1>جاري تحميل الاستبانة...</h1></div></main>
<script>
let activeSurvey=null;
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
function token(){return new URLSearchParams(location.search).get("survey")||""}
function client(){return window.SmartSchoolSupabase?.getClient?.()||null}
function optionHtml(q,i,multi=false){return (q.options||[]).map((o,j)=>`<label class="option"><input ${q.required&&!multi?"required":""} type="${multi?"checkbox":"radio"}" name="q${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}
function questionHtml(q,i){const req=q.required?'<span class="required"> *</span>':'';let field;if(q.type==="text")field=`<textarea name="q${i}" ${q.required?"required":""}></textarea>`;else if(q.type==="multi")field=`<div class="options">${optionHtml(q,i,true)}</div>`;else field=`<div class="options">${optionHtml(q,i,false)}</div>`;return `<section class="question"><h2>${i+1}. ${esc(q.text)}${req}</h2>${field}</section>`}
async function loadSurvey(){const root=document.getElementById("root"),sb=client(),t=token();if(!sb||!t){root.innerHTML='<div class="card message"><h1>الرابط غير مكتمل</h1><p>تحقق من رابط الاستبانة المرسل من المدرسة.</p></div>';return}try{const q=await sb.rpc("get_public_impact_survey",{p_token:t});if(q.error)throw q.error;const row=Array.isArray(q.data)?q.data[0]:q.data;if(!row){root.innerHTML='<div class="card message"><h1>الاستبانة غير متاحة</h1><p>ربما أُغلقت الاستبانة أو انتهى الرابط.</p></div>';return}activeSurvey=row;root.innerHTML=`<header class="hero"><div class="hero-top"></div><div class="hero-body"><h1>${esc(row.title)}</h1><p>نقدّر مشاركتك في تطوير أداء المدرسة وإعداد خطتها التشغيلية. تعامل جميع الإجابات بسرية وتستخدم لأغراض التحسين والتخطيط فقط، وهذه الاستبانة موجهة للمشاركين والمشاركات من جميع الفئات.</p></div></header><form class="card" id="surveyForm"><div id="formError"></div>${(row.questions||[]).map(questionHtml).join("")}<button id="submitBtn" type="submit">إرسال الاستبانة</button></form>`;document.getElementById("surveyForm").addEventListener("submit",submitSurvey)}catch(e){console.error(e);root.innerHTML='<div class="card message"><h1>تعذر تحميل الاستبانة</h1><p>يرجى المحاولة مرة أخرى أو التواصل مع المدرسة.</p></div>'}}
async function submitSurvey(e){e.preventDefault();const form=e.currentTarget,btn=document.getElementById("submitBtn"),err=document.getElementById("formError"),fd=new FormData(form);err.innerHTML="";const questions=activeSurvey.questions||[],answers=[];for(let i=0;i<questions.length;i++){const q=questions[i],values=fd.getAll("q"+i);if(q.required&&!values.length){err.innerHTML='<div class="error">يرجى الإجابة عن جميع الأسئلة المطلوبة.</div>';form.querySelector(`[name="q${i}"]`)?.focus();return}answers.push({text:q.text,type:q.type,value:q.type==="multi"?values:String(values[0]||"")})}try{btn.disabled=true;btn.textContent="جارٍ إرسال الاستبانة...";const first=String(answers[0]?.value||"");const q=await client().rpc("submit_public_impact_response",{p_token:token(),p_respondent_name:"",p_respondent_category:first,p_answers:answers});if(q.error)throw q.error;document.getElementById("root").innerHTML='<div class="card message"><h1>تم إرسال الاستبانة بنجاح</h1><p>شكرًا لمشاركتك الفاعلة في تطوير الخطة التشغيلية للمدرسة.</p></div>'}catch(e){console.error(e);err.innerHTML='<div class="error">تعذر إرسال الاستبانة. تحقق من الاتصال ثم حاول مرة أخرى.</div>';btn.disabled=false;btn.textContent="إرسال الاستبانة"}}
loadSurvey();
</script></body></html>
