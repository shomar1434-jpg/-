<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الزيارة الإشرافية</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{font-family:Cairo,Tajawal,Arial,sans-serif;margin:0;min-height:100vh;background:linear-gradient(135deg,#ecfeff,#f8fafc);color:#0f172a}
  .card{background:rgba(255,255,255,.94);border:1px solid #dbeafe;border-radius:34px;box-shadow:0 18px 45px rgba(15,23,42,.08)}
  .role-card{transition:.18s ease;cursor:pointer}
  .role-card:hover{transform:translateY(-4px);border-color:#0f766e}
  #viewer{display:none;position:fixed;inset:0;background:#fff;z-index:20}
  #viewerBar{height:64px;background:#0f172a;color:white;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px;box-shadow:0 8px 25px rgba(15,23,42,.18)}
  #viewerFrame{width:100%;height:calc(100vh - 64px);border:0;background:white}
  .btn{border:0;border-radius:16px;padding:10px 15px;font-weight:900;cursor:pointer}
  #visitUserDrawer{display:none;position:fixed;top:64px;right:0;bottom:0;width:min(340px,86vw);background:#fff;border-left:1px solid #e2e8f0;z-index:25;box-shadow:-12px 0 30px rgba(15,23,42,.16);padding:14px;overflow:auto}
  #visitUserDrawer .drawer-title{font-weight:900;color:#0f766e;margin:4px 0 12px}
  .visit-user-card{width:100%;text-align:right;border:1px solid #e2e8f0;background:#f8fafc;border-radius:16px;padding:12px;margin-bottom:8px;cursor:pointer;font-family:Cairo,Tajawal,Arial,sans-serif}
  .visit-user-card:hover{background:#ecfeff;border-color:#0f766e}
  .visit-user-card b{display:block;color:#0f172a}.visit-user-card small{color:#64748b;font-weight:700}
</style>
</head>
<body>
<main id="portal" class="max-w-6xl mx-auto px-5 py-10">
  <section class="card p-8 mb-8 text-center">
    <div class="text-5xl mb-3">🧭</div>
    <h1 id="school-title" class="text-3xl md:text-4xl font-black text-slate-800">الزيارة الإشرافية</h1>
    <p class="mt-3 text-slate-500 font-bold">وضع المعاينة فقط — لا توجد صلاحيات تعديل أو حذف أو إضافة</p>
    <div class="mt-5 flex flex-wrap gap-2 justify-center">
      <button onclick="closeSupervisorVisitPage()" class="btn bg-slate-100 text-slate-700">خروج</button>
    </div>
  </section>

  <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">
    <div class="card role-card p-7 text-center" onclick="openRole('manager')">
      <div class="text-5xl mb-3">🏛️</div><h2 class="font-black text-xl">قسم المدير</h2><p class="text-xs text-slate-500 mt-2 font-bold">معاينة الإنجاز والسجلات</p>
    </div>
    <div class="card role-card p-7 text-center" onclick="openRole('agent')">
      <div class="text-5xl mb-3">📑</div><h2 class="font-black text-xl">قسم الوكيل</h2><p class="text-xs text-slate-500 mt-2 font-bold">معاينة الأرشيف والسجلات</p>
    </div>
    <div class="card role-card p-7 text-center" onclick="openRole('teacher')">
      <div class="text-5xl mb-3">👨‍🏫</div><h2 class="font-black text-xl">قسم المعلم</h2><p class="text-xs text-slate-500 mt-2 font-bold">معاينة فقط</p>
    </div>
    <div class="card role-card p-7 text-center" onclick="openRole('student_advisor')">
      <div class="text-5xl mb-3">🧭</div><h2 class="font-black text-xl">قسم الموجه الطلابي</h2><p class="text-xs text-slate-500 mt-2 font-bold">معاينة فقط</p>
    </div>
  </section>
</main>

<section id="viewer">
  <div id="viewerBar">
    <div>
      <b id="viewerTitle">الزيارة الإشرافية</b>
      <div style="font-size:11px;color:#cbd5e1;font-weight:700">معاينة فقط — الأزرار المؤثرة معطلة</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn bg-teal-600 text-white" onclick="openSupervisorVisitForm()">ملاحظات إشرافية</button>
      <button class="btn bg-slate-100 text-slate-800" onclick="backToPortal()">العودة للقائمة</button>
      <button class="btn bg-red-500 text-white" onclick="backToPortal()">خروج</button>
    </div>
  </div>
  <aside id="visitUserDrawer" aria-label="قائمة المستخدمين"></aside>
  <iframe id="viewerFrame" title="معاينة القسم"></iframe>
</section>
<script>
const qs = new URLSearchParams(location.search);
const schoolId = qs.get('school_id') || qs.get('schoolId') || localStorage.getItem('current_school_id') || localStorage.getItem('school_id') || 'school';
const schoolName = qs.get('school_name') || qs.get('schoolName') || localStorage.getItem('school_name') || localStorage.getItem('persist_school') || 'المدرسة';
const token = qs.get('token') || localStorage.getItem('supervisor_visit_token_'+schoolId) || 'visit';
let currentRole = '';

document.getElementById('school-title').textContent = schoolName + ' — الزيارة الإشرافية';


function closeSupervisorVisitPage(){
  try { window.open('', '_self'); window.close(); } catch(e) {}
  setTimeout(function(){
    document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Cairo,Tajawal,Arial,sans-serif;background:#f8fafc;color:#0f172a;text-align:center"><div><div style="font-size:46px;margin-bottom:12px">✅</div><h2 style="margin:0;font-weight:900">تم إغلاق الزيارة الإشرافية</h2><p style="color:#64748b;font-weight:700">يمكنك إغلاق تبويب المتصفح الآن.</p></div></div>';
  }, 250);
}

function pageFor(role){
  return role==='manager'?'manager.html':role==='agent'?'agent.html':role==='teacher'?'teacher.html':'student_advisor.html';
}
function roleName(role){
  return role==='manager'?'قسم المدير':role==='agent'?'قسم الوكيل':role==='teacher'?'قسم المعلم':'قسم الموجه الطلابي';
}
function readVisitUsers(){
  try{return JSON.parse(localStorage.getItem('smartSchoolUnifiedOpsV2_users') || '[]') || [];}catch(e){return [];}
}
function normalizeVisitRole(role){
  role=String(role||'').toLowerCase();
  if(role==='leadership'||role==='manager') return 'manager';
  if(role==='agency'||role==='agent') return 'agent';
  if(role==='advisor'||role==='student_advisor') return 'student_advisor';
  return role || 'teacher';
}
function usersForVisitRole(role){
  const r=normalizeVisitRole(role);
  return readVisitUsers().filter(u=>normalizeVisitRole(u.role)===r && (u.status==='active'||u.isActive===true||u.active===true));
}
function openRole(role){
  const list = usersForVisitRole(role);
  if(list.length > 1){
    currentRole = role;
    document.getElementById('portal').style.display = 'none';
    document.getElementById('viewer').style.display = 'block';
    document.getElementById('viewerTitle').textContent = schoolName + ' — اختيار مستخدم من ' + roleName(role);
    document.getElementById('viewerFrame').src = 'about:blank';
    const drawer=document.getElementById('visitUserDrawer');
    drawer.innerHTML = '<div class="drawer-title">اختر المستخدم للدخول للزيارة</div>' + list.map(u=>'<button class="visit-user-card" type="button" onclick="openRoleUser(\''+role+'\',\''+String(u.id||'').replace(/'/g,'')+'\')"><b>'+String(u.name||'مستخدم').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</b><small>'+String(u.email||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</small></button>').join('');
    drawer.style.display='block';
    return;
  }
  openRoleUser(role, list[0] && list[0].id);
}
function openRoleUser(role, userId){
  const drawer=document.getElementById('visitUserDrawer'); if(drawer) drawer.style.display='none';
  const selected = userId ? usersForVisitRole(role).find(u=>String(u.id)===String(userId)) : null;
  currentRole = role;
  document.getElementById('viewerTitle').textContent = schoolName + ' — ' + roleName(role) + (selected && selected.name ? ' — ' + selected.name : '');
  document.getElementById('portal').style.display = 'none';
  document.getElementById('viewer').style.display = 'block';
  const q = new URLSearchParams({
    mode:'supervisor_visit',
    readonly:'1',
    follow:'1',
    school_id:schoolId,
    schoolId:schoolId,
    school_name:schoolName,
    token:token,
    targetRole:role,
    returnRole:'supervisor_visit',
    schoolMode:'independent',
    independent:'true',
    loginMode:'direct',
    direct:'1'
  });
  if(selected){
    q.set('targetUser', selected.id || '');
    q.set('followUserId', selected.id || '');
    q.set('userId', selected.id || '');
    q.set('uid', selected.id || '');
    q.set('followEmail', selected.email || '');
    q.set('targetEmail', selected.email || '');
  }
  const frame = document.getElementById('viewerFrame');
  frame.src = pageFor(role) + '?' + q.toString();
  frame.onload = protectFrame;
}
function backToPortal(){
  const drawer=document.getElementById('visitUserDrawer'); if(drawer) drawer.style.display='none';
  const frame = document.getElementById('viewerFrame');
  frame.src = 'about:blank';
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('portal').style.display = 'block';
}
function protectFrame(){
  const frame = document.getElementById('viewerFrame');
  let doc;
  try{ doc = frame.contentDocument || frame.contentWindow.document; }catch(e){ return; }
  if(!doc) return;

  function apply(){
    try{
      ['activation-overlay','welcome-gate','login-overlay','login-gate'].forEach(id=>{
        const el = doc.getElementById(id);
        if(el){ el.style.display='none'; el.classList && el.classList.add('hidden'); }
      });

      const welcome = doc.getElementById('welcome-dashboard');
      if(welcome){ welcome.classList.remove('hidden'); if(!welcome.style.display || welcome.style.display==='none') welcome.style.display='block'; }

      doc.querySelectorAll('input,textarea,select,[contenteditable="true"]').forEach(el=>{
        el.setAttribute('readonly','readonly');
        if(el.tagName==='SELECT' || el.type==='file' || el.type==='checkbox' || el.type==='radio') el.setAttribute('disabled','disabled');
        if(el.getAttribute('contenteditable')==='true') el.setAttribute('contenteditable','false');
      });

      doc.querySelectorAll('button,a,[role="button"],input[type="button"],input[type="submit"]').forEach(el=>{
        const text = ((el.innerText||el.textContent||'')+' '+(el.title||'')+' '+(el.getAttribute('aria-label')||'')).trim();
        const onclick = String(el.getAttribute('onclick')||'');
        const isExit = /خروج|العودة للقائمة|عودة للقائمة|الرئيسية/.test(text) || /goHome|logout|exit|index\.html/.test(onclick);
        if(isExit){
          el.onclick = function(e){ e.preventDefault(); e.stopPropagation(); backToPortal(); return false; };
          return;
        }
        const allowed = /معاينة|عرض|فتح|بحث|طباعة|الأرشيف|ارشيف|داشبورد|محفظة|سجلات|السجلات|القائمة/.test(text);
        const destructive = /حذف|إضافة|اضافة|حفظ|تعديل|رفع|إرسال|ارسال|تنشيط|اعتماد|استيراد|تصدير|delete|save|edit|upload|send|add/.test(text+' '+onclick);
        if(destructive && !allowed){
          el.style.display='none';
          el.setAttribute('disabled','disabled');
        }
      });
    }catch(e){}
  }
  apply();
  setTimeout(apply,500);
  setTimeout(apply,1500);
}

function openSupervisorVisitForm(){
  currentRole = 'supervisor_visit_form';
  document.getElementById('viewerTitle').textContent = schoolName + ' — استمارة الزيارة الإشرافية';
  document.getElementById('portal').style.display = 'none';
  document.getElementById('viewer').style.display = 'block';
  const q = new URLSearchParams({
    mode:'supervisor_visit_form',
    school_id:schoolId,
    school_name:schoolName,
    token:token,
    schoolId:schoolId,
    schoolMode:'independent',
    independent:'true',
    loginMode:'direct',
    direct:'1'
  });
  const frame = document.getElementById('viewerFrame');
  frame.onload = null;
  frame.src = 'supervisor_visit_form.html?' + q.toString();
}

function copyVisitLink(){
  const url = location.origin + location.pathname + '?school_id=' + encodeURIComponent(schoolId) + '&school_name=' + encodeURIComponent(schoolName) + '&token=' + encodeURIComponent(token);
  navigator.clipboard && navigator.clipboard.writeText(url);
  alert('تم نسخ رابط الزيارة الإشرافية');
}
</script>


<!-- SAFE_FIX: independent school return button only -->
<style id="independent-school-return-button-style">
  #independentSchoolReturnBtn{
    position:fixed!important;
    right:18px!important;
    bottom:18px!important;
    z-index:999999!important;
    width:54px!important;
    height:54px!important;
    border:0!important;
    border-radius:50%!important;
    background:#0f766e!important;
    color:#fff!important;
    box-shadow:0 10px 28px rgba(15,118,110,.35)!important;
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    font-size:24px!important;
    font-weight:900!important;
    cursor:pointer!important;
    font-family:Arial,Tahoma,sans-serif!important;
  }
  #independentSchoolReturnBtn:hover{filter:brightness(.95)!important;transform:translateY(-1px)!important}
  #independentSchoolReturnBtn::after{
    content:'العودة لشاشة الدخول';
    position:absolute;
    right:62px;
    bottom:8px;
    white-space:nowrap;
    background:#0f172a;
    color:#fff;
    font-size:11px;
    font-weight:800;
    padding:7px 10px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:.18s ease;
  }
  #independentSchoolReturnBtn:hover::after{opacity:1}
  @media print{#independentSchoolReturnBtn{display:none!important}}
</style>
<script id="independent-school-return-button-script">
(function(){
  if(window.__independentSchoolReturnButtonInstalled) return;
  window.__independentSchoolReturnButtonInstalled = true;
  function isIndependentSchoolScope(){
    try{
      var p = new URLSearchParams(location.search || '');
      var independentFlag = String(p.get('independent') || '').toLowerCase() === 'true';
      var schoolMode = String(p.get('schoolMode') || '').toLowerCase() === 'independent';
      var loginMode = String(p.get('loginMode') || '').toLowerCase() === 'direct';
      var direct = String(p.get('direct') || '').toLowerCase() === '1';
      var hasSchoolId = !!String(p.get('schoolId') || '').trim();
      return (independentFlag || schoolMode) && (loginMode || direct || hasSchoolId);
    }catch(e){ return false; }
  }
  function targetLoginUrl(){
    var p = new URLSearchParams(location.search || '');
    var schoolId = String(p.get('schoolId') || '').trim();
    var q = new URLSearchParams();
    if(schoolId) q.set('schoolId', schoolId);
    q.set('return','1');
    return 'school-login.html' + (q.toString() ? ('?' + q.toString()) : '');
  }
  function install(){
    if(!isIndependentSchoolScope()) return;
    if(document.getElementById('independentSchoolReturnBtn')) return;
    var btn=document.createElement('button');
    btn.id='independentSchoolReturnBtn';
    btn.type='button';
    btn.title='العودة لشاشة دخول المدرسة';
    btn.setAttribute('aria-label','العودة لشاشة دخول المدرسة');
    btn.innerHTML='↩';
    btn.addEventListener('click', function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      location.href = targetLoginUrl();
    }, true);
    document.body.appendChild(btn);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install);
  else install();
})();
</script>

<script src="school-exit-scope.js" defer></script>
</body>
</html>
