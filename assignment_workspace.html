<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساحة التكليف</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><style>
:root{--green:#0f766e;--dark:#083f46;--bg:#f2f7f6;--line:#d7e7e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tajawal,Arial;color:#16323a}.top{background:linear-gradient(135deg,var(--dark),var(--green));color:#fff;padding:22px}.wrap{max-width:1180px;margin:auto}.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:15px}.back,.btn{border:0;border-radius:12px;padding:10px 15px;font-family:inherit;font-weight:900;cursor:pointer}.back{background:#fff;color:var(--green)}main{padding:22px}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 35px #083f4610}.hero{padding:22px;margin-bottom:16px}.hero h1{margin:0 0 8px}.status{display:inline-flex;border-radius:999px;background:#e8f7f3;color:#087467;padding:6px 11px;font-weight:900}.progress{height:11px;background:#e5efed;border-radius:999px;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;background:var(--green)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{background:#eaf3f1;color:#164d50}.tab.active{background:var(--green);color:#fff}.panel{padding:18px;min-height:320px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fbfefd}.card h3{margin:0 0 8px}.muted{color:#64748b;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{background:var(--green);color:#fff}.btn.secondary{background:#e6f2f0;color:#0f5d59}.btn.warn{background:#b45309}.btn.danger{background:#b91c1c}textarea,input{width:100%;border:1px solid #cbdad7;border-radius:12px;padding:11px;font-family:inherit;margin:7px 0}.empty{text-align:center;color:#64748b;padding:50px 15px}.banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px 16px;border-radius:14px;margin-bottom:15px;font-weight:800}.toast{position:fixed;left:20px;bottom:20px;z-index:99;padding:12px 18px;border-radius:14px;color:#fff;background:#0f766e;font-weight:900;opacity:0;transform:translateY(15px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:700px){.top .wrap{align-items:flex-start;flex-direction:column}.hero{padding:16px}main{padding:12px}}
</style></head><body>
<header class="top"><div class="wrap"><div><div style="opacity:.8;font-size:13px">منصة القيادة المدرسية</div><strong style="font-size:24px">مساحة تنفيذ التكليف</strong></div><button class="back" onclick="history.back()">العودة</button></div></header>
<main class="wrap"><div id="loading" class="panel empty">جاري تحميل مساحة التكليف...</div><div id="content" hidden><div class="banner">أنت تعمل الآن بصفتك مكلفًا مؤقتًا. صلاحياتك محصورة بنطاق هذا التكليف وتنتهي بانتهائه.</div><section class="hero"><div class="row" style="justify-content:space-between"><div><h1 id="title"></h1><div id="meta" class="muted"></div></div><span id="status" class="status"></span></div><p id="description"></p><div class="progress"><span id="bar"></span></div><div id="progressText" class="muted" style="margin-top:6px"></div></section><nav class="tabs"><button class="btn tab active" data-tab="overview">نظرة عامة</button><button class="btn tab" data-tab="records">السجلات المصرح بها</button><button class="btn tab" data-tab="execution">التنفيذ والتحديثات</button><button class="btn tab" data-tab="evidence">الملفات والشواهد</button><button class="btn tab" data-tab="history">سجل النشاط</button></nav><section class="panel" id="panel"></section></div></main><div id="toast" class="toast"></div>
<script src="platform-cloud-session.js"></script><script src="cloud-file-engine.js"></script><script src="cloud-task-engine.js"></script><script src="platform-core-engine.js"></script><script src="platform-record-registry.js"></script><script src="platform-event-bus.js"></script><script>
const qs=new URLSearchParams(location.search),taskId=qs.get('task_id');let ws=null,tab='overview';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(m,ok=true){const x=document.getElementById('toast');x.textContent=m;x.style.background=ok?'#0f766e':'#b91c1c';x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3000)}
async function load(){try{if(!taskId)throw new Error('معرف التكليف غير موجود');ws=await PlatformCore.workspace(taskId);document.getElementById('loading').hidden=true;document.getElementById('content').hidden=false;document.getElementById('title').textContent=ws.task.title;document.getElementById('description').textContent=ws.task.description||'';document.getElementById('status').textContent=ws.task.status;document.getElementById('meta').textContent=`نوع التكليف: ${ws.task.assignment_type||'-'} · الدور المؤقت: ${ws.task.assignee_role||'-'} · تاريخ الاستحقاق: ${ws.task.due_date||'غير محدد'}`;document.getElementById('bar').style.width=(ws.task.progress_percent||0)+'%';document.getElementById('progressText').textContent='نسبة التقدم: '+(ws.task.progress_percent||0)+'%';render()}catch(e){document.getElementById('loading').textContent=e.message||'تعذر تحميل التكليف'}}
function render(){const p=document.getElementById('panel');if(tab==='overview'){p.innerHTML=`<div class="grid"><div class="card"><h3>نطاق التكليف</h3><div class="muted">القسم: ${esc(ws.task.module_key)}<br>نوع السجل: ${esc(ws.task.record_type||'-')}<br>السجل: ${esc(ws.task.record_id||'-')}</div></div><div class="card"><h3>الصلاحيات المؤقتة</h3>${(ws.grants||[]).map(g=>`<div class="muted">${esc(g.module_key)} · عرض ${g.can_view?'✓':'–'} · تعديل ${g.can_update?'✓':'–'} · رفع ${g.can_upload?'✓':'–'} · اعتماد ${g.can_approve?'✓':'–'}</div>`).join('')||'<div class="muted">لا توجد صلاحيات مسجلة.</div>'}</div><div class="card"><h3>الإجراء التالي</h3><div class="row"><button class="btn" onclick="startTask()">بدء/استئناف التنفيذ</button><button class="btn secondary" onclick="setTab('execution')">إضافة تحديث</button></div></div></div>`}else if(tab==='records'){p.innerHTML=(ws.records||[]).length?`<div class="grid">${ws.records.map(r=>`<div class="card"><h3>${esc(r.record_type)}</h3><div class="muted">${esc(r.module_key)} · ${esc(r.relation_type)}</div>${r.record_id?`<div class="muted">المعرف: ${esc(r.record_id)}</div>`:''}<button class="btn" onclick="openRecord('${esc(r.module_key)}','${esc(r.record_type)}','${esc(r.record_id||'')}')">فتح السجل</button></div>`).join('')}</div>`:'<div class="empty">لا توجد سجلات مرتبطة بهذا التكليف.</div>'}else if(tab==='execution'){p.innerHTML=`<form onsubmit="saveUpdate(event)"><input id="updTitle" placeholder="عنوان التحديث" required><textarea id="updNotes" rows="5" placeholder="وصف ما تم تنفيذه" required></textarea><input id="updProgress" type="number" min="0" max="100" value="${ws.task.progress_percent||0}" placeholder="نسبة الإنجاز"><input id="updFile" type="file"><div class="row"><button class="btn">حفظ التحديث</button><button type="button" class="btn secondary" onclick="submitReview()">إرسال للاعتماد</button></div></form><hr style="border:0;border-top:1px solid #e5efed;margin:20px 0"><div class="grid">${(ws.updates||[]).map(u=>`<div class="card"><h3>${esc(u.title||u.update_type)}</h3><div>${esc(u.notes||'')}</div><div class="muted">${new Date(u.created_at).toLocaleString('ar-SA')} · ${u.progress_percent??'-'}%</div></div>`).join('')||'<div class="empty">لا توجد تحديثات بعد.</div>'}</div>`}else if(tab==='evidence'){p.innerHTML=(ws.evidence||[]).length?`<div class="grid">${ws.evidence.map(e=>`<div class="card"><h3>${esc(e.platform_files?.display_name||e.platform_files?.original_name||'شاهد')}</h3><div class="muted">${esc(e.evidence_type)} · ${new Date(e.created_at).toLocaleString('ar-SA')}</div></div>`).join('')}</div>`:'<div class="empty">لا توجد شواهد مرفوعة.</div>'}else{p.innerHTML=(ws.events||[]).length?ws.events.map(e=>`<div class="card" style="margin-bottom:10px"><strong>${esc(e.event_type)}</strong><div>${esc(e.event_note||'')}</div><div class="muted">${new Date(e.created_at).toLocaleString('ar-SA')}</div></div>`).join(''):'<div class="empty">لا يوجد سجل نشاط.</div>'}}
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>setTab(x.dataset.tab));
async function startTask(){try{await CloudTaskEngine.transition(taskId,'in_progress','بدء التنفيذ من مساحة التكليف');await PlatformCore.emitRecordEvent({moduleKey:'central_tasks',recordType:'central_task',recordId:taskId,taskId,eventType:'task_status_changed',data:{status:'in_progress',progress_percent:ws.task.progress_percent||0}});toast('تم بدء التنفيذ');await load()}catch(e){toast(e.message,false)}}
async function saveUpdate(e){e.preventDefault();try{const title=document.getElementById('updTitle').value,notes=document.getElementById('updNotes').value,progress=Number(document.getElementById('updProgress').value||0),file=document.getElementById('updFile').files[0];const r=await CloudTaskEngine.addUpdate({taskId,updateType:'execution',title,notes,progressPercent:progress,status:'draft'});if(file){const fr=await CloudFileEngine.upload({file,ownershipScope:'school',moduleKey:'central_tasks',recordType:'central_task',recordId:taskId,relationType:'evidence',metadata:{taskId,updateId:r.update.id}});await CloudTaskEngine.attachEvidence({taskId,updateId:r.update.id,platformFileId:fr.file.id,evidenceType:'execution'})}await PlatformCore.emitRecordEvent({moduleKey:'central_tasks',recordType:'central_task',recordId:taskId,taskId,eventType:'record_updated',data:{progress_percent:progress,title,notes,evidence:!!file}});toast('تم حفظ التنفيذ سحابيًا');await load()}catch(e){toast(e.message,false)}}
async function submitReview(){try{await CloudTaskEngine.transition(taskId,'pending_approval','تم الإرسال للاعتماد');await PlatformCore.emitRecordEvent({moduleKey:'central_tasks',recordType:'central_task',recordId:taskId,taskId,eventType:'task_status_changed',data:{status:'pending_approval',progress_percent:ws.task.progress_percent||0}});toast('تم الإرسال للاعتماد');await load()}catch(e){toast(e.message,false)}}
async function openRecord(moduleKey,recordType,recordId){try{const r=await PlatformCore.registry(moduleKey,recordType);const url=r.recordType?.route_url;if(!url)throw new Error('لم يتم تعريف مسار هذا السجل');location.href=url+(url.includes('?')?'&':'?')+'task_id='+encodeURIComponent(taskId)+'&record_id='+encodeURIComponent(recordId)}catch(e){toast(e.message,false)}}load();
</script></body></html>
