<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أرشيف التحليلات الأسبوعية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f1f5f9;font-family:Cairo,Tahoma,Arial;color:#0f172a}
.hero{background:linear-gradient(135deg,#064e3b,#0f766e);color:white;padding:24px;border-radius:0 0 32px 32px}
.wrap{max-width:1200px;margin:20px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:white;border-radius:26px;padding:20px;border:1px solid #dbe7e2;box-shadow:0 12px 28px rgba(15,23,42,.08)}
.kpi{font-size:36px;font-weight:900;color:#0f766e}
.btn{display:inline-block;border:0;border-radius:14px;background:#0f766e;color:white;padding:10px 14px;font-weight:900;text-decoration:none;cursor:pointer}
.small{font-size:12px;color:#64748b;font-weight:700}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #e2e8f0;text-align:right}
th{background:#ecfdf5;color:#065f46}
</style><script src="school_isolation_guard.js?v=nonblock20260614"></script>
<script id="gender-neutral-labels-safe">
/* Hotfix: نظام تسميات خفيف بدون مراقبة مستمرة أو فحص شامل للصفحة.
   التسميات المحايدة تم تثبيتها داخل النصوص، وهذا السكربت يوفّر قاموسًا فقط للاستخدامات المستقبلية. */
(function(){
  window.roleLabels = window.roleLabels || {
    manager: 'المدير/المديرة',
    deputy: 'الوكيل/الوكيلة',
    teacher: 'المعلم/المعلمة',
    supervisor: 'الموجه/الموجهة',
    activityLeader: 'رائد/رائدة النشاط',
    adminEmployee: 'الموظف/الموظفة الإدارية',

  };

</script>


<!-- PREMIUM_UI_2026 -->
<link rel="stylesheet" href="premium-ui.css">
<script defer src="premium-ui.js"></script>
</head>
<body>
<div class="hero">
<h1>أرشيف التحليلات الأسبوعية</h1>
<p>أرشفة تلقائية لكل أسبوع مع إمكانية المقارنة والتصدير.</p>
<a class="btn" href="manager.html">العودة لقسم المدير/المديرة</a>
</div>

<div class="wrap" id="app"></div>

<script src="weekly_analytics_engine.js"></script>
<script>
const snapshots = WeeklyAnalyticsEngine.getWeeklySnapshots();

function compare(a,b){
  return `
    <table>
      <thead><tr><th>المؤشر</th><th>${a.week}</th><th>${b.week}</th></tr></thead>
      <tbody>
        <tr><td>SSPI</td><td>${a.sspi}%</td><td>${b.sspi}%</td></tr>
        <tr><td>النشاط</td><td>${a.activeRate}%</td><td>${b.activeRate}%</td></tr>
        <tr><td>السجلات</td><td>${a.totalReports}</td><td>${b.totalReports}</td></tr>
        <tr><td>خطط التحسين</td><td>${a.totalPlans}</td><td>${b.totalPlans}</td></tr>
      </tbody>
    </table>
  `;
}

document.getElementById('app').innerHTML = `
<div class="grid">
${snapshots.map((s,i)=>`
<div class="card">
  <div class="small">${s.week}</div>
  <h2>${s.schoolName}</h2>
  <div class="kpi">${s.sspi}%</div>
  <div class="small">التقدير: ${s.grade} — الاتجاه: ${s.trend}</div>

  <div style="margin-top:12px">
    <button class="btn" onclick="viewReport(${i})">عرض التقرير</button>
    <button class="btn" onclick="downloadReport(${i})">تصدير HTML</button>
  </div>

  ${i < snapshots.length-1 ? `
    <div style="margin-top:16px">
      <h4>مقارنة بالأسبوع السابق</h4>
      ${compare(s, snapshots[i+1])}
    </div>
  `:''}
</div>
`).join('')}
</div>
`;

window.viewReport = function(index){
  const s = snapshots[index];
  const html = WeeklyAnalyticsEngine.exportSnapshotReportHtml(s);
  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
};

window.downloadReport = function(index){
  const s = snapshots[index];
  const html = WeeklyAnalyticsEngine.exportSnapshotReportHtml(s);
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'weekly_snapshot_' + s.week + '.html';
  a.click();
};
</script>
</body>
</html>
