<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحليل الأسابيع والاتجاهات</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><style>
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:#f1f5f9;color:#0f172a;direction:rtl}
.header{background:linear-gradient(135deg,#064e3b,#0f766e);color:white;padding:22px;border-radius:0 0 28px 28px;box-shadow:0 12px 30px rgba(15,118,110,.25)}
.header h1{margin:0;font-size:24px}.header p{margin:7px 0 0;color:#d1fae5;font-weight:700}
.wrap{max-width:1180px;margin:22px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:white;border:1px solid #e2e8f0;border-radius:22px;padding:18px;box-shadow:0 10px 25px rgba(15,23,42,.06)}
.kpi{font-size:30px;font-weight:900;color:#0f766e}.label{font-weight:900;color:#64748b;font-size:12px}
.btn{display:inline-block;border:0;border-radius:14px;background:#0f766e;color:white;padding:10px 14px;font-weight:900;text-decoration:none;margin:6px 4px;cursor:pointer}
.table{width:100%;border-collapse:collapse;background:white;border-radius:18px;overflow:hidden;box-shadow:0 10px 25px rgba(15,23,42,.06)}
th,td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:right}th{background:#ecfdf5;color:#065f46;font-weight:900}
.bar{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#0f766e;border-radius:999px}
.alert{border-right:6px solid #f59e0b}.danger{border-right-color:#dc2626}.good{border-right-color:#16a34a}
</style><script src="school_isolation_guard.js?v=nonblock20260614"></script>
</head>
<body><div class="header"><h1>تحليل الأسابيع والاتجاهات</h1><p>تحليلات أسبوعية مرتبطة بالمدرسة النشطة</p><a class="btn" href="manager.html">العودة لقسم المدير/المديرة</a></div><div class="wrap" id="app"></div>
<script src="weekly_analytics_engine.js"></script><script>
const res=WeeklyAnalyticsEngine.weekly();
document.getElementById('app').innerHTML=`<table class="table"><thead><tr><th>الأسبوع</th><th>السجلات</th><th>التنبيهات</th><th>خطط التحسين</th><th>مؤشر النشاط</th></tr></thead><tbody>
${res.weeks.map(w=>{let score=Math.min(100,(w.reports*10)+(w.notifications*2)+(w.plans*8));return `<tr><td>${WeeklyAnalyticsEngine.fmtWeek(w.week)}</td><td>${w.reports}</td><td>${w.notifications}</td><td>${w.plans}</td><td><b>${score}%</b><div class="bar"><span style="width:${score}%"></span></div></td></tr>`}).join('')||'<tr><td colspan="5">لا توجد بيانات أسبوعية بعد.</td></tr>'}
</tbody></table>`;
</script>
</body></html>
