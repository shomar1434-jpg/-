*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:linear-gradient(135deg,#eef8f3,#fff8e8);min-height:100vh;color:#17263a}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#0b3d2f,#1b8a61);color:#fff;border-radius:30px;padding:24px;display:flex;gap:16px;align-items:center;box-shadow:0 16px 40px #0b3d2f30}.hero img{width:76px;background:white;border-radius:18px;padding:9px}.hero h1{margin:0;font-size:26px}.hero p{margin:5px 0 0;opacity:.9}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:13px;padding:10px 16px;font-family:inherit;font-weight:900;cursor:pointer;background:var(--green);color:#fff;text-decoration:none}.btn.light{background:#fff;color:var(--green);border:1px solid #cfe4d9}.btn.blue{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.btn.danger{background:#fff0f0;color:var(--red);border:1px solid #fecaca}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:16px;box-shadow:0 12px 30px #0b3d2f12}.title{font-size:18px;font-weight:900;color:var(--dark);margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.miniBox{background:#f8fffb;border:1px solid #d8e8df;border-radius:18px;padding:14px}.miniBox b{display:block;font-size:28px;color:var(--green)}.goal{border:1px solid #e2e8f0;border-radius:22px;padding:16px;margin-top:14px;background:#fff}.goalHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.goal h3{margin:0;color:var(--dark);font-size:17px}.meta{font-size:12px;color:var(--muted);font-weight:800;margin-top:4px}.fields{display:grid;grid-template-columns:1.4fr .6fr;gap:12px;margin-top:12px}label{display:block;font-size:12px;color:#334155;font-weight:900;margin-bottom:5px}textarea,input,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:9px;font-family:inherit;background:#fbfffd}textarea{min-height:74px}.evBox{border:1px dashed #9fc8b6;border-radius:16px;background:#fbfffd;padding:12px;margin-top:12px}.evControls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}.evList{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}.evItem{border:1px solid #e2e8f0;border-radius:13px;padding:8px;background:#fff;display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:46px}.evItem a{color:#0f6b4a;font-weight:900;text-decoration:none;word-break:break-all}.thumb{max-width:70px;max-height:50px;border-radius:8px;object-fit:cover}.badge{display:inline-block;border-radius:999px;padding:5px 12px;font-weight:900;font-size:12px}.badge.ok{background:#eafff4;color:var(--green)}.badge.warn{background:#fff7ed;color:var(--amber)}.badge.off{background:#f1f5f9;color:#64748b}.progressBar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:10px}.progressBar span{display:block;height:100%;background:linear-gradient(90deg,#0f6b4a,#22c55e)}.empty{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:20px;padding:24px;text-align:center;color:#64748b;font-weight:900}@media(max-width:800px){.grid,.fields,.evControls{grid-template-columns:1fr}.hero{flex-direction:column;text-align:center}}@media print{.toolbar,.evControls,.danger{display:none!important}.wrap{padding:0}.card,.goal,.hero{box-shadow:none;break-inside:avoid}}

<body>
<div class="wrap">
<header class="hero"><img src="https://salogos.b-cdn.net/logos/svg/1774895141785-5zgexuf8.svg" alt="وزارة التعليم"><div><h1>تنفيذ خطة الأداء للموظف/ة الإداري/ة</h1><p>متابعة الأهداف المعتمدة ورفع شواهد التنفيذ التي يعتمد عليها المسؤول في التقييم وخطة التحسين</p></div></header>
<div class="toolbar"><button class="btn light" onclick="history.back()">رجوع</button><button class="btn" onclick="saveExecution(true)">حفظ التنفيذ</button><button class="btn blue" onclick="window.print()">طباعة / حفظ PDF</button></div>
<section class="card"><div class="title">بيانات الخطة المعتمدة</div><div class="grid"><div class="miniBox"><span>الموظف/ة</span><b id="mName">-</b></div><div class="miniBox"><span>المسمى</span><b id="mJob">-</b></div><div class="miniBox"><span>حالة الخطة</span><b id="mStatus">-</b></div><div class="miniBox"><span>نسبة التنفيذ</span><b id="mProgress">0%</b></div></div></section>
<section class="card"><div class="title">الأهداف المعتمدة وشواهد التنفيذ</div><div id="goalsBox"></div></section>
</div>
<script>
const qs=new URLSearchParams(location.search);const empId=qs.get('emp')||qs.get('id')||localStorage.getItem('currentUserEmail')||'';const ownerUid=qs.get('owner_uid')||'';const supervisor=qs.get('supervisor')||'';const schoolScope=qs.get('school')||currentSchoolScope();
function currentSchoolScope(){try{const keys=['active_school_id','activeSchoolId','selected_school_id','school_id'];for(const k of keys){const v=localStorage.getItem(k);if(v)return v;}const s=JSON.parse(localStorage.getItem('active_school')||localStorage.getItem('activeSchool')||'null');return s&&(s.id||s.schoolId||s.code||s.name)||''}catch(e){return ''}}
function parse(k,d){try{return JSON.parse(localStorage.getItem(k)||'')}catch(e){return d}}
function allPlans(){return parse('administrative_employee_plans',[])||[]}
function savePlans(arr){localStorage.setItem('administrative_employee_plans',JSON.stringify(arr));try{localStorage.setItem('administrative_employee_metrics_touch',new Date().toISOString())}catch(e){}}
function findPlan(){let arr=allPlans();return arr.find(p=>String(p.id)===String(empId))||arr.find(p=>String(p.contact)===String(empId))||null}
function execKey(){return 'administrative_employee_execution_'+(empId||'guest')}
function loadExec(){let ex=parse(execKey(),null);if(!ex)ex={employeeId:empId,goals:[],updatedAt:new Date().toISOString(),progress:0,evidenceCount:0,schoolId:schoolScope,supervisor:supervisor};return ex}
function statusText(s){return s==='approved'?'معتمدة':s==='pending'?'بانتظار الاعتماد':s==='returned'?'معادة للتعديل':'مسودة'}
function syncExecution(plan,ex){let old=ex.goals||[];let goals=(plan.goals||[]);ex.goals=goals.map((g,i)=>{let prev=old.find(x=>String(x.goal)===String(g.goal))||old[i]||{};return {goal:g.goal||('هدف '+(i+1)),kpi:g.kpi||'',target:g.target||'',weight:g.weight||'',description:prev.description||'',progress:prev.progress||0,evidence:prev.evidence||[],updatedAt:prev.updatedAt||''};});return ex}
function render(){let plan=findPlan();if(!plan){goalsBox.innerHTML='<div class="empty">لم يتم العثور على خطة أداء مرتبطة بهذا الموظف. افتح الصفحة من بطاقة الموظف أو سجّل الدخول بحساب الموظف.</div>';return;}mName.textContent=plan.name||'موظف إداري';mJob.textContent=plan.jobTitle||'-';mStatus.textContent=statusText(plan.status);let ex=syncExecution(plan,loadExec());let approved=plan.status==='approved';if(!approved){goalsBox.innerHTML='<div class="empty">لا يمكن بدء تنفيذ الأهداف قبل اعتماد خطة الأداء من المسؤول المباشر.</div>';mProgress.textContent='0%';return;}goalsBox.innerHTML=ex.goals.map((g,i)=>goalHtml(g,i)).join('')||'<div class="empty">لا توجد أهداف معتمدة في الخطة.</div>';ex.goals.forEach((g,i)=>renderEvidence(i,g.evidence||[]));updateSummary();}
function goalHtml(g,i){return `<div class="goal" data-i="${i}"><div class="goalHead"><div><h3>${i+1}. ${esc(g.goal)}</h3><div class="meta">المؤشر: ${esc(g.kpi||'-')} — المستهدف: ${esc(g.target||'-')} — الوزن: ${esc(g.weight||'-')}%</div></div><span class="badge ${Number(g.progress)>=100?'ok':Number(g.progress)>0?'warn':'off'}" id="badge-${i}">${Number(g.progress)||0}%</span></div><div class="progressBar"><span id="bar-${i}" style="width:${Number(g.progress)||0}%"></span></div><div class="fields"><div><label>وصف التنفيذ</label><textarea id="desc-${i}" oninput="captureGoal(${i})">${esc(g.description||'')}</textarea></div><div><label>نسبة الإنجاز</label><select id="prog-${i}" onchange="captureGoal(${i})"><option>0</option><option>25</option><option>50</option><option>75</option><option>100</option></select></div></div><div class="evBox"><label>شواهد تنفيذ الهدف</label><div class="evControls"><input type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" multiple onchange="addFileEvidence(${i},this)"><input type="url" id="url-${i}" placeholder="رابط شاهد"><input type="text" id="urlTitle-${i}" placeholder="وصف الرابط"><button class="btn light" onclick="addLinkEvidence(${i})">إضافة رابط</button></div><div class="evList" id="ev-${i}"></div></div></div>`}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function currentExecution(){let plan=findPlan();let ex=syncExecution(plan,loadExec());document.querySelectorAll('.goal').forEach(node=>{let i=Number(node.dataset.i);if(ex.goals[i]){ex.goals[i].description=document.getElementById('desc-'+i)?.value||'';ex.goals[i].progress=Number(document.getElementById('prog-'+i)?.value||0);ex.goals[i].updatedAt=new Date().toISOString();}});ex.progress=ex.goals.length?Math.round(ex.goals.reduce((s,g)=>s+(Number(g.progress)||0),0)/ex.goals.length):0;ex.evidenceCount=ex.goals.reduce((s,g)=>s+((g.evidence||[]).length),0);ex.updatedAt=new Date().toISOString();ex.name=plan.name;ex.jobTitle=plan.jobTitle;ex.supervisor=plan.supervisor||supervisor;ex.schoolId=plan.schoolId||schoolScope;return ex;}
function captureGoal(i){let p=document.getElementById('prog-'+i);let val=Number(p?.value||0);let b=document.getElementById('badge-'+i),bar=document.getElementById('bar-'+i);if(b){b.textContent=val+'%';b.className='badge '+(val>=100?'ok':val>0?'warn':'off')}if(bar)bar.style.width=val+'%';saveExecution(false);}
async function saveExecution(show){
 const ex=currentExecution(),ek=execKey(),beforeEx=localStorage.getItem(ek),beforePlans=localStorage.getItem('administrative_employee_plans');let arr=allPlans(),idx=arr.findIndex(p=>String(p.id)===String(empId));if(idx>-1){arr[idx].executionProgress=ex.progress;arr[idx].executionEvidence=ex.evidenceCount;arr[idx].executionUpdatedAt=ex.updatedAt;}
 try{if(!window.PlatformRecordSaveEngine||PlatformRecordSaveEngine.isSystemAdminContext())throw new Error('محرك الحفظ السحابي غير متاح');await PlatformRecordSaveEngine.save({moduleKey:'admin_employee_records',recordType:'admin_execution',recordId:String(ex.employeeId||empId),academicYear:ex.year||localStorage.getItem('school_info_academic_year')||'1448',semester:ex.semester||'سنوي',scope:'user',folderId:'admin_execution',title:'تنفيذ خطة الأداء',data:ex});localStorage.setItem(ek,JSON.stringify(ex));if(idx>-1)savePlans(arr);try{localStorage.setItem('administrative_employee_execution_touch',new Date().toISOString())}catch(_){ }updateSummary();try{if(show)window.SchoolActivity?.emit(ex.progress>=100?'record_completed':'record_updated','حفظ تنفيذ خطة الأداء',{progress:ex.progress,evidence_count:ex.evidenceCount,employee_id:ex.employeeId});}catch(_){ }if(show)alert('تم حفظ تنفيذ خطة الأداء وشواهد الأهداف والتحقق سحابيًا.');return true;}catch(e){if(beforeEx===null)localStorage.removeItem(ek);else localStorage.setItem(ek,beforeEx);if(beforePlans===null)localStorage.removeItem('administrative_employee_plans');else localStorage.setItem('administrative_employee_plans',beforePlans);console.error('[admin_execution cloud save]',e);if(show)alert('تعذر تأكيد الحفظ السحابي؛ لم يتم اعتماد التغيير.');return false;}
}
function updateSummary(){let ex=currentExecution();mProgress.textContent=ex.progress+'%';}
function addFileEvidence(i,input){let files=Array.from((input&&input.files)||[]);if(!files.length)return;let ex=currentExecution();ex.goals[i].evidence=ex.goals[i].evidence||[];let pending=files.length;files.forEach(function(f){let r=new FileReader();r.onload=function(){let kind=(f.type&&f.type.startsWith('image/'))?'image':(f.type==='application/pdf'||/\.pdf$/i.test(f.name))?'pdf':(/\.(doc|docx)$/i.test(f.name))?'word':(/\.(xls|xlsx)$/i.test(f.name))?'excel':'file';ex.goals[i].evidence.push({type:kind,name:f.name,data:r.result,mime:f.type||'',at:new Date().toISOString()});pending--;if(pending===0){localStorage.setItem(execKey(),JSON.stringify(ex));renderEvidence(i,ex.goals[i].evidence);saveExecution(false);input.value='';}};r.readAsDataURL(f);});}
function addLinkEvidence(i){let u=document.getElementById('url-'+i),t=document.getElementById('urlTitle-'+i);let url=(u.value||'').trim();if(!url)return;let ex=currentExecution();ex.goals[i].evidence=ex.goals[i].evidence||[];ex.goals[i].evidence.push({type:'link',name:(t.value||'رابط شاهد'),url:url,at:new Date().toISOString()});localStorage.setItem(execKey(),JSON.stringify(ex));renderEvidence(i,ex.goals[i].evidence);saveExecution(false);u.value='';t.value='';}
function removeEvidence(i,j){let ex=currentExecution();if(ex.goals[i]&&ex.goals[i].evidence){ex.goals[i].evidence.splice(j,1);localStorage.setItem(execKey(),JSON.stringify(ex));renderEvidence(i,ex.goals[i].evidence);saveExecution(false);}}
function evidenceIcon(e){if(e.type==='image')return '<img class="thumb" src="'+e.data+'">';if(e.type==='link')return '🔗';if(e.type==='pdf')return '📕';if(e.type==='word')return '📘';if(e.type==='excel')return '📗';return '📄'}
function renderEvidence(i,ev){let box=document.getElementById('ev-'+i);if(!box)return;box.innerHTML=(ev||[]).map((e,j)=>`<div class="evItem"><div>${evidenceIcon(e)} ${e.type==='link'?'<a target="_blank" href="'+esc(e.url)+'">'+esc(e.name)+'</a>':'<a target="_blank" href="'+esc(e.data||'#')+'">'+esc(e.name)+'</a>'}</div><button class="btn danger" onclick="removeEvidence(${i},${j})">حذف</button></div>`).join('')||'<div class="meta">لا توجد شواهد مرفوعة لهذا الهدف بعد.</div>';let ex=loadExec();let g=ex.goals&&ex.goals[i];if(g){let p=document.getElementById('prog-'+i);if(p)p.value=String(g.progress||0);}}
async function hydrateApprovedPlanAndExecution(){
  try{
    if(!window.PlatformStateEngine)return false;
    const keys=['administrative_employee_plans',execKey()];
    const r=ownerUid&&PlatformStateEngine.pullUser?await PlatformStateEngine.pullUser('admin_performance',ownerUid,keys):await PlatformStateEngine.pull('admin_performance','user',keys);
    (r.items||[]).forEach(function(it){if(it.deleted_at)return;var v=it.payload&&Object.prototype.hasOwnProperty.call(it.payload,'value')?it.payload.value:null;if(v!==null&&v!==undefined)localStorage.setItem(String(it.state_key),String(v));});
    return true;
  }catch(e){console.warn('تعذر تحميل الخطة المعتمدة قبل التنفيذ',e);return false;}
}
async function bootExecution(){await hydrateApprovedPlanAndExecution();render();}
bootExecution();
window.addEventListener('platform-persistence-ready',function(){render()});
</script>
