    &lt;!-- القائمة الجانبية (شريط التنقل) --&gt;
    &lt;aside class=&quot;w-full md:w-64 bg-slate-900 text-white flex flex-col no-print shrink-0&quot;&gt;
        &lt;!-- ترويسة شريط التنقل مع الشعار المرفق بوزارة التعليم --&gt;
        &lt;div class=&quot;p-5 border-b border-slate-800 bg-slate-950 flex items-center gap-3&quot;&gt;
            &lt;div class=&quot;p-1.5 bg-white rounded-lg shadow-sm&quot;&gt;
                &lt;img src=&quot;https://salogos.b-cdn.net/logos/svg/1774895141785-5zgexuf8.svg&quot; alt=&quot;وزارة التعليم&quot; class=&quot;w-8 h-8 object-contain&quot;&gt;
            &lt;/div&gt;
            &lt;div&gt;
                &lt;h1 class=&quot;font-bold text-sm text-emerald-400&quot;&gt;نظام إدارة المدارس&lt;/h1&gt;
                &lt;p class=&quot;text-xs text-slate-400&quot;&gt;إصدار 1447 هـ - تفاعلي&lt;/p&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- لوحة التحكم الرئيسية: نموذج إعدادات سريع مرتبط بكامل سجلات المدرسة --&gt;
        &lt;details open class=&quot;mx-3 mt-4 bg-slate-800/70 rounded-xl border border-emerald-700/40 overflow-hidden&quot;&gt;
            &lt;summary class=&quot;cursor-pointer select-none px-4 py-3 bg-emerald-700/20 text-emerald-200 font-bold text-sm flex items-center gap-2&quot;&gt;
                &lt;i data-lucide=&quot;settings&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                &lt;span&gt;لوحة التحكم الرئيسية&lt;/span&gt;
            &lt;/summary&gt;
            &lt;div class=&quot;p-3 space-y-2 text-xs&quot;&gt;
                &lt;input v-model=&quot;schoolInfo.directorate&quot; class=&quot;w-full rounded-lg border border-slate-700 bg-slate-950/70 px-3 py-2 text-slate-100 placeholder:text-slate-500&quot; placeholder=&quot;إدارة التعليم&quot;&gt;
                &lt;input v-model=&quot;schoolInfo.name&quot; class=&quot;w-full rounded-lg border border-slate-700 bg-slate-950/70 px-3 py-2 text-slate-100 placeholder:text-slate-500&quot; placeholder=&quot;اسم المدرسة&quot;&gt;
                &lt;input v-model=&quot;schoolInfo.director&quot; class=&quot;w-full rounded-lg border border-slate-700 bg-slate-950/70 px-3 py-2 text-slate-100 placeholder:text-slate-500&quot; placeholder=&quot;مدير/مديرة المدرسة&quot;&gt;
                &lt;div class=&quot;grid grid-cols-2 gap-2&quot;&gt;
                    &lt;select v-model=&quot;schoolInfo.dayName&quot; @change=&quot;updateHijriDate&quot; class=&quot;rounded-lg border border-slate-700 bg-slate-950/70 px-2 py-2 text-slate-100&quot;&gt;
                        &lt;option v-for=&quot;day in weekDays&quot; :key=&quot;day&quot; :value=&quot;day&quot;&gt;{{ day }}&lt;/option&gt;
                    &lt;/select&gt;
                    &lt;select v-model=&quot;schoolInfo.hijriMonth&quot; @change=&quot;updateHijriDate&quot; class=&quot;rounded-lg border border-slate-700 bg-slate-950/70 px-2 py-2 text-slate-100&quot;&gt;
                        &lt;option v-for=&quot;month in hijriMonthOptions&quot; :key=&quot;month.value&quot; :value=&quot;month.value&quot;&gt;{{ month.label }}&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/div&gt;
                &lt;div class=&quot;grid grid-cols-2 gap-2&quot;&gt;
                    &lt;select v-model=&quot;schoolInfo.hijriDay&quot; @change=&quot;updateHijriDate&quot; class=&quot;rounded-lg border border-slate-700 bg-slate-950/70 px-2 py-2 text-slate-100&quot;&gt;
                        &lt;option v-for=&quot;day in getHijriDays()&quot; :key=&quot;day&quot; :value=&quot;day&quot;&gt;{{ day }}&lt;/option&gt;
                    &lt;/select&gt;
                    &lt;select v-model=&quot;schoolInfo.hijriYear&quot; @change=&quot;updateHijriDate&quot; class=&quot;rounded-lg border border-slate-700 bg-slate-950/70 px-2 py-2 text-slate-100&quot;&gt;
                        &lt;option v-for=&quot;year in hijriYearOptions&quot; :key=&quot;year&quot; :value=&quot;year&quot;&gt;{{ year }}&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/div&gt;
                &lt;div class=&quot;grid grid-cols-1 gap-2&quot;&gt;
                    &lt;select v-model=&quot;schoolInfo.semester&quot; class=&quot;rounded-lg border border-slate-700 bg-slate-950/70 px-2 py-2 text-slate-100&quot;&gt;
                        &lt;option&gt;الفصل الدراسي الأول&lt;/option&gt;
                        &lt;option&gt;الفصل الدراسي الثاني&lt;/option&gt;
                        &lt;option&gt;الفصل الدراسي الثالث&lt;/option&gt;
                    &lt;/select&gt;
                &lt;/div&gt;
                &lt;label class=&quot;block text-slate-300&quot;&gt;رفع الختم
                    &lt;input type=&quot;file&quot; accept=&quot;image/png,image/jpeg&quot; @change=&quot;uploadStamp&quot; class=&quot;mt-1 block w-full text-[10px] text-slate-400 file:ml-2 file:rounded file:border-0 file:bg-emerald-600 file:px-2 file:py-1 file:text-white&quot;&gt;
                &lt;/label&gt;
                &lt;label class=&quot;block text-slate-300&quot;&gt;رفع التوقيع
                    &lt;input type=&quot;file&quot; accept=&quot;image/png,image/jpeg&quot; @change=&quot;uploadSignature&quot; class=&quot;mt-1 block w-full text-[10px] text-slate-400 file:ml-2 file:rounded file:border-0 file:bg-sky-600 file:px-2 file:py-1 file:text-white&quot;&gt;
                &lt;/label&gt;
                &lt;div class=&quot;flex gap-2 pt-1&quot;&gt;
                    &lt;button @click=&quot;saveToLocalStorage&quot; class=&quot;flex-1 rounded-lg bg-emerald-600 px-2 py-2 font-bold text-white hover:bg-emerald-500&quot;&gt;حفظ الإعدادات&lt;/button&gt;
                    &lt;button @click=&quot;setDefaultStamp&quot; class=&quot;flex-1 rounded-lg bg-slate-700 px-2 py-2 font-bold text-slate-100 hover:bg-slate-600&quot;&gt;ختم افتراضي&lt;/button&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/details&gt;

        &lt;!-- معلومات المدرسة السريعة في الهامش الجانبي للوصول السريع --&gt;
        &lt;div class=&quot;p-4 mx-3 mt-4 bg-slate-800/50 rounded-lg border border-slate-700/50&quot;&gt;
            &lt;div class=&quot;text-xs text-slate-400 mb-1&quot;&gt;المدرسة الحالية:&lt;/div&gt;
            &lt;div class=&quot;font-semibold text-emerald-300 text-sm mb-1&quot;&gt;{{ schoolInfo.name }}&lt;/div&gt;
            &lt;div class=&quot;text-xs text-slate-400&quot;&gt;القيادة المدرسية: &lt;span class=&quot;text-slate-200 font-medium&quot;&gt;{{ schoolInfo.director }}&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- روابط التنقل المحدثة بالترتيب الجديد وزر واقع المدرسة الفعلي المضاف حديثاً --&gt;
        &lt;nav class=&quot;flex-1 px-3 py-4 space-y-1 overflow-y-auto&quot;&gt;
            &lt;button @click=&quot;currentTab = &#x27;schoolBaseData&#x27;&quot; :class=&quot;[&#x27;w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors&#x27;, currentTab === &#x27;schoolBaseData&#x27; ? &#x27;bg-emerald-600 text-white&#x27; : &#x27;hover:bg-slate-800 text-slate-300 hover:text-white&#x27;]&quot;&gt;
                &lt;i data-lucide=&quot;info&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                &lt;span&gt;البيانات الأساسية للمدرسة&lt;/span&gt;
            &lt;/button&gt;
            &lt;!-- القسم الجديد: واقع المدرسة الفعلي المستخرج من مستند مؤشرات الإدارة المدرسية --&gt;
            &lt;button @click=&quot;currentTab = &#x27;actualReality&#x27;&quot; :class=&quot;[&#x27;w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors&#x27;, currentTab === &#x27;actualReality&#x27; ? &#x27;bg-emerald-600 text-white&#x27; : &#x27;hover:bg-slate-800 text-slate-300 hover:text-white&#x27;]&quot;&gt;
                &lt;i data-lucide=&quot;file-text&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                &lt;span class=&quot;font-semibold text-emerald-300&quot;&gt;واقع المدرسة الفعلي&lt;/span&gt;
            &lt;/button&gt;
            &lt;!-- تعديل الرابط بإزالة مسمى 10 أهداف كطلبك --&gt;
            &lt;button @click=&quot;currentTab = &#x27;operationalPlan&#x27;&quot; :class=&quot;[&#x27;w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors&#x27;, currentTab === &#x27;operationalPlan&#x27; ? &#x27;bg-emerald-600 text-white&#x27; : &#x27;hover:bg-slate-800 text-slate-300 hover:text-white&#x27;]&quot;&gt;
                &lt;i data-lucide=&quot;trending-up&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                &lt;span&gt;الخطة التشغيلية&lt;/span&gt;
            &lt;/button&gt;
            &lt;button @click=&quot;currentTab = &#x27;formations&#x27;&quot; :class=&quot;[&#x27;w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors&#x27;, currentTab === &#x27;formations&#x27; ? &#x27;bg-emerald-600 text-white&#x27; : &#x27;hover:bg-slate-800 text-slate-300 hover:text-white&#x27;]&quot;&gt;
                &lt;i data-lucide=&quot;users&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                &lt;span&gt;تشكيل المجالس واللجان والفرق&lt;/span&gt;
            &lt;/button&gt;
            &lt;button @click=&quot;currentTab = &#x27;meetings&#x27;&quot; :class=&quot;[&#x27;w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors&#x27;, currentTab === &#x27;meetings&#x27; ? &#x27;bg-emerald-600 text-white&#x27; : &#x27;hover:bg-slate-800 text-slate-300 hover:text-white&#x27;]&quot;&gt;
                &lt;i data-lucide=&quot;clipboard-list&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                &lt;span&gt;سجل اجتماعات المجالس واللجان والفرق&lt;/span&gt;
            &lt;/button&gt;
            &lt;button @click=&quot;currentTab = &#x27;indicatorsPortal&#x27;&quot; :class=&quot;[&#x27;w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors&#x27;, currentTab === &#x27;indicatorsPortal&#x27; ? &#x27;bg-emerald-600 text-white&#x27; : &#x27;hover:bg-slate-800 text-slate-300 hover:text-white&#x27;]&quot;&gt;
                &lt;i data-lucide=&quot;award&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                &lt;span class=&quot;text-emerald-300 font-bold&quot;&gt;بوابة التميز والمؤشرات&lt;/span&gt;
            &lt;/button&gt;
            &lt;button @click=&quot;currentTab = &#x27;backup&#x27;&quot; :class=&quot;[&#x27;w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors&#x27;, currentTab === &#x27;backup&#x27; ? &#x27;bg-emerald-600 text-white&#x27; : &#x27;hover:bg-slate-800 text-slate-300 hover:text-white&#x27;]&quot;&gt;
                &lt;i data-lucide=&quot;database&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                &lt;span&gt;تصدير واستيراد البيانات&lt;/span&gt;
            &lt;/button&gt;
            &lt;!-- زر تفريغ وتطهير البيانات القابلة للتعبئة المطور في الهامش الجانبي --&gt;
            &lt;button @click=&quot;showClearConfirmModal = true&quot; class=&quot;w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors hover:bg-rose-950/40 text-rose-400 hover:text-rose-200 mt-4 border-t border-slate-800/80 pt-4&quot;&gt;
                &lt;i data-lucide=&quot;trash-2&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                &lt;span class=&quot;font-bold&quot;&gt;تهيئة وتفريغ السجلات&lt;/span&gt;
            &lt;/button&gt;
        &lt;/nav&gt;

        &lt;!-- تذييل الهامش الجانبي --&gt;
        &lt;div class=&quot;p-4 border-t border-slate-800 text-xs text-slate-500 text-center&quot;&gt;
            تطوير ذكي ومستند إلى&lt;br&gt;الدليل التنظيمي 1446-1447 هـ
        &lt;/div&gt;
    &lt;/aside&gt;

    &lt;main class=&quot;flex-1 flex flex-col min-h-screen overflow-x-hidden&quot;&gt;
        
        &lt;!-- الترويسة العلوية للشاشات الكبيرة --&gt;
        &lt;header class=&quot;bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 no-print shrink-0&quot;&gt;
            &lt;div class=&quot;flex items-center gap-4&quot;&gt;
                &lt;div class=&quot;text-sm font-medium text-slate-500&quot;&gt;العام الدراسي: &lt;span class=&quot;text-slate-800 font-bold&quot;&gt;{{ schoolInfo.hijriYear }} هـ - {{ schoolInfo.semester }}&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
            
            &lt;div class=&quot;flex items-center gap-3&quot;&gt;
                &lt;button @click=&quot;showAddCommitteeModal = true&quot; class=&quot;bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5&quot;&gt;
                    &lt;i data-lucide=&quot;plus-circle&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                    &lt;span&gt;إضافة مجلس / لجنة / فريق&lt;/span&gt;
                &lt;/button&gt;
                &lt;button @click=&quot;saveWorkingDataOnly&quot; class=&quot;bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5&quot;&gt;
                    &lt;i data-lucide=&quot;save&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                    &lt;span&gt;حفظ التغييرات الحالية&lt;/span&gt;
                &lt;/button&gt;
            &lt;/div&gt;
        &lt;/header&gt;

        &lt;!-- محتوى التبويبات النشطة --&gt;
        &lt;div class=&quot;flex-1 p-6 max-w-7xl w-full mx-auto space-y-6&quot;&gt;

            &lt;!-- ================= التبويب: البيانات الأساسية للمدرسة (سجل واقع المدرسة وسوات المعتمد) ================= --&gt;
            &lt;div v-if=&quot;currentTab === &#x27;schoolBaseData&#x27;&quot; data-self-eval-print-root=&quot;schoolBaseData&quot; class=&quot;space-y-6&quot;&gt;
                &lt;div class=&quot;no-print flex justify-end&quot;&gt;&lt;button @click=&quot;saveSchoolBaseDataToArchive&quot; class=&quot;bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold&quot;&gt;💾 حفظ بيانات المدرسة في أرشيف التقويم الذاتي&lt;/button&gt;&lt;/div&gt;
                &lt;div class=&quot;flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-b border-slate-200 pb-4 no-print&quot;&gt;
                    &lt;div&gt;
                        &lt;h2 class=&quot;font-bold text-lg text-slate-800&quot;&gt;البيانات الأساسية للمدرسة&lt;/h2&gt;
                        &lt;p class=&quot;text-xs text-slate-500 mt-1&quot;&gt;تعبئة وإدارة معلومات المؤسسة التعليمية وتقرير الواقع ومستويات الأداء العام للجنسين.&lt;/p&gt;
                    &lt;/div&gt;
                    &lt;button @click=&quot;printIndicatorsPortal&quot; class=&quot;bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5 shrink-0&quot;&gt;
                        &lt;i data-lucide=&quot;printer&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;
                        &lt;span&gt;طباعة الاستمارة الرسمية&lt;/span&gt;
                    &lt;/button&gt;
                &lt;/div&gt;

                &lt;div class=&quot;bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-6 print-card&quot;&gt;
                    
                    &lt;!-- الترويسة الرسمية المحدثة بالتنسيق والمسافات المطلوبة والشعار المكبر --&gt;
                    &lt;div class=&quot;official-header grid grid-cols-3 items-center border-b-2 border-slate-900 pb-5 mb-6 gap-6&quot;&gt;
                        &lt;div class=&quot;text-center text-xs space-y-1.5&quot;&gt;
                            &lt;div&gt;المملكة العربية السعودية&lt;/div&gt;
                            &lt;div&gt;وزارة التعليم&lt;/div&gt;
                            &lt;div&gt;{{ schoolInfo.directorate }}&lt;/div&gt;
                            &lt;div class=&quot;font-bold text-slate-900 text-sm&quot;&gt;{{ schoolInfo.name }}&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;flex flex-col items-center justify-center space-y-2&quot;&gt;
                            &lt;img src=&quot;https://salogos.b-cdn.net/logos/svg/1774895141785-5zgexuf8.svg&quot; alt=&quot;وزارة التعليم&quot; class=&quot;h-20 w-auto object-contain&quot;&gt;
                            &lt;div class=&quot;text-[10px] text-slate-500 font-bold font-serif&quot;&gt;بطاقة المعلومات المدرسية الأساسية&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;text-right text-xs space-y-1.5 leading-relaxed&quot;&gt;
                            &lt;div&gt;الرقم الوزاري: &lt;span class=&quot;font-mono font-semibold&quot;&gt;{{ schoolInfo.ministerialNumber }}&lt;/span&gt;&lt;/div&gt;
                            &lt;div&gt;تاريخ التحديث: 1447هـ&lt;/div&gt;
                            &lt;div&gt;النظام المدرسي: {{ schoolInfo.system }}&lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;

                    &lt;!-- شبكة بيانات المدرسة الأساسية (مطابقة لصورة image_3a16be.png بلونها الأخضر وتوزيع خلاياها) --&gt;
                    &lt;div class=&quot;border border-slate-300 rounded-lg overflow-hidden&quot;&gt;
                        &lt;div class=&quot;bg-emerald-600 text-white font-bold p-3 text-center text-sm&quot;&gt;بيانات المدرسة&lt;/div&gt;
                        &lt;div class=&quot;grid grid-cols-5 text-center text-xs&quot;&gt;
                            &lt;!-- صف العناوين الأول --&gt;
                            &lt;div class=&quot;bg-slate-700 text-white p-2 border border-slate-300 font-bold&quot;&gt;اسم المدرسة&lt;/div&gt;
                            &lt;div class=&quot;bg-slate-700 text-white p-2 border border-slate-300 font-bold&quot;&gt;الوحدة (المرحلة)&lt;/div&gt;
                            &lt;div class=&quot;bg-slate-700 text-white p-2 border border-slate-300 font-bold&quot;&gt;نظام المدرسة&lt;/div&gt;
                            &lt;div class=&quot;bg-slate-700 text-white p-2 border border-slate-300 font-bold&quot;&gt;الرقم الوزاري&lt;/div&gt;
                            &lt;div class=&quot;bg-slate-700 text-white p-2 border border-slate-300 font-bold&quot;&gt; وقت الدراسة&lt;/div&gt;
                            
                            &lt;!-- صف المدخلات الأول --&gt;
                            &lt;div class=&quot;p-2 border border-slate-300&quot;&gt;&lt;input type=&quot;text&quot; v-model=&quot;schoolInfo.name&quot; class=&quot;w-full text-center font-bold bg-transparent focus:bg-slate-50 border-none focus:outline-none&quot;&gt;&lt;/div&gt;
                            &lt;div class=&quot;p-2 border border-slate-300&quot;&gt;&lt;input type=&quot;text&quot; v-model=&quot;schoolInfo.level&quot; class=&quot;w-full text-center bg-transparent focus:bg-slate-50 border-none focus:outline-none&quot;&gt;&lt;/div&gt;
                            &lt;div class=&quot;p-2 border border-slate-300&quot;&gt;&lt;input type=&quot;text&quot; v-model=&quot;schoolInfo.system&quot; class=&quot;w-full text-center bg-transparent focus:bg-slate-50 border-none focus:outline-none&quot;&gt;&lt;/div&gt;
                            &lt;div class=&quot;p-2 border border-slate-300&quot;&gt;&lt;input type=&quot;text&quot; v-model=&quot;schoolInfo.ministerialNumber&quot; class=&quot;w-full text-center font-mono bg-transparent focus:bg-slate-50 border-none focus:outline-none&quot;&gt;&lt;/div&gt;
                            &lt;div class=&quot;p-2 border border-slate-300&quot;&gt;
                                &lt;select v-model=&quot;schoolInfo.studyTime&quot; class=&quot;w-full text-center bg-transparent focus:bg-slate-50 border-none focus:outline-none&quot;&gt;
                                    &lt;option value=&quot;صباحي&quot;&gt;صباحي&lt;/option&gt;
                                    &lt;option value=&quot;مسائي&quot;&gt;مسائي&lt;/option&gt;
                                    &lt;option value=&quot;تعليم مستمر&quot;&gt;تعليم مستمر&lt;/option&gt;
                                &lt;/select&gt;
                            &lt;/div&gt;

                            &lt;!-- صف العناوين الثاني --&gt;
                            &lt;div class=&quot;bg-slate-700 text-white p-2 border border-slate-300 font-bold&quot;&gt;عدد الطلاب/الطالبات&lt;/div&gt;
                            &lt;div class=&quot;bg-slate-700 text-white p-2 border border-slate-300 font-bold&quot;&gt;عدد الفصول&lt;/div&gt;
                            &lt;div class=&quot;bg-slate-700 text-white p-2 border border-slate-300 font-bold&quot;&gt;جنس المدرسة&lt;/div&gt;
                            &lt;div class=&quot;bg-slate-700 text-white p-2 border border-slate-300 font-bold&quot;&gt;نوع المبنى&lt;/div&gt;

                        &lt;div class=&quot;overflow-x-auto&quot;&gt;

                        &lt;button @click=&quot;printOperationalPlan&quot; class=&quot;bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5 shrink-0&quot;&gt;

                                &lt;/div&gt;
                                &lt;div&gt;

                                &lt;/div&gt;
                                &lt;div&gt;

                                &lt;/div&gt;
                            &lt;/div&gt;

                                        &lt;/thead&gt;
                                        &lt;tbody&gt;

.planLiveTitle input{max-width:95px;text-align:center;font-weight:900;color:#087743;border:1px solid #b9ddce;background:#fff}

.planLiveField{border:1.5px solid #2d2d2d;border-radius:10px;padding:9px;background:#fff;min-height:62px}
.planLiveField.wide{grid-column:1/-1}
.planLiveField label{display:block;color:#073f93;font-weight:900;margin-bottom:5px}

.planLiveField textarea{min-height:38px;resize:vertical}
.planEvidenceBox{border:1.5px dashed #087743;border-radius:10px;background:#fbfffd;padding:9px;margin-top:8px}
.planEvidenceControls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px;margin-bottom:8px}
.planEvidenceList{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px}

.planLiveProgress{height:9px;background:#e8eef7;border-radius:999px;overflow:hidden;margin-top:9px}
.planLiveProgress span{display:block;height:100%;background:linear-gradient(90deg,#087743,#13b8a6)}
.planCardActions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}

 body.print-plan .planLiveProgress{height:6px!important}
