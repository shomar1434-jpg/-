<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إعداد Supabase</title>
<style>body{font-family:Arial,Tahoma,sans-serif;background:#f8fafc;padding:30px}.card{max-width:760px;margin:auto;background:white;border-radius:22px;padding:24px;box-shadow:0 15px 35px #0001}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:8px 0;direction:ltr}button{padding:12px 18px;border:0;border-radius:12px;background:#0f766e;color:white;font-weight:bold;cursor:pointer}</style>
</head>
<body><div class="card">
<h2>إعداد اتصال Supabase</h2>
<p>تم ضبط رابط المشروع على:</p>
<input id="url" value="https://cijhgvbtrvmmlcssgxht.supabase.co">
<p>الصق anon public key من Project Settings > API إذا كان المفتاح القديم لا يخص هذا المشروع.</p>
<input id="key" placeholder="anon public key">
<button onclick="save()">حفظ الإعداد</button>
<script>
function save(){
 localStorage.setItem('smartSchoolSupabaseUrl', document.getElementById('url').value.trim());
 const k=document.getElementById('key').value.trim();
 if(k) localStorage.setItem('smartSchoolSupabaseAnonKey', k);
 alert('تم حفظ إعداد Supabase. عد للمنصة وجرب إنشاء المدرسة.');
}
</script></div></body></html>
