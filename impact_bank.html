<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>بنك قياس الأثر</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;900&display=swap" rel="stylesheet"><style>
:root{--primary:#0f766e;--dark:#0f172a;--muted:#64748b;--line:#e2e8f0;--red:#dc2626;--gold:#b45309}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Arabic',Arial,sans-serif;background:linear-gradient(135deg,#eefaf7,#f8fafc 50%,#fff);color:var(--dark)}.top{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.top-inner{max-width:1220px;margin:auto;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;gap:14px;align-items:center}.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#0f766e,#0ea5e9);display:grid;place-items:center;color:#fff;font-size:28px}h1{margin:0;font-size:30px}.sub{margin:4px 0;color:var(--muted);font-weight:700}.btn{border:0;border-radius:14px;padding:10px 14px;background:var(--primary);color:#fff;font-family:inherit;font-weight:900;cursor:pointer}.btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--line)}.btn.red{background:#fff;color:var(--red);border:1px solid #fecaca}.wrap{max-width:1220px;margin:24px auto;padding:0 22px 60px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center}.kpi span{color:var(--muted);font-size:12px;font-weight:900}.kpi b{display:block;color:var(--primary);font-size:28px;margin-top:5px}.filters{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:9px;margin-bottom:18px}input,select{border:1px solid #cbd5e1;border-radius:12px;padding:11px;font-family:inherit;font-weight:800;background:#fff}.records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.rec{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px}.rec h3{margin:0 0 8px}.meta,.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{background:#eefaf7;color:var(--primary);border:1px solid #ccebe4;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.pill.gray{background:#f1f5f9;color:#475569;border-color:#e2e8f0}.pill.gold{background:#fffbeb;color:#92400e;border-color:#fde68a}.metrics{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.metric{display:grid;grid-template-columns:1.3fr .7fr .7fr .7fr;gap:8px;font-size:13px;font-weight:800;border-bottom:1px dashed #e5e7eb;padding:6px 0}.analysis{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:10px;font-size:13px}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:26px;padding:38px;text-align:center;color:var(--muted);font-weight:900}.section-title{margin:24px 0 12px;color:var(--primary);font-size:22px}.toast{position:fixed;bottom:24px;left:24px;background:#063b36;color:#fff;border-radius:16px;padding:12px 16px;font-weight:900;display:none;z-index:50}@media(max-width:900px){.kpis,.records,.filters{grid-template-columns:1fr}.top-inner{flex-direction:column;align-items:flex-start}}@media print{.no-print{display:none!important}.top{position:static}.records{grid-template-columns:1fr}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-bridge.js"></script><script src="school_isolation_guard.js?v=nonblock20260614"></script><link rel="stylesheet" href="premium-ui.css"><script defer src="premium-ui.js"></script><script src="platform-state-engine.js"></script>

<link rel="stylesheet" href="responsive-layout.css?v=20260818-responsive-1">
</head><body>
<header class="top"><div class="top-inner"><div class="brand"><div class="logo">📊</div><div><h1>بنك قياس الأثر المؤسسي</h1><p class="sub">مصدر مركزي سحابي لنتائج البرامج والاستبانات والتحليلات المعتمدة في المدرسة</p></div></div><div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" onclick="history.back()">العودة</button><button class="btn" onclick="location.href='impact_assessment.html?role=manager'">نموذج جديد</button><button class="btn secondary" onclick="location.href='external_evaluation_archive.html#impact'">التقويم الخارجي</button></div></div></header>
<main class="wrap"><section class="kpis"><div class="kpi"><span>إجمالي قياسات الأثر</span><b id="total">0</b></div><div class="kpi"><span>متوسط التحسن</span><b id="avg">0%</b></div><div class="kpi"><span>متوسط الاستبانات</span><b id="surveyAvg">0%</b></div><div class="kpi"><span>إجمالي الردود</span><b id="responses">0</b></div><div class="kpi"><span>الأقسام المشاركة</span><b id="roles">0</b></div></section>
<section class="filters no-print"><input id="search" placeholder="بحث باسم البرنامج أو المبادرة"><select id="roleFilter"><option value="all">جميع الأقسام</option></select><select id="statusFilter"><option value="all">جميع الحالات</option><option value="active">نشط</option><option value="approved">معتمد</option><option value="archived">مؤرشف</option></select><select id="impactFilter"><option value="all">جميع مستويات الأثر</option><option>مرتفع جداً</option><option>مرتفع</option><option>متوسط</option><option>منخفض</option></select><select id="periodFilter"><option value="all">كل الفترات</option><option value="30">آخر 30 يوماً</option><option value="90">آخر 90 يوماً</option><option value="365">آخر سنة</option></select><button class="btn secondary" id="exportBtn">تصدير JSON</button></section><div id="content"></div></main><div id="toast" class="toast"></div>
<script>
const roleNames={manager:'المدير/المديرة',agent:'الوكيل/الوكيلة',teacher:'المعلم/المعلمة',student_advisor:'الموجه/الموجهة الطلابية',activity_leader:'رائد/رائدة النشاط',admin_employee:'الموظف/الموظفة الإدارية',health_advisor:'الموجه/الموجهة الصحية',kindergarten_teacher:'معلمة رياض الأطفال'};let records=[],surveys=[],responses=[],snapshots=[];
function sb(){return window.SmartSchoolSupabase?.getClient?.()||null}function sid(){const q=new URLSearchParams(location.search);return q.get('schoolId')||q.get('school_id')||localStorage.getItem('active_school_id')||localStorage.getItem('current_school_id')||localStorage.getItem('school_id')||localStorage.getItem('smart_school_id')||''}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
async function loadCloud(){const c=sb(),school=sid();if(!c||!school)throw new Error('تعذر تحديد المدرسة');const [a,s,r,n]=await Promise.all([c.from('impact_assessments').select('*').eq('school_id',school).order('created_at',{ascending:false}),c.from('impact_surveys').select('*').eq('school_id',school).order('created_at',{ascending:false}),c.from('impact_survey_responses').select('*').eq('school_id',school).order('created_at',{ascending:false}),c.from('impact_analysis_snapshots').select('*').eq('school_id',school).order('created_at',{ascending:false})]);for(const x of[a,s,r,n])if(x.error)throw x.error;records=a.data||[];surveys=s.data||[];responses=r.data||[];snapshots=n.data||[];render()}
function surveyStats(program){const ss=surveys.filter(x=>x.program_name===program&&x.status!=='archived');const ids=new Set(ss.map(x=>x.id));const rr=responses.filter(x=>ids.has(x.survey_id));let vals=[],pos=0,c=0;rr.forEach(r=>(r.answers||[]).forEach(a=>{if(typeof a.value==='number'&&a.value>0){vals.push(a.value);c++;if(a.value>=4)pos++}}));return{count:ss.length,responses:rr.length,avg:vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*20):0,positive:c?Math.round(pos/c*100):0}}
function filterData(){const q=document.getElementById('search').value.trim(),role=document.getElementById('roleFilter').value,status=document.getElementById('statusFilter').value,impact=document.getElementById('impactFilter').value,days=document.getElementById('periodFilter').value;const cutoff=days==='all'?0:Date.now()-Number(days)*86400000;return records.filter(r=>(role==='all'||r.role===role)&&(status==='all'||(r.status||'active')===status)&&(impact==='all'||r.impact_level===impact)&&(!q||String(r.program_name||'').includes(q)||String(roleNames[r.role]||'').includes(q))&&(!cutoff||new Date(r.created_at).getTime()>=cutoff))}
function render(){const all=records.filter(r=>(r.status||'active')!=='deleted');const data=filterData().filter(r=>(r.status||'active')!=='deleted');document.getElementById('total').textContent=all.length;document.getElementById('avg').textContent=Math.round(all.reduce((s,r)=>s+(Number(r.avg_improvement)||0),0)/(all.length||1))+'%';const allStats=all.map(r=>surveyStats(r.program_name)).filter(x=>x.avg);document.getElementById('surveyAvg').textContent=(allStats.length?Math.round(allStats.reduce((a,b)=>a+b.avg,0)/allStats.length):0)+'%';document.getElementById('responses').textContent=allStats.reduce((a,b)=>a+b.responses,0);document.getElementById('roles').textContent=new Set(all.map(r=>r.role).filter(Boolean)).size;if(!data.length){document.getElementById('content').innerHTML='<div class="empty">لا توجد نتائج مطابقة للفلاتر الحالية.</div>';return}const grouped={};data.forEach(r=>(grouped[roleNames[r.role]||r.role||'غير محدد']??=[]).push(r));document.getElementById('content').innerHTML=Object.entries(grouped).map(([role,items])=>`<h2 class="section-title">${esc(role)}</h2><div class="records">${items.map(card).join('')}</div>`).join('')}
function card(r){
 const st=surveyStats(r.program_name),snap=snapshots.find(x=>x.program_name===r.program_name),a=r.analysis||{},an=a.analytical_result||{};
 const planning=a.planning_evaluation||[],follow=a.field_followup||[],impact=a.impact_assessment||[];
 return `<article class="rec"><h3>${esc(r.program_name||'بدون عنوان')}</h3>
 <div class="meta"><span class="pill">${esc(r.program_type||'برنامج')}</span><span class="pill">الأثر: ${esc(r.impact_level||'—')}</span>
 <span class="pill">تحقق الأثر: ${Number(r.avg_improvement)||0}%</span><span class="pill gold">التحليل العام: ${Number(an.overall_score)||0}%</span>
 <span class="pill gray">التخطيط: ${Number(an.planning_score)||0}%</span><span class="pill gray">المتابعة: ${Number(an.follow_score)||0}%</span>
 <span class="pill gray">الحالة: ${esc(r.status||'active')}</span></div>
 <p class="sub">تاريخ التنفيذ: ${esc(a.execution_date||'—')} | تاريخ القياس: ${esc(r.measure_date||'—')} | الفئة: ${esc(r.target_group||'—')} | الحضور: ${Number(a.attendance_count)||0}</p>
 <div class="metrics"><b>نتائج الاستمارة</b>
 ${(impact.length?impact:(r.metrics||[]).map(m=>({item:m.name,percent:m.after,evidence:''}))).map(m=>`<div class="metric"><span>${esc(m.item||m.name)}</span><span>${Number(m.percent??m.after)||0}%</span><span>${esc(m.evidence||'—')}</span></div>`).join('')}
 </div>
 <div class="analysis"><b>التحليل المبني على الاستمارة</b>
 <div><b>نقاط القوة:</b> ${esc((an.strengths||[]).slice(0,4).join(' | ')||r.findings||'—')}</div>
 <div><b>الفجوات والتحديات:</b> ${esc((an.gaps||[]).slice(0,4).join(' | ')||r.conclusion||'—')}</div>
 <div><b>التوصيات:</b> ${esc((an.recommendations||[]).slice(0,4).join(' | ')||r.recommendations||'—')}</div></div>
 <div class="actions no-print"><button class="btn secondary" onclick="location.href='impact_assessment.html?assessment=${encodeURIComponent(r.id)}'">فتح / تطوير النموذج</button>
 <button class="btn secondary" onclick="location.href='impact_assessment.html?role=${encodeURIComponent(r.role||'manager')}'">قياس برنامج جديد</button>
 ${(r.status||'active')!=='approved'?`<button class="btn secondary" onclick="setStatus('${r.id}','approved')">اعتماد</button>`:''}
 ${(r.status||'active')!=='archived'?`<button class="btn secondary" onclick="setStatus('${r.id}','archived')">أرشفة</button>`:''}
 <button class="btn red" onclick="removeRecord('${r.id}')">حذف</button></div></article>`
}
async function setStatus(id,status){const c=sb(),school=sid();const q=await c.from('impact_assessments').update({status,archived_at:status==='archived'?new Date().toISOString():null}).eq('id',id).eq('school_id',school);if(q.error)return toast(q.error.message);await loadCloud();toast('تم تحديث الحالة')}
async function removeRecord(id){const r=records.find(x=>x.id===id);if(!r)return;const hasResponses=surveyStats(r.program_name).responses>0;if(hasResponses){if(!confirm('هذا القياس مرتبط بردود. سيتم أرشفته بدلاً من حذفه حفاظاً على السجل التاريخي.'))return;return setStatus(id,'archived')}if(!confirm('حذف قياس الأثر نهائياً؟'))return;const c=sb(),school=sid();const q=await c.from('impact_assessments').delete().eq('id',id).eq('school_id',school);if(q.error)return toast(q.error.message);await loadCloud();toast('تم الحذف')}
function exportData(){const blob=new Blob([JSON.stringify({assessments:records,surveys,responses,analysisSnapshots:snapshots},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='impact-bank-cloud.json';a.click();URL.revokeObjectURL(a.href)}
async function init(){const sel=document.getElementById('roleFilter');sel.innerHTML='<option value="all">جميع الأقسام</option>'+Object.entries(roleNames).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');['search','roleFilter','statusFilter','impactFilter','periodFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));document.getElementById('exportBtn').onclick=exportData;try{await loadCloud()}catch(e){console.error(e);document.getElementById('content').innerHTML='<div class="empty">تعذر تحميل بنك قياس الأثر السحابي. تحقق من تنفيذ ملف SQL الجديد واتصال المدرسة.</div>'}}init();
</script>
