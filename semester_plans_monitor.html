<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة الخطط الفصلية</title><script>document.documentElement.classList.add('boot')</script><style>.boot body{visibility:hidden}</style><script src="platform-cloud-session.js"></script><script src="platform-core-engine.js"></script><script src="cloud-file-engine.js"></script><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Cairo;background:#f8fafc}.card{background:white;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 8px 25px #0f172a0d}.chip{padding:.25rem .6rem;border-radius:999px;font-size:11px;font-weight:800}</style></head><body><header class="bg-gradient-to-l from-slate-900 to-teal-800 text-white sticky top-0 z-40"><div class="max-w-7xl mx-auto p-5 flex justify-between items-center gap-3"><div><h1 class="text-2xl font-black">متابعة الخطط الفصلية</h1><p class="text-xs text-white/70">اعتماد خطط الأسابيع ومراجعة شواهد التنفيذ لجميع الأقسام</p></div><button onclick="location.href='manager.html'" class="bg-white/10 border border-white/20 px-4 py-2 rounded-xl text-xs font-bold">↩ العودة للأقسام الرئيسية</button></div></header><main class="max-w-7xl mx-auto p-5 space-y-5"><section class="card p-4 flex flex-wrap gap-3 items-end"><div><label class="text-xs font-bold">الخطة</label><select id="plan" class="block border rounded-xl p-2 text-sm"><option value="">جميع الخطط</option><option>النشاط الطلابي</option><option>التوجيه الطلابي</option><option>التوجيه الصحي</option><option>رياض الأطفال</option></select></div><div><label class="text-xs font-bold">الفصل</label><select id="semester" class="block border rounded-xl p-2 text-sm"><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option></select></div><div><label class="text-xs font-bold">العام</label><select id="year" class="block border rounded-xl p-2 text-sm"></select></div><button onclick="load()" class="bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-bold">تحديث</button><div id="stats" class="mr-auto text-xs font-bold text-slate-500"></div></section><div id="msg" class="hidden p-3 rounded-xl text-xs font-bold"></div><section id="rows" class="space-y-3"></section></main><script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t,ok=true){msg.className='p-3 rounded-xl text-xs font-bold '+(ok?'bg-emerald-50 text-emerald-800':'bg-rose-50 text-rose-800');msg.textContent=t;msg.classList.remove('hidden');setTimeout(()=>msg.classList.add('hidden'),3500)}
async function init(){for(let y=1448;y<=1548;y++)year.add(new Option(y+' هـ',y+' هـ'));document.documentElement.classList.remove('boot');await load()}
function status(r){if(r.plan_status==='pending_manager')return 'بانتظار اعتماد الخطة';if(r.plan_status==='approved'&&r.execution_status==='pending_manager')return 'بانتظار اعتماد التنفيذ';if(r.execution_status==='approved')return 'مكتمل ومعتمد';if(r.plan_status==='returned')return 'معاد للتعديل';if(r.plan_status==='approved')return 'معتمد للتنفيذ';return 'مسودة'}
async function load(){try{const x=await PlatformCore.request('semester-plan-list',{academicYear:year.value,semester:semester.value,planType:plan.value||null});const a=x.rows||[];stats.textContent=`إجمالي السجلات: ${a.length} — بانتظار اعتماد الخطة: ${a.filter(r=>r.plan_status==='pending_manager').length} — شواهد بانتظار المراجعة: ${a.filter(r=>r.execution_status==='pending_manager').length}`;rows.innerHTML=a.length?a.map(r=>`<article class="card p-4 grid lg:grid-cols-[1.2fr_2fr_auto] gap-4 items-center"><div><div class="flex gap-2 flex-wrap"><span class="chip bg-teal-50 text-teal-800">${esc(r.plan_type)}</span><span class="chip bg-slate-100">${esc(r.title)}</span><span class="chip bg-amber-50">${status(r)}</span></div><p class="text-xs text-slate-500 mt-2">${esc(r.dates||'')} · ${esc(r.academic_year)} · ${esc(r.semester)}</p></div><div><ul class="text-xs text-slate-700">${(r.programs||[]).map(p=>`<li>• ${esc(p)}</li>`).join('')}</ul>${r.manager_note?`<p class="text-xs mt-2 text-rose-700"><b>الملاحظة السابقة:</b> ${esc(r.manager_note)}</p>`:''}</div><div class="flex flex-wrap gap-2 justify-end">${r.plan_status==='pending_manager'?`<button onclick="decision('${r.id}','approve')" class="bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold">اعتماد الخطة</button><button onclick="decision('${r.id}','return')" class="bg-rose-600 text-white px-3 py-2 rounded-xl text-xs font-bold">إعادة للتعديل</button>`:''}${r.evidence_file_id?`<button onclick="openEvidence('${r.evidence_file_id}')" class="bg-sky-700 text-white px-3 py-2 rounded-xl text-xs font-bold">فتح الشاهد</button>`:''}${r.execution_status==='pending_manager'?`<button onclick="execDecision('${r.id}','approve')" class="bg-teal-800 text-white px-3 py-2 rounded-xl text-xs font-bold">اعتماد التنفيذ</button><button onclick="execDecision('${r.id}','return')" class="bg-amber-600 text-white px-3 py-2 rounded-xl text-xs font-bold">إعادة الشاهد</button>`:''}</div></article>`).join(''):'<div class="card p-10 text-center text-slate-400 font-bold">لا توجد خطط مرسلة في هذا النطاق بعد.</div>'}catch(e){toast(e.message,false)}}
async function decision(id,d){const note=d==='return'?(prompt('اكتب ملاحظة الإعادة للمستخدم:')||'يرجى مراجعة الخطة وإعادة إرسالها'):(prompt('ملاحظة اعتماد اختيارية:')||'');try{await PlatformCore.request('semester-plan-manager-decision',{id,decision:d,note});toast(d==='approve'?'تم اعتماد خطة الأسبوع':'تمت إعادة الأسبوع للتعديل');await load()}catch(e){toast(e.message,false)}}
async function execDecision(id,d){const note=d==='return'?(prompt('سبب إعادة الشاهد:')||'يرجى رفع شاهد تنفيذ أوضح'):(prompt('ملاحظة اعتماد التنفيذ اختيارية:')||'');try{await PlatformCore.request('semester-plan-execution-decision',{id,decision:d,note});toast(d==='approve'?'تم اعتماد التنفيذ نهائيًا':'تمت إعادة الشاهد للمستخدم');await load()}catch(e){toast(e.message,false)}}async function openEvidence(id){try{await CloudFileEngine.open(id)}catch(e){toast(e.message,false)}}document.addEventListener('DOMContentLoaded',init);</script></body></html>
