<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eefaf8"/>
    <stop offset=".55" stop-color="#f7fbff"/>
    <stop offset="1" stop-color="#fff8ee"/>
  </linearGradient>
  <linearGradient id="hill1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d7f4e9"/>
    <stop offset="1" stop-color="#cdeeed"/>
  </linearGradient>
  <linearGradient id="hill2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fbe9c8"/>
    <stop offset="1" stop-color="#f7dfe6"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#31586a" flood-opacity=".12"/>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<!-- soft sky decorations -->
<circle cx="1380" cy="130" r="70" fill="#ffd978" opacity=".78"/>
