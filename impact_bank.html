<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>بنك قياس الأثر المؤسسي</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-bridge.js"></script>
<script src="school_isolation_guard.js?v=nonblock20260614"></script>
<script src="platform-cloud-session.js?v=20260905-impact-bank"></script>
<link rel="stylesheet" href="premium-ui.css"><script defer src="premium-ui.js"></script>
<style>
:root{--teal:#0f7d73;--teal2:#08635d;--cyan:#159fc2;--ink:#172033;--muted:#667085;--line:#d7e2e6;--soft:#eff9f7;--gold:#b7791f;--red:#d92d20}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Arabic',Arial,sans-serif;background:linear-gradient(180deg,#fff,#f4fbfa 55%,#eef8f6);color:var(--ink)}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.top-inner{max-width:1240px;margin:auto;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;gap:14px;align-items:center}.logo{width:58px;height:58px;border-radius:17px;background:linear-gradient(145deg,var(--teal),var(--cyan));display:grid;place-items:center;color:#fff;font-size:28px}.brand h1{margin:0;font-size:30px;font-weight:900}.sub{margin:4px 0 0;color:var(--muted);font-size:12px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:10px 15px;font-family:inherit;font-weight:900;cursor:pointer;background:var(--teal);color:#fff}.btn.secondary{background:#fff;color:var(--teal);border:1px solid var(--line)}.wrap{max-width:1240px;margin:auto;padding:24px 22px 60px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}.kpi span{font-size:11px;color:var(--muted);font-weight:800}.kpi b{display:block;color:var(--teal);font-size:26px;margin-top:4px}.section-title{font-size:22px;margin:24px 0 12px;color:var(--teal);font-weight:900}.portfolios{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.portfolio{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;transition:.18s;box-shadow:0 10px 24px rgba(15,23,42,.04)}.portfolio:hover,.portfolio.active{transform:translateY(-2px);border-color:#7dcfc7;box-shadow:0 14px 30px rgba(15,125,115,.10)}.portfolio .icon{font-size:25px}.portfolio h3{margin:8px 0 5px}.portfolio .count{font-size:25px;color:var(--teal);font-weight:900}.portfolio .mini{font-size:11px;color:var(--muted);font-weight:700}.filters{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:8px}.filters input,.filters select{width:100%;border:1px solid #cbd7df;border-radius:11px;padding:10px;font-family:inherit;font-weight:700}.records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.rec{background:#fff;border:1px solid var(--line);border-radius:21px;padding:17px}.rec h3{margin:0 0 6px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;background:#eefaf7;color:var(--teal);border:1px solid #ccebe4;font-size:11px;font-weight:900}.pill.gray{background:#f3f5f7;color:#475569;border-color:#e2e8f0}.pill.gold{background:#fffbeb;color:#92400e;border-color:#fde68a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.stat{background:#f8fbfc;border:1px solid #e3eaed;border-radius:12px;padding:8px;text-align:center}.stat span{display:block;color:var(--muted);font-size:10px;font-weight:800}.stat b{font-size:18px;color:var(--teal)}.bar{height:8px;background:#e6ecef;border-radius:999px;overflow:hidden;margin-top:5px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan))}.empty{background:#fff;border:1px dashed #bdcbd0;border-radius:22px;padding:35px;text-align:center;color:var(--muted);font-weight:900}.toast{position:fixed;bottom:22px;left:22px;background:#073b36;color:#fff;padding:12px 16px;border-radius:14px;display:none;z-index:50}.legacy-note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:10px 12px;font-size:11px;font-weight:800;margin-bottom:12px}@media(max-width:980px){.portfolios{grid-template-columns:repeat(2,1fr)}.kpis,.filters,.records{grid-template-columns:1fr}}@media(max-width:600px){.portfolios{grid-template-columns:1fr}.top-inner{align-items:flex-start;flex-direction:column}}@media print{.no-print{display:none!important}.top{position:static}.records{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><div class="brand"><div class="logo">📊</div><div><h1>بنك قياس الأثر المؤسسي</h1><p class="sub">بنك موحد بمحافظ متعددة حسب نوع القياس، مع متابعة الأقسام والمستخدمين والنتائج المؤسسية</p></div></div><div class="actions no-print"><button class="btn secondary" onclick="history.back()">العودة</button><button class="btn" onclick="location.href='impact_assessment.html?source_section=manager'">نموذج جديد</button><button class="btn secondary" onclick="location.href='external_evaluation_archive.html#impact'">التقويم الخارجي</button></div></div></header>
<main class="wrap">
<section class="kpis"><div class="kpi"><span>إجمالي الاستبانات</span><b id="totalSurveys">0</b></div><div class="kpi"><span>إجمالي الردود</span><b id="totalResponses">0</b></div><div class="kpi"><span>متوسط القياس</span><b id="avgScore">0%</b></div><div class="kpi"><span>الأقسام المشاركة</span><b id="sectionCount">0</b></div><div class="kpi"><span>المستخدمون المشاركون</span><b id="creatorCount">0</b></div></section>
<h2 class="section-title">محافظ بنك قياس الأثر</h2><section id="portfolios" class="portfolios"></section>
<section class="filters no-print"><input id="search" placeholder="بحث باسم البرنامج أو الاستبانة"><select id="portfolioFilter"></select><select id="sectionFilter"><option value="all">جميع الأقسام</option></select><select id="creatorFilter"><option value="all">جميع المستخدمين</option></select><select id="statusFilter"><option value="all">جميع الحالات</option><option value="active">نشطة</option><option value="closed">مغلقة</option><option value="archived">مؤرشفة</option><option value="draft">مسودة</option></select><button class="btn secondary" id="refreshBtn">تحديث</button></section>
<h2 class="section-title" id="listTitle">جميع الاستبانات</h2><div id="legacyNote"></div><section id="content" class="records"></section>
</main><div id="toast" class="toast"></div>
<script>
const portfolioMeta={satisfaction:{label:'رضا المستفيدين',icon:'😊'},impact:{label:'قياس أثر البرامج',icon:'📈'},training:{label:'التدريب والورش',icon:'🎓'},prepost:{label:'القياس القبلي/البعدي',icon:'↔️'},parents:{label:'أولياء الأمور',icon:'👨‍👩‍👧'},students:{label:'الطلاب / الطالبات',icon:'🧑‍🎓'},teachers:{label:'المعلمون / المعلمات',icon:'👩‍🏫'},custom:{label:'استبانات مخصصة',icon:'🧩'},legacy:{label:'سجلات سابقة',icon:'🗃️'},no_survey:{label:'قياسات بدون استبانة',icon:'📝'}};
const roleNames={manager:'المدير/المديرة',agent:'الوكيل/الوكيلة',teacher:'المعلم/المعلمة',student_advisor:'الموجه/الموجهة الطلابية',activity_leader:'رائد/رائدة النشاط',admin_employee:'الموظف/الموظفة الإدارية',administrative_employee:'الموظف/الموظفة الإدارية',health_advisor:'الموجه/الموجهة الصحية',kindergarten_teacher:'معلمة رياض الأطفال'};
let ctx={schoolId:'',userId:'',role:''},surveys=[],responses=[],assessments=[],users=[],activePortfolio='all';
function sb(){return window.SmartSchoolSupabase?.getClient?.()||null}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
function surveyType(s){return s.survey_type||s.template||'legacy'}function creatorName(id){if(!id)return'سجل سابق بلا منشئ موثق';const u=users.find(x=>String(x.id)===String(id));return u?.full_name||'مستخدم المدرسة'}function sectionName(s){return roleNames[s.role]||s.source_section||s.role||'غير محدد'}
function statsForSurvey(s){const rr=responses.filter(r=>r.survey_id===s.id);let vals=[],pos=0,n=0;rr.forEach(r=>(r.answers||[]).forEach(a=>{if(typeof a.value==='number'&&a.value>0){vals.push(a.value);n++;if(a.value>=4)pos++}}));const avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*20):0,positive=n?Math.round(pos/n*100):0;return{responses:rr.length,avg,positive}}
function assessmentsWithoutSurvey(){const linked=new Set(surveys.map(s=>s.assessment_id).filter(Boolean));return assessments.filter(a=>!linked.has(a.id)&&(a.status||'active')!=='deleted')}
async function loadCloud(){const c=sb();if(!c||!ctx.schoolId)throw new Error('تعذر الاتصال ببيانات المدرسة');const [sq,rq,aq,uq]=await Promise.all([c.from('impact_surveys').select('*').eq('school_id',ctx.schoolId).order('created_at',{ascending:false}),c.from('impact_survey_responses').select('*').eq('school_id',ctx.schoolId).order('created_at',{ascending:false}),c.from('impact_assessments').select('*').eq('school_id',ctx.schoolId).order('created_at',{ascending:false}),c.from('users').select('id,full_name,role,school_id').eq('school_id',ctx.schoolId)]);for(const q of[sq,rq,aq,uq])if(q.error)throw q.error;surveys=sq.data||[];responses=rq.data||[];assessments=aq.data||[];users=uq.data||[];renderAll()}
function renderKpis(){const valid=surveys.filter(s=>s.status!=='deleted'),st=valid.map(statsForSurvey);document.getElementById('totalSurveys').textContent=valid.length;document.getElementById('totalResponses').textContent=st.reduce((a,b)=>a+b.responses,0);const av=st.filter(x=>x.avg);document.getElementById('avgScore').textContent=(av.length?Math.round(av.reduce((a,b)=>a+b.avg,0)/av.length):0)+'%';document.getElementById('sectionCount').textContent=new Set(valid.map(s=>s.source_section||s.role).filter(Boolean)).size;document.getElementById('creatorCount').textContent=new Set(valid.map(s=>s.creator_user_id).filter(Boolean)).size}
function portfolioStats(type){if(type==='no_survey')return{count:assessmentsWithoutSurvey().length,responses:0,avg:0};const ss=surveys.filter(s=>surveyType(s)===type);const st=ss.map(statsForSurvey);const withAvg=st.filter(x=>x.avg);return{count:ss.length,responses:st.reduce((a,b)=>a+b.responses,0),avg:withAvg.length?Math.round(withAvg.reduce((a,b)=>a+b.avg,0)/withAvg.length):0}}
function renderPortfolios(){const keys=['satisfaction','impact','training','prepost','parents','students','teachers','custom','legacy','no_survey'];document.getElementById('portfolios').innerHTML=keys.map(k=>{const m=portfolioMeta[k],st=portfolioStats(k);return `<article class="portfolio ${activePortfolio===k?'active':''}" onclick="selectPortfolio('${k}')"><div class="icon">${m.icon}</div><h3>${m.label}</h3><div class="count">${st.count}</div><div class="mini">${st.responses?st.responses+' رد — ':''}متوسط ${st.avg}%</div></article>`}).join('')}
function populateFilters(){const pf=document.getElementById('portfolioFilter');pf.innerHTML='<option value="all">جميع المحافظ</option>'+Object.entries(portfolioMeta).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');pf.value=activePortfolio;const sections=[...new Set(surveys.map(s=>s.source_section||s.role).filter(Boolean))].sort();document.getElementById('sectionFilter').innerHTML='<option value="all">جميع الأقسام</option>'+sections.map(x=>`<option value="${esc(x)}">${esc(roleNames[x]||x)}</option>`).join('');const ids=[...new Set(surveys.map(s=>s.creator_user_id).filter(Boolean))];document.getElementById('creatorFilter').innerHTML='<option value="all">جميع المستخدمين</option>'+ids.map(id=>`<option value="${esc(id)}">${esc(creatorName(id))}</option>`).join('')}
function selectPortfolio(k){activePortfolio=k;document.getElementById('portfolioFilter').value=k;renderPortfolios();renderList()}
function filteredSurveys(){const q=document.getElementById('search').value.trim(),p=document.getElementById('portfolioFilter').value,sec=document.getElementById('sectionFilter').value,cr=document.getElementById('creatorFilter').value,status=document.getElementById('statusFilter').value;if(p==='no_survey')return[];return surveys.filter(s=>(p==='all'||surveyType(s)===p)&&(sec==='all'||(s.source_section||s.role)===sec)&&(cr==='all'||String(s.creator_user_id||'')===cr)&&(status==='all'||s.status===status)&&(!q||String(s.program_name||'').includes(q)||String(s.title||'').includes(q)||creatorName(s.creator_user_id).includes(q)))}
function surveyCard(s){const st=statsForSurvey(s),type=surveyType(s),pm=portfolioMeta[type]||portfolioMeta.legacy,assessment=s.assessment_id?assessments.find(a=>a.id===s.assessment_id):null;return `<article class="rec"><h3>${esc(s.title||s.program_name||'استبانة')}</h3><div class="meta"><span class="pill">${pm.icon} ${esc(pm.label)}</span><span class="pill gray">${esc(sectionName(s))}</span><span class="pill gray">${esc(creatorName(s.creator_user_id))}</span><span class="pill gold">${esc(s.status||'active')}</span></div><p class="sub">البرنامج: ${esc(s.program_name||'—')} — الفئة: ${esc(s.audience||'—')} — تاريخ الإنشاء: ${s.created_at?new Date(s.created_at).toLocaleDateString('ar-SA'):'—'}</p><div class="stats"><div class="stat"><span>الردود</span><b>${st.responses}</b></div><div class="stat"><span>المتوسط</span><b>${st.avg}%</b></div><div class="stat"><span>الإيجابية</span><b>${st.positive}%</b></div><div class="stat"><span>القسم</span><b style="font-size:12px">${esc(roleNames[s.role]||s.source_section||'—')}</b></div></div><div class="bar"><span style="width:${st.avg}%"></span></div><div class="actions no-print" style="margin-top:12px">${assessment?`<button class="btn secondary" onclick="location.href='impact_assessment.html?assessment=${encodeURIComponent(assessment.id)}&managerView=1'">عرض نموذج قياس الأثر</button>`:''}<button class="btn secondary" onclick="openPublic('${esc(s.public_token)}')">فتح الاستبانة العامة</button></div></article>`}
function noSurveyCard(a){return `<article class="rec"><h3>${esc(a.program_name||'قياس أثر')}</h3><div class="meta"><span class="pill">📝 قياس بدون استبانة</span><span class="pill gray">${esc(roleNames[a.role]||a.source_section||'—')}</span><span class="pill gray">${esc(creatorName(a.creator_user_id))}</span></div><p class="sub">مستوى الأثر: ${esc(a.impact_level||'—')} — التحسن: ${Number(a.avg_improvement)||0}%</p><div class="actions no-print"><button class="btn secondary" onclick="location.href='impact_assessment.html?assessment=${encodeURIComponent(a.id)}&managerView=1'">عرض النموذج</button></div></article>`}
function renderList(){const p=document.getElementById('portfolioFilter').value;activePortfolio=p;renderPortfolios();document.getElementById('listTitle').textContent=p==='all'?'جميع الاستبانات':(portfolioMeta[p]?.label||'المحفظة');const legacy=surveys.filter(s=>!s.creator_user_id).length;document.getElementById('legacyNote').innerHTML=legacy?`<div class="legacy-note">يوجد ${legacy} سجل/سجلات سابقة لا تحمل هوية منشئ موثقة. تظهر للمدير كبيانات تاريخية ولا يتم إسنادها لمستخدم بالتخمين.</div>`:'';if(p==='no_survey'){const arr=assessmentsWithoutSurvey();document.getElementById('content').innerHTML=arr.length?arr.map(noSurveyCard).join(''):'<div class="empty">لا توجد قياسات بدون استبانة.</div>';return}const arr=filteredSurveys();document.getElementById('content').innerHTML=arr.length?arr.map(surveyCard).join(''):'<div class="empty">لا توجد استبانات مطابقة للفلاتر الحالية.</div>'}
function renderAll(){renderKpis();renderPortfolios();populateFilters();renderList()}
function openPublic(token){if(!token)return toast('هذا سجل سابق لا يحمل رابطًا عامًا صالحًا');const u=new URL('impact_assessment.html',location.href);u.searchParams.set('survey',token);window.open(u.toString(),'_blank','noopener')}
async function init(){try{if(!window.PlatformCloudSession)throw new Error('تعذر تحميل جلسة المنصة');await PlatformCloudSession.ensure();const verified=await PlatformCloudSession.verifyAccess(['manager']);ctx={schoolId:String(verified.schoolId||''),userId:String(verified.userId||''),role:String(verified.role||'')};if(!ctx.schoolId||ctx.role!=='manager')throw new Error('بنك قياس الأثر المؤسسي متاح لمدير المدرسة فقط');['search','portfolioFilter','sectionFilter','creatorFilter','statusFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',renderList));document.getElementById('refreshBtn').onclick=()=>loadCloud().catch(e=>toast(e.message));await loadCloud()}catch(e){console.error(e);document.getElementById('content').innerHTML='<div class="empty">'+esc(e.message||'تعذر فتح بنك قياس الأثر')+'</div>'}}
init();
</script>
<script src="school-information-source.js"></script><script src="school_navigation_guard.js" defer></script>
</body></html>
