<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحليل الأسبوعية العامة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><style>
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:#f1f5f9;color:#0f172a;direction:rtl}
.header{background:linear-gradient(135deg,#064e3b,#0f766e);color:white;padding:22px;border-radius:0 0 28px 28px;box-shadow:0 12px 30px rgba(15,118,110,.25)}
.header h1{margin:0;font-size:24px}.header p{margin:7px 0 0;color:#d1fae5;font-weight:700}
.wrap{max-width:1180px;margin:22px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:white;border:1px solid #e2e8f0;border-radius:22px;padding:18px;box-shadow:0 10px 25px rgba(15,23,42,.06)}
.kpi{font-size:30px;font-weight:900;color:#0f766e}.label{font-weight:900;color:#64748b;font-size:12px}
.btn{display:inline-block;border:0;border-radius:14px;background:#0f766e;color:white;padding:10px 14px;font-weight:900;text-decoration:none;margin:6px 4px;cursor:pointer}
.table{width:100%;border-collapse:collapse;background:white;border-radius:18px;overflow:hidden;box-shadow:0 10px 25px rgba(15,23,42,.06)}
th,td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:right}th{background:#ecfdf5;color:#065f46;font-weight:900}
.bar{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#0f766e;border-radius:999px}
.alert{border-right:6px solid #f59e0b}.danger{border-right-color:#dc2626}.good{border-right-color:#16a34a}
</style></head>
<body><div class="header"><h1>لوحة التحليل الأسبوعية العامة</h1><p>تحليلات أسبوعية مرتبطة بالمدرسة النشطة</p><a class="btn" href="manager.html">العودة لقسم المدير/المديرة</a></div><div class="wrap" id="app"></div>
<script src="weekly_analytics_engine.js"></script><script>
const s=WeeklyAnalyticsEngine.snapshot();
document.getElementById('app').innerHTML=`
<div class="grid">
 <div class="card"><div class="label">المدرسة النشطة</div><div class="kpi" style="font-size:20px">${s.school.name}</div></div>
 <div class="card"><div class="label">نسبة إنجاز الأسبوع</div><div class="kpi">${s.completion}%</div><div class="bar"><span style="width:${s.completion}%"></span></div></div>
 <div class="card"><div class="label">العاملون</div><div class="kpi">${s.totalUsers}</div></div>
 <div class="card"><div class="label">النشطون هذا الأسبوع</div><div class="kpi">${s.activeUsers}</div></div>
 <div class="card"><div class="label">السجلات</div><div class="kpi">${s.totalReports}</div></div>
 <div class="card"><div class="label">التنبيهات</div><div class="kpi">${s.totalNotifications}</div></div>
 <div class="card"><div class="label">خطط التحسين</div><div class="kpi">${s.totalPlans}</div></div>
</div>
<div class="card" style="margin-top:16px"><h2>واجهات التحليل</h2>
 <a class="btn" href="analytics_staff_performance.html">تحليل العاملين</a>
 <a class="btn" href="analytics_weekly_trends.html">تحليل الأسابيع</a>
 <a class="btn" href="analytics_execution_monitor.html">آلية التنفيذ الأسبوعية</a>
 <a class="btn" href="analytics_alerts.html">التنبيهات الذكية</a>
</div>`;
</script></body></html>
