<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المراسلات الداخلية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f8;color:#263b3a;font-family:Tajawal,Arial,sans-serif}.top{height:70px;background:#fff;border-bottom:1px solid #e5eceb;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0}.top h1{font-size:21px;color:#087f78}.back{border:1px solid #d5e6e4;background:#fff;border-radius:12px;padding:10px 15px;cursor:pointer}.app{display:grid;grid-template-columns:220px 360px 1fr;min-height:calc(100vh - 70px)}.side,.list,.reader{background:#fff;border-left:1px solid #e8eeee}.side{padding:18px}.compose{width:100%;border:0;background:#087f78;color:#fff;border-radius:14px;padding:13px;font-weight:700;cursor:pointer}.nav{margin-top:18px}.nav button{width:100%;border:0;background:none;text-align:right;padding:12px;border-radius:10px;cursor:pointer}.nav button.on{background:#eaf7f5;color:#087f78;font-weight:700}.list{overflow:auto}.search{padding:14px;border-bottom:1px solid #edf1f1}.search input{width:100%;padding:11px;border:1px solid #dce7e6;border-radius:11px}.row{padding:15px;border-bottom:1px solid #eef2f2;cursor:pointer}.row:hover,.row.unread{background:#f0faf8}.row b{display:block}.meta{font-size:12px;color:#81908f;margin-top:5px}.reader{padding:28px;overflow:auto}.empty{height:70vh;display:grid;place-items:center;color:#8b9998}.msgbody{white-space:pre-wrap;line-height:1.9}.pill{display:inline-block;padding:4px 9px;border-radius:10px;background:#eef7f6;font-size:12px}.modal{position:fixed;inset:0;background:#1c323255;display:none;align-items:center;justify-content:center;padding:20px}.card{background:#fff;width:min(680px,100%);border-radius:20px;padding:22px;max-height:90vh;overflow:auto}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d9e5e4;border-radius:10px}.people{max-height:170px;overflow:auto;border:1px solid #e1e9e8;border-radius:10px;padding:8px}.person{display:flex;gap:8px;padding:7px}.actions{display:flex;gap:9px;margin-top:15px}.primary{background:#087f78;color:#fff;border:0;border-radius:10px;padding:11px 18px;cursor:pointer}.secondary{background:#edf4f3;border:0;border-radius:10px;padding:11px 18px;cursor:pointer}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:flex;gap:8px;overflow:auto}.nav{display:flex;margin:0}.nav button{white-space:nowrap}.list{max-height:42vh}.reader{min-height:45vh}}
</style></head><body>
<header class="top"><h1>✉️ المراسلات الداخلية</h1><button class="back" onclick="history.back()">العودة للقسم</button></header>
<main class="app"><aside class="side"><button class="compose" id="compose">+ رسالة جديدة</button><div class="nav"><button class="on" data-box="inbox">الوارد <span id="unread"></span></button><button data-box="sent">المرسلة</button></div></aside><section class="list"><div class="search"><input id="q" placeholder="بحث في الرسائل"></div><div id="rows"></div></section><section class="reader" id="reader"><div class="empty">اختر رسالة لعرض محتواها</div></section></main>
<div class="modal" id="modal"><div class="card"><h2 style="color:#087f78">رسالة جديدة</h2><div class="field"><label>المستلمون</label><input id="peopleSearch" placeholder="ابحث بالاسم أو الصفة"><div class="people" id="people"></div></div><div class="field"><label>العنوان</label><input id="subject"></div><div class="field"><label>الأولوية</label><select id="priority"><option value="normal">عادية</option><option value="important">مهمة</option><option value="urgent">عاجلة</option></select></div><div class="field"><label>نص الرسالة</label><textarea id="body" rows="7"></textarea></div><div class="actions"><button class="primary" id="send">إرسال</button><button class="secondary" id="cancel">إلغاء</button></div><div id="status"></div></div></div>
<script src="platform-cloud-session.js"></script><script src="internal-messaging.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let box='inbox',messages=[],users=[];
async function load(){try{const d=await InternalMessaging.call(box);messages=d.messages||[];$('#unread').textContent=d.unread?`(${d.unread})`:'';draw()}catch(e){$('#rows').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function draw(){const q=$('#q').value.trim().toLowerCase(),a=messages.filter(m=>!q||`${m.subject} ${m.sender_name} ${m.body}`.toLowerCase().includes(q));$('#rows').innerHTML=a.length?a.map(m=>`<div class="row ${m.read_at?'':'unread'}" data-id="${esc(m.id)}"><b>${esc(m.subject)}</b><div>${box==='sent'?'إلى: '+esc((m.internal_message_recipients||[]).map(x=>x.recipient_name).join('، ')):'من: '+esc(m.sender_name)}</div><div class="meta">${new Date(m.created_at).toLocaleString('ar-SA')}</div></div>`).join(''):'<div class="empty">لا توجد رسائل</div>';document.querySelectorAll('.row').forEach(r=>r.onclick=()=>openMsg(r.dataset.id))}
async function openMsg(id){try{const d=await InternalMessaging.call('read',{messageId:id}),m=d.message;$('#reader').innerHTML=`<h2>${esc(m.subject)}</h2><p><span class="pill">${m.priority==='urgent'?'عاجلة':m.priority==='important'?'مهمة':'عادية'}</span></p><div class="meta">من: ${esc(m.sender_name)} · ${new Date(m.created_at).toLocaleString('ar-SA')}</div><hr style="border:0;border-top:1px solid #edf1f1;margin:20px 0"><div class="msgbody">${esc(m.body)}</div><div class="actions"><button class="primary" onclick="reply('${m.id}','${esc(m.thread_id||m.id)}','${esc(m.sender_user_id||'')}','${esc(m.subject)}')">رد</button></div>`;load()}catch(e){alert(e.message)}}
async function openCompose(){try{if(!users.length){const d=await InternalMessaging.call('users');users=d.users||[]}renderPeople('');$('#modal').style.display='flex'}catch(e){alert(e.message)}}
function renderPeople(q){q=q.toLowerCase();$('#people').innerHTML=users.filter(u=>!q||`${u.full_name} ${u.role} ${u.email}`.toLowerCase().includes(q)).map(u=>`<label class="person"><input type="checkbox" value="${esc(u.id)}"><span>${esc(u.full_name||u.email)} <small>— ${esc(u.role||'')}</small></span></label>`).join('')}
window.reply=async(id,thread,sender,subject)=>{await openCompose();document.querySelectorAll('#people input').forEach(x=>x.checked=x.value===sender);$('#subject').value='رد: '+subject;$('#modal').dataset.parent=id;$('#modal').dataset.thread=thread}
$('#compose').onclick=openCompose;$('#cancel').onclick=()=>$('#modal').style.display='none';$('#peopleSearch').oninput=e=>renderPeople(e.target.value);$('#q').oninput=draw;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');box=b.dataset.box;load()});
$('#send').onclick=async()=>{const ids=[...document.querySelectorAll('#people input:checked')].map(x=>x.value),subject=$('#subject').value.trim(),body=$('#body').value.trim();if(!ids.length||!subject||!body)return $('#status').textContent='اختر المستلم وأدخل العنوان ونص الرسالة.';try{$('#send').disabled=true;await InternalMessaging.call('send',{recipientIds:ids,subject,body,priority:$('#priority').value,parentMessageId:$('#modal').dataset.parent||null,threadId:$('#modal').dataset.thread||null});$('#modal').style.display='none';$('#subject').value='';$('#body').value='';delete $('#modal').dataset.parent;delete $('#modal').dataset.thread;box='sent';load()}catch(e){$('#status').textContent=e.message}finally{$('#send').disabled=false}};
load();const p=new URLSearchParams(location.search);if(p.get('compose'))openCompose();if(p.get('message'))openMsg(p.get('message'));
</script></body></html>
