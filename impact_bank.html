<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>بنك قياس الأثر</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#0f766e;--dark:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--red:#dc2626;--gold:#b45309}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Arabic',Arial,sans-serif;background:linear-gradient(135deg,#eefaf7,#f8fafc 50%,#fff);color:var(--dark)}.top{background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.top-inner{max-width:1180px;margin:auto;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;gap:14px;align-items:center}.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#0f766e,#0ea5e9);display:grid;place-items:center;color:#fff;font-size:28px;box-shadow:0 15px 30px rgba(15,118,110,.22)}h1{margin:0;font-size:30px;font-weight:900}.sub{margin:4px 0;color:var(--muted);font-weight:700}.btn{border:0;border-radius:14px;padding:11px 16px;background:var(--primary);color:#fff;font-family:inherit;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(15,118,110,.18)}.btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--line);box-shadow:0 8px 18px rgba(15,23,42,.05)}.btn.red{background:#fff;color:var(--red);border:1px solid #fecaca}.wrap{max-width:1180px;margin:24px auto;padding:0 22px 60px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center;box-shadow:0 12px 28px rgba(15,23,42,.06)}.kpi span{color:var(--muted);font-size:13px;font-weight:900}.kpi b{display:block;color:var(--primary);font-size:30px;margin-top:6px}.bar{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select{border:1px solid #cbd5e1;border-radius:13px;padding:12px;font-family:inherit;font-weight:800;outline:none;background:#fff}.records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.rec{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 14px 32px rgba(15,23,42,.06)}.rec h3{margin:0 0 8px;font-size:20px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{background:#eefaf7;color:var(--primary);border:1px solid #ccebe4;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.metrics{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.metric{display:grid;grid-template-columns:1.3fr .7fr .7fr .7fr;gap:8px;font-size:13px;font-weight:800;border-bottom:1px dashed #e5e7eb;padding:6px 0}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:26px;padding:38px;text-align:center;color:var(--muted);font-weight:900}.section-title{margin:24px 0 12px;color:var(--primary);font-size:22px}.evidence{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:850px){.kpis,.records{grid-template-columns:1fr}.top-inner{flex-direction:column;align-items:flex-start}}@media print{.no-print{display:none!important}.top{position:static}.rec,.kpi{box-shadow:none;break-inside:avoid}body{background:#fff}.records{grid-template-columns:1fr}}
</style>
<script id="gender-neutral-labels-safe">
(function(){
  if (window.__GENDER_NEUTRAL_LABELS_SAFE__) return;
  window.__GENDER_NEUTRAL_LABELS_SAFE__ = true;
  const pairs = [
    ['مدير المدرسة','المدير/المديرة'],
    ['مديرة المدرسة','المدير/المديرة'],
    ['مدير/ة المدرسة','المدير/المديرة'],
    ['قائد المدرسة','المدير/المديرة'],
    ['قائدة المدرسة','المدير/المديرة'],
    ['وكيل المدرسة','الوكيل/الوكيلة'],
    ['وكيلة المدرسة','الوكيل/الوكيلة'],
    ['معلم المادة','معلم/معلمة المادة'],
    ['معلمة المادة','معلم/معلمة المادة'],
    ['الموجه الطلابي','الموجه/الموجهة الطلابية'],
    ['الموجهة الطلابية','الموجه/الموجهة الطلابية'],
    ['رائد النشاط','رائد/رائدة النشاط'],
    ['رائدة النشاط','رائد/رائدة النشاط'],
    ['الموظف الإداري','الموظف/الموظفة الإدارية'],
    ['الموظفة الإدارية','الموظف/الموظفة الإدارية'],
    ['اسم الطالب','اسم الطالب/الطالبة'],
    ['اسم الموظف','اسم الموظف/الموظفة']
  ];
  const skipTags = new Set(['SCRIPT','STYLE','TEXTAREA','CODE','PRE','OPTION']);
  function neutralizeText(t){
    if (!t || typeof t !== 'string') return t;
    let out = t;
    for (const [from,to] of pairs){
      if (out.includes(to)) continue;
      out = out.split(from).join(to);
    }
    return out;
  }
  function walk(root){
    if (!root || skipTags.has(root.nodeName)) return;
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node){
        const p = node.parentElement;
        if (!p || skipTags.has(p.tagName)) return NodeFilter.FILTER_REJECT;
        if (p.closest && p.closest('[data-no-gender-neutralize]')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[]; let n;
    while((n=tw.nextNode())) nodes.push(n);
    for (const node of nodes){
      const v = neutralizeText(node.nodeValue);
      if (v !== node.nodeValue) node.nodeValue = v;
    }
    if (root.querySelectorAll){
      root.querySelectorAll('[placeholder],[title],[aria-label],[alt],[data-title],[data-label]').forEach(el=>{
        if (el.closest && el.closest('[data-no-gender-neutralize]')) return;
        ['placeholder','title','aria-label','alt','data-title','data-label'].forEach(a=>{
          const v = el.getAttribute(a);
          if (v){ const nv = neutralizeText(v); if (nv !== v) el.setAttribute(a,nv); }
        });
      });
    }
  }
  function run(){ try { walk(document.body || document.documentElement); } catch(e){} }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run, {once:true}); else run();
})();
</script>

</head><body>
<header class="top"><div class="top-inner"><div class="brand"><div class="logo">📊</div><div><h1>بنك قياس الأثر</h1><p class="sub">تجميع احترافي لنماذج قياس الأثر حسب الأقسام وربطها بالتقويم الخارجي والأرشيف المؤسسي</p></div></div><div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" onclick="history.back()">العودة</button><button class="btn" onclick="location.href='impact_assessment.html?role=manager'">نموذج جديد</button><button class="btn secondary" onclick="location.href='external_evaluation_archive.html#impact'">التقويم الخارجي</button></div></div></header>
<main class="wrap">
  <section class="kpis"><div class="kpi"><span>إجمالي النماذج</span><b id="total">0</b></div><div class="kpi"><span>متوسط التحسن</span><b id="avg">0%</b></div><div class="kpi"><span>أعلى أثر</span><b id="best">0%</b></div><div class="kpi"><span>الأقسام المشاركة</span><b id="roles">0</b></div></section>
  <div class="bar no-print"><input id="search" placeholder="بحث باسم البرنامج أو المبادرة" oninput="render()"><select id="roleFilter" onchange="render()"><option value="all">جميع الأقسام</option></select><button class="btn secondary" onclick="exportData()">تصدير JSON</button><button class="btn secondary" onclick="window.print()">طباعة</button><button class="btn red" onclick="clearAll()">مسح البنك</button></div>
  <div id="content"></div>
</main>
<script>
const STORAGE='schoolImpactAssessments';
const roleNames={manager:'المدير/ة',agent:'الوكيل/ة',teacher:'المعلم/ة',student_advisor:'الموجه الطلابي',activity_leader:'رائد/ة النشاط',admin_employee:'الأداء الوظيفي للإداريين'};
function load(){try{return JSON.parse(localStorage.getItem(STORAGE))||[]}catch(e){return[]}}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function init(){const sel=document.getElementById('roleFilter');sel.innerHTML='<option value="all">جميع الأقسام</option>'+Object.entries(roleNames).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');render();}
function render(){const all=load();const q=(document.getElementById('search').value||'').trim();const rf=document.getElementById('roleFilter').value;let data=all.filter(r=>(rf==='all'||r.role===rf)&&(!q||String(r.programName||'').includes(q)||String(r.roleLabel||'').includes(q)));document.getElementById('total').textContent=all.length;const avg=Math.round(all.reduce((s,r)=>s+(Number(r.avgImprovement)||0),0)/(all.length||1));document.getElementById('avg').textContent=avg+'%';document.getElementById('best').textContent=(Math.max(0,...all.map(r=>Number(r.avgImprovement)||0)))+'%';document.getElementById('roles').textContent=new Set(all.map(r=>r.role)).size;if(!data.length){document.getElementById('content').innerHTML='<div class="empty">لا توجد نماذج قياس أثر محفوظة بعد.<br><br><button class="btn" onclick="location.href=\'impact_assessment.html\'">إنشاء نموذج قياس أثر</button></div>';return;}const grouped={};data.forEach(r=>(grouped[r.roleLabel||roleNames[r.role]||'غير محدد']??=[]).push(r));document.getElementById('content').innerHTML=Object.entries(grouped).map(([role,items])=>`<h2 class="section-title">${esc(role)}</h2><div class="records">${items.map(card).join('')}</div>`).join('');}
function summarizeEvidence(evs){const names={device:'من الجهاز',section_library:'مكتبة القسم',digital_archive:'الأرشيف الرقمي',smart_archive:'الأرشيف الذكي'};const g={};(evs||[]).forEach(e=>{const k=names[e.source]||e.source||'غير محدد';g[k]=(g[k]||0)+1});return Object.entries(g).map(([k,v])=>k+': '+v).join(' | ')}
function card(r){return `<article class="rec"><h3>${esc(r.programName||'بدون عنوان')}</h3><div class="meta"><span class="pill">${esc(r.programType||'برنامج')}</span><span class="pill">${esc(r.target||'المستفيدون')}</span><span class="pill">الأثر: ${esc(r.impactLevel||'—')}</span><span class="pill">متوسط التحسن: ${Number(r.avgImprovement)||0}%</span></div><p class="sub">تاريخ القياس: ${esc(r.measureDate||'—')} | فترة التنفيذ: ${esc(r.period||'—')}</p><div class="metrics"><b>مؤشرات القياس</b>${(r.metrics||[]).map(m=>`<div class="metric"><span>${esc(m.name)}</span><span>قبل: ${esc(m.baseline)}</span><span>بعد: ${esc(m.after)}</span><span>${Number(m.improvement)||0}%</span></div>`).join('')}</div><p><b>الاستنتاج:</b> ${esc(r.conclusion||'—')}</p><p><b>التوصيات:</b> ${esc(r.recommendations||'—')}</p><div class="evidence">الشواهد: ${(r.evidence||[]).length} عنصر | المصادر: ${esc(r.evidenceSummary||summarizeEvidence(r.evidence)||'—')}</div></article>`}
function exportData(){const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='impact-bank.json';a.click();URL.revokeObjectURL(a.href)}
function clearAll(){if(confirm('هل تريد مسح جميع نماذج قياس الأثر المحفوظة محلياً؟')){localStorage.removeItem(STORAGE);render();}}
init();
</script>
</body></html>
