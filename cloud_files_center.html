<!doctype html><html lang="ar" dir="rtl"><head><style id="platform-first-paint-guard">#elsPicker{display:none!important;visibility:hidden!important}html[data-system-admin-context="1"] #activeSchoolLabel{display:none!important;visibility:hidden!important}</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز الملفات السحابية</title><style>body{margin:0;background:#f3f7f8;font-family:Cairo,Tajawal,Tahoma,sans-serif;color:#163b43}.top{background:linear-gradient(135deg,#0d4d59,#10918c);color:#fff;padding:24px}.wrap{max-width:1200px;margin:auto;padding:20px}.bar,.card{background:#fff;border:1px solid #d8e5e8;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(14,55,64,.06)}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}select,input,button{font-family:inherit;padding:10px 12px;border-radius:10px;border:1px solid #cbdcdf}button{cursor:pointer;background:#117e86;color:#fff;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.muted{color:#6a7e83;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{padding:7px 9px}.stat{font-weight:800;color:#0b6f72}.badge{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900;margin-inline-start:5px}.ref{background:#f1f5f9;color:#475569}.work{background:#eff6ff;color:#1d4ed8}.cont{background:#ecfdf5;color:#047857}.ver{background:#fff7ed;color:#c2410c}.secondary{background:#fff;color:#0f766e}</style><script defer src="school-base-settings-source.js"></script><link rel="stylesheet" href="responsive-layout.css?v=20260818-responsive-1"></head><body>
<div class="top"><div class="wrap"><h1 style="margin:0">مركز الملفات السحابية</h1><div>المعاينة والتحرير والإصدارات والسجلات المستمرة مع بقاء Supabase مصدر الملف وعزل كل مدرسة.</div></div></div>
<main class="wrap"><div class="bar"><button onclick="history.back()">← عودة</button><select id="module"><option value="">جميع الأقسام</option></select><select id="scope"><option value="">ملفاتي والمشتركة</option><option value="user">ملفاتي</option><option value="school">ملفات المدرسة المشتركة</option></select><input id="search" placeholder="بحث باسم الملف"><button id="refresh">تحديث</button><span id="status" class="muted"></span></div><div class="bar"><span id="stats" class="stat">جارٍ التحميل...</span></div><section id="files" class="grid"></section></main>
<script src="platform-cloud-session.js?v=20260905-RL33-complete-tab-role-isolation"></script><script src="cloud-file-engine.js?v=20260910-cdw-complete"></script><script src="cloud-document-workspace.js?v=20260910-cdw-complete"></script><script>
(function(){const names={manager_library:'مكتبة المدير',vice_principal_library:'مكتبة الوكيل',teacher_library:'مكتبة المعلم',student_advisor_records:'سجلات الموجه/الموجهة الطلابية',school_readiness:'جاهزية المدرسة',self_evaluation_records:'التقويم الذاتي',external_evaluation_archive:'التقويم الخارجي',meeting_minutes:'محاضر الاجتماعات',manager_records:'أرشيف المدير',administrative_employee_library:'مكتبة الموظف الإداري'};const f=document.getElementById('files'),m=document.getElementById('module'),s=document.getElementById('scope'),q=document.getElementById('search'),st=document.getElementById('status'),stats=document.getElementById('stats');let rows=[];const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sz=n=>n<1048576?Math.ceil(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';const modeLabel=r=>{const mode=CloudDocumentWorkspace.modeOf(r);return mode==='reference'?'<span class="badge ref">مرجع</span>':mode==='continuous'?'<span class="badge cont">سجل مستمر</span>':'<span class="badge work">ملف عمل</span>'};function render(){const t=q.value.trim().toLowerCase(),mod=m.value;let x=rows.filter(r=>(!mod||r.module_key===mod)&&(!t||String(r.display_name).toLowerCase().includes(t)));f.innerHTML=x.map(r=>`<article class="card"><div><strong>${esc(r.display_name)}</strong>${CloudDocumentWorkspace.isEditable(r)||CloudDocumentWorkspace.EXTENSIONS.has(CloudDocumentWorkspace.extOf(r))?modeLabel(r):''}<span class="badge ver">إصدار ${Number(r.version_number||1)}</span></div><div class="muted">${esc(names[r.module_key]||r.module_key)} · ${sz(Number(r.file_size||0))} · ${(r.created_at||'').slice(0,10)}</div><div class="actions"><button data-open="${r.id}">معاينة</button>${CloudDocumentWorkspace.isEditable(r)?`<button data-edit="${r.id}">تحرير</button>`:''}${CloudDocumentWorkspace.EXTENSIONS.has(CloudDocumentWorkspace.extOf(r))?`<button class="secondary" data-vers="${r.id}">الإصدارات</button>`:''}<button data-down="${r.id}" data-name="${esc(r.display_name)}">تنزيل</button></div></article>`).join('')||'<div class="card muted">لا توجد ملفات مطابقة.</div>'}async function load(){try{st.textContent='جارٍ التحميل...';const r=await CloudFileEngine.list({ownershipScope:s.value||undefined,limit:1000});rows=r.files||[];const mods=[...new Set(rows.map(x=>x.module_key))].sort();m.innerHTML='<option value="">جميع الأقسام</option>'+mods.map(x=>`<option value="${esc(x)}">${esc(names[x]||x)}</option>`).join('');const total=rows.reduce((a,x)=>a+Number(x.file_size||0),0);stats.textContent=`${rows.length} ملف · ${sz(total)}`;render();st.textContent='تمت المزامنة'}catch(e){st.textContent=e.message}}document.getElementById('refresh').onclick=load;m.onchange=render;s.onchange=load;q.oninput=render;f.onclick=async e=>{const o=e.target.closest('[data-open]'),ed=e.target.closest('[data-edit]'),v=e.target.closest('[data-vers]'),d=e.target.closest('[data-down]');try{if(o)await CloudFileEngine.open(o.dataset.open);if(ed)CloudDocumentWorkspace.edit(ed.dataset.edit,location.href);if(v)await CloudDocumentWorkspace.showVersions(v.dataset.vers,load);if(d)await CloudFileEngine.download(d.dataset.down,d.dataset.name)}catch(x){alert(x.message)}};load()})();
</script><script src="platform-record-catalog.js"></script><script src="delegated-access-guard.js"></script><script src="evidence-library-source.js"></script><script src="school-information-source.js"></script><script src="internal-messaging.js"></script><script src="agent-role-profiles.js"></script><script src="agent-section-adapters.js"></script><script src="agent-core-v2.js"></script><script src="openai-engine.js"></script><script src="top-ai-center.js"></script><script src="platform-page-navigation.js?v=20260818-nav1"></script></body></html>
