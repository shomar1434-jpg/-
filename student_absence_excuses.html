<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>أعذار غياب الطلاب - الطالبات</title><script src="platform-cloud-session.js"></script><script src="school-information-source.js"></script><script src="school-base-settings-source.js"></script><style>
body{font-family:Tahoma,Arial;background:#f4faf9;color:#18323b;margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.bar,.card{background:#fff;border:1px solid #dcebea;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 10px 28px #174b4b12}h1,h2{color:#15445A}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{font-size:13px;font-weight:700}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cfe0e3;border-radius:12px;font-size:16px;background:#fff}button{background:#0d9488;color:white;font-weight:800;cursor:pointer}.muted{color:#64748b;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row button{width:auto}.badge{padding:5px 9px;border-radius:999px;background:#e6fffa;font-size:12px}.item{border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin:10px 0}.modalback{position:fixed;inset:0;background:#10252f99;display:grid;place-items:center;padding:16px;z-index:100}.modalback[hidden]{display:none}.modal{background:#fff;border-radius:20px;padding:20px;width:min(850px,96vw);max-height:90vh;overflow:auto}.attachments{display:grid;gap:8px;margin:12px 0}.attachment{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid #dbe8eb;padding:10px;border-radius:12px}.attachment a{color:#0b7285;font-weight:700}.decision{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.decision button{width:100%}.secondary{background:#fff;color:#15445A}.danger{background:#b42318}.warn{background:#b7791f}@media(max-width:700px){.grid,.decision{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div class="wrap"><div class="bar"><div class="row"><button class="secondary" onclick="location.href='agent.html?sectionReturn=1'">العودة</button><div><h1>أعذار غياب الطلاب - الطالبات</h1><div class="muted">إنشاء روابط آمنة لأولياء الأمور ومراجعة الأعذار الواردة.</div></div></div></div><div class="card"><h2>إنشاء رابط عذر جديد</h2><div class="grid"><div><label>الطالب - الطالبة</label><select id="student"></select></div><div><label>تاريخ الغياب</label><input id="absenceDate" type="date"></div><div><label>عدد أيام الغياب</label><input id="days" type="number" min="1" max="60" value="1"></div><div><label>صلاحية الرابط</label><select id="expiry"><option value="7">7 أيام</option><option value="14">14 يومًا</option><option value="30">30 يومًا</option></select></div></div><p class="muted" id="studentInfo"></p><button id="create">إنشاء الرابط الآمن</button><div id="share" class="item" hidden></div></div><div class="card"><h2>الأعذار الواردة</h2><div class="row"><button onclick="loadExcuses()">تحديث</button><select id="filter" onchange="loadExcuses()"><option value="">الكل</option><option value="pending">بانتظار المراجعة</option><option value="accepted">مقبول</option><option value="returned">معاد للاستكمال</option><option value="rejected">مرفوض</option></select></div><div id="list"></div></div></div>
<div id="reviewBack" class="modalback" hidden><div class="modal"><div class="row" style="justify-content:space-between"><h2 id="reviewTitle" style="margin:0">مراجعة العذر</h2><button class="secondary" style="width:auto" onclick="closeReview()">إغلاق</button></div><div id="reviewMeta" class="item"></div><div id="reviewNote" class="item"></div><h3>المرفقات</h3><div id="reviewFiles" class="attachments"></div><p id="previewHint" class="muted">يجب فتح جميع المرفقات للمعاينة قبل اتخاذ القرار.</p><label>ملاحظة الوكيل</label><textarea id="reviewerNote" rows="3" maxlength="1000"></textarea><div class="decision" style="margin-top:12px"><button onclick="decide('accepted')">قبول العذر</button><button class="warn" onclick="decide('returned')">إعادة للاستكمال</button><button class="danger" onclick="decide('rejected')">رفض العذر</button></div></div></div>
<script>
const API='platform-absence-excuses';let students=[],currentReview=null,previewed=new Set();const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function civil(s){return String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'')}
async function token(){return await PlatformCloudSession.token()}async function call(action,body={}){let t=await token();let cfg=PlatformCloudSession.connectionConfig();let r=await fetch(`${cfg.url}/functions/v1/${API}?action=${encodeURIComponent(action)}`,{method:'POST',headers:{'content-type':'application/json','x-platform-session':t},body:JSON.stringify(body)});let j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.error||'تعذر تنفيذ العملية');return j}
function field(o,...ks){for(const k of ks)if(o&&o[k]!=null&&o[k]!=='')return o[k];return ''}function selected(){return students.find(x=>String(field(x,'id','student_id','national_id','identity'))===$('student').value)}function info(){let s=selected();$('studentInfo').textContent=s?`المرحلة: ${field(s,'stage','level')} — الصف: ${field(s,'grade')} — الفصل: ${field(s,'class_name','classroom','class')} — المسار: ${field(s,'track')||'—'}`:''}
async function init(){await PlatformCloudSession.ensure();students=await SchoolInformationSource.getStudents();$('student').innerHTML='<option value="">اختر من مركز المعلومات المدرسي</option>'+students.map(s=>`<option value="${esc(field(s,'id','student_id','national_id','identity'))}">${esc(field(s,'name','student_name','full_name'))}</option>`).join('');$('student').onchange=info;if(new URLSearchParams(location.search).get('archive')==='1')$('filter').value='accepted';await loadExcuses()}
$('create').onclick=async()=>{try{let s=selected();if(!s)throw Error('اختر الطالب');if(!$('absenceDate').value)throw Error('حدد تاريخ الغياب');let nid=civil(field(s,'national_id','identity','civil_id','id_number'));if(!nid)throw Error('لا يوجد سجل مدني محفوظ لهذا الطالب في مركز المعلومات');let payload={student:{source_id:field(s,'id','student_id'),name:field(s,'name','student_name','full_name'),stage:field(s,'stage','level'),grade:field(s,'grade'),class_name:field(s,'class_name','classroom','class'),track:field(s,'track'),civil_id:nid},absence_date:$('absenceDate').value,absence_days:Number($('days').value||1),expires_days:Number($('expiry').value)};let j=await call('create-link',payload);let url=new URL('absence_excuse_portal.html',location.href);url.searchParams.set('token',j.token);$('share').hidden=false;$('share').innerHTML=`<b>الرابط:</b><br><input value="${esc(url.href)}" readonly onclick="this.select()"><button onclick="navigator.clipboard.writeText('${url.href.replaceAll("'","%27")}')">نسخ الرابط</button>`}catch(e){alert(e.message)}};
async function loadExcuses(){try{let j=await call('list',{status:$('filter').value});$('list').innerHTML=(j.items||[]).map(x=>`<div class="item"><b>${esc(x.student_name)}</b> <span class="badge">${esc(x.status_label||x.status)}</span><div class="muted">${esc(x.stage)} / ${esc(x.grade)} / ${esc(x.class_name)} — الغياب: ${esc(x.absence_date)} — ${esc(x.absence_days)} يوم — المرجع: ${esc(x.reference_no||'')}</div><div>${esc(x.parent_note||'')}</div><div class="row"><button onclick="review('${x.id}')">مراجعة</button></div></div>`).join('')||'<p class="muted">لا توجد طلبات.</p>'}catch(e){$('list').innerHTML='<p>'+esc(e.message)+'</p>'}}
async function review(id){try{let j=await call('get',{id});currentReview=j.item;previewed=new Set();$('reviewTitle').textContent='مراجعة عذر: '+currentReview.student_name;$('reviewMeta').innerHTML=`<b>تاريخ الغياب:</b> ${esc(currentReview.absence_date)} — <b>عدد الأيام:</b> ${esc(currentReview.absence_days)}<br><b>المرحلة/الصف/الفصل:</b> ${esc(currentReview.stage)} / ${esc(currentReview.grade)} / ${esc(currentReview.class_name)}<br><b>الرقم المرجعي:</b> ${esc(currentReview.reference_no||'')}`;$('reviewNote').textContent=currentReview.parent_note?'ملاحظة ولي الأمر: '+currentReview.parent_note:'لا توجد ملاحظة من ولي الأمر.';$('reviewerNote').value=currentReview.reviewer_note||'';$('reviewFiles').innerHTML=(currentReview.attachments||[]).map((a,i)=>`<div class="attachment"><span>${esc(a.file_name)}</span><a href="${esc(a.url)}" target="_blank" rel="noopener" onclick="markPreview(${i})">فتح للمعاينة</a></div>`).join('')||'<p class="muted">لا توجد مرفقات.</p>';$('reviewBack').hidden=false;updatePreviewHint()}catch(e){alert(e.message)}}
function markPreview(i){previewed.add(i);setTimeout(updatePreviewHint,50)}function updatePreviewHint(){let n=(currentReview?.attachments||[]).length;$('previewHint').textContent=n&&previewed.size>=n?'تمت معاينة جميع المرفقات ويمكن اتخاذ القرار.':`تمت معاينة ${previewed.size} من ${n} مرفق.`}function closeReview(){$('reviewBack').hidden=true;currentReview=null;previewed.clear()}
async function decide(status){try{if(!currentReview)return;let n=(currentReview.attachments||[]).length;if(!n||previewed.size<n)throw Error('يجب فتح جميع المرفقات للمعاينة قبل اتخاذ القرار');await call('decide',{id:currentReview.id,status,note:$('reviewerNote').value,previewed:true});closeReview();await loadExcuses()}catch(e){alert(e.message)}}
init().catch(e=>alert(e.message));
</script></body></html>
