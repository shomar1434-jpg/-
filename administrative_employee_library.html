:root{--green:#0f766e;--dark:#0f172a;--muted:#64748b;--line:#dbeafe;--sky:#0284c7;--amber:#b7791f;--rose:#be123c;--ok:#15803d;--bg:#f8fafc}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#eff6ff,#f8fafc 55%,#ecfdf5);min-height:100vh;color:#0f172a}.wrap{max-width:1220px;margin:auto;padding:24px}.top{background:white;border:1px solid #e2e8f0;border-radius:28px;padding:18px 20px;box-shadow:0 18px 40px rgba(15,23,42,.08);display:flex;justify-content:space-between;gap:15px;align-items:center}.top h1{margin:0;font-size:26px;font-weight:900}.top p{margin:6px 0 0;color:#64748b;font-size:13px;font-weight:800;line-height:1.8}.btn{border:0;border-radius:14px;padding:10px 16px;font-family:inherit;font-weight:900;cursor:pointer;background:var(--green);color:white;text-decoration:none;display:inline-flex;align-items:center;gap:7px;justify-content:center}.btn.light{background:#fff;color:var(--green);border:1px solid #99f6e4}.btn.blue{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.btn.red{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.btn.amber{background:#fff7ed;color:#b45309;border:1px solid #fed7aa}.btn.gray{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}.grid{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:18px}.side,.main{background:white;border:1px solid #e2e8f0;border-radius:28px;box-shadow:0 18px 40px rgba(15,23,42,.06)}.side{padding:14px;position:sticky;top:14px;align-self:start}.folderBtn{width:100%;border:1px solid #e2e8f0;background:#f8fafc;border-radius:18px;padding:13px;margin:6px 0;text-align:right;font-family:inherit;font-weight:900;color:#1e293b;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}.folderBtn.active{background:#ecfeff;border-color:#67e8f9;color:#0e7490}.folderBtn small{display:block;color:#64748b;font-weight:800;font-size:10px;margin-top:4px;line-height:1.6}.sideTitle{padding:10px 12px;margin:0 0 8px;font-weight:900;color:#0f766e;border-bottom:1px solid #e2e8f0}.main{padding:18px}.panelHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid #e2e8f0;padding-bottom:14px;margin-bottom:14px}.panelHead h2{margin:0;font-size:24px;font-weight:900}.panelHead p{margin:6px 0 0;color:#64748b;font-weight:800;font-size:12px;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:12px}.stat b{display:block;font-size:22px;color:var(--green)}.stat span{font-size:11px;color:#64748b;font-weight:800}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:22px;padding:14px;margin-bottom:14px}.form .full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:900;color:#334155;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:10px;font-family:inherit;font-weight:800;background:white}.field textarea{min-height:86px;resize:vertical}.items{display:grid;gap:10px}.item{border:1px solid #e2e8f0;border-radius:20px;background:#fff;padding:14px}.itemTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.item h3{margin:0;font-size:16px;font-weight:900}.meta{font-size:11px;color:#64748b;font-weight:800;margin-top:5px;line-height:1.7}.desc{font-size:13px;color:#334155;font-weight:700;line-height:1.8;margin-top:8px;background:#f8fafc;border-radius:14px;padding:9px}.badge{display:inline-flex;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:900}.draft{background:#f1f5f9;color:#475569}.pending{background:#eff6ff;color:#1d4ed8}.returned{background:#fff7ed;color:#b45309}.rejected{background:#fff1f2;color:#be123c}.approved{background:#ecfdf5;color:#15803d}.transferred{background:#f5f3ff;color:#6d28d9}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{padding:28px;text-align:center;border:1px dashed #cbd5e1;background:#f8fafc;border-radius:20px;color:#64748b;font-weight:900}.hint{background:#ecfeff;border-right:4px solid #06b6d4;border-radius:16px;padding:12px;margin:12px 0;color:#155e75;font-weight:800;font-size:12px;line-height:1.8}.handover{background:#fffbeb;border:1px solid #fde68a;border-radius:18px;padding:12px;margin:12px 0;color:#92400e;font-weight:800;line-height:1.8}.hidden{display:none!important}@media(max-width:850px){.grid{grid-template-columns:1fr}.side{position:static}.form{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}

</head><body>
<div class="wrap"><header class="top"><div><h1>🧭 مركز الأعمال المفوضة للموظف/ة الإدارية</h1><p id="empMeta">تظهر هنا السجلات والأعمال المفوضة مباشرة للعمل عليها، مع حفظ العمل السابق عند نقل التكليف وإيقاف صلاحية المنفذ السابق.</p></div><div><button class="btn light" onclick="history.back()">رجوع</button><a class="btn" id="portalLink" href="administrative_employee_portal.html">البوابة</a></div></header>
<div class="grid"><aside class="side"><div class="sideTitle" id="sideTitle">السجلات المتاحة للعمل</div><div id="folderNav"></div></aside><main class="main" id="content"></main></div></div>
<script>
function uid(prefix){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m))}
function today(){return new Date().toISOString().slice(0,10)}
function statusText(s){return {draft:'مسودة',pending:'بانتظار الاعتماد',returned:'معاد للتعديل',rejected:'غير معتمد',approved:'معتمد',transferred:'محول'}[s]||'مسودة'}
function statusClass(s){return {draft:'draft',pending:'pending',returned:'returned',rejected:'rejected',approved:'approved',transferred:'transferred'}[s]||'draft'}
function fileMeta(input){const f=input&&input.files&&input.files[0];return f?{name:f.name,size:f.size,type:f.type||'ملف',at:new Date().toISOString()}:null}
function saveItems(key,items){localStorage.setItem(key,JSON.stringify(items||[]))}
function loadItems(key){try{return JSON.parse(localStorage.getItem(key)||'[]')||[]}catch(e){return []}}
const qs=new URLSearchParams(location.search);const empId=qs.get('emp')||qs.get('id')||'';const supervisor=qs.get('supervisor')||'';const schoolScope=qs.get('school')||'';
function allPlans(){try{return JSON.parse(localStorage.getItem('administrative_employee_plans')||'[]')||[]}catch(e){return []}}
function normJob(v){return String(v||'').replace(/[\sـ]+/g,' ').trim()}
const employee=allPlans().find(x=>String(x.id)===String(empId))||{};const job=normJob(employee.jobTitle||employee.position||'');
function isLabJob(){return /محضر\s*مختبر|محضرة\s*مختبر|مختبر/.test(job)}
function isLrcJob(){return /أمين\s*مصادر|أمينة\s*مصادر|مصادر\s*تعلم|مركز\s*مصادر/.test(job)}
portalLink.href='administrative_employee_portal.html'+(empId?'?emp='+encodeURIComponent(empId)+(supervisor?'&supervisor='+encodeURIComponent(supervisor):'')+(schoolScope?'&school='+encodeURIComponent(schoolScope):''):'');
empMeta.textContent=(employee.name?employee.name+' — ':'')+(job||'مسمى إداري')+' — مركز عمل مباشر على السجلات المفوضة دون مكتبة وسيطة.';
const owner='admin_'+(empId||employee.name||'local');const storeKey='admin_delegated_work_'+owner;
const labRecords=[
 {id:'lab_assets',icon:'🧪',title:'سجل العهد المختبرية',desc:'العهد والأدوات والمواد المخبرية وتسليمها واستلامها.'},
 {id:'lab_experiments',icon:'⚗️',title:'سجل التجارب العملية',desc:'توثيق التجارب العملية والتحضير والتنفيذ والشواهد.'},
 {id:'lab_materials',icon:'📦',title:'سجل المواد والأدوات',desc:'المواد المستهلكة والأدوات والاحتياج والتحديث.'},
 {id:'lab_safety',icon:'🛡️',title:'سجل الصيانة والسلامة',desc:'السلامة المخبرية والبلاغات والصيانة والمتابعة.'},
 {id:'lab_requests',icon:'📝',title:'سجل طلبات المختبر',desc:'طلبات التجهيز والمواد والاعتماد.'},
 {id:'lab_prep',icon:'📋',title:'سجل التحضير للتجارب',desc:'خطة التحضير وتنسيق المعلمين والحصص.'},
 {id:'lab_archive',icon:'🗄️',title:'أرشيف المختبر',desc:'الأعمال السابقة والشواهد المعتمدة والمعادة.'}
];
const lrcRecords=[
 {id:'lrc_loans',icon:'📚',title:'سجل الإعارة والزيارات',desc:'الإعارة وزيارات الطلاب والمعلمين للمصادر.'},
 {id:'lrc_activities',icon:'🎯',title:'سجل أنشطة مصادر التعلم',desc:'البرامج والأنشطة والشواهد.'},
 {id:'lrc_assets',icon:'🧾',title:'سجل التجهيزات والعهد',desc:'عهد وتجهيزات مصادر التعلم.'},
 {id:'lrc_maintenance',icon:'🛠️',title:'سجل الصيانة والمتابعة',desc:'الصيانة التقنية والتشغيلية.'},
 {id:'lrc_evidence',icon:'📎',title:'سجل الشواهد والبرامج',desc:'ملفات وروابط وشواهد البرامج.'},
 {id:'lrc_archive',icon:'🗄️',title:'أرشيف مصادر التعلم',desc:'الأعمال المنتهية والمحفوظة.'}
];
const commonRecords=[
 {id:'active_delegations',icon:'📌',title:'الأعمال المفوضة النشطة',desc:'أي عمل أو سجل يفوضه المدير/الوكيل يظهر هنا مباشرة.'},
 {id:'approved_work',icon:'✅',title:'الأعمال المعتمدة',desc:'الأعمال التي اعتمدها صاحب الصلاحية.'},
 {id:'returned_work',icon:'↩️',title:'المعاد للتعديل',desc:'الأعمال التي أعيدت للمراجعة والتعديل.'},
 {id:'archive',icon:'🗄️',title:'أرشيف الأعمال المفوضة',desc:'يحفظ الأعمال السابقة عند النقل أو الإلغاء دون حذفها.'}
];
let records=[];
if(isLabJob())records=labRecords.concat(commonRecords);else if(isLrcJob())records=lrcRecords.concat(commonRecords);else records=commonRecords;
let current=records[0].id;
function allItems(){return loadItems(storeKey)}function setAllItems(v){saveItems(storeKey,v)}
function renderNav(){folderNav.innerHTML=records.map(f=>`<button class="folderBtn ${current===f.id?'active':''}" onclick="openRecord('${f.id}')"><span><b>${f.icon} ${f.title}</b><small>${f.desc}</small></span><span>›</span></button>`).join('')}
function openRecord(id){current=id;renderNav();renderContent()}
function rec(){return records.find(x=>x.id===current)||records[0]}
function recordItems(id=current){return allItems().filter(x=>x.recordId===id)}
function counts(){let arr=allItems();return ['draft','pending','returned','rejected','approved'].map(s=>`<div class="stat"><b>${arr.filter(x=>x.status===s).length}</b><span>${statusText(s)}</span></div>`).join('')}
function renderContent(){let f=rec(),items=recordItems();let isArchive=/archive|approved|returned/.test(f.id);let html=`<div class="panelHead"><div><h2>${f.icon} ${f.title}</h2><p>${f.desc}</p></div><button class="btn" onclick="showForm()">+ إضافة تنفيذ/شاهد</button></div><div class="hint">هذا ليس مخزن ملفات عام؛ هذا مركز تنفيذ مباشر للسجل المحدد. يحفظ العمل باسم المنفذ الحالي، ولا يدخل رسميًا إلا بعد اعتماد صاحب الصلاحية.</div><div class="stats">${counts()}</div>`;html+=transferNote()+formHtml('hidden')+`<div class="items">${items.length?items.map(itemHtml).join(''):'<div class="empty">لا توجد أعمال محفوظة داخل هذا السجل حاليًا.</div>'}</div>`;content.innerHTML=html}
function transferNote(){return `<div class="handover">عند نقل التكليف إلى موظف/ة آخر: تبقى أعمال هذا المنفذ محفوظة في الأرشيف، وتُسحب صلاحياته من السجل، ويستكمل المكلف الجديد العمل من آخر حالة دون حذف السابق.</div>`}
function formHtml(cls=''){return `<form id="itemForm" class="form ${cls}" onsubmit="saveItem(event)"><div class="field"><label>عنوان التنفيذ/الشاهد</label><input id="itTitle" required placeholder="مثال: تحديث العهد أو رفع شاهد تنفيذ"></div><div class="field"><label>الحالة</label><select id="itStatus"><option value="draft">مسودة</option><option value="pending">بانتظار الاعتماد</option><option value="returned">معاد للتعديل</option><option value="rejected">غير معتمد</option><option value="approved">معتمد</option></select></div><div class="field"><label>رابط داعم</label><input id="itLink" placeholder="https://..."></div><div class="field"><label>رفع ملف/شاهد</label><input id="itFile" type="file"></div><div class="field full"><label>الوصف / الملاحظات</label><textarea id="itDesc" placeholder="اكتب تفاصيل التنفيذ أو ملاحظات الاعتماد..."></textarea></div><div class="full actions"><button class="btn" type="submit">حفظ كمسودة</button><button class="btn blue" type="button" onclick="saveItem(event,'pending')">إرسال للاعتماد</button><button class="btn light" type="button" onclick="hideForm()">إلغاء</button></div></form>`}
function showForm(){document.getElementById('itemForm').classList.remove('hidden')}function hideForm(){document.getElementById('itemForm').classList.add('hidden')}
function saveItem(e,forced){if(e&&e.preventDefault)e.preventDefault();let arr=allItems();let file=fileMeta(document.getElementById('itFile'));let f=rec();arr.unshift({id:uid('work'),recordId:f.id,recordTitle:f.title,title:document.getElementById('itTitle').value,status:forced||document.getElementById('itStatus').value,link:document.getElementById('itLink').value,desc:document.getElementById('itDesc').value,file,createdAt:new Date().toISOString(),assignee:employee.name||'موظف إداري',assigneeId:empId,owner});setAllItems(arr);renderContent()}
function itemHtml(x){return `<div class="item"><div class="itemTop"><div><h3>${esc(x.title)}</h3><div class="meta">السجل: ${esc(x.recordTitle)} — المنفذ: ${esc(x.assignee)} — تاريخ الإضافة: ${(x.createdAt||'').slice(0,10)} ${x.file?' — ملف: '+esc(x.file.name):''} ${x.link?' — رابط مرفق':''}</div></div><span class="badge ${statusClass(x.status)}">${statusText(x.status)}</span></div>${x.desc?`<div class="desc">${esc(x.desc)}</div>`:''}<div class="actions">${x.link?`<a class="btn light" target="_blank" href="${esc(x.link)}">فتح الرابط</a>`:''}<button class="btn blue" onclick="changeStatus('${x.id}','pending')">إرسال للاعتماد</button><button class="btn amber" onclick="changeStatus('${x.id}','returned')">معاد للتعديل</button><button class="btn gray" onclick="changeStatus('${x.id}','transferred')">أرشفة كنقل تكليف</button><button class="btn red" onclick="removeItem('${x.id}')">حذف محلي</button></div></div>`}
function changeStatus(id,status){setAllItems(allItems().map(x=>x.id===id?{...x,status,updatedAt:new Date().toISOString()}:x));renderContent()}
function removeItem(id){if(!confirm('حذف العنصر المحلي؟ يفضّل عدم حذف الأعمال المعتمدة أو المحولة حفاظًا على الأثر.'))return;setAllItems(allItems().filter(x=>x.id!==id));renderContent()}
renderNav();renderContent();
</script>
