<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>متابعة الخطط الفصلية</title>
<script>document.documentElement.classList.add('boot')</script><style>.boot body{visibility:hidden}</style><script src="platform-cloud-session.js?v=20260911-RL77-delegated-role-effective-access"></script><script src="platform-core-engine.js"></script><script src="cloud-file-engine.js"></script><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Tajawal;background:#f8fafc}.card{background:white;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 8px 25px #0f172a0d}.chip{padding:.25rem .6rem;border-radius:999px;font-size:11px;font-weight:800}.btn{border-radius:12px;padding:.6rem .8rem;font-size:12px;font-weight:800}.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.show{display:flex}.modalbox{background:#fff;width:min(780px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:20px}.btn:disabled{opacity:.4;cursor:not-allowed}@media(max-width:640px){select,button,input,textarea{font-size:16px!important}}</style></head>
<body><header class="bg-gradient-to-l from-[#15445A] to-[#0DA9A6] text-white sticky top-0 z-40"><div class="max-w-7xl mx-auto p-5 flex justify-between items-center gap-3"><div><h1 class="text-2xl font-black">متابعة الخطط الفصلية</h1><p class="text-xs text-white/80">اعتماد الخطط الأسبوعية ومراجعة الشواهد وتقييم التنفيذ للأقسام المرتبطة بالمدير</p></div><button onclick="location.href='manager.html'" class="btn bg-white/10 border border-white/20">↩ العودة للأقسام الرئيسية</button></div></header>
<main class="max-w-7xl mx-auto p-5 space-y-5"><section class="card p-4 flex flex-wrap gap-3 items-end"><div><label class="text-xs font-bold">الخطة</label><select id="plan" class="block border rounded-xl p-2 text-sm"><option value="">جميع الخطط</option><option>النشاط الطلابي</option><option>التوجيه الطلابي</option><option>التوجيه الصحي</option><option>رياض الأطفال</option></select></div><div><label class="text-xs font-bold">الفصل</label><select id="semester" class="block border rounded-xl p-2 text-sm"><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option></select></div><div><label class="text-xs font-bold">العام</label><select id="year" class="block border rounded-xl p-2 text-sm"></select></div><button onclick="load()" class="btn bg-teal-700 text-white">تحديث</button></section><div id="msg" class="hidden p-3 rounded-xl text-xs font-bold"></div><section><h2 class="font-black text-lg mb-3">الملخص التنفيذي حسب القسم</h2><div id="summaryCards" class="grid md:grid-cols-2 xl:grid-cols-4 gap-4"></div></section><section id="rows" class="space-y-3"></section></main>
<div id="evidenceModal" class="modal"><div class="modalbox"><div class="flex justify-between gap-2"><div><h2 class="font-black text-lg">معاينة شواهد التنفيذ</h2><p class="text-xs text-slate-500">يجب فتح جميع الشواهد قبل إتاحة تقييم التنفيذ.</p></div><button onclick="closeEvidence()" class="btn bg-slate-100">إغلاق</button></div><div id="evidenceReviewList" class="space-y-2 my-4"></div><div id="ratingArea" class="border-t pt-4 hidden"><div class="font-black mb-2">تقييم التنفيذ</div><div class="flex flex-wrap gap-2"><button onclick="rate('high')" class="btn bg-emerald-700 text-white">منفذ بمستوى عالي</button><button onclick="rate('medium')" class="btn bg-amber-500 text-white">منفذ بمستوى متوسط</button><button onclick="rate('low')" class="btn bg-rose-600 text-white">منفذ بمستوى منخفض</button></div></div></div></div>
<script>
const TYPES=['التوجيه الصحي','التوجيه الطلابي','النشاط الطلابي','رياض الأطفال'];let allRows=[],reviewRow=null,previewed=new Set();const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t,ok=true){msg.className='p-3 rounded-xl text-xs font-bold '+(ok?'bg-emerald-50 text-emerald-800':'bg-rose-50 text-rose-800');msg.textContent=t;msg.classList.remove('hidden');setTimeout(()=>msg.classList.add('hidden'),3500)}
function status(r){if(r.plan_status==='pending_manager')return'بانتظار اعتماد الخطة';if(r.plan_status==='returned')return'معاد للتعديل';if(r.execution_status==='pending_manager')return'الشواهد بانتظار التقييم';if(r.execution_status==='approved'){return({high:'منفذ بمستوى عالي',medium:'منفذ بمستوى متوسط',low:'منفذ بمستوى منخفض'})[r.execution_rating]||'تم تقييم التنفيذ'}if(r.plan_status==='approved')return'الخطة معتمدة — بانتظار الشواهد';return'مسودة'}
async function init(){for(let y=1448;y<=1548;y++)year.add(new Option(y+' هـ',y+' هـ'));document.documentElement.classList.remove('boot');await load()}
async function load(){try{const x=await PlatformCore.request('semester-plan-list',{academicYear:year.value,semester:semester.value,planType:plan.value||null});allRows=x.rows||[];renderSummary();renderRows()}catch(e){toast(e.message,false)}}
function renderSummary(){summaryCards.innerHTML=TYPES.map(t=>{const a=allRows.filter(r=>r.plan_type===t),approved=a.filter(r=>r.plan_status==='approved').length,pendingPlan=a.filter(r=>r.plan_status==='pending_manager').length,pendingEv=a.filter(r=>r.execution_status==='pending_manager').length,hi=a.filter(r=>r.execution_rating==='high').length,mid=a.filter(r=>r.execution_rating==='medium').length,lo=a.filter(r=>r.execution_rating==='low').length,rated=hi+mid+lo,pct=a.length?Math.round(rated/a.length*100):0;return `<div class="card p-4"><div class="font-black text-teal-800">${t}</div><div class="text-3xl font-black mt-2">${pct}%</div><div class="text-[11px] text-slate-500 mt-2">أسابيع مسجلة: ${a.length} · خطط بانتظار الاعتماد: ${pendingPlan} · شواهد بانتظار التقييم: ${pendingEv}</div><div class="grid grid-cols-3 gap-1 mt-3 text-center text-[10px]"><span class="bg-emerald-50 rounded-lg p-2">عالي<br><b>${hi}</b></span><span class="bg-amber-50 rounded-lg p-2">متوسط<br><b>${mid}</b></span><span class="bg-rose-50 rounded-lg p-2">منخفض<br><b>${lo}</b></span></div></div>`}).join('')}
function renderRows(){const a=allRows;rows.innerHTML=a.length?a.map(r=>{const ev=Array.isArray(r.evidence_items)?r.evidence_items:[];return `<article class="card p-4 grid lg:grid-cols-[1.2fr_2fr_auto] gap-4 items-center"><div><div class="flex gap-2 flex-wrap"><span class="chip bg-teal-50 text-teal-800">${esc(r.plan_type)}</span><span class="chip bg-slate-100">${esc(r.title)}</span><span class="chip bg-amber-50">${esc(status(r))}</span></div><p class="text-xs text-slate-500 mt-2">${esc(r.dates||'')} · ${esc(r.academic_year)} · ${esc(r.semester)}</p></div><div><ul class="text-xs text-slate-700">${(r.programs||[]).map(p=>`<li>• ${esc(p)}</li>`).join('')}</ul>${r.manager_note?`<p class="text-xs mt-2 text-rose-700"><b>الملاحظة:</b> ${esc(r.manager_note)}</p>`:''}<div class="text-[11px] text-slate-500 mt-2">عدد الشواهد: ${ev.length||(r.evidence_file_id?1:0)}</div></div><div class="flex flex-wrap gap-2 justify-end">${r.plan_status==='pending_manager'?`<button onclick="decision('${r.id}','approve')" class="btn bg-emerald-700 text-white">اعتماد الخطة</button><button onclick="decision('${r.id}','return')" class="btn bg-rose-600 text-white">إعادة للتعديل</button>`:''}${r.execution_status==='pending_manager'?`<button onclick="reviewEvidence('${r.id}')" class="btn bg-sky-700 text-white">معاينة الشواهد وتقييم التنفيذ</button>`:''}</div></article>`}).join(''):'<div class="card p-10 text-center text-slate-400 font-bold">لا توجد خطط مرسلة في هذا النطاق بعد.</div>'}
async function decision(id,d){const note=d==='return'?(prompt('اكتب ملاحظة الإعادة للمستخدم:')||'يرجى مراجعة الخطة وإعادة إرسالها'):(prompt('ملاحظة اعتماد اختيارية:')||'');try{await PlatformCore.request('semester-plan-manager-decision',{id,decision:d,note});toast(d==='approve'?'تم اعتماد خطة الأسبوع':'تمت إعادة الأسبوع للتعديل');await load()}catch(e){toast(e.message,false)}}
function evidenceItems(r){const a=Array.isArray(r.evidence_items)?r.evidence_items:[];if(a.length)return a;if(r.evidence_file_id)return[{type:'file',fileId:r.evidence_file_id,name:r.evidence_name||'شاهد'}];return[]}
function reviewEvidence(id){reviewRow=allRows.find(r=>r.id===id);previewed=new Set();renderReview();evidenceModal.classList.add('show')}function closeEvidence(){evidenceModal.classList.remove('show');reviewRow=null}
function keyOf(x,i){return x.fileId?`f:${x.fileId}`:`u:${x.url||i}`}
function renderReview(){const a=evidenceItems(reviewRow);evidenceReviewList.innerHTML=a.map((x,i)=>{const k=keyOf(x,i),seen=previewed.has(k);return `<div class="border rounded-xl p-3 flex justify-between items-center gap-3"><div><b>${esc(x.name||x.url||'شاهد')}</b><div class="text-[11px] text-slate-500">${x.type==='external'?'رابط خارجي':x.type==='library'?'من مكتبة القسم':'ملف مرفوع'} · ${seen?'تمت المعاينة':'لم تتم المعاينة'}</div></div><button onclick="previewItem(${i})" class="btn ${seen?'bg-emerald-100 text-emerald-800':'bg-sky-700 text-white'}">${seen?'فتح مرة أخرى':'معاينة'}</button></div>`}).join('');ratingArea.classList.toggle('hidden',a.length===0||previewed.size<a.length)}
async function previewItem(i){const x=evidenceItems(reviewRow)[i];try{if(x.type==='external')window.open(x.url,'_blank','noopener,noreferrer');else await CloudFileEngine.open(x.fileId);previewed.add(keyOf(x,i));renderReview()}catch(e){toast('تعذر فتح الشاهد: '+e.message,false)}}
async function rate(rating){const labels={high:'منفذ بمستوى عالي',medium:'منفذ بمستوى متوسط',low:'منفذ بمستوى منخفض'};const note=prompt('ملاحظة تقييم التنفيذ (اختيارية):')||'';try{await PlatformCore.request('semester-plan-execution-rating',{id:reviewRow.id,rating,note,previewConfirmed:true});toast('تم اعتماد التنفيذ: '+labels[rating]);closeEvidence();await load()}catch(e){toast(e.message,false)}}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
