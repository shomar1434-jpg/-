<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>دخول المدرسة المستقلة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{font-family:'Cairo',sans-serif;background:#0f172a;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden;}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 15%,rgba(20,184,166,.28),transparent 35%),linear-gradient(135deg,#0f172a,#042f2e);z-index:-2;}
    body:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.05);z-index:-1;pointer-events:none}
    #activation-overlay{display:none!important;visibility:hidden!important;pointer-events:none!important;}
    .login-card{width:min(92vw,520px);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);border-radius:2rem;padding:2rem;box-shadow:0 24px 80px rgba(0,0,0,.28);text-align:center;position:relative;z-index:10;}
    .login-card input{width:100%;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#fff;outline:0;font-size:16px;text-align:center;}
    .login-card input:focus{border-color:#5eead4;box-shadow:0 0 0 3px rgba(94,234,212,.13)}
    .login-card input::placeholder{color:rgba(255,255,255,.74)}
    #login-email{direction:ltr;text-align:left;unicode-bidi:plaintext}
    #school-login-btn{width:100%;border:0;border-radius:18px;padding:15px 18px;background:#14b8a6;color:#fff;font-weight:900;font-size:22px;cursor:pointer;position:relative;z-index:30;touch-action:manipulation;box-shadow:0 14px 30px rgba(20,184,166,.22)}
    #school-login-btn:active{transform:translateY(1px)}
    #school-login-btn[disabled]{opacity:.65;cursor:wait}
    #login-msg{min-height:1.5rem;margin-top:.75rem;font-size:13px;font-weight:800;color:#fecdd3}
    .safe-hidden-deactivate{display:none!important}
    @media(max-width:520px){body{padding:18px}.login-card{padding:1.8rem 1.5rem;border-radius:1.8rem}}
  </style>
<script>
(function(){
  const SUPABASE_URL = (localStorage.getItem('smartSchoolSupabaseUrl') || 'https://cijhgvbtrvmmlcssgxht.supabase.co').trim();
  const SUPABASE_KEY = (localStorage.getItem('smartSchoolSupabaseAnonKey') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpamhndmJ0cnZtbWxjc3NneGh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTY4MzUsImV4cCI6MjA5NDI3MjgzNX0.1sbfDvL1V12kj9oVcYJqYhj8NPuLpYjId7CO9QGj3bM').trim();
  let client = null;
  function getClient(){
    if(client) return client;
    if(!window.supabase || !window.supabase.createClient) return null;
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return client;
  }
  function appRoleToDb(role){
    if(['leadership','manager','school_manager','principal','admin','مدير','مديرة','مدير المدرسة','مديرة المدرسة'].includes(role)) return 'manager';
    if(['agency','agent','وكيل'].includes(role)) return 'agent';
    if(['activity_leader','activity','activity-leader','leader','activities_leader','مسؤول النشاط','مسؤولة النشاط','مسؤول/ة النشاط','رائد النشاط','رائدة النشاط','رائد/ة النشاط'].includes(role)) return 'activity_leader';
    if(['administrative_employee','admin_employee','employee_admin','موظف إداري','موظفة إدارية','الموظف الإداري','الموظفة الإدارية'].includes(role)) return 'administrative_employee';
    if(['student_advisor','advisor','counselor','مرشد','موجه','موجه طلابي','الموجه الطلابي','مرشد طلابي'].includes(role)) return 'student_advisor';
    if(['performance','teacher','معلم'].includes(role)) return 'teacher';
    if(role === 'owner') return 'owner';
    return role || 'teacher';
  }
  function dbRoleToApp(role){
    if(['manager','owner','school_manager','principal','admin','مدير','مديرة','مدير المدرسة','مديرة المدرسة'].includes(role)) return 'leadership';
    if(role === 'agent') return 'agency';
    if(role === 'administrative_employee') return 'administrative_employee';
    if(role === 'student_advisor') return 'student_advisor';
    if(role === 'teacher') return 'performance';
    return role || 'performance';
  }
  function readJsonSafe(key, fallback){ try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback||{}));}catch(e){return fallback||{};} }
  function currentLoginSchoolId(){ const q=new URLSearchParams(location.search||''); return q.get('schoolId') || q.get('school_id') || q.get('id') || q.get('school') || q.get('schoolCode') || q.get('school_code') || localStorage.getItem('current_school_id') || localStorage.getItem('school_id') || 'default'; }

  function teacherRoleCode(x){x=String(x||'').trim();var map={'التوجيه الصحي':'health_guidance','موجه صحي':'health_guidance','الموجه الصحي':'health_guidance','health':'health_guidance','health_guidance':'health_guidance','منسق الموهوبين':'gifted_coordinator','منسق/ة الموهوبين':'gifted_coordinator','الجودة':'quality_coordinator','منسق الجودة':'quality_coordinator','منسق/ة الجودة':'quality_coordinator','منصة مدرستي':'madrasati_coordinator','منسق منصة مدرستي':'madrasati_coordinator'};return map[x]||x}
  function normalizeTeacherExtraRoles(v){
    if(Array.isArray(v)) return v.map(teacherRoleCode).filter(Boolean);
    if(typeof v==='string') return v.split(/[،,|]+/).map(x=>teacherRoleCode(x.trim())).filter(Boolean);
    return [];
  }
  function readTeacherExtraRoleMap(){try{return JSON.parse(localStorage.getItem('smart_school_teacher_extra_roles_map')||'{}')}catch(e){return {}}}
  function teacherExtraRolesForLoginUser(user){
    const map=readTeacherExtraRoleMap();
    let roles=normalizeTeacherExtraRoles(user && (user.teacher_extra_roles||user.additional_assignments||user.extra_roles||user.extraRoles));
    if(!roles.length && user && user.id) roles=normalizeTeacherExtraRoles(map['id:'+user.id]);
    if(!roles.length && user && user.email) roles=normalizeTeacherExtraRoles(map['email:'+String(user.email).trim().toLowerCase()]);
    return roles;
  }

  function normalizeAgencyList(v){
    if(Array.isArray(v)) return v.map(String).map(x=>x.trim()).filter(Boolean).filter(x=>x!=='general');
    v=String(v||'').trim(); if(!v || v==='general') return [];
    if(v.charAt(0)==='['){try{return normalizeAgencyList(JSON.parse(v));}catch(e){}}
    return v.split(/[،,|]/).map(x=>x.trim()).filter(Boolean).filter(x=>x!=='general');
  }
  function mergeViceAgency(user){
    if(!user) return user;
    const sid = user.schoolId || currentLoginSchoolId() || 'default';
    const map = readJsonSafe('smartSchoolUnifiedOpsV2_vp_agency_map_'+sid, {});
    const id = String(user.id||'');
    const email = String(user.email||'').trim().toLowerCase();
    const agencyRaw = user.agent_categories || user.agency_categories || user.agency_types || user.agency_type || user.agencyType || user.vice_agency_type || user.viceAgencyType || (id&&map[id]) || (email&&map[email]) || '';
    const agencyList = normalizeAgencyList(agencyRaw);
    if(agencyList.length){ user.agent_categories = agencyList; user.agency_categories = agencyList; user.agency_types = agencyList; user.agency_type = agencyList.join(','); user.agencyType = user.agency_type; }
    return user;
  }
  function normalizeUser(row, school){
    if(!row) return null;
    const appRole = dbRoleToApp(row.role);
    return {
      id: row.id,
      name: row.full_name || row.name || '',
      full_name: row.full_name || row.name || '',
      email: row.email || '',
      password: row.password || '',
      role: appRole,
      dbRole: row.role,
      status: row.status || 'pending',
      isActive: row.status === 'active',
      active: row.status === 'active',
      schoolId: row.school_id || row.schoolId || '',
      schoolName: (school && (school.school_name || school.schoolName)) || row.schoolName || '',
      accountType: row.role === 'manager' ? 'school_manager' : 'school_user',
      isPrimaryManager: !!row.is_primary_manager,
      is_primary_manager: !!row.is_primary_manager,
      mustChangePassword: !!row.must_change_password,
      createdAt: row.created_at || '',
      agent_categories: normalizeAgencyList(row.agent_categories || row.agency_categories || row.agency_types || row.agency_type || row.agencyType || row.vice_agency_type || row.viceAgencyType || ''),
      agency_categories: normalizeAgencyList(row.agent_categories || row.agency_categories || row.agency_types || row.agency_type || row.agencyType || row.vice_agency_type || row.viceAgencyType || ''),
      agency_types: normalizeAgencyList(row.agent_categories || row.agency_categories || row.agency_types || row.agency_type || row.agencyType || row.vice_agency_type || row.viceAgencyType || ''),
      agency_type: normalizeAgencyList(row.agent_categories || row.agency_categories || row.agency_types || row.agency_type || row.agencyType || row.vice_agency_type || row.viceAgencyType || '').join(','),
      agencyType: normalizeAgencyList(row.agent_categories || row.agency_categories || row.agency_types || row.agency_type || row.agencyType || row.vice_agency_type || row.viceAgencyType || '').join(','),
      teacher_extra_roles: normalizeTeacherExtraRoles(row.teacher_extra_roles || row.additional_assignments || row.extra_roles || row.extraRoles || ''),
      additional_assignments: normalizeTeacherExtraRoles(row.teacher_extra_roles || row.additional_assignments || row.extra_roles || row.extraRoles || ''),
      extra_roles: normalizeTeacherExtraRoles(row.teacher_extra_roles || row.additional_assignments || row.extra_roles || row.extraRoles || '')
    };
  }
  function normalizeSchool(row){
    if(!row) return null;
    return {
      id: row.id,
      schoolId: row.id,
      schoolCode: row.school_code || row.id,
      schoolName: row.school_name || '',
      managerName: row.manager_name || '',
      managerEmail: row.manager_email || '',
      status: row.status || 'pending',
      registrationCode: row.registration_code || '',
      registrationLink: row.registration_link || '',
      loginLink: row.login_link || '',
      createdAt: row.created_at || ''
    };
  }
  async function listSchools(){
    const sb = getClient(); if(!sb) throw new Error('Supabase غير جاهز');
    const {data,error} = await sb.from('schools').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    return (data||[]).map(normalizeSchool);
  }
  async function insertUserCompat(row){
    const sb = getClient();
    let q = await sb.from('users').insert(row).select('*').single();
    if(q.error && /full_name/i.test(q.error.message || '')){
      const fallback = Object.assign({}, row, { name: row.full_name });
      delete fallback.full_name;
      q = await sb.from('users').insert(fallback).select('*').single();
    }
    if(q.error) throw q.error;
    return q.data;
  }
  async function updateUserCompat(row, id){
    const sb = getClient();
    let q = await sb.from('users').update(row).eq('id',id).select('*').single();
    if(q.error && /full_name/i.test(q.error.message || '')){
      const fallback = Object.assign({}, row, { name: row.full_name });
      delete fallback.full_name;
      q = await sb.from('users').update(fallback).eq('id',id).select('*').single();
    }
    if(q.error) throw q.error;
    return q.data;
  }
  async function createSchoolWithManager(payload){
    const sb = getClient(); if(!sb) throw new Error('Supabase غير جاهز');
    const email = String(payload.email || payload.managerEmail || '').trim().toLowerCase();
    const schoolCode = payload.schoolCode || ('SCH-' + Math.random().toString(36).slice(2,8).toUpperCase());
    const registrationCode = payload.registrationCode || ('REG-' + Math.random().toString(36).slice(2,8).toUpperCase());

    let existingManager = null;
    try{
      const ex = await sb.from('users').select('*').eq('email',email).eq('role','manager').limit(1).maybeSingle();
      existingManager = ex.data || null;
    }catch(e){}

    const {data:school,error:schoolErr} = await sb.from('schools').insert({
      school_name: payload.schoolName,
      school_code: schoolCode,
      manager_name: payload.managerName,
      manager_email: email,
      status: 'active',
      registration_code: registrationCode,
      registration_link: payload.registrationLink || null,
      login_link: payload.loginLink || null
    }).select('*').single();
    if(schoolErr) throw schoolErr;

    let user = existingManager;
    if(!user){
      try{
        user = await insertUserCompat({
          school_id: school.id,
          full_name: payload.managerName,
          email: email,
          password: payload.password,
          role: 'manager',
          status: 'active',
          is_primary_manager: true,
          must_change_password: false
        });
      }catch(e){
        const ex = await sb.from('users').select('*').eq('email',email).eq('role','manager').limit(1).maybeSingle();
        if(!ex.data) throw e;
        user = ex.data;
      }
    }

    try{
      await sb.from('school_members').insert({
        school_id: school.id,
        user_id: user.id || null,
        email: email,
        role: 'manager',
        status: 'active',
        is_primary_manager: true
      });
    }catch(e){ console.warn('school_members غير متاح، سيتم الاعتماد على manager_email', e); }

    return { school: normalizeSchool(school), manager: normalizeUser(Object.assign({}, user, {school_id:school.id, is_primary_manager:true}), school) };
  }

  async function updateSchoolStatus(schoolId,status){
    const sb = getClient(); if(!sb) throw new Error('Supabase غير جاهز');
    const {error} = await sb.from('schools').update({status}).eq('id',schoolId);
    if(error) throw error;
    await sb.from('users').update({status}).eq('school_id',schoolId).eq('role','manager');
    return true;
  }
  async function registerSchoolUser(payload){
    const sb = getClient(); if(!sb) throw new Error('Supabase غير جاهز');
    let schoolId = payload.schoolId || '';
    let school = null;
    if(schoolId){
      const {data,error} = await sb.from('schools').select('*').eq('id',schoolId).maybeSingle();
      if(!error && data) school = data;
    }
    if(!school && payload.registrationCode){
      const {data,error} = await sb.from('schools').select('*').eq('registration_code',payload.registrationCode).maybeSingle();
      if(!error && data){ school = data; schoolId = data.id; }
    }
    if(!schoolId) throw new Error('الرابط غير مرتبط بمدرسة صحيحة');
    const {data:existing} = await sb.from('users').select('id').eq('email',payload.email).eq('school_id',schoolId).maybeSingle();
    if(existing) throw new Error('يوجد طلب أو حساب سابق بنفس البريد داخل هذه المدرسة');
    const user = await insertUserCompat({
      school_id: schoolId,
      full_name: payload.name,
      email: payload.email,
      password: payload.password,
      role: appRoleToDb(payload.role),
      status: 'pending',
      is_primary_manager: false,
      must_change_password: false
    });
    return normalizeUser(user, school);
  }
  async function listUsersBySchool(schoolId){
    const sb = getClient(); if(!sb) throw new Error('Supabase غير جاهز');
    const {data,error} = await sb.from('users').select('*').eq('school_id',schoolId).order('created_at',{ascending:false});
    if(error) throw error;
    return (data||[]).map(u => normalizeUser(u));
  }
  async function updateUserStatus(userId,status){
    const sb = getClient(); if(!sb) throw new Error('Supabase غير جاهز');
    const {data,error} = await sb.from('users').update({status}).eq('id',userId).select('*').single();
    if(error) throw error;
    return normalizeUser(data);
  }
  async function upsertSchoolUser(payload){
    const sb = getClient(); if(!sb) throw new Error('Supabase غير جاهز');
    const row = {
      school_id: payload.schoolId,
      full_name: payload.name || payload.full_name || '',
      email: payload.email || '',
      password: payload.password || '123456',
      role: appRoleToDb(payload.role),
      status: payload.status || 'pending',
      is_primary_manager: !!payload.isPrimaryManager
    };
    const data = payload.id ? await updateUserCompat(row, payload.id) : await insertUserCompat(row);
    return normalizeUser(data);
  }
  function normText(v){ return String(v == null ? '' : v).trim(); }
  function normEmail(v){ return normText(v).toLowerCase(); }
  function activeStatusOk(v){
    const s = normText(v).toLowerCase();
    return !['deleted','disabled','blocked','inactive','محذوف','معطل','موقوف'].includes(s);
  }
  function passwordMatches(row, password){
    const p = normText(password);
    if(!row) return false;
    const fields = ['password','pass','manager_password','school_password','login_password','temp_password','default_password','pin','code','access_code','secret'];
    for(const f of fields){ if(row[f] != null && normText(row[f]) === p) return true; }
    return false;
  }
  function emailMatches(row, email){
    const e = normEmail(email);
    const fields = ['email','user_email','manager_email','principal_email','admin_email','owner_email','login_email','username','userName','loginName'];
    return fields.some(f => normEmail(row && row[f]) === e);
  }
  function schoolIdOf(row){ return normText(row && (row.school_id || row.schoolId || row.school || row.id)); }
  async function fetchSchoolById(sb, sid){
    if(!sid) return null;
    try{ const q = await sb.from('schools').select('*').eq('id',sid).maybeSingle(); return q && !q.error ? q.data : null; }catch(e){ return null; }
  }
  async function fetchSchoolByRef(sb, ref){
    ref = normText(ref);
    if(!ref) return null;
    const cols = ['id','school_code','registration_code'];
    for(const col of cols){
      try{ const q = await sb.from('schools').select('*').eq(col, ref).maybeSingle(); if(q && !q.error && q.data) return q.data; }catch(e){}
    }
    try{
      const q = await sb.from('schools').select('*').or(`login_link.ilike.%${ref}%,registration_link.ilike.%${ref}%`).limit(1);
      if(q && !q.error && q.data && q.data[0]) return q.data[0];
    }catch(e){}
    return null;
  }
  async function findSchoolByManagerEmail(sb, email, wantedSchool){
    const e = normEmail(email);
    if(!e) return null;
    let wantedRealId = '';
    let wantedRefs = [];
    if(wantedSchool){
      const wantedRow = await fetchSchoolByRef(sb, wantedSchool);
      if(!wantedRow) return null;
      wantedRealId = normText(wantedRow.id);
      wantedRefs = [wantedRow.id, wantedRow.school_code, wantedRow.registration_code, wantedSchool].map(normText).filter(Boolean);
    }
    const cols = ['manager_email','email','principal_email','admin_email','owner_email'];
    for(const col of cols){
      try{
        let res = await sb.from('schools').select('*').ilike(col,e).limit(50);
        let rows = (res && !res.error && res.data) ? res.data : [];
        if(!rows.length){
          res = await sb.from('schools').select('*').eq(col,e).limit(50);
          rows = (res && !res.error && res.data) ? res.data : [];
        }
        const filtered = wantedSchool ? rows.filter(r => {
          const refs = [r.id, r.school_code, r.registration_code].map(normText).filter(Boolean);
          return (wantedRealId && normText(r.id) === wantedRealId) || refs.some(x => wantedRefs.includes(x));
        }) : rows;
        if(filtered.length) return filtered[0];
      }catch(err){}
    }
    return null;
  }
  function emailBelongsToSchoolRow(email, school){
    const e = normEmail(email);
    if(!e || !school) return false;
    return ['manager_email','email','principal_email','admin_email','owner_email'].some(f => normEmail(school[f]) === e);
  }
  async function findMembership(sb, email, userId, wantedSchool){
    if(!wantedSchool) return null;
    const e = normEmail(email);
    try{
      const parts = [`email.eq.${e}`];
      if(userId) parts.push(`user_id.eq.${userId}`);
      const res = await sb.from('school_members').select('*').eq('school_id',wantedSchool).or(parts.join(',')).limit(1);
      return res && !res.error && res.data && res.data[0] ? res.data[0] : null;
    }catch(err){ return null; }
  }
  async function signInAuth(sb, email, password){
    if(!sb.auth || !sb.auth.signInWithPassword) return null;
    try{
      const r = await sb.auth.signInWithPassword({email:normEmail(email), password:normText(password)});
      return r && !r.error && r.data && r.data.user ? r.data.user : null;
    }catch(e){ return null; }
  }
  async function login(email,password,schoolId){
    const sb = getClient(); if(!sb) throw new Error('Supabase غير جاهز');
    email = normEmail(email);
    const wantedSchool = normText(schoolId);
    const p = normText(password);
    const wantedSchoolRow = wantedSchool ? await fetchSchoolByRef(sb, wantedSchool) : null;
    if(wantedSchool && !wantedSchoolRow) return null;
    const wantedSchoolId = wantedSchoolRow ? normText(wantedSchoolRow.id) : wantedSchool;

    let authUser = await signInAuth(sb, email, p);
    let rows = [];

    // 1) الحسابات القديمة والجديدة داخل جدول users: نقرأ بالبريد ثم نطابق كلمة المرور محلياً عبر أكثر من حقل.
    try{
      const q = await sb.from('users').select('*').eq('email',email).limit(20);
      if(q.error) throw q.error;
      rows = (q.data || []).filter(u => activeStatusOk(u.status));
    }catch(e){ rows = []; }

    // 2) إن كان الحساب موثقًا عبر Supabase Auth فلا نشترط وجود كلمة المرور داخل جدول users.
    // الحسابات القديمة كانت فعالة على Supabase Auth بينما جدول users قد لا يحتوي password،
    // وكان ذلك يؤدي إلى حذف الصف المطابق بعد التحقق الناجح.
    if(authUser){
      try{
        let q = await sb.from('users').select('*').eq('email',email).limit(20);
        if(q && !q.error && q.data && q.data.length) rows = q.data.filter(u => activeStatusOk(u.status));
      }catch(e){}
      if(!rows.length){
        rows = [{
          id: authUser.id,
          email,
          full_name: authUser.user_metadata && (authUser.user_metadata.full_name || authUser.user_metadata.name) || email,
          role: 'manager',
          status: 'active'
        }];
      }
    }else{
      rows = rows.filter(u => passwordMatches(u,p));
    }

    // 3) ضبط نطاق المدرسة للحسابات القديمة التي كانت مرتبطة عبر school_members أو manager_email دون school_id مباشر.
    if(wantedSchool){
      let scoped = rows.filter(u => {
        const usid = normText(u.school_id || u.schoolId);
        return usid === wantedSchool || usid === wantedSchoolId || (wantedSchoolRow && [wantedSchoolRow.school_code, wantedSchoolRow.registration_code].map(normText).includes(usid));
      });
      if(!scoped.length){
        for(const candidate of rows){
          const member = await findMembership(sb, email, candidate.id, wantedSchoolId);

          if(schByEmail){ scoped.push(Object.assign({}, candidate, {school_id:schByEmail.id, __schoolOverride:schByEmail, role:candidate.role || 'manager'})); break; }
        }
      }
      rows = scoped;
    }

    let row = rows[0] || null;

    // 4) دعم حسابات المدارس التي كانت تحفظ بيانات المدير داخل جدول schools فقط.
    if(!row){
      const sch = await findSchoolByManagerEmail(sb, email, wantedSchool || wantedSchoolId);
      if(sch && activeStatusOk(sch.status)){
        const hasPassField = ['manager_password','password','school_password','login_password','temp_password','default_password','pin','code','access_code'].some(f => sch[f] != null && normText(sch[f]) !== '');
        if(authUser || !hasPassField || passwordMatches(sch,p)){

        }
      }
    }

    if(!row) return null;
    let school = row.__schoolOverride || null;
    let sid = normText(row.school_id || row.schoolId) || wantedSchool;
    if(sid && !school) school = await fetchSchoolByRef(sb, sid);
    // إذا كان الحساب موثقًا في Supabase Auth أو موجودًا في users دون school_id،
    // نربطه بمدرسته من جدول schools عبر بريد المدير قبل إنشاء الجلسة.
    if(!school){
      const byManagerEmail = await findSchoolByManagerEmail(sb, email, wantedSchool || '');
      if(byManagerEmail){
        school = byManagerEmail;
        sid = normText(byManagerEmail.id) || sid;
        if(!row.school_id) row.school_id = sid;
        if(!row.role) row.role = 'manager';
      }
    }
    if(wantedSchool){
      const finalSchoolId = normText(school && school.id);
      const finalRefs = [finalSchoolId, school && school.school_code, school && school.registration_code].map(normText).filter(Boolean);
      const userSchoolRef = normText(row.school_id || row.schoolId);
      const member = row.__membership || await findMembership(sb, email, row.id, wantedSchoolId);

      if(!sameSchool && !member && !isSchoolManager) return null;
      if(finalSchoolId && finalSchoolId !== wantedSchoolId) return null;
    }
    const normalized = normalizeUser(row, school);
    normalized.schoolId = (school && school.id) || sid || normalized.schoolId;
    normalized.schoolName = (school && (school.school_name || school.schoolName)) || normalized.schoolName || row.schoolName || '';
    normalized.role = dbRoleToApp(row.role || normalized.dbRole || normalized.role || 'manager');
    normalized.status = row.status || 'active';
    normalized.active = true;
    normalized.isActive = true;
    return normalized;
  }
  window.SmartSchoolSupabase = { getClient, appRoleToDb, dbRoleToApp, normalizeUser, normalizeSchool, listSchools, createSchoolWithManager, updateSchoolStatus, registerSchoolUser, listUsersBySchool, updateUserStatus, upsertSchoolUser, login };
})();

  async function schoolLogin(event){
    if(event && typeof event.preventDefault === 'function') event.preventDefault();
    setMsg(''); setLoading(true);
    try{
      const loginEl = document.getElementById('login-email');
      const passEl = document.getElementById('login-password');
      const loginId = String(loginEl && loginEl.value || '').trim().toLowerCase();
      const password = String(passEl && passEl.value || '').trim();
      if(!loginId || !password){ setMsg('يرجى إدخال البريد/اسم المستخدم والرقم السري'); return; }
      const school = await resolveActiveSchool();
      if((targetSchoolId || targetSchoolCode) && !school){ setMsg('رابط المدرسة غير مرتبط بسجل مدرسة صحيح.'); return; }
      let user = await loginFromSupabase(loginId,password);
      if(!user) user = loginFromLocal(loginId,password,school);
      if(!user){ setMsg('بيانات الدخول غير صحيحة أو الحساب غير موجود في هذه المدرسة'); return; }
      if(!isActiveAccount(user)){ setMsg('الحساب غير مفعل بعد'); return; }
      user = normalizeLocalUser(user, school);
      const role = normalizeRole(user.role);
      const schoolId = user.schoolId || targetSchoolId || (school && (school.schoolId || school.id || school.school_id)) || '';
      const schoolName = user.schoolName || (school && (school.schoolName || school.school_name || school.name)) || '';
      if(school && !activeSchool) cacheActiveSchool(school);
      try{
        Object.keys(sessionStorage).forEach(k => { if(/follow|monitor|readonly/i.test(k)) sessionStorage.removeItem(k); });
        localStorage.removeItem('smartSchoolUnifiedOpsV2_follow_context');
        localStorage.removeItem('follow_context');
      }catch(e){}
      const agencyCats = normalizeAgencyList(user.agent_categories || user.agency_categories || user.agency_types || user.agency_type || user.agencyType || '');
      const teacherExtraRoles = normalizeTeacherExtraRoles(user.teacher_extra_roles || user.additional_assignments || user.extra_roles || user.extraRoles || '');
      Object.assign(user,{role, schoolId, schoolName, agent_categories:agencyCats, agency_categories:agencyCats, agency_types:agencyCats, agency_type:agencyCats.join(','), agencyType:agencyCats.join(','), teacher_extra_roles:teacherExtraRoles, additional_assignments:teacherExtraRoles, extra_roles:teacherExtraRoles});
      localStorage.setItem('currentRole', role);
      localStorage.setItem('currentUserName', user.name || '');
      localStorage.setItem('currentUserEmail', user.email || loginId);
      localStorage.setItem('smart_school_active_role', role);
      localStorage.setItem('currentSchoolUser', JSON.stringify(user));
      localStorage.setItem('currentUser', JSON.stringify(user));
      if(schoolId){ localStorage.setItem('current_school_id', schoolId); localStorage.setItem('school_id', schoolId); localStorage.setItem('smart_school_id', schoolId); }
      if(schoolName){ localStorage.setItem('current_school_name', schoolName); localStorage.setItem('school_name', schoolName); localStorage.setItem('persist_school', schoolName); }
      localStorage.setItem('smart_school_current_session', JSON.stringify({ id:user.id||'', name:user.name||'', email:user.email||loginId, role, agent_categories:agencyCats, agency_categories:agencyCats, agency_types:agencyCats, agency_type:agencyCats.join(','), agencyType:agencyCats.join(','), teacher_extra_roles:teacherExtraRoles, additional_assignments:teacherExtraRoles, extra_roles:teacherExtraRoles, schoolId, schoolName, loginAt:new Date().toISOString(), independentSchool:true, loginMode:'direct' }));
      setMsg('تم التحقق من الحساب، جارٍ فتح القسم...', 'ok');
      const target = fileForRole(role);
      const q = new URLSearchParams({ role, uid:user.id || '', email:user.email || loginId, schoolId:schoolId || '', school_name:schoolName || '', schoolMode:'independent', independent:'true', loginMode:'direct', direct:'1', agency_type:agencyCats.join(','), teacher_extra_roles:teacherExtraRoles.join(',') });
      setTimeout(()=>{ location.assign(target + '?' + q.toString()); }, 80);
    }catch(err){
      console.error('Independent school login error:', err);
      setMsg('حدث خطأ أثناء تسجيل الدخول. تحقق من الاتصال أو بيانات الحساب.');
    }finally{ setLoading(false); }
  }
  window.schoolLogin = schoolLogin;
  function bindLogin(){
    const form = document.getElementById('school-login-form');
    const btn = document.getElementById('school-login-btn');
    if(form && !form.dataset.bound){ form.dataset.bound='1'; form.addEventListener('submit', schoolLogin, {passive:false}); }
    if(btn && !btn.dataset.bound){
      btn.dataset.bound='1';
      ['click','touchend','pointerup'].forEach(ev=>btn.addEventListener(ev, function(e){ if(ev!=='click') e.preventDefault(); schoolLogin(e); }, {passive:false}));
      btn.style.pointerEvents='auto'; btn.style.position='relative'; btn.style.zIndex='30';
    }
    ['login-email','login-password'].forEach(function(id){
      const el=document.getElementById(id);
      if(el && !el.dataset.bound){ el.dataset.bound='1'; el.addEventListener('keydown', function(e){ if(e.key === 'Enter') schoolLogin(e); }); }
    });
  }

  let __schoolLoginInitDone = false;
  async function initSchoolLoginPage(){
    if(__schoolLoginInitDone) return;
    __schoolLoginInitDone = true;
    bindLogin();
    const hasSchoolLink = !!(targetSchoolId || targetSchoolCode);
    if(hasSchoolLink){
      const cached = findCachedSchoolByLink();
      if(cached){ updateSchoolTitle(cached); }
      else {
        const title = document.getElementById('school-title');
        if(title) title.textContent = 'جارٍ التحقق من رابط المدرسة المستقلة...';
      }
    }
    const school = await resolveActiveSchool();
    if(!school && hasSchoolLink){
      setMsg('رابط المدرسة لم يطابق سجل مدرسة في Supabase أو العقد المحلي. لا يتم السماح بالدخول من رابط عام. أعد نسخ رابط الدخول من إدارة المدارس بعد تحديث النسخة.');
    }
  }
  document.addEventListener('DOMContentLoaded', initSchoolLoginPage);
  if(document.readyState !== 'loading') initSchoolLoginPage();
})();
</script>
