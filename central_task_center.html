<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز التكليفات المركزي</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:Tajawal,Arial,sans-serif;background:linear-gradient(135deg,#eefdf8,#f8fafc);min-height:100vh;color:#0f172a}.glass{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);box-shadow:0 20px 50px rgba(15,23,42,.08)}.tab.active{background:#0f766e;color:white}.status{font-size:11px;font-weight:900;border-radius:999px;padding:4px 10px}.s-active{background:#ecfeff;color:#0e7490}.s-pending{background:#fff7ed;color:#c2410c}.s-returned{background:#fef3c7;color:#a16207}.s-rejected{background:#fee2e2;color:#b91c1c}.s-approved{background:#dcfce7;color:#15803d}.s-archived{background:#e2e8f0;color:#475569}.s-withdrawn{background:#f1f5f9;color:#334155}.card-hover{transition:.2s}.card-hover:hover{transform:translateY(-2px);box-shadow:0 18px 35px rgba(15,23,42,.10)}input,select,textarea{outline:none}.audit-line{border-right:3px solid #0f766e}.hidden{display:none!important}.folderBtn{border:1px solid #e2e8f0;background:#fff;border-radius:18px;padding:12px;text-align:right;font-weight:900}.folderBtn.active{background:#0f766e;color:white;border-color:#0f766e}@media print{.no-print{display:none!important}body{background:white}.glass{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<header class="no-print sticky top-0 z-40 bg-white/85 backdrop-blur border-b border-teal-100 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3"><div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-teal-600 to-emerald-700 text-white flex items-center justify-center text-2xl shadow-lg">🧭</div><div><h1 id="pageHeading" class="font-black text-xl text-slate-800">مركز التكليفات المركزي</h1><p id="pageSubtitle" class="text-xs text-slate-500 font-bold">إنشاء التكليفات، نقلها، سحبها، اعتمادها، رفضها وأرشفتها دون حذف أي أثر سابق.</p></div></div>
    <div class="flex gap-2"><button onclick="history.back()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-black">رجوع</button><button onclick="print()" class="px-4 py-2 rounded-xl bg-teal-600 text-white text-xs font-black">طباعة</button></div>
  </div>
</header>
<main class="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
  <section class="glass rounded-[34px] p-5 md:p-7"><div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="summaryCards"></div></section>
  <section id="ownerTabs" class="glass rounded-[34px] p-4 no-print"><div class="flex flex-wrap gap-2" id="tabs">
    <button class="tab active px-4 py-2 rounded-2xl text-xs font-black" data-view="create" onclick="switchView('create')">إنشاء تكليف</button>
    <button class="tab px-4 py-2 rounded-2xl text-xs font-black bg-white text-slate-600" data-view="active" onclick="switchView('active')">التكليفات النشطة</button>
    <button class="tab px-4 py-2 rounded-2xl text-xs font-black bg-white text-slate-600" data-view="pending" onclick="switchView('pending')">بانتظار الاعتماد</button>
    <button class="tab px-4 py-2 rounded-2xl text-xs font-black bg-white text-slate-600" data-view="returned" onclick="switchView('returned')">معادة للتعديل</button>
    <button class="tab px-4 py-2 rounded-2xl text-xs font-black bg-white text-slate-600" data-view="rejected" onclick="switchView('rejected')">مرفوضة</button>
    <button class="tab px-4 py-2 rounded-2xl text-xs font-black bg-white text-slate-600" data-view="approved" onclick="switchView('approved')">معتمدة</button>
    <button class="tab px-4 py-2 rounded-2xl text-xs font-black bg-white text-slate-600" data-view="archived" onclick="switchView('archived')">الأرشيف</button>
  </div></section>
  <section id="createView" class="glass rounded-[34px] p-6 md:p-8">
    <h2 class="font-black text-lg text-teal-800 mb-4">إنشاء تكليف جديد</h2>
    <form id="taskForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div><label class="block text-xs font-black text-slate-600 mb-1">عنوان التكليف</label><input id="taskTitle" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm" placeholder="مثال: تعبئة سجل الصيانة الأسبوعي"></div>
      <div><label class="block text-xs font-black text-slate-600 mb-1">نوع التكليف</label><select id="taskType" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm"><option value="record">تكليف سجل كامل</option><option value="partial">تكليف مهمة جزئية</option><option value="additional_role">تكليف دور إضافي</option></select></div>
      <div><label class="block text-xs font-black text-slate-600 mb-1">الجهة المالكة للسجل</label><select id="sourceOwner" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm"><option value="manager">سجلات المدير/المديرة</option><option value="agent">سجلات الوكيل/الوكيلة</option><option value="shared">سجل/عمل مشترك</option></select></div>
      <div><label class="block text-xs font-black text-slate-600 mb-1">السجل أو الملف المرتبط</label><select id="recordKey" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm"></select></div>
      <div><label class="block text-xs font-black text-slate-600 mb-1">المكلف</label><select id="assigneeId" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm"></select></div>
      <div><label class="block text-xs font-black text-slate-600 mb-1">الأولوية</label><select id="priority" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm"><option value="normal">عادية</option><option value="high">عالية</option><option value="urgent">عاجلة</option></select></div>
      <div><label class="block text-xs font-black text-slate-600 mb-1">تاريخ البداية</label><input id="startDate" type="date" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm"></div>
      <div><label class="block text-xs font-black text-slate-600 mb-1">تاريخ النهاية</label><input id="dueDate" type="date" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm"></div>
      <div class="md:col-span-2"><label class="block text-xs font-black text-slate-600 mb-1">وصف التكليف</label><textarea id="taskDesc" rows="3" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm" placeholder="حدد المطلوب من المكلف بدقة، والملفات أو الشواهد المطلوبة."></textarea></div>
      <div class="md:col-span-2 flex flex-wrap gap-2 pt-2"><button class="bg-teal-600 text-white rounded-2xl px-6 py-3 text-sm font-black" type="submit">حفظ التكليف</button><button class="bg-slate-100 text-slate-700 rounded-2xl px-6 py-3 text-sm font-black" type="button" onclick="resetForm()">تفريغ النموذج</button></div>
    </form>
  </section>
  <section id="listView" class="glass rounded-[34px] p-6 md:p-8 hidden"><div class="flex items-center justify-between gap-2 mb-4"><h2 class="font-black text-lg text-teal-800" id="listTitle">التكليفات</h2><input id="searchBox" oninput="renderList()" class="rounded-2xl border border-slate-200 px-4 py-2 text-sm no-print" placeholder="بحث..."></div><div id="tasksList" class="space-y-4"></div></section>
</main>
<div id="modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50 no-print"><div class="bg-white rounded-[30px] max-w-xl w-full p-6 shadow-2xl"><div class="flex justify-between items-center mb-4"><h3 id="modalTitle" class="font-black text-lg text-slate-800"></h3><button onclick="closeModal()" class="text-slate-400 font-black">✕</button></div><div id="modalBody"></div></div></div>
<script>
const NS='smartSchoolCloudStorage';
const STATUS_LABELS={active:'نشط',in_progress:'قيد التنفيذ',pending_approval:'بانتظار الاعتماد',returned:'معاد للتعديل',rejected:'مرفوض',approved:'معتمد',archived:'مؤرشف',withdrawn:'مسحوب',transferred:'منقول'};
const STATUS_CLASS={active:'s-active',in_progress:'s-active',pending_approval:'s-pending',returned:'s-returned',rejected:'s-rejected',approved:'s-approved',archived:'s-archived',withdrawn:'s-withdrawn',transferred:'s-withdrawn'};
const MANAGER_RECORDS=['الاتصالات الإدارية','الاجتماعات','المجالس واللجان','دعم وتطوير الهيئة التعليمية','النشرات والتبليغات','التكليفات والوصف الوظيفي','الخطة التشغيلية وملف الشواهد','الصلاحيات','الميزانية التشغيلية','متابعة الهيئة التعليمية والإدارية','الأداء الوظيفي','البيانات الشاملة','تقارير المشرفين/المشرفات','التعزيز والتكريم','قياس اتجاه المتعلمين نحو المدرسة','ضبط الوثائق','التدقيق الداخلي','الاختبارات الدولية'];
const AGENT_RECORDS=['الجداول المدرسية','حصص الانتظار','المناوبة والإشراف اليومي','تقرير المناوبة اليومي','الخطط الدراسية','دعم وتطوير الهيئة التعليمية','متابعة أعمال المعلمين والإداريين','التحصيل الدراسي والفاقد التعليمي','ملف الاختبار العام','ملف الاختبارات الدولية','منصة مدرستي','النمو المهني','ملف الموهوبين','التربية الخاصة','سجل العمل الرسمي','استئذان الموظفين','حصر غياب الموظفين','حصر دقائق التأخير','التحويلات','العهد والمستودعات والأرشفة','الصيانة والنظافة','النقل المدرسي','المقصف المدرسي','المرافق','المعامل والمختبرات والمصادر','سجل الزائرات','متابعة إدخال الإجازات في نظام نور','متابعة الإدخال في نظام فارس','سجلات شؤون الطلاب'];
const SHARED_RECORDS=['رفع شاهد','إعداد تقرير','تعبئة نموذج','متابعة مبادرة','تحديث ملف','أرشفة مستندات','تنفيذ مهمة تشغيلية','التوجيه الصحي','محضر المختبر','مصادر التعلم'];
function qs(k){return new URLSearchParams(location.search).get(k)||''}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function uid(){return 'task_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}function parse(v,d){try{return JSON.parse(v)}catch(e){return d}}function read(k,d){return parse(localStorage.getItem(k),d)}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function currentSchoolId(){return localStorage.getItem('activeSchoolId')||localStorage.getItem('school_id')||localStorage.getItem('currentSchoolId')||'default_school'}
function mode(){return qs('mode')||'owner'}function role(){return qs('role')||qs('owner')||localStorage.getItem('smart_school_active_role')||'manager'}
function taskKey(){return 'central_school_tasks_'+currentSchoolId()}function tasks(){return read(taskKey(),[])}function saveTasks(a){write(taskKey(),a)}
function normalizeRole(r){r=String(r||'').toLowerCase(); if(['teacher','معلم','معلمة','performance'].includes(r))return 'teacher'; if(['admin','administrative','administrative_employee','إداري','employee'].includes(r))return 'admin_employee'; if(['agent','wakil','وكيل'].includes(r))return 'agent'; if(['student_advisor','counselor','موجه'].includes(r))return 'student_advisor'; if(['activity_leader','رائد'].includes(r))return 'activity_leader'; return r||'user'}
function roleLabel(r){return {teacher:'معلم/معلمة',admin_employee:'موظف/موظفة إدارية',agent:'وكيل/وكيلة',student_advisor:'موجه/موجهة طلابية',activity_leader:'رائد/رائدة نشاط'}[r]||'مستخدم'}
function currentOwnerLabel(){return normalizeRole(role())==='agent'?'الوكيل/الوكيلة':'المدير/المديرة'}
function collectUsers(){let out=[]; const keys=[NS+'_users','smartSchoolCloudStorage_users','smart_school_users','school_users','users','registered_users','school_members','administrative_employee_plans']; keys.forEach(k=>{let a=read(k,[]); if(Array.isArray(a)) out=out.concat(a.map(x=>k==='administrative_employee_plans'?Object.assign({},x,{role:'admin_employee',name:x.name||x.employeeName}):x))}); for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i); if(/users|school_members|accounts/i.test(k||'')){let a=read(k,[]); if(Array.isArray(a)) out=out.concat(a)}} let seen=new Set(); out=out.map(u=>({id:u.id||u.user_id||u.email||uid(),name:u.name||u.fullName||u.full_name||u.employeeName||u.email||'مستخدم',email:u.email||'',role:normalizeRole(u.role||u.dbRole||u.type),status:u.status||((u.active||u.isActive)?'active':'active'),schoolId:u.schoolId||u.school_id||currentSchoolId()})).filter(u=>u.status!=='deleted' && (!u.schoolId || String(u.schoolId)===String(currentSchoolId()))).filter(u=>{let key=String(u.id||u.email); if(seen.has(key))return false; seen.add(key); return true;}); if(!out.length) out=[{id:'demo_teacher',name:'معلم تجريبي',role:'teacher',email:''},{id:'demo_admin',name:'موظف إداري تجريبي',role:'admin_employee',email:''},{id:'demo_agent',name:'وكيل تجريبي',role:'agent',email:''}]; return out}
function currentAssigneeId(){return qs('uid')||qs('userId')||qs('emp')||localStorage.getItem('currentUserId')||localStorage.getItem('current_user_id')||''}function currentAssigneeEmail(){return (qs('email')||localStorage.getItem('currentUserEmail')||'').toLowerCase()}function isMine(t){let id=currentAssigneeId(), em=currentAssigneeEmail(); return (id&&String(t.assignee_id)===String(id)) || (em&&String(t.assignee_email||'').toLowerCase()===em)}
function normalizeExtraCode(v){v=String(v||'').trim(); let map={'التوجيه الصحي':'health_guidance','موجه صحي':'health_guidance','الموجه الصحي':'health_guidance','health_guidance':'health_guidance','health':'health_guidance','منسق الموهوبين':'gifted_coordinator','الموهوبين':'gifted_coordinator','منسق الجودة':'quality_coordinator','الجودة':'quality_coordinator','محضر المختبر':'lab_preparator','مختبر':'lab_preparator','مصادر التعلم':'learning_resources'};return map[v]||v}
function readRoleMap(){return read('smart_school_teacher_extra_roles_map',{})}function writeRoleMap(m){write('smart_school_teacher_extra_roles_map',m);write('smartSchoolCloudStorage_teacher_extra_roles_map',m)}
function updateTeacherExtraRole(user,code,add){if(!user||normalizeRole(user.role)!=='teacher')return; code=normalizeExtraCode(code); let map=readRoleMap(); let keys=[]; if(user.id)keys.push('id:'+user.id); if(user.email)keys.push('email:'+String(user.email).toLowerCase()); keys.forEach(k=>{let arr=Array.isArray(map[k])?map[k]:[]; arr=arr.map(normalizeExtraCode); if(add&&!arr.includes(code))arr.push(code); if(!add)arr=arr.filter(x=>x!==code); map[k]=arr}); writeRoleMap(map)}
function routeTaskToAssignee(t,oldUser){let u={id:t.assignee_id,email:t.assignee_email,role:t.assignee_role,name:t.assignee_name}; if(t.assignment_type==='additional_role'){updateTeacherExtraRole(u,t.record_key,true); if(oldUser) updateTeacherExtraRole(oldUser,t.record_key,false)}}
function removeTaskRoute(t){let u={id:t.assignee_id,email:t.assignee_email,role:t.assignee_role,name:t.assignee_name}; if(t.assignment_type==='additional_role') updateTeacherExtraRole(u,t.record_key,false)}
function populateRecords(){let owner=document.getElementById('sourceOwner').value; let arr=owner==='manager'?MANAGER_RECORDS:(owner==='agent'?AGENT_RECORDS:SHARED_RECORDS); document.getElementById('recordKey').innerHTML=arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function populateUsers(){let users=collectUsers(); document.getElementById('assigneeId').innerHTML=users.map(u=>`<option value="${esc(u.id)}" data-role="${esc(u.role)}" data-email="${esc(u.email)}">${esc(u.name)} — ${esc(roleLabel(u.role))}</option>`).join('')}
function resetForm(){document.getElementById('taskForm').reset(); const today=new Date().toISOString().slice(0,10); document.getElementById('startDate').value=today; populateRecords()}
function switchView(v){document.querySelectorAll('.tab').forEach(b=>{b.classList.remove('active');b.classList.add('bg-white','text-slate-600')}); const btn=document.querySelector(`[data-view="${v}"]`); if(btn){btn.classList.add('active');btn.classList.remove('bg-white','text-slate-600')} document.getElementById('createView').classList.toggle('hidden',v!=='create');document.getElementById('listView').classList.toggle('hidden',v==='create'); window.currentView=v; if(v!=='create') renderList()}
function getTask(id){return tasks().find(t=>t.task_id===id)}function setTask(next){saveTasks(tasks().map(t=>t.task_id===next.task_id?next:t));renderAll()}
function addHistory(t,action,note){t.history=t.history||[];t.history.unshift({at:new Date().toISOString(),action,by:mode()==='assignee'?'المكلف':currentOwnerLabel(),note:note||''});return t}
function createTask(e){e.preventDefault(); const users=collectUsers(); const sel=document.getElementById('assigneeId'); const assignee=users.find(u=>String(u.id)===String(sel.value))||{}; const t={task_id:uid(),school_id:currentSchoolId(),title:document.getElementById('taskTitle').value,description:document.getElementById('taskDesc').value,assignment_type:document.getElementById('taskType').value,source_owner:document.getElementById('sourceOwner').value,record_key:document.getElementById('recordKey').value,owner_role:normalizeRole(role()),owner_label:currentOwnerLabel(),owner_id:localStorage.getItem('currentUserId')||role(),assignee_id:assignee.id,assignee_email:assignee.email,assignee_name:assignee.name,assignee_role:assignee.role,priority:document.getElementById('priority').value,start_date:document.getElementById('startDate').value,due_date:document.getElementById('dueDate').value,status:'active',created_at:new Date().toISOString(),updated_at:new Date().toISOString(),pending_updates:[],evidence:[],history:[]}; addHistory(t,'إنشاء التكليف','تم إنشاء التكليف وربطه بالمكلف الحالي.'); let a=tasks(); a.unshift(t); saveTasks(a); routeTaskToAssignee(t); resetForm(); switchView('active')}
function renderSummary(){let a=visibleTasks(); const counts={all:a.length,active:a.filter(t=>['active','in_progress','transferred'].includes(t.status)).length,pending:a.filter(t=>t.status==='pending_approval').length,archived:a.filter(t=>t.status==='archived').length}; document.getElementById('summaryCards').innerHTML=[['إجمالي التكليفات',counts.all,'🗂️'],['النشطة',counts.active,'⚙️'],['بانتظار الاعتماد',counts.pending,'⏳'],['المؤرشفة',counts.archived,'🗃️']].map(x=>`<div class="bg-white rounded-[26px] p-5 border border-white shadow-sm"><div class="flex justify-between items-center"><div><p class="text-xs text-slate-500 font-black">${x[0]}</p><h3 class="text-3xl font-black text-teal-700 mt-1">${x[1]}</h3></div><div class="text-3xl">${x[2]}</div></div></div>`).join('')}
function visibleTasks(){let a=tasks(); if(mode()==='assignee') return a.filter(isMine).filter(t=>!['withdrawn','archived'].includes(t.status)); return a}
function filterByView(t,v){if(mode()==='assignee')return true; if(v==='active')return ['active','in_progress','transferred','withdrawn'].includes(t.status); if(v==='pending')return t.status==='pending_approval'; if(v==='returned')return t.status==='returned'; if(v==='rejected')return t.status==='rejected'; if(v==='approved')return t.status==='approved'; if(v==='archived')return t.status==='archived'; return true}
function renderList(){let v=window.currentView||'active'; document.getElementById('listTitle').innerText=mode()==='assignee'?'تكليفاتي':({active:'التكليفات النشطة',pending:'بانتظار الاعتماد',returned:'المعادة للتعديل',rejected:'المرفوضة',approved:'المعتمدة',archived:'الأرشيف'}[v]||'التكليفات'); let q=(document.getElementById('searchBox')?.value||'').trim().toLowerCase(); let arr=visibleTasks().filter(t=>filterByView(t,v)).filter(t=>!q||JSON.stringify(t).toLowerCase().includes(q)); document.getElementById('tasksList').innerHTML=arr.length?arr.map(taskCard).join(''):'<div class="text-center p-10 text-slate-400 font-black border border-dashed rounded-[28px] bg-white/70">لا توجد تكليفات في هذا التصنيف.</div>'}
function taskCard(t){let canAct=t.status!=='archived'; let assignee=mode()==='assignee'; let ownerBtns=`<button onclick="openReassign('${t.task_id}')" class="px-3 py-2 rounded-xl bg-blue-50 text-blue-700 text-xs font-black">نقل</button><button onclick="withdrawTask('${t.task_id}')" class="px-3 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-black">سحب</button><button onclick="approveTask('${t.task_id}')" class="px-3 py-2 rounded-xl bg-green-50 text-green-700 text-xs font-black">اعتماد</button><button onclick="returnTask('${t.task_id}')" class="px-3 py-2 rounded-xl bg-amber-50 text-amber-700 text-xs font-black">إعادة للتعديل</button><button onclick="rejectTask('${t.task_id}')" class="px-3 py-2 rounded-xl bg-red-50 text-red-700 text-xs font-black">رفض</button><button onclick="archiveTask('${t.task_id}')" class="px-3 py-2 rounded-xl bg-slate-800 text-white text-xs font-black">أرشفة</button>`; let assigneeBtns=`<button onclick="startWork('${t.task_id}')" class="px-3 py-2 rounded-xl bg-blue-50 text-blue-700 text-xs font-black">بدء/متابعة</button><button onclick="openSubmit('${t.task_id}')" class="px-3 py-2 rounded-xl bg-teal-600 text-white text-xs font-black">رفع تنفيذ/شاهد</button><button onclick="submitForApproval('${t.task_id}')" class="px-3 py-2 rounded-xl bg-amber-50 text-amber-700 text-xs font-black">إرسال للاعتماد</button>`; return `<article class="bg-white rounded-[28px] p-5 border border-slate-100 card-hover"><div class="flex flex-col md:flex-row md:items-start justify-between gap-4"><div class="space-y-2"><div class="flex flex-wrap gap-2 items-center"><h3 class="font-black text-lg text-slate-800">${esc(t.title)}</h3><span class="status ${STATUS_CLASS[t.status]||'s-active'}">${STATUS_LABELS[t.status]||t.status}</span></div><p class="text-xs text-slate-500 font-bold">${esc(t.record_key)} — ${esc(t.owner_label)} → ${esc(t.assignee_name)} (${esc(roleLabel(t.assignee_role))})</p><p class="text-sm text-slate-600 leading-7">${esc(t.description||'لا يوجد وصف.')}</p><div class="flex flex-wrap gap-2 text-[11px] font-black"><span class="bg-slate-50 px-3 py-1 rounded-full">الأولوية: ${esc(t.priority)}</span><span class="bg-slate-50 px-3 py-1 rounded-full">البداية: ${esc(t.start_date||'-')}</span><span class="bg-slate-50 px-3 py-1 rounded-full">النهاية: ${esc(t.due_date||'-')}</span><span class="bg-slate-50 px-3 py-1 rounded-full">الأعمال المرفوعة: ${(t.pending_updates||[]).length}</span></div></div><div class="flex flex-wrap gap-2 no-print">${canAct?(assignee?assigneeBtns:ownerBtns):''}<button onclick="showHistory('${t.task_id}')" class="px-3 py-2 rounded-xl bg-teal-50 text-teal-700 text-xs font-black">السجل التاريخي</button></div></div></article>`}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').classList.remove('flex')}function openModal(title,body){document.getElementById('modalTitle').innerText=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex')}
function openReassign(id){let t=getTask(id), users=collectUsers().filter(u=>String(u.id)!==String(t.assignee_id)); openModal('نقل التكليف',`<div class="space-y-3"><p class="text-sm text-slate-600 font-bold">سيبقى عمل المكلف السابق محفوظًا في الأرشيف، وتُسحب صلاحياته تلقائيًا.</p><select id="newAssignee" class="w-full rounded-2xl border px-4 py-3 text-sm">${users.map(u=>`<option value="${esc(u.id)}">${esc(u.name)} — ${esc(roleLabel(u.role))}</option>`).join('')}</select><textarea id="transferNote" class="w-full rounded-2xl border px-4 py-3 text-sm" placeholder="سبب النقل"></textarea><button onclick="reassignTask('${id}')" class="w-full bg-blue-600 text-white rounded-2xl py-3 font-black">تأكيد النقل</button></div>`)}
function reassignTask(id){let t=getTask(id); let users=collectUsers(); let nu=users.find(u=>String(u.id)===String(document.getElementById('newAssignee').value)); if(!t||!nu)return; let old={id:t.assignee_id,email:t.assignee_email,role:t.assignee_role,name:t.assignee_name}; t.previous_assignees=t.previous_assignees||[]; t.previous_assignees.unshift({id:t.assignee_id,name:t.assignee_name,role:t.assignee_role,ended_at:new Date().toISOString(),reason:document.getElementById('transferNote').value||'نقل التكليف',preserved_updates:t.pending_updates||[],preserved_evidence:t.evidence||[]}); t.assignee_id=nu.id;t.assignee_email=nu.email;t.assignee_name=nu.name;t.assignee_role=nu.role;t.status='transferred';t.updated_at=new Date().toISOString(); addHistory(t,'نقل التكليف','تم نقل التكليف إلى '+nu.name+' مع حفظ أعمال المنفذ السابق وسحب صلاحياته.'); setTask(t); routeTaskToAssignee(t,old); closeModal(); switchView('active')}
function withdrawTask(id){let t=getTask(id); if(!t)return; removeTaskRoute(t); t.status='withdrawn';t.updated_at=new Date().toISOString(); addHistory(t,'سحب التكليف','تم سحب صلاحية المنفذ الحالي مع حفظ الأعمال السابقة.'); setTask(t)}
function approveTask(id){let t=getTask(id); if(!t)return; t.status='approved';t.updated_at=new Date().toISOString(); addHistory(t,'اعتماد','تم اعتماد التكليف ودمج الأعمال المعتمدة في السجل الرسمي حسب الصلاحية.'); setTask(t); switchView('approved')}
function returnTask(id){let note=prompt('ملاحظات الإعادة للتعديل:')||''; let t=getTask(id); if(!t)return; t.status='returned';t.updated_at=new Date().toISOString(); addHistory(t,'إعادة للتعديل',note); setTask(t); switchView('returned')}
function rejectTask(id){let note=prompt('سبب الرفض النهائي:')||''; let t=getTask(id); if(!t)return; t.status='rejected';t.updated_at=new Date().toISOString(); addHistory(t,'رفض نهائي',note); setTask(t); switchView('rejected')}
function archiveTask(id){let t=getTask(id); if(!t)return; t.status='archived';t.updated_at=new Date().toISOString(); addHistory(t,'أرشفة','تمت أرشفة التكليف دون حذف أي عمل سابق.'); setTask(t); switchView('archived')}
function startWork(id){let t=getTask(id); if(!t)return; if(t.status==='active'||t.status==='transferred'){t.status='in_progress';t.updated_at=new Date().toISOString();addHistory(t,'بدء التنفيذ','بدأ المكلف العمل على التكليف.');setTask(t)} if(t.assignment_type==='additional_role' && normalizeExtraCode(t.record_key)==='health_guidance') location.href='school_health_unified_registry.html?source=central_task&task_id='+encodeURIComponent(id);}
function openSubmit(id){openModal('رفع تنفيذ أو شاهد',`<form onsubmit="saveUpdate(event,'${id}')" class="space-y-3"><input id="updTitle" required class="w-full rounded-2xl border px-4 py-3 text-sm" placeholder="عنوان التنفيذ"><textarea id="updDesc" class="w-full rounded-2xl border px-4 py-3 text-sm" placeholder="وصف التنفيذ أو ملاحظاته"></textarea><input id="updLink" class="w-full rounded-2xl border px-4 py-3 text-sm" placeholder="رابط داعم اختياري"><input id="updFile" type="file" class="w-full rounded-2xl border px-4 py-3 text-sm"><button class="w-full bg-teal-600 text-white rounded-2xl py-3 font-black">حفظ التنفيذ</button></form>`)}
function saveUpdate(e,id){e.preventDefault();let t=getTask(id); if(!t)return; let f=document.getElementById('updFile').files[0]; let item={id:'upd_'+Date.now(),title:document.getElementById('updTitle').value,desc:document.getElementById('updDesc').value,link:document.getElementById('updLink').value,file:f?{name:f.name,size:f.size,type:f.type}:null,by:t.assignee_name,at:new Date().toISOString(),status:'draft'}; t.pending_updates=t.pending_updates||[];t.pending_updates.unshift(item);t.status='in_progress';t.updated_at=new Date().toISOString();addHistory(t,'رفع تنفيذ/شاهد',item.title);setTask(t);closeModal();renderList()}
function submitForApproval(id){let t=getTask(id); if(!t)return; t.status='pending_approval';t.updated_at=new Date().toISOString();addHistory(t,'إرسال للاعتماد','أرسل المكلف العمل إلى صاحب الصلاحية للمراجعة.');setTask(t);renderList()}
function showHistory(id){let t=getTask(id); if(!t)return; openModal('السجل التاريخي للتكليف',(t.history||[]).map(h=>`<div class="audit-line bg-slate-50 rounded-2xl p-3 mb-2"><div class="font-black text-slate-800 text-sm">${esc(h.action)}</div><div class="text-xs text-slate-500 font-bold">${new Date(h.at).toLocaleString('ar-SA')} — ${esc(h.by)}</div><p class="text-xs text-slate-600 mt-1">${esc(h.note||'')}</p></div>`).join('')||'<p class="text-slate-400 text-center font-bold">لا توجد أحداث.</p>')}
function initAssigneeMode(){document.getElementById('pageHeading').textContent='مركز تكليفاتي';document.getElementById('pageSubtitle').textContent='تنفيذ التكليفات المرسلة إليك، رفع الشواهد، وإرسال الأعمال للاعتماد.';document.getElementById('ownerTabs').classList.add('hidden');document.getElementById('createView').classList.add('hidden');document.getElementById('listView').classList.remove('hidden');window.currentView='all';renderAll();renderList()}
function renderAll(){renderSummary(); if((window.currentView||'create')!=='create') renderList()}
document.addEventListener('DOMContentLoaded',()=>{populateRecords();populateUsers();resetForm();document.getElementById('sourceOwner').addEventListener('change',populateRecords);document.getElementById('taskForm').addEventListener('submit',createTask);if(mode()==='assignee')initAssigneeMode();else renderAll()});
</script>
</body></html>
