<script id="GLOBAL_VERTICAL_FLOATING_ICONS_LABELS_FIX">
(function(){
  if(window.__GLOBAL_VERTICAL_FLOATING_ICONS_SINGLE_LABEL__) return;
  window.__GLOBAL_VERTICAL_FLOATING_ICONS_SINGLE_LABEL__ = true;

  function clean(v){
    return String(v || '')
      .replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function labelFromElement(el){
    var saved = clean(el.dataset.originalTitle || el.dataset.originalAriaLabel || el.dataset.floatingOriginalLabel || '');
    if(saved) return saved;

    var title = clean(el.getAttribute('title') || '');
    if(title) return title;

    var aria = clean(el.getAttribute('aria-label') || '');
    if(aria && aria !== 'أداة') return aria;

    var childTitle = '';
    var titled = el.querySelector && el.querySelector('[title]');
    if(titled) childTitle = clean(titled.getAttribute('title') || '');
    if(childTitle) return childTitle;

    var text = clean(el.innerText || el.textContent || '');
    if(text && text.length > 1) return text;

    return '';
  }

  function removeNativeTooltip(node){
    if(!node || !node.hasAttribute) return;
    if(node.hasAttribute('title')){
      if(!node.dataset.originalTitle) node.dataset.originalTitle = node.getAttribute('title') || '';
      node.removeAttribute('title');
    }
  }

  function apply(){
    var bars = document.querySelectorAll('#ssFinalBar,.ss-final-bar,#smartSchoolFloatingBar,.smart-school-floating-bar,#top-floating-icons,.top-floating-icons,.floating-icons,.global-floating-icons,.top-actions-floating,.quick-actions-floating');
    bars.forEach(function(bar){
      Array.from(bar.children || []).forEach(function(el){
        if(el.hasAttribute('aria-label') && !el.dataset.originalAriaLabel){
          el.dataset.originalAriaLabel = el.getAttribute('aria-label') || '';
        }

        var label = labelFromElement(el);

        // لا نستخدم أي تخمين أو ترتيب رقمي حتى لا تظهر مسميات خاطئة.
        if(!label) label = 'أداة';

        el.dataset.floatingOriginalLabel = label;
        el.dataset.floatingLabel = label;
        el.removeAttribute('data-tooltip');
        el.setAttribute('aria-label', label);

        removeNativeTooltip(el);
        if(el.querySelectorAll){
          el.querySelectorAll('[title]').forEach(removeNativeTooltip);
        }

        el.onmouseenter = function(){
          removeNativeTooltip(el);
          if(el.querySelectorAll) el.querySelectorAll('[title]').forEach(removeNativeTooltip);
        };
      });
    });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply);
  else apply();

  setTimeout(apply, 120);
  setTimeout(apply, 500);
  setTimeout(apply, 1200);
  setTimeout(apply, 2500);
  setInterval(apply, 3000);
})();
</script>

function extractAIJson(text){

  t=t.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();
  const start=t.indexOf('{'), end=t.lastIndexOf('}');
  if(start>=0 && end>start) t=t.slice(start,end+1);
  try{return JSON.parse(t)}catch(e){return null}

function fillFirstMatching(labels,value,overwrite=false){

function applyAIObject(obj,overwrite=false){
  let count=0;
  if(!obj || typeof obj!=='object') return 0;
  const aliases={
    'الإجراءات والتوصيات النهائية':['الإجراءات والتوصيات النهائية','الإجراءات النهائية','التوصيات النهائية'],
    'الإجراء المتخذ':['الإجراء المتخذ','الإجراءات المتخذة','الإجراءات','الإجراء','إجراء الوكيل','الإجراء النظامي'],
    'التوصيات':['التوصيات','توصيات الوكيل','التوصيات والمقترحات'],
    'ملاحظات':['ملاحظات','ملحوظات الزيارة','ملاحظات المناوبة','ملاحظات بداية اليوم','ملاحظات الفسحة','ملاحظات الانصراف'],
    'فرص التحسين':['فرص التحسين','جوانب التحسين'],
    'جوانب القوة':['جوانب القوة'],
    'خطة المتابعة':['خطة المتابعة','موعد المتابعة','تاريخ المتابعة'],
    'وصف الحالة':['وصف الحالة','تفاصيل الحالة','الحالات المرصودة'],
    'سبب التحويل':['سبب التحويل','سبب الاستئذان','سبب الغياب حسب الإفادة','أبرز الأسباب'],
    'نص القرار':['نص القرار','رأي الوكيل','قرار المدير']
  };
  for(const [k,v] of Object.entries(obj)){
    if(typeof v==='object') continue;
    if(fillFieldByName(k,v,overwrite)) {count++; continue;}
    for(const [main,names] of Object.entries(aliases)){
      if(k.includes(main) || names.some(n=>k.includes(n) || n.includes(k))){
        if(fillFirstMatching(names,v,overwrite)){count++; break;}
      }
    }
  }
  if(obj.فرص_التحسين) count += fillFirstMatching(['فرص التحسين','ملحوظات الزيارة','ملاحظات'],obj.فرص_التحسين,overwrite)?1:0;
  if(obj.التوصيات) count += fillFirstMatching(['التوصيات','توصيات الوكيل','الإجراءات والتوصيات النهائية'],obj.التوصيات,overwrite)?1:0;
  if(obj.الإجراءات) count += fillFirstMatching(['الإجراء المتخذ','الإجراءات المتخذة','الإجراءات والتوصيات النهائية'],obj.الإجراءات,overwrite)?1:0;
  return count;
}
function fallbackApplyAIText(text,overwrite=false){
  let count=0;
  const clean=String(text||'').replace(/```[\s\S]*?```/g,'').trim();
  if(!clean) return 0;
  const rec=qs('[data-field="الإجراءات والتوصيات النهائية"]');
  if(rec && (overwrite || !rec.value.trim())){rec.value=clean;autoGrowOne(rec);count++;}
  const recommendations=(clean.match(/(?:التوصيات|توصيات)[:：]?([\s\S]*?)(?:الإجراءات|فرص|جوانب|$)/)||[])[1];
  if(recommendations) count += fillFirstMatching(['التوصيات','توصيات الوكيل','التوصيات والمقترحات'],recommendations.trim(),overwrite)?1:0;
  const actions=(clean.match(/(?:الإجراءات|إجراءات|الإجراء)[:：]?([\s\S]*?)(?:التوصيات|فرص|جوانب|$)/)||[])[1];
  if(actions) count += fillFirstMatching(['الإجراء المتخذ','الإجراءات المتخذة','الإجراءات والتوصيات النهائية'],actions.trim(),overwrite)?1:0;
  const improvements=(clean.match(/(?:فرص التحسين|فرص)[:：]?([\s\S]*?)(?:التوصيات|الإجراءات|$)/)||[])[1];
  if(improvements) count += fillFirstMatching(['فرص التحسين','ملحوظات الزيارة','ملاحظات'],improvements.trim(),overwrite)?1:0;
  return count;
}

function autoGrowOne(el){
  if(!el || el.tagName!=='TEXTAREA') return;
  const isTable = el.classList.contains('table-textarea') || el.hasAttribute('data-table');
  const isLong = el.closest('.note') || el.dataset.field === 'الإجراءات والتوصيات النهائية';
  const maxHeight = isTable ? 58 : (isLong ? 92 : 78);
  const minHeight = isTable ? 30 : 34;
  el.style.height='auto';
  const nextHeight = Math.max(minHeight, Math.min(el.scrollHeight, maxHeight));
  el.style.height = nextHeight + 'px';
  el.style.overflow = el.scrollHeight > maxHeight ? 'hidden' : 'hidden';
}
function autoGrowAll(root=document){
  qsa('textarea', root).forEach(autoGrowOne);
}
function bindAutoGrow(root=document){
  qsa('textarea', root).forEach(el=>{
    autoGrowOne(el);
    if(!el.dataset.autogrowBound){
      el.addEventListener('input',()=>autoGrowOne(el));
      el.addEventListener('change',()=>autoGrowOne(el));
      el.dataset.autogrowBound='1';
    }
  });
}

function previewTeamsText(text){
  const participants=parseTeamsParticipants(text);
  const preview=qs('#teamsPreview');
  if(!preview) return;
  preview.innerHTML = `<strong>ملخص أولي:</strong><br>
  عدد الأسماء المحتملة: ${participants.length}<br>

}

function parseTeamsParticipants(text){
  if(!text) return [];
  const lines=String(text).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const names=[];
  for(const line of lines){
    let cleaned=line
      .replace(/\[[^\]]+\]/g,'')
      .replace(/\([^\)]*(joined|left|انضم|غادر|دخل|خرج)[^\)]*\)/ig,'')
      .replace(/\b(joined|left|started|ended|meeting|chat)\b/ig,'')
      .replace(/^\d{1,2}:\d{2}(:\d{2})?\s*/,'')
      .replace(/[,:؛|-].*$/,'')
      .trim();
    if(cleaned.length>=3 && cleaned.length<=60 && !/[<>@]/.test(cleaned)){
      if(!names.includes(cleaned)) names.push(cleaned);
    }
  }
  return names.slice(0,40);
}

  const DATE_WORDS=/(?:^|\s)(?:التاريخ|تاريخ|الموافق)(?:\s|:|$)/;
  const DAY_WORDS=/(?:^|\s)(?:اليوم|هذا اليوم)(?:\s|:|$)/;
  const EXCLUDE=/(الميلاد|الهوية|الإقامة|الجواز|انتهاء|النهاية|نهاية|الإصدار|الاصدار|الحصول عليها|الشهادة|بداية|من تاريخ|إلى تاريخ|الى تاريخ|حسب الخطة|التاريخ الفعلي|تاريخ التدقيق|تاريخ انتهاء|تاريخ البداية)/;
  let serial=0, applying=false;
  const root=()=>document.querySelector(ROOT);
  const dateHeaders=()=>Array.from((root()||document).querySelectorAll('[data-field="التاريخ"].header-date'));
  const dayHeaders=()=>Array.from((root()||document).querySelectorAll('[data-field="اليوم"].header-day'));
  function clean(v){return String(v||'').trim();}
  function todayText(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')} / ${String(d.getMonth()+1).padStart(2,'0')} / ${d.getFullYear()}`;}
  function parse(v){
    v=clean(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
    v=v.replace(/[.\- ـ]/g,'/').replace(/\s+/g,'');
    const p=v.split('/').filter(Boolean); if(p.length!==3)return null;
    let d=+p[0],m=+p[1],y=+p[2]; if(y<100)y+=2000;
    const dt=new Date(y,m-1,d); if(!d||!m||!y||dt.getFullYear()!=y||dt.getMonth()!=m-1||dt.getDate()!=d)return null;
    return {date:dt,text:`${String(d).padStart(2,'0')} / ${String(m).padStart(2,'0')} / ${y}`};
  }
  function dayName(dateText){const p=parse(dateText);return p?['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][p.date.getDay()]:'';}
  function contextText(el){
    const cell=el.closest('td,th,.field,.ref-paragraph,.section');
    let t=(cell?cell.textContent:el.parentElement?.textContent||'').replace(/\s+/g,' ').trim();
    return t.slice(0,220);
  }
  function mark(el,kind='date'){if(!el||el.matches('.header-date,.header-day'))return; el.dataset.headerSync=kind; el.classList.add(kind==='date'?'synced-record-date':'synced-record-day');}
  function markTableDates(scope){
    scope.querySelectorAll('table').forEach(table=>{
      const rows=Array.from(table.rows||[]); if(!rows.length)return;
      let headerRow=rows.find(r=>Array.from(r.cells).some(c=>/التاريخ|تاريخ|اليوم/.test(c.textContent||''))); if(!headerRow)return;
      Array.from(headerRow.cells).forEach((c,idx)=>{
        const label=(c.textContent||'').replace(/\s+/g,' ').trim(); if(EXCLUDE.test(label))return;
        const kind=DAY_WORDS.test(label)&&!DATE_WORDS.test(label)?'day':(DATE_WORDS.test(label)?'date':null); if(!kind)return;
        const col=idx; rows.slice(rows.indexOf(headerRow)+1).forEach(r=>{const td=r.cells[col]; if(!td)return; td.querySelectorAll('input,textarea,select').forEach(el=>mark(el,kind));});
      });
    });
  }
  function replaceBlankDateText(scope){
    const walker=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT); const nodes=[]; while(walker.nextNode())nodes.push(walker.currentNode);
    const re=/((?:التاريخ|تاريخ|الموافق)\s*[:：]?\s*)(?:[._ـ\s]*\/[._ـ\s]*\/[._ـ\s]*(?:14\d{0,2})?\s*هـ?)/g;
    nodes.forEach(n=>{if(!n.parentElement||n.parentElement.closest('script,style,input,textarea,select'))return; const txt=n.nodeValue||''; if(!re.test(txt))return; re.lastIndex=0;
      const frag=document.createDocumentFragment(); let last=0,m; while((m=re.exec(txt))){
        const before=txt.slice(last,m.index); if(before)frag.appendChild(document.createTextNode(before)); frag.appendChild(document.createTextNode(m[1]));
        const inp=document.createElement('input'); inp.type='text'; inp.className='ref-inline-input synced-record-date'; inp.setAttribute('autocomplete','off'); inp.dataset.field=`${current?.id||'record'}_autosync_date_${++serial}`; inp.dataset.headerSync='date'; frag.appendChild(inp); last=m.index+m[0].length;
      }
      if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last))); n.replaceWith(frag);
    });
  }
  function discover(){
    const scope=root(); if(!scope)return; replaceBlankDateText(scope); markTableDates(scope);
    scope.querySelectorAll('input,textarea,select').forEach(el=>{
      if(el.matches('.header-date,.header-day,[data-header-sync]'))return;
      const k=el.dataset.field||el.getAttribute('name')||''; const ctx=(k+' '+contextText(el)).replace(/\s+/g,' ');
      if(EXCLUDE.test(ctx))return;
      if(DAY_WORDS.test(ctx) && !DATE_WORDS.test(ctx) && (/اليوم/.test(k)||/^اليوم/.test(ctx))) mark(el,'day');
      else if(DATE_WORDS.test(ctx) && (/(التاريخ|تاريخ|الموافق)/.test(k)||el.closest('td')||el.closest('.ref-paragraph,.field'))) mark(el,'date');
    });
  }
  function syncAll(force=false){
    const scope=root(); if(!scope||applying)return; applying=true;
    try{
      const hs=dateHeaders(); if(!hs.length)return; let value=clean(hs.find(x=>clean(x.value))?.value)||todayText(); const p=parse(value); if(p)value=p.text;
      hs.forEach(h=>{h.value=value;}); const dn=dayName(value); dayHeaders().forEach(h=>h.value=dn);
      discover(); scope.querySelectorAll('[data-header-sync="date"]').forEach(el=>{
        const cur=clean(el.value); if(force||!cur||el.dataset.dateSyncAuto==='1'||cur===el.dataset.lastAutoDate){el.value=value;el.dataset.dateSyncAuto='1';el.dataset.lastAutoDate=value;}
        else el.dataset.dateSyncAuto='0';
      });
      scope.querySelectorAll('[data-header-sync="day"]').forEach(el=>{const cur=clean(el.value);if(force||!cur||el.dataset.dateSyncAuto==='1'||cur===el.dataset.lastAutoDate){el.value=dn;el.dataset.dateSyncAuto='1';el.dataset.lastAutoDate=dn;}else el.dataset.dateSyncAuto='0';});
    }finally{applying=false;}
  }
  document.addEventListener('input',e=>{
    const t=e.target; if(!(t instanceof HTMLElement))return;
    if(t.matches('.header-date')){dateHeaders().forEach(h=>{if(h!==t)h.value=t.value});syncAll(false);}
    else if(t.matches('[data-header-sync]')&&!applying)t.dataset.dateSyncAuto='0';
  },true);
  document.addEventListener('change',e=>{const t=e.target;if(!(t instanceof HTMLElement))return;if(t.matches('.header-date'))syncAll(false);if(t.matches('.header-day')){const v=t.value;dayHeaders().forEach(h=>h.value=v);}},true);
  function boot(){discover();syncAll(false);}
  document.addEventListener('DOMContentLoaded',()=>setTimeout(boot,0));
  const mo=new MutationObserver(()=>{clearTimeout(mo._t);mo._t=setTimeout(boot,20);}); document.addEventListener('DOMContentLoaded',()=>{const r=root();if(r)mo.observe(r,{childList:true,subtree:true});});
  window.RecordDateSync={refresh:boot,force:()=>syncAll(true)};
})();
</script>
<script id="RL78_WAKIL_RECORDS_CANONICAL_ARCHIVE">
(function(){
  'use strict';
  const CENTRAL_KEY='agent_records_archive_v4';
  let memory=[];

  async function readCloud(){
    const g=window.PlatformPersistenceGuard;
    if(!g||typeof g.readExactValues!=='function')throw new Error('طبقة الحفظ السحابي غير متاحة');
    const r=await g.readExactValues({moduleKey:'agent',scope:'school',keys:[CENTRAL_KEY]});
    if(!r||r.ok===false)throw new Error(r&&r.error||'تعذر قراءة أرشيف سجلات الوكيل');
    try{memory=JSON.parse((r.values&&r.values[CENTRAL_KEY])||'[]');if(!Array.isArray(memory))memory=[]}catch(_){memory=[]}
    return memory;
  }
  async function writeCloud(rows){
    const g=window.PlatformPersistenceGuard;
    const payload=JSON.stringify(rows||[]);
    const w=await g.writeExactValues({moduleKey:'agent',scope:'school',values:{[CENTRAL_KEY]:payload}});
    if(!w||w.ok===false)throw new Error(w&&w.error||'تعذر تثبيت سجل الوكيل سحابيًا');
    const v=await g.readExactValues({moduleKey:'agent',scope:'school',keys:[CENTRAL_KEY]});
    if(!v||v.ok===false)throw new Error(v&&v.error||'تعذر إعادة قراءة أرشيف الوكيل');
    try{memory=JSON.parse((v.values&&v.values[CENTRAL_KEY])||'[]');if(!Array.isArray(memory))memory=[]}catch(_){memory=[]}
    return memory;
  }
  function htmlSnapshot(){
    try{return typeof getCurrentRecordPrintableDocumentForArchive==='function'?getCurrentRecordPrintableDocumentForArchive():('<!DOCTYPE html>'+document.documentElement.outerHTML)}
    catch(_){return '<!DOCTYPE html>'+document.documentElement.outerHTML}
  }
  window.saveCurrent=async function(){
    if(!window.current||!current.id)return false;
    try{if(window.PlatformCloudSession&&typeof PlatformCloudSession.ensure==='function')await PlatformCloudSession.ensure()}catch(e){alert('تعذر تهيئة جلسة المدرسة السحابية.');return false}
    try{
      const data=typeof collect==='function'?collect():{};
      data['آخر حفظ']=new Date().toLocaleString('ar-SA');
      if(typeof formKey==='function')localStorage.setItem(formKey(),JSON.stringify(data));
      const rows=await readCloud();
      const folderId=String(current.id), folderName=String(current.title);
      const now=new Date().toISOString();
      const duplicateNo=rows.filter(r=>String(r.folderId||r.formId||'')===folderId).length+1;
      const sourceRecordId=Date.now();
      const personName=(typeof guessWakilPersonNameForRecordsArchive==='function'&&guessWakilPersonNameForRecordsArchive(data))||data['الاسم']||data['اسم الطالب']||data['اسم الموظف']||'';
      const row={
        id:sourceRecordId,sourceRecordId,formId:folderId,folderId,
        folderName,recordName:folderName,title:folderName,
        category:current.category||'shared',
        categoryLabel:typeof wakilCategoryLabel==='function'?wakilCategoryLabel(current.category||'shared'):(current.categoryTitle||''),
        personName,personType:(String(folderName).includes('موظ')||String(folderName).includes('معلم'))?'employee':'student',
        displayName:folderName+' - نسخة '+duplicateNo,duplicateNo,
        saveMode:'repeatable_form',
        academicYear:(typeof settings==='function'&&settings().year)||'',
        semester:(typeof settings==='function'&&settings().semester)||'الأول',
        data,
        htmlContent:typeof getCurrentFormHTMLForRecordsArchive==='function'?getCurrentFormHTMLForRecordsArchive():htmlSnapshot(),
        printableHTML:htmlSnapshot(),
        createdAt:new Date().toLocaleString('ar-SA'),updatedAt:now
      };
      rows.push(row);
      const verified=await writeCloud(rows);
      const ok=verified.some(r=>String(r.sourceRecordId||r.id)===String(sourceRecordId)&&String(r.folderId||r.formId||'')===folderId&&String(r.folderName||r.recordName||'')===folderName);
      if(!ok)throw new Error('لم يرجع السجل من السحابة داخل المجلد المطابق لاسمه');
      if(window.parent&&window.parent!==window){try{window.parent.postMessage({type:'WAKIL_RECORD_SAVED',payload:row},'*')}catch(_){}}
      alert('تم حفظ النموذج سحابيًا والتحقق من عودته إلى مجلد «'+folderName+'».');
      return true;
    }catch(e){
      console.error('[RL78 wakil archive]',e);
      alert('تعذر تأكيد حفظ سجل الوكيل سحابيًا: '+String(e&&e.message||e));
      return false;
    }
  };
})();
</script>
