<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الفصلية</title>
<script>document.documentElement.classList.add('ss-booting');</script><style>.ss-booting body{visibility:hidden}</style>
<script src="platform-cloud-session.js?v=20260905-RL33-complete-tab-role-isolation"></script><script src="platform-core-engine.js"></script><script src="cloud-file-engine.js"></script>
<script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Cairo,sans-serif;background:#f8fafc;color:#0f172a}.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 8px 30px #0f172a0d}.chip{border-radius:999px;padding:.25rem .65rem;font-size:11px;font-weight:800}button:disabled{opacity:.45;cursor:not-allowed}</style><script src="platform-page-navigation.js?v=20260830-nav2" defer></script>
</head>
<body><header class="bg-gradient-to-l from-emerald-900 via-teal-800 to-slate-900 text-white sticky top-0 z-40 shadow-xl"><div class="max-w-7xl mx-auto p-5 flex flex-wrap items-center justify-between gap-3"><div><div id="roleBadge" class="text-xs text-emerald-200 font-bold"></div><h1 id="planTitle" class="text-2xl font-black">الخطة الفصلية</h1><p class="text-xs text-white/70 mt-1">إعداد أسبوعي ← اعتماد المدير ← تنفيذ ← شاهد ← اعتماد التنفيذ</p></div><div class="flex gap-2"><button onclick="historyBack()" class="bg-white/10 border border-white/20 px-4 py-2 rounded-xl font-bold text-xs">↩ العودة للأقسام الرئيسية</button></div></div></header>
<main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-5"><section class="card p-4 flex flex-wrap gap-3 items-end"><div><label class="text-xs font-bold">الفصل الدراسي</label><select id="semester" class="block mt-1 border rounded-xl p-2 text-sm"><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option></select></div><div><label class="text-xs font-bold">العام الدراسي</label><select id="year" class="block mt-1 border rounded-xl p-2 text-sm"></select></div><button onclick="loadRows()" class="bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-bold">تحديث الخطة</button><div id="summary" class="mr-auto text-xs font-bold text-slate-500"></div></section><div id="notice" class="hidden rounded-2xl p-3 text-xs font-bold"></div><section id="weeks" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></section></main>
<div id="modal" class="hidden fixed inset-0 bg-slate-950/60 z-50 p-4 items-center justify-center"><div class="card max-w-xl w-full p-5 space-y-4"><div class="flex justify-between"><h2 id="mTitle" class="font-black text-lg"></h2><button onclick="closeModal()">✕</button></div><label class="text-xs font-bold">البرامج والمبادرات (كل برنامج في سطر)</label><textarea id="mPrograms" rows="5" class="w-full border rounded-xl p-3 text-sm"></textarea><label class="text-xs font-bold">ملاحظات</label><textarea id="mNotes" rows="3" class="w-full border rounded-xl p-3 text-sm"></textarea><div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold">إلغاء</button><button onclick="saveEdit()" class="px-4 py-2 bg-emerald-700 text-white rounded-xl text-xs font-bold">حفظ المسودة</button></div></div></div>
<script>
const DEFAULTS=[{weekKey:"1",weekOrder:1,title:"الأسبوع الأول",dates:"10/3 - 14/3",behavior:"الانضباط",event:null,isVacation:false,programs:["الأسبوع التمهيدي والتهيئة", "التوعية بقواعد السلوك والمواظبة"]},{weekKey:"2",weekOrder:2,title:"الأسبوع الثاني",dates:"17/3 - 21/3",behavior:"الانضباط",event:null,isVacation:false,programs:["برنامج تنفيذي وفق اختصاص القسم", "متابعة المستفيدين والتوثيق"]},{weekKey:"3",weekOrder:3,title:"الأسبوع الثالث",dates:"24/3 - 28/3",behavior:"العزيمة",event:null,isVacation:false,programs:["برنامج توعوي/تربوي", "مبادرة داعمة لأهداف الخطة"]},{weekKey:"4",weekOrder:4,title:"الأسبوع الرابع",dates:"2/4 - 6/4",behavior:"الانضباط",event:null,isVacation:false,programs:["برنامج وقائي", "نشاط تفاعلي"]},{weekKey:"5",weekOrder:5,title:"الأسبوع الخامس",dates:"9/4 - 13/4",behavior:"الانتماء",event:"اليوم الوطني السعودي",isVacation:false,programs:["الاحتفاء باليوم الوطني", "برنامج تعزيز الانتماء"]},{weekKey:"6",weekOrder:6,title:"الأسبوع السادس",dates:"16/4 - 20/4",behavior:"الانضباط",event:null,isVacation:false,programs:["برنامج تخصصي للقسم"]},{weekKey:"7",weekOrder:7,title:"الأسبوع السابع",dates:"23/4 - 27/4",behavior:"المثابرة",event:"اليوم العالمي للمعلم",isVacation:false,programs:["برنامج داعم", "المشاركة في المناسبة"]},{weekKey:"8",weekOrder:8,title:"الأسبوع الثامن",dates:"30/4 - 4/5",behavior:"الوسطية",event:"اليوم العالمي للصحة النفسية",isVacation:false,programs:["برنامج توعوي", "قياس أثر مبسط"]},{weekKey:"9",weekOrder:9,title:"الأسبوع التاسع",dates:"7/5 - 11/5",behavior:"الإيجابية",event:null,isVacation:false,programs:["برنامج تخصصي", "متابعة حالات التنفيذ"]},{weekKey:"10",weekOrder:10,title:"الأسبوع العاشر",dates:"14/5 - 18/5",behavior:"الانضباط",event:null,isVacation:false,programs:["متابعة التنفيذ", "توثيق الشواهد"]},{weekKey:"11",weekOrder:11,title:"الأسبوع الحادي عشر",dates:"28/5 - 2/6",behavior:"الإتقان",event:null,isVacation:false,programs:["برنامج تطويري", "مبادرة إثرائية"]},{weekKey:"12",weekOrder:12,title:"الأسبوع الثاني عشر",dates:"5/6 - 9/6",behavior:"الانضباط",event:null,isVacation:false,programs:["برنامج تخصصي للقسم"]},{weekKey:"13",weekOrder:13,title:"الأسبوع الثالث عشر",dates:"10/6 - 18/6",behavior:"التسامح",event:"اليوم العالمي للتسامح",isVacation:false,programs:["تفعيل المناسبة", "نشاط داعم"]},{weekKey:"14",weekOrder:14,title:"الأسبوع الرابع عشر",dates:"19/6 - 23/6",behavior:"المرونة",event:null,isVacation:false,programs:["برنامج متابعة"]},{weekKey:"15",weekOrder:15,title:"الأسبوع الخامس عشر",dates:"26/6 - 1/7",behavior:"الانضباط",event:null,isVacation:false,programs:["مبادرة تعزيز الانضباط"]},{weekKey:"16",weekOrder:16,title:"الأسبوع السادس عشر",dates:"4/7 - 8/7",behavior:"الانتماء",event:"اليوم العالمي للغة العربية",isVacation:false,programs:["نشاط تفاعلي", "تفعيل المناسبة"]},{weekKey:"17",weekOrder:17,title:"الأسبوع السابع عشر",dates:"11/7 - 15/7",behavior:"العزيمة",event:null,isVacation:false,programs:["برنامج ختامي"]},{weekKey:"18",weekOrder:18,title:"الأسبوع الثامن عشر",dates:"18/7 - 22/7",behavior:"الانضباط",event:null,isVacation:false,programs:["متابعة ختامية", "جمع الشواهد"]},{weekKey:"19",weekOrder:19,title:"الأسبوع التاسع عشر",dates:"25/7 - 29/7",behavior:"المثابرة",event:null,isVacation:false,programs:["التقرير الختامي وتحليل النتائج"]}]; const ROLE_MAP={student_advisor:['التوجيه الطلابي','student_advisor.html','الموجه الطلابي'],activity_leader:['النشاط الطلابي','activity_leader.html','رائد النشاط'],kindergarten_teacher:['رياض الأطفال','kindergarten_teacher.html','معلمة رياض الأطفال'],health_advisor:['التوجيه الصحي','health_advisor.html','الموجه الصحي']};
let role='',planType='',returnPage='index.html',rows=[],editing=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t,ok=true){const n=document.getElementById('notice');n.className='rounded-2xl p-3 text-xs font-bold '+(ok?'bg-emerald-50 text-emerald-800 border border-emerald-200':'bg-rose-50 text-rose-800 border border-rose-200');n.textContent=t;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),4000)}
function historyBack(){location.href=returnPage}
function statusText(r){if(r.plan_status==='pending_manager')return ['بانتظار اعتماد المدير','bg-amber-100 text-amber-800'];if(r.plan_status==='approved'&&r.execution_status==='approved')return ['مكتمل ومعتمد','bg-emerald-100 text-emerald-800'];if(r.plan_status==='approved'&&r.execution_status==='pending_manager')return ['الشاهد بانتظار المراجعة','bg-sky-100 text-sky-800'];if(r.plan_status==='approved')return ['معتمد للتنفيذ','bg-teal-100 text-teal-800'];if(r.plan_status==='returned')return ['معاد للتعديل','bg-rose-100 text-rose-800'];return ['مسودة','bg-slate-100 text-slate-700']}
async function init(){for(let y=1448;y<=1548;y++)year.add(new Option(y+' هـ',y+' هـ')); try{await PlatformCloudSession.ensure();role=String(PlatformCloudSession.role()||'').toLowerCase()}catch(e){role=new URLSearchParams(location.search).get('role')||''} const cfg=ROLE_MAP[role];if(!cfg){document.body.innerHTML='<div class="p-10 text-center font-bold">هذا القسم متاح للأدوار المحددة فقط.</div>';document.documentElement.classList.remove('ss-booting');return} [planType,returnPage]=cfg;roleBadge.textContent=cfg[2];planTitle.textContent='الخطة الفصلية — '+planType;document.documentElement.classList.remove('ss-booting');await loadRows()}
async function loadRows(){try{const x=await PlatformCore.request('semester-plan-list',{academicYear:year.value,semester:semester.value});const map=new Map((x.rows||[]).map(r=>[String(r.week_key),r]));rows=DEFAULTS.map(w=>Object.assign({},w,map.get(String(w.weekKey))||{}));render()}catch(e){toast(e.message||'تعذر تحميل الخطة',false)}}
function render(){weeks.innerHTML=rows.map(r=>{const [st,cls]=statusText(r),locked=r.plan_status&&!['draft','returned'].includes(r.plan_status);return `<article class="card p-5 flex flex-col gap-3"><div class="flex justify-between"><span class="chip bg-slate-100">${esc(r.dates)}</span><span class="chip ${cls}">${st}</span></div><h3 class="font-black text-lg">${esc(r.title)}</h3><div class="text-xs font-bold text-emerald-800">القيمة: ${esc(r.behavior||'-')}</div>${r.event?`<div class="text-xs bg-amber-50 border border-amber-200 p-2 rounded-xl">⭐ ${esc(r.event_name||r.event)}</div>`:''}<ul class="text-xs space-y-1">${(r.programs||[]).map(p=>`<li>• ${esc(p)}</li>`).join('')}</ul>${r.manager_note?`<div class="text-xs bg-rose-50 border border-rose-200 p-2 rounded-xl"><b>ملاحظة المدير:</b> ${esc(r.manager_note)}</div>`:''}<div class="mt-auto pt-3 border-t flex flex-wrap gap-2"><button ${locked?'disabled':''} onclick="editWeek('${r.weekKey}')" class="px-3 py-2 bg-slate-100 rounded-xl text-xs font-bold">تعديل</button><button ${locked?'disabled':''} onclick="submitWeek('${r.weekKey}')" class="px-3 py-2 bg-amber-500 text-white rounded-xl text-xs font-bold">إرسال للاعتماد</button>${r.plan_status==='approved'&&r.execution_status!=='approved'?`<label class="px-3 py-2 bg-teal-700 text-white rounded-xl text-xs font-bold cursor-pointer">رفع شاهد التنفيذ<input type="file" class="hidden" accept="image/*,.pdf,.doc,.docx" onchange="uploadEvidence('${r.weekKey}',this)"></label>`:''}</div></article>`}).join('');const done=rows.filter(r=>r.execution_status==='approved').length;summary.textContent=`${planType} — معتمد التنفيذ: ${done} من ${rows.length} أسبوع`}
function editWeek(k){editing=rows.find(r=>String(r.weekKey||r.week_key)===String(k));mTitle.textContent=editing.title;mPrograms.value=(editing.programs||[]).join('\n');mNotes.value=editing.notes||'';modal.classList.remove('hidden');modal.classList.add('flex')}function closeModal(){modal.classList.add('hidden');modal.classList.remove('flex');editing=null}
async function persist(w){const payload={weekKey:String(w.weekKey||w.week_key),weekOrder:Number(w.weekOrder||w.week_order||0),title:w.title,dates:w.dates,behavior:w.behavior,event:w.event_name||w.event||null,isVacation:!!(w.isVacation||w.is_vacation),programs:w.programs||[],notes:w.notes||''};const x=await PlatformCore.request('semester-plan-save-week',{academicYear:year.value,semester:semester.value,week:payload});return x.row}
async function saveEdit(){try{editing.programs=mPrograms.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);editing.notes=mNotes.value.trim();await persist(editing);closeModal();toast('تم حفظ مسودة الأسبوع سحابيًا');await loadRows()}catch(e){toast(e.message,false)}}
async function submitWeek(k){try{let w=rows.find(r=>String(r.weekKey||r.week_key)===String(k));if(!w.id)w=await persist(w);await PlatformCore.request('semester-plan-submit-week',{id:w.id});toast('تم إرسال الأسبوع لمدير المدرسة للاعتماد');await loadRows()}catch(e){toast(e.message,false)}}
async function uploadEvidence(k,input){const file=input.files[0];if(!file)return;try{const w=rows.find(r=>String(r.weekKey||r.week_key)===String(k));if(!w?.id)throw new Error('تعذر تحديد سجل الأسبوع');const up=await CloudFileEngine.upload({file,ownershipScope:'school',moduleKey:'semester_plans',recordType:'semester_plan_week',recordId:w.id,relationType:'execution_evidence',metadata:{planType,weekKey:k}});await PlatformCore.request('semester-plan-submit-evidence',{id:w.id,fileId:up.file.id,fileName:file.name});toast('تم رفع شاهد التنفيذ وإرساله للمدير');await loadRows()}catch(e){toast(e.message,false)}finally{input.value=''}}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
