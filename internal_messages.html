<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المراسلات الداخلية</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f8f8;color:#263b3a;font-family:Tajawal,Arial,sans-serif}.top{height:70px;background:#fff;border-bottom:1px solid #e5eceb;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.top h1{font-size:21px;color:#087f78}.back{border:1px solid #d5e6e4;background:#fff;border-radius:12px;padding:10px 15px;cursor:pointer}.app{display:grid;grid-template-columns:220px 390px 1fr;min-height:calc(100vh - 70px)}.side,.list,.reader{background:#fff;border-left:1px solid #e8eeee}.side{padding:18px}.compose{width:100%;border:0;background:#087f78;color:#fff;border-radius:14px;padding:13px;font-weight:700;cursor:pointer}.nav{margin-top:18px}.nav button{width:100%;border:0;background:none;text-align:right;padding:12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between}.nav button.on{background:#eaf7f5;color:#087f78;font-weight:700}.list{overflow:auto}.search{padding:14px;border-bottom:1px solid #edf1f1;display:grid;gap:8px}.search input,.search select{width:100%;padding:10px;border:1px solid #dce7e6;border-radius:11px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.row{padding:15px;border-bottom:1px solid #eef2f2;cursor:pointer}.row:hover,.row.unread{background:#f0faf8}.row.pinned{border-right:4px solid #d5a62b}.rowtop{display:flex;justify-content:space-between;gap:8px}.row b{display:block}.meta{font-size:12px;color:#81908f;margin-top:5px}.receipt{font-size:11px;color:#087f78;margin-top:6px}.reader{padding:28px;overflow:auto}.empty{height:55vh;display:grid;place-items:center;color:#8b9998}.empty.mini{height:auto;padding:30px}.msgbody{white-space:pre-wrap;line-height:1.9;margin:25px 0}.pill{display:inline-block;padding:4px 9px;border-radius:10px;background:#eef7f6;font-size:12px}.pill.warn{background:#fff5df;color:#8a6110}.pill.ok{background:#e8f8ef;color:#167042}.t-official{background:#f3eaff;color:#6e3cab}.t-action_request{background:#fff0e7;color:#a34e19}.linked,.due{background:#f6fbfa;border:1px solid #dbecea;border-radius:14px;padding:12px;margin:16px 0}.linked a{color:#087f78;font-weight:700;margin-right:8px}.modal{position:fixed;inset:0;background:#1c323255;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.card{background:#fff;width:min(760px,100%);border-radius:20px;padding:22px;max-height:92vh;overflow:auto}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d9e5e4;border-radius:10px}.people,.roles{max-height:180px;overflow:auto;border:1px solid #e1e9e8;border-radius:10px;padding:8px}.person,.roles label{display:flex;gap:8px;padding:7px}.roles{display:grid;grid-template-columns:repeat(2,1fr)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.primary{background:#087f78;color:#fff;border:0;border-radius:10px;padding:11px 18px;cursor:pointer}.secondary{background:#edf4f3;border:0;border-radius:10px;padding:11px 18px;cursor:pointer}.bad{color:#b42318;margin-top:8px}.attachments{margin-top:20px}.att{display:block;width:100%;text-align:right;border:1px solid #dce9e8;background:#f8fbfb;border-radius:10px;padding:10px;margin:7px 0;cursor:pointer}.thread{margin-top:22px;border-top:1px solid #e9efee;padding-top:12px}.thread-msg{background:#f8fbfb;border-radius:12px;padding:10px;margin:8px 0}.thread-msg span{font-size:11px;color:#83908f;margin-right:8px}.thread-msg p{margin:7px 0 0;white-space:pre-wrap}.receipts{margin-top:20px}.receipt-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #dce7e6;font-size:13px}.attach-tools{display:flex;gap:8px;flex-wrap:wrap}.attach-chip{display:inline-flex;align-items:center;gap:5px;background:#eef8f6;border:1px solid #cae8e4;border-radius:999px;padding:6px 9px;margin:5px}.attach-chip button{border:0;background:none;cursor:pointer}.librow{display:flex;align-items:center;gap:8px;padding:9px;border-bottom:1px solid #eef2f2}.librow span{flex:1}.librow button{border:0;background:#edf5f4;border-radius:8px;padding:6px}.library-list{max-height:50vh;overflow:auto}.checkline{display:flex;gap:8px;align-items:center;margin:10px 0}.checkline input{width:auto}.chips{display:flex;gap:6px;flex-wrap:wrap}.reader-actions{border-top:1px solid #edf2f1;padding-top:15px}@media(max-width:1100px){.app{grid-template-columns:190px 330px 1fr}}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:flex;gap:8px;overflow:auto}.compose{width:auto;white-space:nowrap}.nav{display:flex;margin:0}.nav button{white-space:nowrap;gap:8px}.list{max-height:43vh}.reader{min-height:45vh}.filters{grid-template-columns:1fr}}</style></head><body>
<header class="top"><h1>✉️ المراسلات الداخلية</h1><button class="back" onclick="returnToSection()">العودة للقسم</button></header>
<main class="app"><aside class="side"><button class="compose" id="compose">+ رسالة جديدة</button><div class="nav"><button class="on" data-box="inbox">الوارد <span id="cInbox">0</span></button><button data-box="pinned">المثبتة <span id="cPinned">0</span></button><button data-box="sent">المرسلة <span id="cSent">0</span></button><button data-box="archive">الأرشيف <span id="cArchive">0</span></button></div><div style="margin-top:15px;font-size:12px;color:#667"><b>غير المقروء:</b> <span id="cUnread">0</span></div></aside><section class="list"><div class="search"><input id="q" placeholder="بحث في الرسائل"><div class="filters"><select id="filterType"><option value="">كل الأنواع</option><option value="message">رسالة</option><option value="official">تعميم رسمي</option><option value="notice">إشعار</option><option value="action_request">طلب إجراء</option></select><select id="filterPriority"><option value="">كل الأولويات</option><option value="normal">عادية</option><option value="important">مهمة</option><option value="urgent">عاجلة</option></select><select id="filterStatus"><option value="">كل الحالات</option><option value="unread">غير مقروءة</option><option value="ack">تم تأكيدها</option><option value="pending_ack">تنتظر التأكيد</option></select></div></div><div id="rows"></div></section><section class="reader" id="reader"><div class="empty">اختر رسالة لعرض محتواها</div></section></main>
<div class="modal" id="modal"><div class="card"><h2 style="color:#087f78">رسالة جديدة</h2><div class="field"><label>المستلمون</label><input id="peopleSearch" placeholder="ابحث بالاسم أو الصفة"><div class="people" id="people"></div></div><div class="field" id="groupWrap"><label>الإرسال إلى فئة وظيفية</label><div class="roles" id="groupRoles"></div></div><label class="checkline" id="allSchoolWrap"><input type="checkbox" id="allSchool"> جميع منسوبي المدرسة</label><div class="field"><label>نوع الرسالة</label><select id="messageType"><option value="message">رسالة داخلية</option><option value="notice">إشعار</option><option value="action_request">طلب إجراء</option><option value="official" id="officialOption">تعميم رسمي</option></select></div><div class="field"><label>العنوان</label><input id="subject"></div><div class="field"><label>الأولوية</label><select id="priority"><option value="normal">عادية</option><option value="important">مهمة</option><option value="urgent">عاجلة</option></select></div><div class="field"><label>نص الرسالة</label><textarea id="body" rows="7"></textarea></div><label class="checkline"><input type="checkbox" id="requireAck"> يتطلب تأكيد الاطلاع</label><div class="field"><label>موعد نهائي اختياري</label><input type="datetime-local" id="dueAt"></div><div class="field"><label>المرفقات</label><div class="attach-tools"><label class="secondary" style="cursor:pointer">📎 من الجهاز<input type="file" id="deviceFiles" multiple hidden></label><button type="button" class="secondary" id="libraryBtn">📚 من مكتبة القسم</button></div><div id="attachmentList"></div></div><div class="actions"><button class="primary" id="send">إرسال</button><button class="secondary" id="cancel">إلغاء</button></div><div id="status"></div></div></div>
<div class="modal" id="library"><div class="card"><h2 style="color:#087f78">📚 مكتبة القسم</h2><div class="field"><input id="librarySearch" placeholder="بحث باسم الملف"></div><div id="libraryList" class="library-list"></div><div class="actions"><button class="primary" id="libraryUse">استخدام الملفات المحددة</button><button class="secondary" id="libraryCancel">إلغاء</button></div></div></div>
<script>function returnToSection(){const p=new URLSearchParams(location.search),r=p.get("return_to");if(r&&!/^(?:https?:|javascript:|data:)/i.test(r)){location.href=r;return}const role=localStorage.getItem("platform_file_session_role")||"";const map={manager:"manager.html",school_manager:"manager.html",principal:"manager.html",agent:"agent.html",deputy:"agent.html",deputy_admin:"agent.html",deputy_academic:"agent.html",deputy_students:"agent.html",teacher:"teacher.html",student_advisor:"student_advisor.html",counselor:"student_advisor.html",activity_leader:"activity_leader.html",admin_employee:"administrative_employee_portal.html",administrative_employee:"administrative_employee_portal.html"};location.href=map[role]||"index.html"}</script><script src="platform-cloud-session.js"></script><script src="cloud-file-engine.js"></script><script src="internal-messaging.js"></script><script src="internal_messages_app.js"></script></body></html>
