name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "supabase/functions/platform-session/**"
      - "supabase/functions/platform-files/**"
      - "supabase/functions/platform-tasks/**"
      - "supabase/functions/platform-core/**"
      - "supabase/functions/platform-state/**"
      - "supabase/functions/platform-directory/**"
      - "supabase/functions/platform-document-workspace/**"
      - "supabase/functions/impact-measurement/**"
      - "supabase/functions/system-admin/**"
      - ".github/workflows/deploy-supabase-functions.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.116.0

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Deploy platform-session
        run: |
          supabase functions deploy platform-session \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy platform-files
        run: |
          supabase functions deploy platform-files \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy platform-tasks
        run: |
          supabase functions deploy platform-tasks \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy platform-core
        run: |
          supabase functions deploy platform-core \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy platform-state
        run: |
          supabase functions deploy platform-state \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy platform-directory
        run: |
          supabase functions deploy platform-directory \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy platform-document-workspace
        run: |
          supabase functions deploy platform-document-workspace \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Verify platform-document-workspace is reachable
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/platform-document-workspace?action=probe"
          echo "Checking: ${URL}"
          ok=0
          for attempt in 1 2 3 4 5; do
            http_code="$(curl --silent --show-error --location \
              --output /tmp/cdw_probe.json \
              --write-out '%{http_code}' \
              --connect-timeout 15 \
              --max-time 30 \
              "$URL" || true)"
            echo "Attempt ${attempt}: HTTP ${http_code}"
            cat /tmp/cdw_probe.json 2>/dev/null || true
            echo
            if [ "$http_code" = "200" ] && grep -q '"service":"platform-document-workspace"' /tmp/cdw_probe.json; then
              ok=1
              break
            fi
            sleep 6
          done
          if [ "$ok" != "1" ]; then
            echo "::error::platform-document-workspace was deployed but is not reachable from the Supabase project."
            exit 1
          fi
          if grep -q '"configured":false' /tmp/cdw_probe.json; then
            echo "::warning::platform-document-workspace is reachable, but ONLYOFFICE_DOCUMENT_SERVER_URL and/or ONLYOFFICE_JWT_SECRET are not configured in Supabase secrets."
          else
            echo "Cloud Document Workspace Edge Function is reachable and ONLYOFFICE configuration is present."
          fi

      - name: Deploy impact-measurement
        run: |
          supabase functions deploy impact-measurement \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy system-admin
        run: |
          supabase functions deploy system-admin \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt
