<script id="GLOBAL_VERTICAL_FLOATING_ICONS_LABELS_FIX">
(function(){
  if(window.__GLOBAL_VERTICAL_FLOATING_ICONS_SINGLE_LABEL__) return;
  window.__GLOBAL_VERTICAL_FLOATING_ICONS_SINGLE_LABEL__ = true;

  function clean(v){
    return String(v || '')
      .replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function labelFromElement(el){
    var saved = clean(el.dataset.originalTitle || el.dataset.originalAriaLabel || el.dataset.floatingOriginalLabel || '');
    if(saved) return saved;

    var title = clean(el.getAttribute('title') || '');
    if(title) return title;

    var aria = clean(el.getAttribute('aria-label') || '');
    if(aria && aria !== 'أداة') return aria;

    var childTitle = '';
    var titled = el.querySelector && el.querySelector('[title]');
    if(titled) childTitle = clean(titled.getAttribute('title') || '');
    if(childTitle) return childTitle;

    var text = clean(el.innerText || el.textContent || '');
    if(text && text.length > 1) return text;

    return '';
  }

  function removeNativeTooltip(node){
    if(!node || !node.hasAttribute) return;
    if(node.hasAttribute('title')){
      if(!node.dataset.originalTitle) node.dataset.originalTitle = node.getAttribute('title') || '';
      node.removeAttribute('title');
    }
  }

  function apply(){
    var bars = document.querySelectorAll('#ssFinalBar,.ss-final-bar,#smartSchoolFloatingBar,.smart-school-floating-bar,#top-floating-icons,.top-floating-icons,.floating-icons,.global-floating-icons,.top-actions-floating,.quick-actions-floating');
    bars.forEach(function(bar){
      Array.from(bar.children || []).forEach(function(el){
        if(el.hasAttribute('aria-label') && !el.dataset.originalAriaLabel){
          el.dataset.originalAriaLabel = el.getAttribute('aria-label') || '';
        }

        var label = labelFromElement(el);

        // لا نستخدم أي تخمين أو ترتيب رقمي حتى لا تظهر مسميات خاطئة.
        if(!label) label = 'أداة';

        el.dataset.floatingOriginalLabel = label;
        el.dataset.floatingLabel = label;
        el.removeAttribute('data-tooltip');
        el.setAttribute('aria-label', label);

        removeNativeTooltip(el);
        if(el.querySelectorAll){
          el.querySelectorAll('[title]').forEach(removeNativeTooltip);
        }

        el.onmouseenter = function(){
          removeNativeTooltip(el);
          if(el.querySelectorAll) el.querySelectorAll('[title]').forEach(removeNativeTooltip);
        };
      });
    });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply);
  else apply();

  setTimeout(apply, 120);
  setTimeout(apply, 500);
  setTimeout(apply, 1200);
  setTimeout(apply, 2500);
  setInterval(apply, 3000);
})();
</script>

  return null;
}

async function verifyWakilCentralReadback(recordId,folderId){
  const g=window.PlatformPersistenceGuard;
  const r=await g.readExactValues({moduleKey:'agent',scope:'school',keys:[WAKIL_RECORDS_CENTRAL_ARCHIVE_KEY]});
  if(!r||r.ok===false)throw new Error(r?.error||'تعذر إعادة قراءة الأرشيف بعد الحفظ');
  let rows=[];try{rows=JSON.parse(r.values?.[WAKIL_RECORDS_CENTRAL_ARCHIVE_KEY]||'[]');if(!Array.isArray(rows))rows=[]}catch(_){rows=[]}
  const found=rows.find(x=>String(x.id)===String(recordId));
  if(!found||String(found.folderId||found.formId)!==String(folderId))throw new Error('فشل التحقق السحابي من السجل داخل مجلده الصحيح');
  wakilCentralArchiveMemory=rows;
  cacheWakilCentralArchiveLocally(rows);
  return found;
}

function extractAIJson(text){
  if(!text) return null;
  let t=String(text).trim();
  t=t.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();
  const start=t.indexOf('{'), end=t.lastIndexOf('}');
  if(start>=0 && end>start) t=t.slice(start,end+1);
  try{return JSON.parse(t)}catch(e){return null}
}

function fillFieldByName(name,value,overwrite=false){
  if(value===undefined || value===null || String(value).trim()==='') return false;
  const el=qsa('[data-field]',qs('#formPage')).find(x=>x.dataset.field===name);
  if(!el) return false;
  if(!overwrite && el.value && el.value.trim()) return false;
  el.value=String(value).trim();
  el.dispatchEvent(new Event('input',{bubbles:true}));
  el.dispatchEvent(new Event('change',{bubbles:true}));
  if(el.tagName==='TEXTAREA') autoGrowOne(el);
  return true;
}
function fillFirstMatching(labels,value,overwrite=false){
  for(const label of labels){ if(fillFieldByName(label,value,overwrite)) return true; }
  return false;
}
function applyAIObject(obj,overwrite=false){
  let count=0;
  if(!obj || typeof obj!=='object') return 0;
  const aliases={
    'الإجراءات والتوصيات النهائية':['الإجراءات والتوصيات النهائية','الإجراءات النهائية','التوصيات النهائية'],
    'الإجراء المتخذ':['الإجراء المتخذ','الإجراءات المتخذة','الإجراءات','الإجراء','إجراء الوكيل','الإجراء النظامي'],
    'التوصيات':['التوصيات','توصيات الوكيل','التوصيات والمقترحات'],
    'ملاحظات':['ملاحظات','ملحوظات الزيارة','ملاحظات المناوبة','ملاحظات بداية اليوم','ملاحظات الفسحة','ملاحظات الانصراف'],
    'فرص التحسين':['فرص التحسين','جوانب التحسين'],
    'جوانب القوة':['جوانب القوة'],
    'خطة المتابعة':['خطة المتابعة','موعد المتابعة','تاريخ المتابعة'],
    'وصف الحالة':['وصف الحالة','تفاصيل الحالة','الحالات المرصودة'],
    'سبب التحويل':['سبب التحويل','سبب الاستئذان','سبب الغياب حسب الإفادة','أبرز الأسباب'],
    'نص القرار':['نص القرار','رأي الوكيل','قرار المدير']
  };
  for(const [k,v] of Object.entries(obj)){
    if(typeof v==='object') continue;
    if(fillFieldByName(k,v,overwrite)) {count++; continue;}
    for(const [main,names] of Object.entries(aliases)){
      if(k.includes(main) || names.some(n=>k.includes(n) || n.includes(k))){
        if(fillFirstMatching(names,v,overwrite)){count++; break;}
      }
    }
  }
  if(obj.فرص_التحسين) count += fillFirstMatching(['فرص التحسين','ملحوظات الزيارة','ملاحظات'],obj.فرص_التحسين,overwrite)?1:0;
  if(obj.التوصيات) count += fillFirstMatching(['التوصيات','توصيات الوكيل','الإجراءات والتوصيات النهائية'],obj.التوصيات,overwrite)?1:0;
  if(obj.الإجراءات) count += fillFirstMatching(['الإجراء المتخذ','الإجراءات المتخذة','الإجراءات والتوصيات النهائية'],obj.الإجراءات,overwrite)?1:0;
  return count;
}
function fallbackApplyAIText(text,overwrite=false){
  let count=0;
  const clean=String(text||'').replace(/```[\s\S]*?```/g,'').trim();
  if(!clean) return 0;
  const rec=qs('[data-field="الإجراءات والتوصيات النهائية"]');
  if(rec && (overwrite || !rec.value.trim())){rec.value=clean;autoGrowOne(rec);count++;}
  const recommendations=(clean.match(/(?:التوصيات|توصيات)[:：]?([\s\S]*?)(?:الإجراءات|فرص|جوانب|$)/)||[])[1];
  if(recommendations) count += fillFirstMatching(['التوصيات','توصيات الوكيل','التوصيات والمقترحات'],recommendations.trim(),overwrite)?1:0;
  const actions=(clean.match(/(?:الإجراءات|إجراءات|الإجراء)[:：]?([\s\S]*?)(?:التوصيات|فرص|جوانب|$)/)||[])[1];
  if(actions) count += fillFirstMatching(['الإجراء المتخذ','الإجراءات المتخذة','الإجراءات والتوصيات النهائية'],actions.trim(),overwrite)?1:0;
  const improvements=(clean.match(/(?:فرص التحسين|فرص)[:：]?([\s\S]*?)(?:التوصيات|الإجراءات|$)/)||[])[1];
  if(improvements) count += fillFirstMatching(['فرص التحسين','ملحوظات الزيارة','ملاحظات'],improvements.trim(),overwrite)?1:0;
  return count;

function autoGrowOne(el){
  if(!el || el.tagName!=='TEXTAREA') return;
  const isTable = el.classList.contains('table-textarea') || el.hasAttribute('data-table');
  const isLong = el.closest('.note') || el.dataset.field === 'الإجراءات والتوصيات النهائية';
  const maxHeight = isTable ? 58 : (isLong ? 92 : 78);
  const minHeight = isTable ? 30 : 34;
  el.style.height='auto';
  const nextHeight = Math.max(minHeight, Math.min(el.scrollHeight, maxHeight));
  el.style.height = nextHeight + 'px';
  el.style.overflow = el.scrollHeight > maxHeight ? 'hidden' : 'hidden';
}
function autoGrowAll(root=document){
  qsa('textarea', root).forEach(autoGrowOne);
}
function bindAutoGrow(root=document){
  qsa('textarea', root).forEach(el=>{
    autoGrowOne(el);
    if(!el.dataset.autogrowBound){
      el.addEventListener('input',()=>autoGrowOne(el));
      el.addEventListener('change',()=>autoGrowOne(el));
      el.dataset.autogrowBound='1';
    }
  });
}

function previewTeamsText(text){
  const participants=parseTeamsParticipants(text);
  const preview=qs('#teamsPreview');
  if(!preview) return;
  preview.innerHTML = `<strong>ملخص أولي:</strong><br>
  عدد الأسماء المحتملة: ${participants.length}<br>
  ${participants.slice(0,12).join('، ')}${participants.length>12?' ...':''}`;
}

function parseTeamsParticipants(text){
  if(!text) return [];
  const lines=String(text).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const names=[];
  for(const line of lines){
    let cleaned=line
      .replace(/\[[^\]]+\]/g,'')
      .replace(/\([^\)]*(joined|left|انضم|غادر|دخل|خرج)[^\)]*\)/ig,'')
      .replace(/\b(joined|left|started|ended|meeting|chat)\b/ig,'')
      .replace(/^\d{1,2}:\d{2}(:\d{2})?\s*/,'')
      .replace(/[,:؛|-].*$/,'')
      .trim();
    if(cleaned.length>=3 && cleaned.length<=60 && !/[<>@]/.test(cleaned)){
      if(!names.includes(cleaned)) names.push(cleaned);
    }
  }
  return names.slice(0,40);
}

      const [studentsRaw,staffRaw,teachersRaw]=await Promise.all([
        typeof SchoolInformationSource.getStudents==='function'?SchoolInformationSource.getStudents(!!force):[],
        typeof SchoolInformationSource.getStaff==='function'?SchoolInformationSource.getStaff(false):[],
        typeof SchoolInformationSource.getTeachers==='function'?SchoolInformationSource.getTeachers(false):[]
      ]);
      const ctx=typeof SchoolInformationSource.context==='function'?SchoolInformationSource.context():{};
      const sid=safe(ctx?.schoolId||'');
      const active=activeSchoolId();
      if(active&&sid&&active!==sid) throw new Error('WAKIL_ROSTER_SCHOOL_SCOPE_MISMATCH');
      roster.schoolId=sid||active;
      roster.students=(Array.isArray(studentsRaw)?studentsRaw:[]).filter(x=>!roster.schoolId||!x?.school_id||safe(x.school_id)===roster.schoolId).map(normalizeStudent).filter(x=>x.name);
      roster.staff=(Array.isArray(staffRaw)?staffRaw:[]).filter(x=>!roster.schoolId||!x?.school_id||safe(x.school_id)===roster.schoolId).map(normalizeStaff).filter(x=>x.name);
      roster.teachers=(Array.isArray(teachersRaw)?teachersRaw:[]).filter(x=>!roster.schoolId||!x?.school_id||safe(x.school_id)===roster.schoolId).map(normalizeStaff).filter(x=>x.name);
      roster.studentByName=new Map(); roster.staffByName=new Map(); roster.teacherByName=new Map();
      roster.students.forEach(x=>putMap(roster.studentByName,x)); roster.staff.forEach(x=>putMap(roster.staffByName,x)); roster.teachers.forEach(x=>putMap(roster.teacherByName,x));
      roster.loaded=true;
      buildRosterDatalists(); bindRosterFields();
      return true;
    })().catch(e=>{console.warn('[wakil school information bridge]',e);return false;}).finally(()=>{roster.loading=null;});
    return roster.loading;
  }
  function datalist(id,rows){
    let dl=document.getElementById(id); if(!dl){dl=document.createElement('datalist');dl.id=id;document.body.appendChild(dl);}
    dl.innerHTML=rows.map(x=>'<option value="'+safe(x.name).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'"></option>').join('');
  }
  function buildRosterDatalists(){
    datalist('wakil-school-students-list',roster.students);
    datalist('wakil-school-staff-list',roster.staff);
    datalist('wakil-school-teachers-list',roster.teachers);
    const mixed=[...roster.students,...roster.staff].filter((x,i,a)=>a.findIndex(y=>y.name===x.name)===i);
    datalist('wakil-school-people-list',mixed);
  }
  function rosterKind(label){
    const s=safe(label);
    if(/اسم الطالب\s*\/\s*الموظف/.test(s)) return 'mixed';
    if(/اسم الطالب|الطالب$/.test(s)) return 'student';
    if(/اسم المعلم|المعلم الغائب|المعلم المنفذ/.test(s)) return 'teacher';
    if(/اسم الموظف|اسم المحول|المناوب|مشرف الانصراف/.test(s)) return 'staff';
    return '';
  }
  function tableHeaderFor(el){
    const td=el.closest('td'),table=el.closest('table'); if(!td||!table)return '';
    const th=table.querySelectorAll('thead th')[td.cellIndex]; return safe(th?.textContent||'');
  }
  function fillField(name,value,overwrite){
    if(!safe(value))return;
    const el=Array.from(document.querySelectorAll('#formPage [data-field]')).find(x=>safe(x.dataset.field)===name);
    if(!el)return; if(!overwrite&&safe(el.value))return; el.value=safe(value); el.dispatchEvent(new Event('input',{bubbles:true}));
  }
  function applyStudent(x){
    fillField('السجل المدني',x.nationalId,false); fillField('رقم الهوية',x.nationalId,false);
    fillField('المرحلة',x.stage,false); fillField('الصف',x.grade,false); fillField('الفصل',x.section,false);
    fillField('ولي الأمر',x.guardianName,false); fillField('رقم التواصل',x.guardianPhone,false);
  }
  function applyStaff(x){
    fillField('رقم الهوية',x.nationalId,false); fillField('السجل المدني',x.nationalId,false);
    fillField('المسمى الوظيفي',x.jobTitle,false);
    fillField('المسمى / التخصص',[x.jobTitle,x.specialty].filter(Boolean).join(' / '),false);
    fillField('الصف / العمل',x.jobTitle||x.specialty,false); fillField('المادة',x.specialty,false);
  }
  function onRosterPick(el,kind){
    const name=safe(el.value); if(!name)return;
    if(kind==='student'){const x=roster.studentByName.get(name);if(x)applyStudent(x);}
    else if(kind==='teacher'){const x=roster.teacherByName.get(name)||roster.staffByName.get(name);if(x)applyStaff(x);}
    else if(kind==='staff'){const x=roster.staffByName.get(name);if(x)applyStaff(x);}
    else if(kind==='mixed'){const s=roster.studentByName.get(name);if(s)applyStudent(s);else{const x=roster.staffByName.get(name);if(x)applyStaff(x);}}
  }
  function rosterRows(kind){
    if(kind==='student')return roster.students;
    if(kind==='teacher')return roster.teachers.length?roster.teachers:roster.staff;
    if(kind==='staff')return roster.staff;
    return [...roster.students,...roster.staff].filter((x,i,a)=>a.findIndex(y=>y.name===x.name)===i);
  }
  function replaceNameInputWithSelect(el,kind){
    if(!el||el.tagName!=='INPUT'||el.type==='hidden')return el;
    const rows=rosterRows(kind); if(!rows.length)return el;
    const sel=document.createElement('select');
    Array.from(el.attributes).forEach(a=>{if(a.name!=='list'&&a.name!=='type'&&a.name!=='value')sel.setAttribute(a.name,a.value)});
    sel.dataset.wakilRosterKind=kind;
    const currentValue=safe(el.value);
    sel.innerHTML='<option value="">اختر من مركز المعلومات</option>'+rows.map(x=>'<option value="'+safe(x.name).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'">'+safe(x.name).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</option>').join('');
    if(currentValue&&!rows.some(x=>x.name===currentValue)){
      const opt=document.createElement('option');opt.value=currentValue;opt.textContent=currentValue;sel.appendChild(opt);
    }
    sel.value=currentValue;
    el.replaceWith(sel);
    return sel;
  }
  function bindOne(el,label){
    if(!el||!('value' in el))return; const kind=rosterKind(label); if(!kind)return;
    el=replaceNameInputWithSelect(el,kind)||el;
    el.dataset.wakilRosterKind=kind;
    if(el.dataset.wakilRosterBound==='1')return; el.dataset.wakilRosterBound='1';
    el.addEventListener('change',()=>onRosterPick(el,kind));
  }
  function escOption(v){return safe(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
  function uniqueSorted(values){return Array.from(new Set((values||[]).map(safe).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ar',{numeric:true,sensitivity:'base'}));}
  function studentNameField(){
    const page=document.getElementById('formPage'); if(!page)return null;
    return Array.from(page.querySelectorAll('[data-field]')).find(el=>rosterKind(el.dataset.field)==='student')||null;
  }
  function studentGradeField(){
    const page=document.getElementById('formPage'); if(!page)return null;
    return Array.from(page.querySelectorAll('[data-field]')).find(el=>safe(el.dataset.field)==='الصف')||null;
  }
  function studentSectionField(){
    const page=document.getElementById('formPage'); if(!page)return null;
    return Array.from(page.querySelectorAll('[data-field]')).find(el=>['الفصل','الشعبة'].includes(safe(el.dataset.field)))||null;
  }
  function ensureCascadeSelect(el, marker){
    if(!el)return null;
    if(el.tagName==='SELECT'){el.dataset[marker]='1';return el;}
    if(el.tagName!=='INPUT'||el.type==='hidden')return el;
    const sel=document.createElement('select');
    Array.from(el.attributes).forEach(a=>{if(a.name!=='type'&&a.name!=='value'&&a.name!=='list')sel.setAttribute(a.name,a.value)});
    sel.value=safe(el.value);
    sel.dataset[marker]='1';
    el.replaceWith(sel);
    return sel;
  }
  function setSelectOptions(sel, placeholder, values, keepValue){
    if(!sel)return;
    const old=safe(keepValue!==undefined?keepValue:sel.value);
    const opts=uniqueSorted(values);
    sel.innerHTML='<option value="">'+escOption(placeholder)+'</option>'+opts.map(v=>'<option value="'+escOption(v)+'">'+escOption(v)+'</option>').join('');
    if(old&&!opts.includes(old)){const o=document.createElement('option');o.value=old;o.textContent=old;sel.appendChild(o);}
    sel.value=old;
  }
  function filteredStudentsByCascade(grade,section){
    return roster.students.filter(s=>(!grade||safe(s.grade)===safe(grade))&&(!section||safe(s.section)===safe(section)));
  }
  function refreshStudentCascade(preserveStudent){
    const nameEl=studentNameField(); if(!nameEl)return;
    const gradeEl=studentGradeField();
    const sectionEl=studentSectionField();
    const grade=safe(gradeEl?.value);
    const section=safe(sectionEl?.value);
    const currentStudent=safe(preserveStudent!==undefined?preserveStudent:nameEl.value);
    if(sectionEl){
      const sections=roster.students.filter(s=>!grade||safe(s.grade)===grade).map(s=>s.section);
      setSelectOptions(sectionEl,grade?'اختر الفصل / الشعبة':'اختر الصف أولاً',sections,section);
      sectionEl.disabled=!grade;
    }
    const effectiveSection=safe(sectionEl?.value);
    const students=filteredStudentsByCascade(grade,effectiveSection);
    setSelectOptions(nameEl,grade?(effectiveSection?'اختر الطالب من الفصل':'اختر الطالب من الصف'):'اختر الصف أولاً',students.map(s=>s.name),currentStudent);
    nameEl.disabled=!grade;
  }
  function bindStudentCascade(){
    const nameCandidate=studentNameField(); if(!nameCandidate||!roster.students.length)return;
    let gradeEl=ensureCascadeSelect(studentGradeField(),'wakilStudentGradeSelect');
    let sectionEl=ensureCascadeSelect(studentSectionField(),'wakilStudentSectionSelect');
    let nameEl=nameCandidate;
    if(nameEl.tagName!=='SELECT') nameEl=replaceNameInputWithSelect(nameEl,'student')||nameEl;
    if(!gradeEl){
      /* بعض السجلات الطلابية لا تتضمن الصف؛ لا نضيف حقلاً جديداً حفاظاً على النموذج الرسمي. */
      return;
    }
    setSelectOptions(gradeEl,'اختر الصف',roster.students.map(s=>s.grade),gradeEl.value);
    if(gradeEl.dataset.wakilStudentCascadeBound!=='1'){
      gradeEl.dataset.wakilStudentCascadeBound='1';
      gradeEl.addEventListener('change',()=>{
        if(sectionEl)sectionEl.value='';
        if(nameEl)nameEl.value='';
        refreshStudentCascade('');
      });
    }
    if(sectionEl&&sectionEl.dataset.wakilStudentCascadeBound!=='1'){
      sectionEl.dataset.wakilStudentCascadeBound='1';
      sectionEl.addEventListener('change',()=>{if(nameEl)nameEl.value='';refreshStudentCascade('');});
    }
    if(nameEl&&nameEl.dataset.wakilStudentCascadeBound!=='1'){
      nameEl.dataset.wakilStudentCascadeBound='1';
      nameEl.addEventListener('change',()=>{
        const st=roster.studentByName.get(safe(nameEl.value));
        if(!st)return;
        if(gradeEl&&safe(gradeEl.value)!==safe(st.grade)){gradeEl.value=safe(st.grade);}
        if(sectionEl){
          const sections=roster.students.filter(s=>safe(s.grade)===safe(st.grade)).map(s=>s.section);
          setSelectOptions(sectionEl,'اختر الفصل / الشعبة',sections,st.section);
          sectionEl.disabled=false;
          sectionEl.value=safe(st.section);
        }
        applyStudent(st);
      });
    }
    refreshStudentCascade(safe(nameEl?.value));
  }
  function bindRosterFields(){
    const page=document.getElementById('formPage'); if(!page)return;
    page.querySelectorAll('[data-field]').forEach(el=>bindOne(el,el.dataset.field));
    page.querySelectorAll('[data-table]').forEach(el=>bindOne(el,tableHeaderFor(el)));
    bindStudentCascade();
  }

  const originalRenderForm=window.renderForm;
  if(typeof originalRenderForm==='function'){
    window.renderForm=function(){const r=originalRenderForm.apply(this,arguments);setTimeout(()=>{bindRosterFields();if(!roster.loaded)loadRoster(false);},0);return r;};
  }
  setTimeout(()=>loadRoster(false),0);
  window.addEventListener('school-information-source-invalidated',()=>loadRoster(true));
})();
</script>
