<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>البوابة الرسمية لرفع عذر الغياب</title><script src="platform-cloud-session.js"></script><style>body{font-family:Tahoma,Arial;background:#eef9f7;margin:0;color:#18323b}.box{max-width:720px;margin:40px auto;background:#fff;border-radius:24px;padding:26px;box-shadow:0 15px 45px #15445a20}h1{color:#15445A}input,textarea,button{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbdde0;border-radius:12px;font-size:16px;margin:7px 0}button{background:#0d9488;color:#fff;font-weight:800}.meta{background:#f4faf9;padding:15px;border-radius:15px;line-height:2}.ok{text-align:center;padding:30px;color:#087f5b}small{color:#64748b}</style></head><body><div class="box"><h1 id="school">البوابة الرسمية للمدرسة لرفع أعذار الغياب</h1><p>هذه الصفحة مخصصة لاستلام عذر غياب الطالب - الطالبة بصورة آمنة.</p><div id="meta" class="meta">جاري التحقق من الرابط…</div><div id="verify" hidden><label>رقم السجل المدني للطالب - الطالبة</label><input id="civil" inputmode="numeric" autocomplete="off" placeholder="يمكن كتابة الأرقام بالعربية أو الإنجليزية"><button onclick="verifyCivil()">تحقق</button></div><div id="upload" hidden><p><b>تم التحقق بنجاح.</b></p><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf,.doc,.docx"><textarea id="note" maxlength="200" rows="4" placeholder="ملاحظة اختيارية — بحد أقصى 200 حرف"></textarea><small><span id="count">0</span>/200</small><button onclick="submitExcuse()">إرسال العذر</button></div><div id="done" class="ok" hidden></div></div><script>
const token=new URLSearchParams(location.search).get('token')||'';const API='platform-absence-excuses';let verified='';const $=x=>document.getElementById(x);function digits(s){return String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'')}async function req(action,body,form){let c=window.PlatformCloudSession?.connectionConfig?.()||{};let u=c.url?`${c.url}/functions/v1/${API}?action=${action}`:`${location.origin}/functions/v1/${API}?action=${action}`;let r=await fetch(u,{method:'POST',headers:form?{}:{'content-type':'application/json'},body:form?body:JSON.stringify(body||{})});let j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.error||'تعذر تنفيذ العملية');return j}
async function start(){try{let j=await req('resolve',{token});$('school').textContent=(j.school_name?j.school_name+' — ':'')+'البوابة الرسمية لرفع أعذار الغياب';$('meta').innerHTML=`<b>الطالب - الطالبة:</b> ${j.student_name}<br><b>المرحلة:</b> ${j.stage||'—'} — <b>الصف:</b> ${j.grade||'—'} — <b>الفصل:</b> ${j.class_name||'—'}<br><b>عدد أيام الغياب:</b> ${j.absence_days}<br><b>تاريخ الغياب:</b> ${j.absence_date}`;$('verify').hidden=false}catch(e){$('meta').textContent=e.message}}async function verifyCivil(){try{let j=await req('verify',{token,civil_id:digits($('civil').value)});verified=j.verification_token;$('verify').hidden=true;$('upload').hidden=false}catch(e){alert(e.message)}}$('note').oninput=()=>{$('count').textContent=$('note').value.length};async function submitExcuse(){try{let fs=[...$('files').files];if(!fs.length)throw Error('أرفق ملف العذر');let f=new FormData();f.append('token',token);f.append('verification_token',verified);f.append('note',$('note').value);for(let file of fs){let bytes=await file.arrayBuffer();if(!bytes.byteLength)throw Error('تعذر قراءة أحد الملفات');f.append('files',new Blob([bytes],{type:file.type||'application/octet-stream'}),file.name)}let j=await req('submit',f,true);$('upload').hidden=true;$('done').hidden=false;$('done').innerHTML=`<h2>شكرًا لكم</h2><p>تم استلام عذر الغياب بنجاح وسيتم مراجعته من المدرسة.</p><b>الرقم المرجعي: ${j.reference}</b>`}catch(e){alert(e.message)}}start();</script></body></html>
