<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الخطة الفصلية</title>
<script>document.documentElement.classList.add('ss-booting')</script><style>.ss-booting body{visibility:hidden}</style>
<script src="platform-cloud-session.js?v=20260911-RL77-delegated-role-effective-access"></script><script src="platform-core-engine.js"></script><script src="cloud-file-engine.js"></script><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:Tajawal;background:#f6faf9}.card{background:#fff;border:1px solid #dfeae7;border-radius:24px;box-shadow:0 10px 28px #0f172a0b}.chip{padding:.3rem .65rem;border-radius:999px;font-size:11px;font-weight:800}.modal{position:fixed;inset:0;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.show{display:flex}.modalbox{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:20px}.btn{border-radius:12px;padding:.65rem .9rem;font-size:12px;font-weight:800}.btn:disabled{opacity:.45;cursor:not-allowed}@media(max-width:640px){input,select,textarea,button{font-size:16px!important}}</style></head>
<body><header class="bg-gradient-to-l from-[#15445A] via-[#0DA9A6] to-[#15445A] text-white sticky top-0 z-40 shadow-xl"><div class="max-w-7xl mx-auto p-5 flex flex-wrap items-center justify-between gap-3"><div><div id="roleBadge" class="text-xs text-cyan-100 font-bold"></div><h1 id="planTitle" class="text-2xl font-black">الخطة الفصلية</h1><p class="text-xs text-white/80 mt-1">إعداد أسابيع الفصل ← اعتماد المدير ← تنفيذ أسبوعي ← شواهد ← تقييم المدير</p></div><button onclick="historyBack()" class="btn bg-white/10 border border-white/20">↩ العودة للقسم</button></div></header>
<main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-5"><section class="card p-4 flex flex-wrap gap-3 items-end"><div><label class="text-xs font-bold">الفصل الدراسي</label><select id="semester" class="block mt-1 border rounded-xl p-2 text-sm"><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option></select></div><div><label class="text-xs font-bold">العام الدراسي</label><select id="year" class="block mt-1 border rounded-xl p-2 text-sm"></select></div><button onclick="loadRows()" class="btn bg-teal-700 text-white">تحديث الخطة</button><div id="summary" class="mr-auto text-xs font-bold text-slate-500"></div></section><div id="notice" class="hidden rounded-2xl p-3 text-xs font-bold"></div><section id="weeks" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"></section></main>
<div id="editModal" class="modal"><div class="modalbox"><h2 class="font-black text-lg mb-3">تعديل بيانات الأسبوع</h2><label class="text-xs font-bold">البرامج / الأعمال (كل بند في سطر)</label><textarea id="mPrograms" rows="8" class="w-full border rounded-xl p-3 mt-1"></textarea><label class="text-xs font-bold block mt-3">ملاحظات</label><textarea id="mNotes" rows="3" class="w-full border rounded-xl p-3 mt-1"></textarea><div class="flex gap-2 mt-4"><button onclick="saveEdit()" class="btn bg-teal-700 text-white">حفظ المسودة</button><button onclick="closeEdit()" class="btn bg-slate-100">إلغاء</button></div></div></div>
<div id="evidenceModal" class="modal"><div class="modalbox"><div class="flex justify-between gap-3"><div><h2 class="font-black text-lg">شواهد تنفيذ الأسبوع</h2><p class="text-xs text-slate-500">يمكن إرفاق أكثر من شاهد: ملف جديد، من مكتبة قسمك، أو رابط خارجي.</p></div><button onclick="closeEvidence()" class="btn bg-slate-100">إغلاق</button></div><div class="flex flex-wrap gap-2 my-4"><label class="btn bg-teal-700 text-white cursor-pointer">رفع ملفات<input id="evidenceFiles" type="file" multiple class="hidden" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" onchange="addUploads(this)"></label><button onclick="openLibrary()" class="btn bg-sky-700 text-white">من مكتبة قسمي</button><button onclick="addExternal()" class="btn bg-violet-700 text-white">رابط خارجي</button></div><div id="evidenceList" class="space-y-2"></div><button id="sendEvidenceBtn" onclick="submitEvidence()" class="btn bg-emerald-700 text-white mt-4">إرسال الشواهد للمدير</button></div></div>
<div id="libraryModal" class="modal"><div class="modalbox"><div class="flex justify-between"><h2 class="font-black text-lg">مكتبة قسمي</h2><button onclick="libraryModal.classList.remove('show')" class="btn bg-slate-100">إغلاق</button></div><div id="libraryList" class="space-y-2 mt-4"></div></div></div>
<script>
const DEFAULTS=Array.from({length:19},(_,i)=>({weekKey:String(i+1),weekOrder:i+1,title:`الأسبوع ${i+1}`,dates:'',behavior:'',event:null,isVacation:false,programs:[]}));
const ROLE_MAP={student_advisor:['التوجيه الطلابي','student_advisor.html','الموجه الطلابي'],activity_leader:['النشاط الطلابي','activity_leader.html','رائد النشاط'],kindergarten_teacher:['رياض الأطفال','kindergarten_teacher.html','معلمة رياض الأطفال'],health_advisor:['التوجيه الصحي','health_advisor.html','الموجه الصحي']};
let role='',planType='',returnPage='',rows=[],editing=null,evidenceWeek=null,evidenceDraft=[];
const $=id=>document.getElementById(id); function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t,ok=true){notice.className='rounded-2xl p-3 text-xs font-bold '+(ok?'bg-emerald-50 text-emerald-800':'bg-rose-50 text-rose-800');notice.textContent=t;notice.classList.remove('hidden');setTimeout(()=>notice.classList.add('hidden'),3500)}
function historyBack(){location.href=returnPage||'teacher.html'}
function statusText(r){if(r.plan_status==='pending_manager')return['بانتظار اعتماد المدير','bg-amber-100 text-amber-800'];if(r.plan_status==='returned')return['معادة للتعديل','bg-rose-100 text-rose-800'];if(r.execution_status==='pending_manager')return['الشواهد بانتظار تقييم المدير','bg-sky-100 text-sky-800'];if(r.execution_status==='approved'){const m={high:'منفذ بمستوى عالي',medium:'منفذ بمستوى متوسط',low:'منفذ بمستوى منخفض'};return[m[r.execution_rating]||'تم تقييم التنفيذ','bg-emerald-100 text-emerald-800']}if(r.plan_status==='approved')return['الخطة معتمدة — بانتظار شواهد التنفيذ','bg-teal-100 text-teal-800'];return['مسودة','bg-slate-100 text-slate-700']}
async function init(){for(let y=1448;y<=1548;y++)year.add(new Option(y+' هـ',y+' هـ'));try{await PlatformCloudSession.ensure();role=String(PlatformCloudSession.role()||'').toLowerCase()}catch(e){role=new URLSearchParams(location.search).get('role')||''}const cfg=ROLE_MAP[role];if(!cfg){document.body.innerHTML='<div class="p-10 text-center font-bold">هذا القسم متاح للأدوار المحددة فقط.</div>';document.documentElement.classList.remove('ss-booting');return}[planType,returnPage]=cfg;roleBadge.textContent=cfg[2];planTitle.textContent='الخطة الفصلية — '+planType;document.documentElement.classList.remove('ss-booting');await loadRows()}
async function loadRows(){try{const x=await PlatformCore.request('semester-plan-list',{academicYear:year.value,semester:semester.value});const map=new Map((x.rows||[]).map(r=>[String(r.week_key),r]));rows=DEFAULTS.map(w=>Object.assign({},w,map.get(String(w.weekKey))||{}));render()}catch(e){toast(e.message||'تعذر تحميل الخطة',false)}}
function render(){weeks.innerHTML=rows.map(r=>{const [st,cls]=statusText(r),locked=r.plan_status&&!['draft','returned'].includes(r.plan_status),items=Array.isArray(r.evidence_items)?r.evidence_items:[];return `<article class="card p-5 flex flex-col gap-3"><div class="flex justify-between gap-2"><span class="chip bg-slate-100">${esc(r.dates||'')}</span><span class="chip ${cls}">${esc(st)}</span></div><h3 class="font-black text-lg">${esc(r.title)}</h3><ul class="text-xs space-y-1 min-h-12">${(r.programs||[]).map(p=>`<li>• ${esc(p)}</li>`).join('')||'<li class="text-slate-400">لم تدرج أعمال بعد.</li>'}</ul>${r.manager_note?`<div class="text-xs bg-rose-50 border border-rose-200 p-2 rounded-xl"><b>ملاحظة المدير:</b> ${esc(r.manager_note)}</div>`:''}<div class="text-xs text-slate-500">الشواهد المرسلة: <b>${items.length||(r.evidence_file_id?1:0)}</b></div><div class="mt-auto pt-3 border-t flex flex-wrap gap-2"><button ${locked?'disabled':''} onclick="editWeek('${r.weekKey}')" class="btn bg-slate-100">تعديل</button><button ${locked?'disabled':''} onclick="submitWeek('${r.weekKey}')" class="btn bg-amber-500 text-white">إرسال الخطة للاعتماد</button>${r.plan_status==='approved'&&r.execution_status!=='approved'?`<button onclick="openEvidence('${r.weekKey}')" class="btn bg-teal-700 text-white">إدارة شواهد التنفيذ</button>`:''}</div></article>`}).join('');const rated=rows.filter(r=>r.execution_status==='approved').length;summary.textContent=`${planType} — تم تقييم تنفيذ ${rated} من ${rows.length} أسبوع`}
function editWeek(k){editing=rows.find(r=>String(r.weekKey||r.week_key)===String(k));mPrograms.value=(editing.programs||[]).join('\n');mNotes.value=editing.notes||'';editModal.classList.add('show')}function closeEdit(){editModal.classList.remove('show')}
async function persist(w){const payload={weekKey:String(w.weekKey||w.week_key),weekOrder:Number(w.weekOrder||w.week_order||0),title:w.title,dates:w.dates||'',behavior:w.behavior||'',event:w.event_name||w.event||null,isVacation:!!(w.isVacation||w.is_vacation),programs:w.programs||[],notes:w.notes||''};const x=await PlatformCore.request('semester-plan-save-week',{academicYear:year.value,semester:semester.value,week:payload});return x.row}
async function saveEdit(){try{editing.programs=mPrograms.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);editing.notes=mNotes.value.trim();await persist(editing);closeEdit();toast('تم حفظ مسودة الأسبوع سحابيًا');await loadRows()}catch(e){toast(e.message,false)}}
async function submitWeek(k){try{let w=rows.find(r=>String(r.weekKey||r.week_key)===String(k));if(!w.id)w=await persist(w);await PlatformCore.request('semester-plan-submit-week',{id:w.id});toast('تم إرسال خطة الأسبوع لمدير المدرسة للاعتماد');await loadRows()}catch(e){toast(e.message,false)}}
function openEvidence(k){evidenceWeek=rows.find(r=>String(r.weekKey||r.week_key)===String(k));evidenceDraft=Array.isArray(evidenceWeek.evidence_items)?JSON.parse(JSON.stringify(evidenceWeek.evidence_items)):[];if(!evidenceDraft.length&&evidenceWeek.evidence_file_id)evidenceDraft=[{type:'file',fileId:evidenceWeek.evidence_file_id,name:evidenceWeek.evidence_name||'شاهد'}];renderEvidence();evidenceModal.classList.add('show')}function closeEvidence(){evidenceModal.classList.remove('show')}
function renderEvidence(){evidenceList.innerHTML=evidenceDraft.length?evidenceDraft.map((x,i)=>`<div class="border rounded-xl p-3 flex justify-between gap-2"><div><b>${esc(x.name||x.url||'شاهد')}</b><div class="text-[11px] text-slate-500">${x.type==='external'?'رابط خارجي':x.type==='library'?'من مكتبة القسم':'ملف مرفوع'}</div></div><button class="btn bg-rose-50 text-rose-700" onclick="evidenceDraft.splice(${i},1);renderEvidence()">إزالة</button></div>`).join(''):'<div class="text-center p-5 text-slate-400">لم تتم إضافة شواهد بعد.</div>'}
async function addUploads(input){const files=[...input.files];if(!files.length)return;try{const r=await CloudFileEngine.uploadMany({files,ownershipScope:'user',moduleKey:'semester_plans',recordType:'semester_plan_week',recordId:evidenceWeek.id,relationType:'execution_evidence',continueOnError:false});for(const z of r.results){const f=z.file||z;evidenceDraft.push({type:'file',fileId:f.id,name:f.display_name||f.original_name||'شاهد مرفوع'})}renderEvidence();input.value=''}catch(e){toast('تعذر رفع الشاهد: '+e.message,false)}}
async function openLibrary(){try{const x=await CloudFileEngine.list({ownershipScope:'user',limit:300});const a=x.files||[];libraryList.innerHTML=a.length?a.map(f=>`<button class="w-full border rounded-xl p-3 text-right hover:bg-slate-50" onclick="chooseLibrary('${f.id}',${JSON.stringify(String(f.display_name||f.original_name||'ملف')).replace(/</g,'\\u003c')})"><b>${esc(f.display_name||f.original_name||'ملف')}</b><div class="text-[11px] text-slate-400">${esc(f.module_key||'مكتبتي')}</div></button>`).join(''):'<div class="p-5 text-center text-slate-400">لا توجد ملفات متاحة في مكتبتك.</div>';libraryModal.classList.add('show')}catch(e){toast(e.message,false)}}
function chooseLibrary(id,name){if(!evidenceDraft.some(x=>x.fileId===id))evidenceDraft.push({type:'library',fileId:id,name});libraryModal.classList.remove('show');renderEvidence()}
function addExternal(){const url=prompt('ألصق الرابط الخارجي للشاهد:');if(!url)return;if(!/^https?:\/\//i.test(url)){toast('الرابط يجب أن يبدأ بـ http أو https',false);return}const name=prompt('اسم الشاهد (اختياري):')||url;evidenceDraft.push({type:'external',url,name});renderEvidence()}
async function submitEvidence(){if(!evidenceDraft.length){toast('أضف شاهدًا واحدًا على الأقل',false);return}try{sendEvidenceBtn.disabled=true;await PlatformCore.request('semester-plan-submit-evidence',{id:evidenceWeek.id,items:evidenceDraft});toast('تم إرسال شواهد التنفيذ للمدير للتقييم');closeEvidence();await loadRows()}catch(e){toast(e.message,false)}finally{sendEvidenceBtn.disabled=false}}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
