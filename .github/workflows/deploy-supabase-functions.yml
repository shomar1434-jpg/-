name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/functions/platform-session/**"
      - "supabase/functions/platform-state/**"
      - "supabase/functions/platform-core/**"
      - "supabase/functions/platform-directory/**"
      - "supabase/functions/_shared/login-upstream.ts"
      - "weekly-workflow-core.js"
      - ".github/workflows/deploy-supabase-functions.yml"

permissions:
  contents: read

concurrency:
  group: deploy-supabase-edge-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.116.0

      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${{ secrets.SUPABASE_PROJECT_REF }}"
          test -d supabase/functions
          test -f supabase/functions/platform-files/index.ts
          count="$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' | wc -l | tr -d ' ')"
          if [ "${count}" -eq 0 ]; then
            echo "::error::No Supabase Edge Functions were found."
            exit 1
          fi
          echo "Functions found: ${count}"

      - name: Deploy all Supabase Edge Functions
        run: |
          supabase functions deploy \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy platform-session password recovery
        run: |
          supabase functions deploy platform-session \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy platform-state weekly delivery integrity
        run: |
          supabase functions deploy platform-state \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy platform-core school performance projection
        run: |
          supabase functions deploy platform-core \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Deploy platform-directory school login identity
        run: |
          supabase functions deploy platform-directory \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Verify platform-document-workspace is reachable
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/platform-document-workspace?action=probe"
          ok=0

          for attempt in 1 2 3 4 5; do
            echo "Workspace probe attempt ${attempt}/5"
            http_code="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output /tmp/cdw_probe.json \
                --write-out '%{http_code}' \
                --connect-timeout 15 \
                --max-time 30 \
                "${URL}" \
                || true
            )"

            if [ -f /tmp/cdw_probe.json ]; then
              cat /tmp/cdw_probe.json
              echo
            fi

            if [ "${http_code}" = "200" ] && \
               grep -q '"service":"platform-document-workspace"' /tmp/cdw_probe.json 2>/dev/null; then
              ok=1
              break
            fi

            if [ "${attempt}" -lt 5 ]; then
              sleep 6
            fi
          done

          if [ "${ok}" != "1" ]; then
            echo "::error::platform-document-workspace was not reachable after deployment."
            exit 1
          fi

          echo "All Edge Functions were deployed successfully."

      - name: Verify platform-files access boundary is reachable
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/platform-files?action=health"
          http_code="$(
            curl \
              --silent \
              --show-error \
              --output /tmp/platform_files_probe.json \
              --write-out '%{http_code}' \
              --connect-timeout 15 \
              --max-time 30 \
              "${URL}"
          )"
          cat /tmp/platform_files_probe.json
          echo
          # The unauthenticated probe must reach the new function while its
          # session boundary remains closed. A 401 is the expected healthy result.
          test "${http_code}" = "401"
          grep -q 'جلسة الملفات مفقودة' /tmp/platform_files_probe.json
